<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevOps по-тихому</title><style>:root{color-scheme:dark;--bg:#0f1417;--pn:#161d21;--pn2:#1d262b;--ln:#2a363d;--tx:#d7e0e4;--mu:#8a9aa2;--ac:#4fd18b;
--c:#5aa9ff;--i:#f2c94c;--s:#b48cff;--r:#3dd6c6;--mix:#ff9f5a;--ok:#4fd18b;--no:#ff6b6b;
--k-cmd:#4fd18b;--k-flag:#f2c94c;--k-path:#5aa9ff;--k-var:#ff9f5a;--k-str:#e6a6ff;--k-com:#6f8088;--k-op:#ff6b9a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;min-height:100vh}
a{color:var(--c)}
#side{width:290px;flex:none;background:var(--pn);border-right:1px solid var(--ln);height:100vh;position:sticky;top:0;overflow:auto;padding:12px 8px}
#main{flex:1;min-width:0;max-width:900px;padding:24px 28px 80px}
#burger{display:none}
.sl{display:block;position:relative;padding:6px 10px 8px;border-radius:6px;color:var(--tx);text-decoration:none;font-size:14px}
.sl:hover{background:var(--pn2)}.sl.cur{background:var(--pn2);outline:1px solid var(--ac)}
.sl.rev{color:var(--mix)}
.pg{position:absolute;left:10px;right:10px;bottom:3px;height:2px;background:var(--ln)}
.pg::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--ac)}
.cnt{color:var(--mix);font-weight:700}
details>summary{cursor:pointer}
#side summary{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:12px 10px 4px}
h1{margin:.2em 0 .2em;font-size:28px}h2{font-size:21px;margin:1.4em 0 .5em}h3{font-size:17px;margin:1.2em 0 .4em}
.sub{color:var(--mu);margin-top:0}.muted{color:var(--mu);font-size:14px}
.lv{color:var(--ac);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
mark{background:none;color:var(--i);font-weight:600}
code{font:14px/1.4 ui-monospace,Consolas,monospace;background:var(--pn2);padding:1px 5px;border-radius:4px}
pre.code{font:14px/1.5 ui-monospace,Consolas,monospace;background:#0a0e10;border:1px solid var(--ln);border-radius:8px;padding:12px 14px;overflow:auto;white-space:pre}
.k-cmd{color:var(--k-cmd);font-weight:600}.k-flag{color:var(--k-flag)}.k-path{color:var(--k-path)}.k-var{color:var(--k-var)}.k-str{color:var(--k-str)}.k-com{color:var(--k-com)}.k-op{color:var(--k-op)}
.k-pr{color:var(--mu);user-select:none}.k-outl{color:#aab6bc}
.tw{overflow:auto}table{border-collapse:collapse;width:100%;font-size:15px;margin:.6em 0}
th,td{border:1px solid var(--ln);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--pn2)}
table.cmds td:first-child{white-space:nowrap;width:1%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin:14px 0 6px;overflow:auto}
.tabs a{padding:8px 14px;color:var(--mu);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--tx);border-color:var(--ac)}
.intro{background:var(--pn);border-left:3px solid var(--ac);padding:2px 18px 10px;border-radius:6px;margin-top:14px}
.box{background:var(--pn);border:1px solid var(--ln);border-left:3px solid var(--c);border-radius:8px;padding:10px 16px;margin:14px 0}
.box>b{display:block;margin-bottom:4px}.box.warn{border-left-color:var(--i)}.box.deep{border-left-color:var(--s)}
.traps{list-style:none;padding:0}.traps li{background:var(--pn);border-radius:8px;padding:10px 14px;margin:8px 0}
.bad{color:var(--no)}.good{color:var(--ok)}.why{color:var(--tx);opacity:.9;margin-top:4px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 0;color:var(--mu)}
.grp{color:var(--mu);text-transform:uppercase;font-size:13px;letter-spacing:.06em;margin-top:26px}
.ex,.lab{background:var(--pn);border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:10px;padding:12px 16px;margin:12px 0}
.ex.t-i{border-left-color:var(--i)}.ex.t-s{border-left-color:var(--s)}.ex.t-r{border-left-color:var(--r)}.ex.mixd{border-left-color:var(--mix)}
.lab{border-left-color:var(--ac)}
.ex.ok{border-color:var(--ok)}.ex.no{border-color:var(--no)}.lab.ok{opacity:.75}
.exh{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mu);margin-bottom:6px;flex-wrap:wrap}
.tag{text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.t-c .tag{color:var(--c)}.t-i .tag{color:var(--i)}.t-s .tag{color:var(--s)}.t-r .tag{color:var(--r)}.lab .tag{color:var(--ac)}
.num{margin-left:auto}.ref{color:var(--mix);text-decoration:none}
.opts{display:grid;gap:6px}
button{font:inherit;cursor:pointer;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--mu)}
.opt{text-align:left}.opt.sel{border-color:var(--c)}
.ex.ok .opt.sel{border-color:var(--ok);background:#173325}.ex.no .opt.sel{border-color:var(--no);background:#3a1d1f}
.inrow{display:flex;gap:6px;align-items:center;background:#0a0e10;border:1px solid var(--ln);border-radius:8px;padding:4px 4px 4px 10px}
.inp{flex:1;min-width:0;background:transparent;border:0;color:var(--tx);font:15px ui-monospace,Consolas,monospace;padding:6px 0;outline:0}
.inp.wide{width:100%;border:1px solid var(--ln);border-radius:8px;padding:8px 10px;background:#0a0e10}
.go{background:#1d3a2a;border-color:#2c5a40}
.sline{min-height:44px;border:1px dashed var(--ln);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:5px;margin-bottom:8px;counter-reset:s}
.spool{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font:14px ui-monospace,Consolas,monospace;text-align:left}
.sline .chip{border-color:var(--s)}
.sline .chip::before{counter-increment:s;content:counter(s) ". ";color:var(--mu)}
.fb:empty{display:none}.fb{margin-top:10px;padding-top:10px;border-top:1px solid var(--ln)}
.res{font-weight:700}.ex.ok .res{color:var(--ok)}.ex.no .res{color:var(--no)}
.right{margin:4px 0}.fb .totodo{margin-top:8px;font-size:13px;padding:4px 10px}
.lab details{margin-top:8px;background:var(--pn2);border-radius:6px;padding:6px 10px}
.lab details.sol summary{color:var(--i)}
.qa{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 14px;margin:8px 0}
.qa summary{font-weight:600}.qa>div{margin-top:8px}
.lock{background:var(--pn);border-radius:10px;padding:18px;margin:18px 0}.lock .force{margin-top:10px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.stats div{background:var(--pn);border-radius:10px;padding:12px 16px;color:var(--mu);font-size:14px}
.stats b{display:block;font-size:22px;color:var(--tx)}
.btn{display:inline-block;background:#1d3a2a;border:1px solid #2c5a40;color:var(--tx);padding:9px 16px;border-radius:8px;text-decoration:none}
.nextp{margin-top:26px}
.todo{list-style:none;padding:0}.todo li{display:flex;justify-content:space-between;gap:10px;background:var(--pn);border-radius:8px;padding:8px 12px;margin:6px 0}
@media(max-width:800px){
  body{display:block}#main{padding:60px 14px 80px}
  #side{position:fixed;z-index:9;left:0;top:0;width:86vw;max-width:330px;transform:translateX(-100%);transition:.2s}
  body.menu #side{transform:none;box-shadow:0 0 0 100vmax #0009}
  #burger{display:block;position:fixed;z-index:10;top:10px;left:10px}
  h1{font-size:23px}
}

.early{background:var(--pn);border:1px solid var(--ln);border-left:3px solid var(--s);border-radius:8px;padding:10px 14px;margin:14px 0}
.early summary{font-weight:600;color:var(--s)}
.term{background:var(--pn2);border-radius:8px;padding:8px 12px;margin:8px 0}.term>summary{font-weight:700;cursor:pointer}
.term dl{margin:8px 0 0}.term dt{color:var(--ac);font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin-top:10px}.term dd{margin:2px 0 0}
.case{background:var(--pn);border:1px solid var(--ln);border-left:3px solid var(--mix);border-radius:8px;padding:2px 18px 10px;margin-top:14px}.case h2{color:var(--mix)}
.goal{background:var(--pn2);border-radius:6px;padding:8px 12px}

.ticket{background:var(--pn);border:1px solid var(--ln);border-left:4px solid var(--mix);border-radius:10px;padding:10px 16px;margin:12px 0}.ticket.ok{opacity:.7;border-left-color:var(--ok)}.ticket h3{margin:.2em 0 .5em}.ticket .tag{color:var(--mix)}
.rdy{color:var(--ok)}.nrdy{color:var(--mu)}
.projbox{background:var(--pn);border:1px dashed var(--mix);border-radius:8px;padding:2px 18px 10px;margin-top:20px}.projbox h2{color:var(--mix)}
.mref{font-weight:700;text-decoration:none;border-bottom:1px dashed var(--c)}

.links{padding-left:20px}.links li{margin:6px 0}.linkbox{margin-top:20px}</style></head><body><button id="burger" aria-label="Меню">☰ Модули</button>
<nav id="side"></nav>
<main id="main"></main><script>/* Помощники для текста модулей. Всё глобально (один файл после сборки).
   esc(s)             — экранировать HTML
   C(code,lang)       — блок кода с раскраской. lang: 'sh' (по умолч.), 'term' ($ команда + вывод), 'out' (как есть), 'yaml', 'ps' (PowerShell)
   c(code)            — команда в строке текста (inline)
   tbl(head,rows)     — таблица
   CMDS([[cmd,что делает],…]) — таблица команд с раскраской
   TR([[ошибка,правильно,почему],…]) — ловушки
   BOX(title,html,kind) — врезка: kind 'idea' | 'warn' | 'deep' (глубже: механизм под капотом) */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const CMDWORD=/^(sudo|time|watch|xargs|exec|env)$/;
function hlSh(line){
  if(/^\s*#/.test(line))return `<i class="k-com">${esc(line)}</i>`;
  let out='',first=true,m;const re=/(\s+)|("(?:[^"\\]|\\.)*"|'[^']*')|(\|\||&&|\||;|>>|2>&1|>&2|&>>|&>|>|<|&)|(#.*$)|([^\s|;&<>]+)/g;
  while((m=re.exec(line))){
    if(m[1]){out+=m[1];continue}
    if(m[2]){out+=`<span class="k-str">${esc(m[2])}</span>`;continue}
    if(m[3]){out+=`<span class="k-op">${esc(m[3])}</span>`;if(/^(\|\||&&|\||;)$/.test(m[3]))first=true;continue}
    if(m[4]){out+=`<i class="k-com">${esc(m[4])}</i>`;continue}
    const t=m[5];let k;
    if(first){k='k-cmd';if(!CMDWORD.test(t)&&!/=/.test(t))first=false}
    else if(/^-/.test(t))k='k-flag';
    else if(/^\$/.test(t))k='k-var';
    else if(/^(\/|~|\.\/|\.\.\/)/.test(t))k='k-path';
    out+=k?`<span class="${k}">${esc(t)}</span>`:esc(t)}
  return out}
function hlYaml(line){
  if(/^\s*#/.test(line))return `<i class="k-com">${esc(line)}</i>`;
  const m=line.match(/^(\s*-?\s*)([\w.\-\/]+)(:)(.*)$/);
  return m?esc(m[1])+`<span class="k-cmd">${esc(m[2])}</span>`+m[3]+`<span class="k-str">${esc(m[4])}</span>`:esc(line)}
function C(code,lang='sh'){
  const lines=code.replace(/^\n|\n\s*$/g,'').split('\n');
  const body=lines.map(l=>{
    if(lang==='term')return /^\$ /.test(l)?`<span class="k-pr">$ </span>`+hlSh(l.slice(2)):`<span class="k-outl">${esc(l)}</span>`;
    if(lang==='out')return esc(l);
    if(lang==='yaml')return hlYaml(l);
    return hlSh(l)}).join('\n');
  return `<pre class="code">${body}</pre>`}
const c=s=>`<code>${hlSh(s)}</code>`;
const tbl=(h,rows)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const CMDS=rows=>`<div class="tw"><table class="cmds"><tbody>${rows.map(([k,v])=>`<tr><td><code>${hlSh(k)}</code></td><td>${v}</td></tr>`).join('')}</tbody></table></div>`;
const TR=rows=>`<ul class="traps">${rows.map(([w,r,y])=>`<li><div><span class="bad">✗ ${w}</span></div><div><span class="good">✓ ${r}</span></div><div class="why">${y}</div></li>`).join('')}</ul>`;
const BOX=(t,h,k='idea')=>`<div class="box ${k}"><b>${t}</b>${h}</div>`;
/* Реестр. Каждый файл src/modules/** вызывает MOD({...}) или REV({...}). Порядок — в course/order.js.
   MOD({
     id, lvl:'L1', title, sub,
     intro:  'html — Что это и зачем (3–6 предложений)',
     theory: 'html — суть: механизм, команды, схемы',
     memo:   'html — Как тренировать',
     traps:  [[ошибка, правильно, почему], …],
     ex:     [задания — формат в engine/ex.js],
     lab:    [{t:'задача руками', h:'подсказка', chk:'как проверить себя', sol:'решение'}],
     qa:     [[вопрос собеса, ответ], …],
     cheat:  [[команда, что делает], …]   — уходит в общую шпаргалку
   }) */
const MODS={};
const MOD=m=>{if(MODS[m.id])throw new Error('Дубль модуля: '+m.id);MODS[m.id]=Object.assign({ex:[],lab:[],qa:[],cheat:[],traps:[]},m)};
const REV=r=>MOD(Object.assign({review:true,lvl:'',sub:'Накопительный обзор: без подсказок, темы смешаны.'},r));
/* bash1 · L1 · Bash-скрипты 1: переменные, кавычки, условия, циклы, set -euo pipefail, отладка */
MOD({id:'bash1',title:'Bash-скрипты 1: переменные, условия, циклы',sub:'Переменные и кавычки, if и [[ ]], for и while, $(( )), set -euo pipefail, bash -x и shellcheck.',
case:`<p>Тебе достался скрипт деплоя от прошлого админа. Он «работал годами». Однажды на сервере не оказалось папки релиза: <code>cd $RELEASE_DIR</code> упал, но скрипт <b>продолжил</b> и выполнил <code>rm -rf *</code> — в домашней папке. В другой раз в имени файла оказался пробел, и скрипт обработал не тот файл. А ещё каждый вечер ты руками делаешь одни и те же 15 команд проверки серверов и иногда пропускаешь одну.</p><p class="goal"><b>Цель модуля:</b> писать небольшие скрипты, которые автоматизируют рутину и <b>останавливаются при первой ошибке</b>, а не продолжают разрушать; понимать кавычки, условия и циклы настолько, чтобы читать чужие скрипты и находить в них такие мины.</p>`,
intro:`<p><b>Bash-скрипт</b> — это команды, которые ты и так набираешь в терминале, записанные в файл, плюс немного логики: переменные, «если — то», «для каждого». Ничего нового: те же <code>ls</code>, <code>grep</code>, <code>systemctl</code>, только выполняются сами и одинаково каждый раз.</p>
<p>Зачем DevOps-у: автоматизация — суть профессии. Бэкапы, деплой, проверки серверов, шаги в CI — всё это bash. Даже если основной язык компании Python, мелкие склейки и шаги пайплайнов почти всегда на bash.</p>
<p>Главная особенность bash: он <mark>по умолчанию прощает ошибки</mark> — упавшая команда не останавливает скрипт, пустая переменная тихо подставляется пустотой. Поэтому половина модуля — о том, как сделать скрипт строгим и безопасным.</p>`,
theory:`<h2>Каркас любого скрипта</h2>
${C(`#!/usr/bin/env bash
set -euo pipefail           # строгий режим — объяснение ниже

APP_DIR="/opt/shop"         # переменные — в начале
LOG="/var/log/shop-check.log"

echo "[$(date +%F_%T)] start" >> "$LOG"`)}
${tbl(['Флаг','Что делает','От чего спасает'],[
 ['<code>-e</code>','выйти, если любая команда вернула ненулевой код','упал <code>cd</code> — не выполнять <code>rm</code> дальше'],
 ['<code>-u</code>','ошибка при обращении к неустановленной переменной','опечатка <code>$RELESE_DIR</code> → пустота → <code>rm -rf /*</code>'],
 ['<code>-o pipefail</code>','пайп падает, если упала любая его часть (модуль [[mod:streams]])','<code>curl … | tar x</code> «успешен», хотя curl не скачал']])}
<h2>Переменные</h2>
${C(`name="shop"                 # БЕЗ пробелов вокруг =
port=3000
echo "$name on port $port"
today=$(date +%F)          # вывод команды в переменную
count=$(( port + 1 ))      # арифметика — только $(( ))
readonly BACKUP_DIR=/backup   # константа
export DB_HOST=localhost   # видна дочерним процессам (модуль [[mod:shell]]: source vs ./)`)}
<p><code>name = "shop"</code> с пробелами bash поймёт как «запусти команду <code>name</code> с аргументами <code>=</code> и <code>shop</code>» — <i>command not found</i>.</p>
<h2>Кавычки — главный источник багов</h2>
${tbl(['Запись','Что происходит','Пример: file="my report.txt"'],[
 ['<code>$file</code>','подставить и <b>разрезать по пробелам</b>, раскрыть * и ?','<code>rm $file</code> → rm получит <b>два</b> файла: my и report.txt'],
 ['<code>"$file"</code>','подставить как <mark>одно целое</mark>','<code>rm "$file"</code> → удалится ровно my report.txt'],
 ['<code>\'$file\'</code>','ничего не подставлять, буквально $file','<code>echo \'$file\'</code> → $file']])}
<p>Правило: <mark>переменные всегда в двойных кавычках</mark>: <code>"$var"</code>, <code>"$(команда)"</code>. Одинарные — когда нужен текст буквально (например, программа для awk: <code>awk '{print $1}'</code>).</p>
<p>Значение по умолчанию: <code>"\${PORT:-3000}"</code> — PORT, а если пусто — 3000. Обязательная переменная: <code>"\${DB_PASS:?нужен DB_PASS}"</code> — пусто → скрипт падает с этим сообщением.</p>
<h2>Условия</h2>
${C(`if [[ -f "$APP_DIR/.env" ]]; then
  echo "конфиг есть"
elif [[ -d "$APP_DIR" ]]; then
  echo "папка есть, конфига нет"
else
  echo "нет ничего" >&2      # сообщение об ошибке — в stderr
  exit 1                    # выйти с кодом ошибки
fi`)}
${tbl(['Проверка','Значит'],[
 ['<code>-f файл</code> / <code>-d папка</code> / <code>-e путь</code>','существует файл / папка / что угодно'],
 ['<code>-r</code> / <code>-w</code> / <code>-x</code>','можно читать / писать / выполнять'],
 ['<code>-z "$s"</code> / <code>-n "$s"</code>','строка пустая / не пустая'],
 ['<code>"$a" == "$b"</code> / <code>!=</code>','строки равны / не равны'],
 ['<code>$a -eq $b</code>, <code>-ne -lt -le -gt -ge</code>','<b>числа</b>: равно, не равно, меньше, ≤, больше, ≥'],
 ['<code>&amp;&amp;</code>, <code>||</code>, <code>!</code>','и, или, не (внутри <code>[[ ]]</code>)']])}
${BOX('[ ] или [[ ]]','<p><code>[ ]</code> — старая POSIX-команда test: работает в sh, но капризна к кавычкам и не умеет <code>&amp;&amp;</code> внутри. <code>[[ ]]</code> — встроенная конструкция bash: надёжнее, умеет шаблоны (<code>[[ $f == *.log ]]</code>) и регулярки (<code>=~</code>). В bash-скриптах пиши <code>[[ ]]</code>. И помни: <code>if</code> проверяет <b>код возврата команды</b> — можно писать прямо <code>if grep -q error app.log; then</code>.</p>','deep')}
<p>Сравнение чисел через <code>==</code> внутри <code>[[ ]]</code> сравнивает их <b>как строки</b>: <code>[[ 10 == 010 ]]</code> — ложь. Для чисел — <code>-eq</code> или <code>(( a == b ))</code>.</p>
<h2>case — выбор из вариантов</h2>
${C(`case "$ENV" in
  prod)        HOST=10.0.0.10 ;;
  stage|test)  HOST=10.0.1.10 ;;
  *)           echo "неизвестное окружение: $ENV" >&2; exit 1 ;;
esac`)}
<h2>Циклы</h2>
${C(`for host in web-01 web-02 db-01; do        # по списку
  echo "== $host"
done

for f in /var/log/nginx/*.log; do         # по файлам (шаблон раскрывает bash)
  echo "$f: $(wc -l < "$f") строк"
done

for i in {1..5}; do echo "попытка $i"; done

while read -r line; do                    # построчно из файла
  echo "→ $line"
done < hosts.txt

until curl -sf http://localhost:3000/health > /dev/null; do   # ждать, пока не поднимется
  echo "ждём сервис..."; sleep 2
done`)}
<p><code>break</code> — выйти из цикла, <code>continue</code> — к следующему шагу. Не пиши <code>for line in $(cat file)</code>: строки с пробелами развалятся на слова — для строк есть <code>while read -r</code>.</p>
<h2>Отладка</h2>
${CMDS([['bash -n script.sh','проверить синтаксис, не выполняя'],['bash -x script.sh','выполнить, печатая каждую команду после подстановок (видно, что на самом деле запустилось)'],['set -x … set +x','включить трассировку только для куска скрипта'],['shellcheck script.sh','линтер: находит пропущенные кавычки, опечатки, ловушки (sudo apt install shellcheck)']])}`,
memo:`<p>Каждую неделю бери одну свою ручную рутину (проверить место на серверах, почистить старые логи, пингануть сервисы) и превращай её в скрипт. Каждый скрипт: шебанг, <code>set -euo pipefail</code>, переменные в кавычках, прогон через <code>shellcheck</code>. Через месяц у тебя будет папка полезных скриптов — и привычка, которую видно на собесе.</p>`,

/* bash2 · L1 · Bash-скрипты 2: функции, аргументы, trap, mktemp, flock, cron */
MOD({id:'bash2',title:'Bash-скрипты 2: функции, аргументы, trap, cron',sub:'Функции и local, $1 $# "$@", shift и getopts, trap и уборка, flock, cron и его окружение.',
case:`<p>Скрипт бэкапа поставили в cron каждые 10 минут. Однажды база выросла, бэкап стал идти 15 минут — и следующий запуск стартовал поверх ещё не закончившегося. Два бэкапа одновременно забили диск, а прерванный скрипт оставил в <code>/tmp</code> гигабайты недоделанных архивов. Тем временем новый скрипт, который «точно работает, я руками запускал», в cron не выполнился ни разу: <i>command not found</i> — в логе, который никто не читал.</p><p class="goal"><b>Цель модуля:</b> писать скрипты как маленькие программы — с аргументами и подсказкой по использованию, функциями, уборкой за собой при любом выходе, защитой от параллельного запуска — и надёжно ставить их по расписанию в cron.</p>`,
intro:`<p>Скрипт из модуля [[mod:bash1]] — это «рецепт на один случай». Настоящий рабочий скрипт принимает <b>аргументы</b> (какой сервер, какое окружение), разбит на <b>функции</b> (проверить, сделать, отчитаться), <b>убирает за собой</b> временные файлы, даже если его прервали, и <b>не запускается дважды</b> одновременно.</p>
<p>А потом его ставят по расписанию — в <b>cron</b>. Там скрипт живёт без тебя: без твоего терминала, без твоих переменных, без твоего PATH. Большинство «в cron не работает» — именно из-за этой разницы.</p>
<p>Зачем DevOps-у: бэкапы, чистка, отчёты, ротация, проверки — всё это скрипты по расписанию. Если они ломаются молча, ты узнаёшь об этом в самый плохой момент — когда понадобился бэкап.</p>`,
theory:`<h2>Аргументы скрипта</h2>
${C(`# ./deploy.sh prod v1.4 --force
echo "$0"    # ./deploy.sh    — имя скрипта
echo "$1"    # prod           — первый аргумент
echo "$2"    # v1.4
echo "$#"    # 3              — сколько аргументов
echo "$@"    # prod v1.4 --force — все`)}
${tbl(['Запись','Значит'],[
 ['<code>"$@"</code>','все аргументы, <mark>каждый отдельно</mark> и с сохранением пробелов — почти всегда нужно именно это'],
 ['<code>"$*"</code>','все аргументы одной строкой'],
 ['<code>$@</code> без кавычек','разрежет аргументы с пробелами — ошибка'],
 ['<code>shift</code>','сдвинуть: $2 становится $1 (для разбора по очереди)']])}
${C(`usage() { echo "Использование: $0 <prod|stage> <версия>" >&2; exit 2; }
[[ $# -eq 2 ]] || usage            # нет нужных аргументов — подсказка и выход
ENV="$1"; VERSION="$2"`)}
<p>Флаги в стиле <code>-e prod -v 1.4</code> разбирает встроенный <code>getopts</code>:</p>
${C(`while getopts "e:v:f" opt; do     # e: и v: — с значением, f — флаг без значения
  case "$opt" in
    e) ENV="$OPTARG" ;;
    v) VERSION="$OPTARG" ;;
    f) FORCE=1 ;;
    *) usage ;;
  esac
done`)}
<h2>Функции</h2>
${C(`log() {                            # функция логирования — в каждый скрипт
  echo "[$(date '+%F %T')] $*" | tee -a "$LOG" >&2
}

check_disk() {
  local mount="$1" limit="$2"       # local — переменная видна только внутри
  local used
  used=$(df --output=pcent "$mount" | tail -1 | tr -dc '0-9')
  (( used < limit ))                # код возврата функции = код последней команды
}

if check_disk / 90; then log "диск ок"; else log "диск почти полон"; exit 1; fi`)}
${BOX('return и echo — разные вещи','<p><code>return N</code> — <b>код возврата</b> функции (0–255): успех или ошибка, проверяется через <code>if</code> и <code>&amp;&amp;</code>. Чтобы функция <b>вернула значение</b> (строку, число), она его печатает через <code>echo</code>, а вызывающий забирает: <code>ver=$(get_version)</code>. Поэтому логи внутри таких функций пишут в stderr (<code>&gt;&amp;2</code>), иначе они смешаются с результатом.</p><p>Без <code>local</code> все переменные функции — глобальные и затирают одноимённые переменные скрипта.</p>','deep')}
<p>Общие функции выносят в файл и подключают: <code>source /opt/scripts/lib.sh</code> (модуль [[mod:shell]]: source выполняет в текущей оболочке).</p>
<h2>trap — уборка при любом выходе</h2>
${C(`TMP=$(mktemp -d)                             # уникальная временная папка
trap 'rm -rf "$TMP"' EXIT                    # выполнится при ЛЮБОМ выходе: успех, ошибка, set -e
trap 'log "прервано"; exit 130' INT TERM     # Ctrl+C, kill

pg_dump … > "$TMP/dump.sql"                  # работаем во временной папке
mv "$TMP/dump.sql" /backup/                  # готовый результат — на место одним движением`)}
${tbl(['Сигнал в trap','Когда'],[['<code>EXIT</code>','скрипт завершается по любой причине — место для уборки'],['<code>ERR</code>','команда вернула ошибку (можно напечатать, на какой строке: <code>$LINENO</code>)'],['<code>INT</code> / <code>TERM</code>','Ctrl+C / kill (модуль [[mod:procs]])']])}
<p><code>mktemp</code> вместо <code>/tmp/backup.tmp</code>: фиксированное имя столкнётся с параллельным запуском или чужим файлом.</p>
<h2>Защита от двойного запуска: flock</h2>
${C(`exec 9>/var/lock/backup.lock
flock -n 9 || { echo "уже выполняется, выходим" >&2; exit 1; }
# … дальше скрипт идёт, только если замок свободен …`)}
<p>Или прямо в cron: <code>flock -n /var/lock/backup.lock /opt/scripts/backup.sh</code>. Замок снимается сам, когда процесс завершается, даже если его убили.</p>
<h2>cron</h2>
${C(`# ┌──────── минута (0–59)
# │ ┌────── час (0–23)
# │ │ ┌──── день месяца (1–31)
# │ │ │ ┌── месяц (1–12)
# │ │ │ │ ┌ день недели (0–7, 0 и 7 — воскресенье)
# │ │ │ │ │
  0 3 * * *     /opt/scripts/backup.sh >> /var/log/backup.log 2>&1
  */10 * * * *  /opt/scripts/check.sh  >> /var/log/check.log 2>&1
  30 8 * * 1-5  /opt/scripts/report.sh                         # будни в 8:30`,'out')}
${tbl(['Запись','Значит'],[['<code>*</code>','каждое значение'],['<code>*/10</code>','каждые 10'],['<code>1-5</code>','с 1 по 5'],['<code>0,30</code>','в 0 и в 30'],['<code>@reboot</code>','при загрузке'],['<code>@daily</code>','раз в сутки (0 0 * * *)']])}
${CMDS([['crontab -e','редактировать задачи своего пользователя'],['crontab -l','показать задачи'],['sudo crontab -u deploy -l','задачи другого пользователя'],['/etc/cron.d/backup','системный файл задач: <b>с полем пользователя</b> (0 3 * * * root /opt/…)'],['grep CRON /var/log/syslog','запускал ли cron задачу (или journalctl -u cron)']])}
${BOX('Почему «руками работает, в cron — нет»','<p>У cron <b>минимальное окружение</b>: PATH обычно только <code>/usr/bin:/bin</code>, нет твоего <code>~/.bashrc</code>, переменных и текущей папки, оболочка — <code>sh</code>. Поэтому: абсолютные пути к программам и файлам (или <code>PATH=…</code> строкой в начале crontab), переменные — в самом скрипте или через <code>source</code> файла с ними, вывод — в лог с <code>2&gt;&amp;1</code>. И ещё: символ <code>%</code> в строке crontab означает перевод строки — его экранируют: <code>date +\\%F</code>.</p>','warn')}
<p>Альтернатива cron — таймеры systemd (модуль [[mod:systemd]]): вывод сам в журнале и видно прошлый запуск.</p>`,
memo:`<p>Сделай себе шаблон скрипта и начинай каждый новый с него: шебанг, <code>set -euo pipefail</code>, <code>log()</code>, <code>usage()</code>, проверка аргументов, <code>mktemp</code> + <code>trap … EXIT</code>, <code>flock</code>, если скрипт идёт по расписанию. Через пару недель это будет «рука сама пишет» — и чужие скрипты без этих частей будут сразу бросаться в глаза.</p>`,

lab:[
 {t:'Шаблон скрипта: создай <code>~/lab/template.sh</code> с шебангом, строгим режимом, функциями <code>log</code> и <code>usage</code>, проверкой, что передан ровно 1 аргумент, <code>mktemp -d</code> + <code>trap … EXIT</code>. Проверь: временная папка исчезает и при успехе, и при Ctrl+C посреди <code>sleep 30</code>.',sol:C(`#!/usr/bin/env bash
set -euo pipefail
LOG="${'$'}{LOG:-$HOME/lab/template.log}"
log()   { echo "[$(date '+%F %T')] $*" | tee -a "$LOG" >&2; }
usage() { echo "Использование: $0 <имя>" >&2; exit 2; }
[[ $# -eq 1 ]] || usage
TMP=$(mktemp -d)
trap 'rm -rf "$TMP"; log "уборка: $TMP удалена"' EXIT
log "старт для $1, временная папка $TMP"
sleep 30`)},
 {h:'<p>Разбор флагов — цикл <code>while getopts "e:v:f" opt</code> с case из теории. После цикла проверь, что обязательные значения заданы: <code>[[ -n "${ENV:-}" &amp;&amp; -n "${VERSION:-}" ]] || usage</code>.</p>',t:'Аргументы и флаги: напиши <code>deploy.sh</code>, который принимает <code>-e prod|stage</code>, <code>-v версия</code> и необязательный <code>-f</code>; без -e или -v печатает usage. Внутри — только echo того, что «было бы сделано».'},
 {chk:'<p>Без flock в логе будут перемешанные start, start, end, end — два экземпляра работали одновременно. С <code>flock -n</code> второй запуск сразу выйдет, в логе будет ровно одна пара start/end.</p>',t:'Наложение запусков: напиши скрипт, который пишет в лог «start», спит 20 секунд, пишет «end». Запусти его в двух терминалах одновременно без flock, потом с flock -n. Сравни лог.'},
 {t:'cron: поставь задачу «каждую минуту дописывать дату и <code>df -h /</code> в ~/lab/cron.log». Убедись через syslog/journalctl, что cron её запускает. Потом намеренно сломай: используй команду без полного пути, которой нет в /usr/bin:/bin, и найди ошибку в логе. Не забудь удалить задачу.',sol:C(`crontab -e
# * * * * * { date; df -h /; } >> $HOME/lab/cron.log 2>&1
grep CRON /var/log/syslog | tail -3     # или: journalctl -u cron -n 5
tail -f ~/lab/cron.log`)+'<p>В WSL cron может быть не запущен: <code>sudo systemctl enable --now cron</code>.</p>'},
 {h:'<p>Каждая проверка — функция с кодом возврата (0 — ок). Основная часть: <code>bad=0</code>, вызовы <code>check_disk || bad=1</code>, сервисы из аргументов — <code>for s in "$@"; do check_service "$s" || bad=1; done</code>, в конце <code>exit $bad</code>.</p>',t:'Перепиши <code>check.sh</code> из модуля [[mod:bash1]] на функции: <code>check_disk</code>, <code>check_mem</code>, <code>check_service имя</code>; общий итог и код возврата. Сервисы для проверки передавай аргументами: <code>./check.sh ssh cron nginx</code>.'}],

 ['Как читать строку cron?','Пять полей: минута, час, день месяца, месяц, день недели. */N — каждые N, a-b — диапазон, a,b — список.'],
 ['cron или systemd-таймер?','cron — проще и везде. Таймер — логи в журнале, видно прошлый/следующий запуск, Persistent, зависимости (модуль [[mod:systemd]]).']],
cheat:[['$1 $2 $# "$@"','аргументы'],['shift','сдвиг аргументов'],['getopts "e:v:f" opt','разбор флагов'],['f() { local x="$1"; }','функция с local'],['v=$(f)','результат функции'],['TMP=$(mktemp -d)','временная папка'],["trap 'rm -rf \"$TMP\"' EXIT",'уборка при выходе'],['flock -n /var/lock/x.lock cmd','без двойного запуска'],['crontab -e / -l','задачи cron'],['0 3 * * * cmd >> log 2>&1','каждый день в 3:00'],['*/10 * * * *','каждые 10 минут'],['grep CRON /var/log/syslog','запуски cron'],['\\%','% в crontab']]});
/* dns · L1 · DNS и HTTP(S): разрешение имён, записи, TTL, /etc/hosts, dig; запрос/ответ, методы, коды, заголовки, TLS */
MOD({id:'dns',title:'DNS и HTTP(S)',sub:'Как имя превращается в IP, записи и TTL, dig и /etc/hosts; из чего состоит HTTP-запрос, коды ответа, заголовки, сертификаты.',
case:`<p>Магазин переезжает на новый сервер. Ты меняешь в DNS адрес <code>shop.kz</code> на новый IP — и следующие сутки половина клиентов попадает на старый сервер, а половина на новый. Заказы раскиданы по двум базам. Через месяц в 00:00 сайт у всех показывает «Ваше подключение не защищено» — истёк сертификат. А разработчик жалуется: «на сервере <code>curl http://10.0.0.5</code> отдаёт не наш сайт, а какую-то страницу nginx по умолчанию».</p><p class="goal"><b>Цель модуля:</b> понимать путь от имени до IP и почему изменения DNS «расходятся» не сразу; читать HTTP-запросы и ответы как текст, отличать 401 от 403 и 502 от 504; проверять сертификаты до того, как они истекут.</p>`,
intro:`<p><b>DNS</b> — телефонная книга интернета: превращает имя (<code>shop.kz</code>) в IP-адрес (<code>185.12.34.56</code>), потому что сеть работает с адресами, а люди помнят имена. Ответы <mark>кэшируются</mark> на каждом шаге — это делает DNS быстрым, но из-за этого изменения применяются не сразу.</p>
<p><b>HTTP</b> — язык, на котором браузер, curl или другой сервис разговаривает с веб-сервером: «дай мне вот это» → «вот, код 200». Это обычный текст, его можно прочитать глазами. <b>HTTPS</b> — тот же HTTP внутри шифрованного канала TLS с проверкой сертификата.</p>
<p>Зачем DevOps-у: переезды, новые домены, балансировщики, Ingress в Kubernetes, сертификаты, «сайт не открывается у части пользователей» — это всё DNS и HTTP. Шаг 1 лестницы из модуля [[mod:net1]] («имя резолвится?») — как раз сюда.</p>`,
theory:`<h2>Путь имени до адреса</h2>
${C(`
 приложение: «какой IP у shop.kz?»
   │
   ├─ 1. /etc/hosts              — локальные записи (если есть — ответ сразу)
   ├─ 2. локальный кэш           — systemd-resolved (127.0.0.53)
   ├─ 3. рекурсивный резолвер    — провайдера, офиса или 8.8.8.8 / 1.1.1.1
   │        └─ спрашивает по цепочке:
   │           корневые серверы «.» → серверы зоны «kz.» → серверы shop.kz (authoritative)
   └─ ответ: 185.12.34.56, TTL 3600  → кэшируется на каждом шаге на 3600 секунд
`,'out')}
<p><b>Authoritative</b> (авторитетные) серверы — те, где реально хранятся записи домена (у регистратора или в Cloudflare). Все остальные только <b>кэшируют</b> ответы на время <b>TTL</b>.</p>
<h2>Типы записей</h2>
${tbl(['Запись','Что хранит','Пример'],[
 ['<b>A</b>','имя → IPv4','<code>shop.kz → 185.12.34.56</code>'],
 ['<b>AAAA</b>','имя → IPv6','<code>shop.kz → 2a01:4f8::1</code>'],
 ['<b>CNAME</b>','имя → другое имя (псевдоним)','<code>www.shop.kz → shop.kz</code>'],
 ['<b>MX</b>','почтовые серверы домена','<code>shop.kz → 10 mail.shop.kz</code>'],
 ['<b>TXT</b>','произвольный текст: подтверждение владения, SPF, проверки для сертификатов','<code>"v=spf1 …"</code>'],
 ['<b>NS</b>','какие серверы авторитетны для зоны','<code>shop.kz → ns1.provider.kz</code>'],
 ['<b>PTR</b>','обратная запись: IP → имя','<code>56.34.12.185.in-addr.arpa → shop.kz</code>'],
 ['<b>SRV</b>','сервис, порт и хост (активно в Kubernetes)','<code>_mssql._tcp…</code>']])}
${BOX('TTL и «DNS ещё не обновился»','<p>Если у записи TTL 86400 (сутки), то резолверы, которые уже спросили старый адрес, будут отдавать его до суток. Поэтому перед переездом <mark>заранее</mark> (за TTL до переезда) снижают TTL до 300 секунд, переезжают, проверяют — и только потом возвращают TTL обратно. И пока кэши не истекли, старый сервер должен работать или проксировать на новый.</p>','warn')}
<h2>Инструменты DNS</h2>
${CMDS([['dig shop.kz','полный ответ: записи, TTL, какой сервер ответил'],['dig +short shop.kz','только адрес'],['dig shop.kz MX','конкретный тип записи'],['dig @8.8.8.8 shop.kz','спросить конкретный резолвер (сравнить, что видят разные)'],['dig +trace shop.kz','пройти цепочку от корня до авторитетного сервера самому'],['dig -x 185.12.34.56','обратный запрос (PTR)'],['getent hosts shop.kz','разрешить <b>так же, как приложение</b> (с учётом /etc/hosts)'],['resolvectl status','какие резолверы использует система'],['nslookup shop.kz','то же, есть и в Windows']])}
${BOX('dig не смотрит в /etc/hosts','<p><code>dig</code> всегда идёт в DNS напрямую. Приложения же сначала смотрят <code>/etc/hosts</code> (порядок задан в <code>/etc/nsswitch.conf</code>). Поэтому если в hosts есть строка для имени, <code>dig</code> и приложение могут видеть <b>разные</b> адреса. Чтобы проверить «как видит приложение» — <code>getent hosts</code>.</p>','deep')}
${C(`# /etc/hosts — локальная подмена имён (в Windows: C:\\Windows\\System32\\drivers\\etc\\hosts)
127.0.0.1    localhost
10.0.5.20    db-01
192.168.49.2 myapp.local      # так позже откроем Ingress в Kubernetes`,'out')}
<h2>HTTP: запрос и ответ — это текст</h2>
${C(`
$ curl -v http://shop.kz/api/items?limit=2
> GET /api/items?limit=2 HTTP/1.1          ← метод, путь, версия
> Host: shop.kz                            ← какой сайт на этом IP
> User-Agent: curl/8.5.0
> Accept: */*
>
< HTTP/1.1 200 OK                          ← код ответа
< Content-Type: application/json
< Content-Length: 58
< Cache-Control: no-cache
<
[{"id":1,"name":"Кофе"},{"id":2,"name":"Чай"}]   ← тело
`,'term')}
${tbl(['Метод','Смысл'],[['<b>GET</b>','получить (не меняет данные)'],['<b>POST</b>','создать / выполнить действие'],['<b>PUT</b> / <b>PATCH</b>','заменить целиком / изменить часть'],['<b>DELETE</b>','удалить'],['<b>HEAD</b>','как GET, но только заголовки (curl -I)']])}
${BOX('Заголовок Host — почему curl по IP отдаёт «не тот сайт»','<p>На одном IP nginx может держать десятки сайтов. Какой отдать, он решает по заголовку <code>Host</code>. <code>curl http://10.0.0.5</code> отправляет <code>Host: 10.0.0.5</code> — и nginx отдаёт сайт по умолчанию. Проверить нужный сайт по IP, не трогая DNS: <code>curl -H "Host: shop.kz" http://10.0.0.5/</code> (или <code>curl --resolve shop.kz:443:10.0.0.5 https://shop.kz</code> для HTTPS).</p>','deep')}
<h2>Коды ответа</h2>
${tbl(['Код','Значит','Чья проблема / что делать'],[
 ['200 / 201 / 204','ок / создано / ок без тела','—'],
 ['301 / 302','перенаправление (Location: куда)','301 — навсегда (браузеры кэшируют!), 302 — временно'],
 ['304','не изменилось, бери из кэша','—'],
 ['400','кривой запрос','клиент'],
 ['<b>401</b>','<b>не представился</b>: нет или неверный логин/токен','клиент — авторизоваться'],
 ['<b>403</b>','<b>представился, но нельзя</b>: нет прав (или права на файлы у nginx, модуль [[mod:perms]])','права'],
 ['404','нет такого пути','клиент или неверный маршрут'],
 ['429','слишком много запросов (rate limit)','клиент или лимиты'],
 ['500','приложение упало при обработке','логи приложения'],
 ['<b>502</b>','прокси (nginx) <b>не получил нормального ответа</b> от приложения: не запущено, не слушает, упало','приложение / порт за nginx'],
 ['503','сервис временно недоступен (перегруз, обслуживание, нет живых бэкендов)','нагрузка, балансировщик'],
 ['<b>504</b>','прокси <b>не дождался</b> ответа от приложения (таймаут)','медленное приложение или база']])}
<h2>HTTPS и сертификаты</h2>
<p>TLS шифрует соединение и доказывает, что сервер — действительно <code>shop.kz</code>. Для этого у сервера есть <b>сертификат</b>: имя домена, срок действия, подпись центра сертификации (CA), которому доверяет браузер. Проверяется три вещи: <mark>подпись цепочки, совпадение имени, срок</mark>.</p>
${C(`
$ echo | openssl s_client -connect shop.kz:443 -servername shop.kz 2>/dev/null | openssl x509 -noout -subject -issuer -dates
subject=CN = shop.kz
issuer=C = US, O = Let's Encrypt, CN = R11
notBefore=Oct  1 00:00:00 2026 GMT
notAfter=Dec 30 23:59:59 2026 GMT          ← когда истекает
`,'term')}
${tbl(['Ошибка','Причина'],[['certificate has expired','истёк срок — не продлили'],['hostname mismatch','сертификат выдан на другое имя (например, только на shop.kz, а зашли на www.shop.kz)'],['unable to get local issuer certificate','на сервере не настроена промежуточная цепочка или самоподписанный сертификат']])}
<p><b>Let\'s Encrypt</b> выдаёт бесплатные сертификаты на 90 дней; продление автоматизирует certbot (модуль Nginx). <code>curl -k</code> отключает проверку — только для отладки, никогда в скриптах продакшена.</p>`,
memo:`<p>Неделю для каждого сайта, который открываешь, делай три команды: <code>dig +short</code> (адрес), <code>curl -sI</code> (код и заголовки), проверку срока сертификата через openssl. Через неделю ответы на «почему не открывается» будут приходить в голову сами.</p>`,
traps:[
 ['Бизнес-ошибку («недостаточно средств», «запись не найдена») отдавать как 500 с безликим текстом','4xx (400, 404, 409, 422) с понятным сообщением; 500 — только когда сервер действительно сломался','500 значит «у нас авария»: на неё срабатывают алерты и мониторинг ошибок, а фронтенд не может показать человеку, что пошло не так. Реальный случай: бэкенд отдавал все ошибки как обезличенные 500 — пользователи видели «что-то пошло не так» вместо понятной причины.'],
 ['Поменял A-запись при TTL сутки и сразу выключил старый сервер','Заранее снизить TTL до 300, переехать, держать старый сервер (или прокси) до истечения кэшей','Резолверы отдают старый адрес до конца TTL.'],
 ['dig показывает новый IP — «значит, приложение тоже ходит туда»','getent hosts имя','dig игнорирует /etc/hosts, а приложение — нет. Старая строка в hosts — частая причина «у меня одно, у всех другое».'],
 ['curl http://IP — «nginx отдаёт не тот сайт»','curl -H "Host: имя" http://IP/','nginx выбирает сайт по заголовку Host.'],
 ['401 и 403 — одно и то же','401 — не авторизован (нет/неверный токен), 403 — авторизован, но нет прав','Разные проблемы — разные решения.'],
 ['502 — «nginx сломался»','502 — nginx жив, а приложение за ним не ответило: смотри сервис и его порт','nginx как раз работает и честно сообщает, что бэкенд недоступен.'],
 ['curl -k в скрипте деплоя, «чтобы не ругался»','Починить цепочку сертификатов или добавить свой CA в доверенные','-k отключает проверку подлинности — подменённый сервер тоже «пройдёт».']],
ex:[
 {t:'c',q:'Что делает DNS?',o:['Превращает имя в IP-адрес (и хранит другие записи домена)','Шифрует трафик','Раздаёт IP-адреса машинам','Ускоряет сайт'],a:0,e:'Сеть работает с IP-адресами, а люди помнят имена. DNS превращает shop.kz в адрес и хранит другие записи домена (почта, проверки). Не путай: IP-адреса машинам раздаёт DHCP, а шифрует трафик TLS.'},
 {t:'c',q:'Какая запись связывает имя с IPv4-адресом?',o:['A','CNAME','MX','TXT'],a:0,e:'AAAA — IPv6, CNAME — псевдоним на другое имя, MX — почта.'},
 {t:'c',q:'Что такое TTL записи DNS?',o:['Сколько секунд ответ можно хранить в кэше','Время ответа сервера','Номер версии записи','Количество серверов'],a:0,e:'Пока TTL не истёк, резолверы отдают сохранённый ответ.'},
 {t:'c',q:'Чем <code>getent hosts shop.kz</code> отличается от <code>dig shop.kz</code>?',o:['getent разрешает имя как приложения — с учётом /etc/hosts; dig ходит только в DNS','Ничем','dig учитывает /etc/hosts','getent работает только с IPv6'],a:0,e:'Для «почему приложение идёт не туда» — getent.'},
 {t:'c',q:'Чем 401 отличается от 403?',o:['401 — не авторизован (нет или неверные данные входа), 403 — авторизован, но нет прав','Ничем','401 — нет страницы','403 — ошибка сервера'],a:0,e:'401 — сервер не знает, кто ты: нет токена или он неверный, нужно войти. 403 — сервер знает, кто ты, но тебе нельзя: нужны права (или у nginx нет прав на файлы, модуль [[mod:perms]]). Разные причины — разные решения.'},
 {t:'c',q:'Что означает 502 Bad Gateway от nginx?',o:['nginx не получил нормального ответа от приложения за ним','nginx не запущен','Неверный пароль пользователя','Страница не найдена'],a:0,e:'Если бы nginx не работал, ответа не было бы вовсе (refused/timeout).'},
 {t:'c',q:'Как nginx выбирает, какой сайт отдать, если на одном IP их несколько?',o:['По заголовку Host','По User-Agent','По IP клиента','Случайно'],a:0,e:'Для HTTPS ещё по SNI — имени в начале TLS-рукопожатия.'},
 {t:'i',q:'Впиши: получить только IP-адрес <code>shop.kz</code> через dig.',a:['dig +short shop.kz','dig shop.kz +short','dig +short shop.kz A','dig +short A shop.kz'],ph:'dig …',e:'Без +short dig печатает весь ответ: вопрос, секцию ответа с TTL, какой сервер ответил. +short оставляет только данные — удобно в скриптах и для быстрой проверки.'},
 {t:'i',q:'Впиши: спросить адрес <code>shop.kz</code> у публичного резолвера Google 8.8.8.8.',a:['dig @8.8.8.8 shop.kz','dig shop.kz @8.8.8.8','dig @8.8.8.8 +short shop.kz','dig +short @8.8.8.8 shop.kz','nslookup shop.kz 8.8.8.8'],ph:'dig …',e:'Сравнивая ответы разных резолверов, видно, где ещё лежит старый кэш.'},
 {t:'i',q:'Впиши curl, который отправит запрос на IP <code>10.0.0.5</code>, но с заголовком <code>Host: shop.kz</code>.',a:['curl -H "Host: shop.kz" http://10.0.0.5/','curl -H "Host: shop.kz" http://10.0.0.5',"curl -H 'Host: shop.kz' http://10.0.0.5/","curl -H 'Host: shop.kz' http://10.0.0.5"],ph:'curl …',e:'Проверка сайта на новом сервере до смены DNS.'},
 {t:'i',q:'Впиши curl: только заголовки ответа <code>https://shop.kz</code>.',a:['curl -I https://shop.kz','curl -sI https://shop.kz','curl --head https://shop.kz','curl -Is https://shop.kz'],ph:'curl …',e:'-I — метод HEAD: код, Content-Type, Location, кэш.'},
 {t:'i',q:'Впиши: узнать, какое имя закреплено за IP <code>8.8.8.8</code> (обратный запрос, PTR).',a:['dig -x 8.8.8.8','dig +short -x 8.8.8.8','dig -x 8.8.8.8 +short','nslookup 8.8.8.8'],ph:'dig …',e:'PTR нужен почтовым серверам и логам: по IP видно, чей это хост (dns.google).'},
 {t:'s',q:'Собери путь DNS-запроса (без кэшей) по порядку.',p:['Приложение проверяет /etc/hosts','Локальный резолвер (systemd-resolved)','Рекурсивный резолвер (провайдера или 8.8.8.8)','Корневые серверы «.»','Серверы зоны kz.','Авторитетные серверы shop.kz → ответ с TTL'],e:'Ответ кэшируется на обратном пути на каждом уровне.'},
 {t:'s',q:'Собери безопасный переезд сайта на новый IP.',p:['За сутки (старый TTL) снизить TTL записи до 300','Поднять сайт на новом сервере, проверить curl -H "Host: …" http://новый-IP/','Поменять A-запись на новый IP','Следить за логами обоих серверов, пока трафик не перетечёт','Выключить старый сервер, вернуть TTL'],e:'TTL заранее → проверка до смены → смена → переходный период → уборка.'},

 {t:'c',g:'prac',q:'Сайт отдаёт 301 на неправильный адрес, ты исправил конфиг, но в браузере всё ещё старое перенаправление. Почему?',o:['Браузер закэшировал 301 (постоянный редирект) — проверить curl или в режиме инкогнито','nginx не перечитал конфиг никогда','DNS','Сервер тормозит'],a:0,e:'301 — «навсегда», браузеры его запоминают. Для временных редиректов — 302.'},
 {t:'c',g:'prac',q:'Нужно проверить сайт на новом сервере по HTTPS до смены DNS. Как?',o:['curl --resolve shop.kz:443:НОВЫЙ_IP https://shop.kz/','curl -k https://НОВЫЙ_IP','Поменять DNS и проверить','ping НОВЫЙ_IP'],a:0,e:'--resolve подставляет адрес для имени только для этого запроса — сертификат и SNI проверяются честно.'},
 {t:'i',g:'prac',fix:true,q:'Исправь команду проверки API в скрипте — она «проходит», даже если сертификат поддельный.',code:'curl -k -sf https://api.shop.kz/health',a:['curl -sf https://api.shop.kz/health','curl -fs https://api.shop.kz/health','curl -s -f https://api.shop.kz/health'],ph:'curl …',e:'-k отключает проверку сертификата. В скриптах — никогда.'},
 {t:'c',g:'job',q:'Как узнать заранее, что сертификат скоро истечёт, а не в момент падения?',o:['Мониторинг: проверять notAfter (openssl x509 -enddate / blackbox exporter) и алерт за 14–20 дней','Ждать писем от пользователей','Смотреть в браузере раз в месяц','Перевыпускать каждый день'],a:0,e:'Плюс автопродление certbot. Мониторинг страхует, если продление сломалось.'},
 {t:'c',g:'job',q:'Пользователи из одного города не могут открыть сайт, остальные могут. С чего начать?',o:['Сравнить ответы DNS разных резолверов (dig @…) и проверить доступность с разных точек (маршрут, провайдер)','Перезапустить nginx','Перевыпустить сертификат','Увеличить сервер'],a:0,e:'Частичная недоступность — почти всегда DNS-кэш или маршрут/провайдер, а не сам сервер.'}],
lab:[
 {t:'DNS руками: для <code>github.com</code> получи A, AAAA, MX, NS и TTL; пройди цепочку <code>dig +trace</code> и найди, какие серверы ответили на каждом шаге.',sol:C(`dig github.com
dig +short github.com AAAA
dig +short github.com MX
dig +short github.com NS
dig +trace github.com | grep -E "IN\\s+(NS|A)\\s" | head`)},
 {t:'/etc/hosts против DNS: добавь в hosts строку <code>127.0.0.1 example.com</code>, сравни <code>dig +short example.com</code> и <code>getent hosts example.com</code>, открой <code>curl -I http://example.com</code>. Убери строку!',sol:C(`echo "127.0.0.1 example.com" | sudo tee -a /etc/hosts
dig +short example.com; getent hosts example.com
curl -sI http://example.com | head -1      # пойдёт на localhost
sudo sed -i '/example.com/d' /etc/hosts`)},
 {t:'HTTP руками: с помощью <code>curl -v</code> отправь GET, HEAD и POST с JSON на <code>https://httpbin.org</code> (/get, /post, /status/401, /status/503). Для каждого найди в выводе строку запроса, заголовок Host, код ответа.',sol:C(`curl -v https://httpbin.org/get
curl -sI https://httpbin.org/get
curl -s -X POST -H "Content-Type: application/json" -d '{"name":"Кофе"}' https://httpbin.org/post
curl -s -o /dev/null -w "%{http_code}\\n" https://httpbin.org/status/401`)},
 {t:'Сертификаты: узнай, кто выдал сертификат <code>github.com</code>, на какие имена и когда он истекает. Затем найди сайт с ошибкой сертификата на <code>badssl.com</code> (expired, wrong.host) и посмотри, как ругается curl.',sol:C(`echo | openssl s_client -connect github.com:443 -servername github.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
curl -sI https://expired.badssl.com     # certificate has expired
curl -sI https://wrong.host.badssl.com  # name mismatch`)}],
qa:[
 ['Как работает DNS?','Приложение → /etc/hosts → локальный кэш → рекурсивный резолвер → корневые → TLD → авторитетные серверы домена. Ответ кэшируется на время TTL на каждом шаге.'],
 ['Какие записи DNS знаешь?','A (IPv4), AAAA (IPv6), CNAME (псевдоним), MX (почта), TXT (проверки, SPF), NS (авторитетные серверы), PTR (обратная), SRV (сервис и порт).'],
 ['Почему изменения DNS применяются не сразу?','Кэши резолверов держат старый ответ до истечения TTL. Перед изменениями TTL заранее снижают.'],
 ['Из чего состоит HTTP-запрос?','Стартовая строка (метод, путь, версия), заголовки (Host, User-Agent, Authorization, Content-Type…), пустая строка, тело. Ответ — версия и код, заголовки, тело.'],
 ['401 vs 403, 502 vs 504?','401 — не авторизован, 403 — нет прав. 502 — прокси получил плохой ответ или не смог подключиться к бэкенду, 504 — не дождался ответа (таймаут).'],
 ['Зачем заголовок Host?','На одном IP много сайтов; сервер выбирает сайт по Host (для HTTPS — по SNI).'],
 ['Что проверяется у TLS-сертификата?','Цепочка подписей до доверенного CA, совпадение имени (CN/SAN) с доменом, срок действия.'],
 ['Как проверить сайт на новом сервере до смены DNS?','curl -H "Host: домен" http://IP/ или curl --resolve домен:443:IP https://домен/; либо временная строка в /etc/hosts.']],
cheat:[['dig +short name','адрес'],['dig name MX / NS / TXT','другие записи'],['dig @8.8.8.8 name','спросить конкретный резолвер'],['dig +trace name','цепочка от корня'],['getent hosts name','как видит приложение'],['resolvectl status','текущие DNS-серверы'],['curl -v url','весь HTTP-разговор'],['curl -I url','только заголовки'],['curl -H "Host: x" http://IP/','конкретный сайт на IP'],['curl --resolve h:443:IP https://h/','HTTPS до смены DNS'],['openssl s_client -connect h:443 -servername h','TLS и сертификат'],['openssl x509 -noout -dates','срок сертификата']]});
/* files · L1 · Иерархия ФС и работа с файлами */
MOD({id:'files',title:'Файлы и иерархия ФС',sub:'Где что лежит на сервере (/etc, /var, /opt…) и как читать, копировать, искать файлы.',
case:`<p>В 2 часа ночи приходит алерт: «Диск на web-01 заполнен на 95%». Через час сервер встанет: база не сможет писать. Утром другая задача: «Поменяй порт в конфиге приложения». Где этот конфиг? Где логи? Что можно удалять, а что — нельзя ни в коем случае?</p><p class="goal"><b>Цель модуля:</b> на любом незнакомом сервере за минуту находить конфиги, логи и данные сервисов, читать огромные файлы, искать файлы по имени и размеру, безопасно копировать и править — с бэкапом и путём отката.</p>`,
intro:`<p>В Linux нет дисков C: и D: — есть <b>одно дерево</b>, которое растёт из корня <code>/</code>. Все диски, флешки и даже информация о процессах «подвешены» в это дерево в виде папок.</p>
<p>У каждой папки есть назначение, и оно <mark>одинаковое на всех серверах</mark> (стандарт FHS). Поэтому на незнакомом сервере ты сразу знаешь: конфиги — в <code>/etc</code>, логи — в <code>/var/log</code>, данные сервисов — в <code>/var/lib</code>.</p>
<p>Принцип «<b>всё есть файл</b>»: конфиг — файл, лог — файл, диск — файл в <code>/dev</code>, сведения о процессе — файлы в <code>/proc</code>. Значит, одни и те же <code>cat</code>, <code>grep</code>, <code>tail</code> работают со всем.</p>`,
theory:`<h2>Карта файловой системы</h2>
${tbl(['Папка','Что там','Пример'],[
 ['<code>/etc</code>','<mark>конфиги</mark> системы и сервисов','<code>/etc/nginx/nginx.conf</code>, <code>/etc/ssh/sshd_config</code>'],
 ['<code>/var/log</code>','<mark>логи</mark>','<code>/var/log/nginx/error.log</code>, <code>/var/log/syslog</code>'],
 ['<code>/var/lib</code>','данные сервисов (меняются в работе)','<code>/var/lib/docker</code>, <code>/var/lib/postgresql</code>'],
 ['<code>/opt</code>','сторонние приложения, часто — твой сервис','<code>/opt/app</code>'],
 ['<code>/home</code>','домашние папки пользователей','<code>/home/deploy/.ssh</code>'],
 ['<code>/root</code>','домашняя папка root','<code>/root/.bashrc</code>'],
 ['<code>/usr/bin</code>, <code>/bin</code>','программы (в современных системах /bin → /usr/bin)','<code>/usr/bin/ls</code>'],
 ['<code>/tmp</code>','временные файлы, могут удаляться при перезагрузке','—'],
 ['<code>/proc</code>, <code>/sys</code>','<b>виртуальные</b>: ядро показывает своё состояние в виде файлов','<code>/proc/cpuinfo</code>, <code>/proc/1234/</code>'],
 ['<code>/dev</code>','устройства','<code>/dev/sda</code>, <code>/dev/null</code>'],
 ['<code>/boot</code>','ядро и загрузчик','<code>/boot/vmlinuz-…</code>'],
 ['<code>/mnt</code>, <code>/media</code>','точки монтирования дисков','—']])}
${BOX('Как запомнить','<p><b>etc</b> — «настройки», <b>var</b> — «variable», то, что меняется в работе (логи, данные), <b>opt</b> — «optional», то, что поставили сверху. Сервер сломался → смотришь <code>/var/log</code>, хочешь поменять поведение → <code>/etc</code>.</p>')}
<h2>Чтение файлов</h2>
${CMDS([['cat file','вывести целиком (только для маленьких файлов)'],['less file','листать: / — поиск, n — дальше, G — в конец, q — выход'],['head -n 20 file','первые 20 строк'],['tail -n 50 file','последние 50 строк'],['tail -f app.log','следить, как дописывается лог (Ctrl+C — выйти)'],['tail -F app.log','то же, но переживает ротацию лога (файл пересоздали)'],['wc -l file','сколько строк'],['file x','что это за файл: текст, бинарник, архив'],['stat file','размер, права, владелец, даты изменения']])}
<h2>Создание, копирование, удаление</h2>
${CMDS([['touch a.txt','создать пустой файл (или обновить дату)'],['mkdir -p a/b/c','создать папки вместе с родителями'],['cp a.txt b.txt','копировать файл'],['cp -r src/ dst/','копировать папку (рекурсивно)'],['cp -a src/ dst/','копировать с сохранением прав, владельца и дат (для бэкапов)'],['mv old new','переместить или <b>переименовать</b>'],['rm file','удалить файл'],['rm -r dir/','удалить папку со всем содержимым'],['ln -s target link','символическая ссылка (ярлык)']])}
${BOX('Корзины нет','<p><code>rm</code> удаляет сразу и навсегда. <code>rm -rf</code> не спрашивает подтверждения и не жалуется на ошибки. Перед удалением — <code>ls</code> того же пути. Особенно опасно с переменной: если <code>$DIR</code> пустая, <code>rm -rf $DIR/*</code> превращается в <code>rm -rf /*</code> — удаление всего содержимого корня (защита rm --preserve-root спасает только от голого <code>/</code>, но не от <code>/*</code>).</p>','warn')}
<h2>Поиск файлов</h2>
${C(`find /etc -name "*.conf"                # по имени (кавычки обязательны!)
find /var/log -name "*.log" -mtime +7    # изменённые больше 7 дней назад
find / -size +500M 2>/dev/null           # больше 500 МБ, ошибки доступа скрыть
find /opt/app -type d                    # только папки (-type f — только файлы)`)}
<p>Шаблоны <code>*</code> (любые символы) и <code>?</code> (один символ) раскрывает <b>оболочка</b> до запуска команды. Поэтому в <code>find -name</code> шаблон берут в кавычки — иначе bash раскроет его сам по файлам текущей папки.</p>
<h2>Символические ссылки</h2>
${C(`
$ ls -l /etc/nginx/sites-enabled/
lrwxrwxrwx 1 root root 34 May 3 myapp -> /etc/nginx/sites-available/myapp
`,'term')}
<p>Буква <b>l</b> в начале и стрелка <code>-&gt;</code> — это ссылка. Nginx включает сайт ссылкой из <code>sites-enabled</code> на файл в <code>sites-available</code>: удалил ссылку — сайт выключен, а конфиг остался.</p>`,
memo:`<p>Зайди на свою Ubuntu и пройди по карте: открой по одному файлу из <code>/etc</code>, <code>/var/log</code>, <code>/proc</code>. Для каждой папки скажи вслух, что там лежит. Потом найди через <code>find</code> 5 самых больших файлов в системе.</p>`,
traps:[
 ['cat /var/log/syslog на 2 ГБ','less /var/log/syslog или tail -n 200','cat вывалит гигабайты в терминал, и SSH-сессия «зависнет». Большие файлы читаем постранично или с конца.'],
 ['find / -name *.log','find / -name "*.log"','Без кавычек bash раскроет *.log по текущей папке ещё до запуска find, и поиск будет не тот (или ошибка).'],
 ['cp /etc/nginx /backup/','cp -r /etc/nginx /backup/ (а лучше cp -a)','Без -r папки не копируются: «omitting directory». -a ещё и сохраняет права и владельца.'],
 ['rm -rf $APP_DIR/* без проверки','[ -n "$APP_DIR" ] && rm -rf "$APP_DIR"/* — и сначала ls','Пустая переменная превращает команду в rm -rf /* — удаление всего. Кавычки защищают имена с пробелами.'],
 ['tail -f на лог, который ротируется','tail -F','После ротации старый файл переименован, -f продолжает читать его и «молчит». -F переоткрывает файл по имени.']],
ex:[
 {t:'c',q:'Где лежат конфигурационные файлы системы и сервисов?',o:['/etc','/var','/opt','/usr/bin'],a:0,e:'/etc — конфиги: /etc/nginx, /etc/ssh, /etc/hosts.'},
 {t:'c',q:'Где искать логи nginx в первую очередь?',o:['/var/log/nginx','/etc/nginx/log','/opt/nginx','/tmp/nginx'],a:0,e:'Логи — в /var/log: access.log и error.log.'},
 {t:'c',q:'Где Docker хранит образы и данные контейнеров по умолчанию?',o:['/var/lib/docker','/etc/docker','/opt/docker','/home/docker'],a:0,e:'/var/lib — изменяемые данные сервисов. В /etc/docker лежит только конфиг daemon.json.'},
 {t:'c',q:'Что такое <code>/proc</code>?',o:['Виртуальная ФС: ядро показывает процессы и своё состояние как файлы','Папка с программами','Папка с логами процессов','Временные файлы'],a:0,e:'/proc не хранится на диске. /proc/cpuinfo, /proc/meminfo, /proc/&lt;pid&gt;/ — живые данные ядра.'},
 {t:'c',q:'Какая команда подходит, чтобы <b>следить</b> за логом в реальном времени?',o:['tail -f','head -f','cat -f','less -n'],a:0,e:'tail -f дописывает новые строки по мере появления. Выход — Ctrl+C.'},
 {t:'c',q:'Как переименовать файл <code>app.conf</code> в <code>app.conf.bak</code>?',o:['mv app.conf app.conf.bak','rename app.conf','cp -r app.conf','ln app.conf.bak'],a:0,e:'Отдельной команды rename в базе нет: переименование = перемещение в то же место под новым именем.'},
 {t:'i',q:'Впиши команду: создать папки <code>/opt/app/releases/v1</code> одним махом, даже если родителей нет.',a:['mkdir -p /opt/app/releases/v1'],ph:'mkdir …',e:'-p создаёт всю цепочку и не ругается, если папка уже есть.'},
 {t:'i',q:'Впиши команду: показать последние 100 строк файла <code>/var/log/syslog</code>.',a:['tail -n 100 /var/log/syslog','tail -100 /var/log/syslog','tail -n100 /var/log/syslog'],ph:'tail …',e:'tail -n 100 — последние 100 строк. По умолчанию tail показывает 10.'},
 {t:'i',q:'Впиши команду: скопировать папку <code>conf</code> в <code>conf.bak</code> с сохранением прав и владельца.',a:['cp -a conf conf.bak','cp -a conf/ conf.bak','cp -a conf/ conf.bak/','cp -rp conf conf.bak'],ph:'cp …',e:'-a (archive) = рекурсивно + права + владелец + даты + ссылки. Для бэкапов конфигов — то, что нужно.'},
 {t:'i',q:'Впиши команду: найти в <code>/etc</code> все файлы с именем, оканчивающимся на <code>.conf</code>.',a:['find /etc -name "*.conf"',"find /etc -name '*.conf'",'find /etc -type f -name "*.conf"',"find /etc -type f -name '*.conf'"],ph:'find …',e:'Шаблон в кавычках, чтобы его разобрал find, а не bash.'},
 {t:'s',q:'Собери путь к главному конфигу nginx.',p:['/etc','/nginx','/nginx.conf'],e:'/etc/nginx/nginx.conf — главный конфиг. Сайты — в /etc/nginx/sites-available и sites-enabled.'},
 {t:'r',q:'Что это за объект?',code:`$ ls -l /etc/nginx/sites-enabled/
lrwxrwxrwx 1 root root 34 May  3 10:12 shop -> /etc/nginx/sites-available/shop`,lang:'term',o:['Символическая ссылка на файл в sites-available','Обычный файл конфига','Папка','Сломанный файл'],a:0,e:'l в первом символе и стрелка -> — symlink. Конфиг живёт в sites-available, ссылка включает сайт.'},
 {t:'r',q:'Почему ничего не скопировалось?',code:`$ cp /etc/nginx /root/backup/
cp: -r not specified; omitting directory '/etc/nginx'`,lang:'term',o:['Это папка, нужен флаг -r (или -a)','Нет прав root','Папки /root/backup нет','nginx запущен и файл занят'],a:0,e:'cp без -r копирует только файлы. Папки — cp -r или cp -a.'},
 {t:'c',g:'prac',q:'Сервис пишет лог 3 ГБ. Ты хочешь найти в нём первое упоминание <code>timeout</code>. Что лучше?',o:['less app.log, потом /timeout','cat app.log','head app.log','nano app.log'],a:0,e:'less не грузит файл целиком в терминал и умеет искать. cat вывалит 3 ГБ, редактор может съесть всю память.'},
 {t:'c',g:'prac',q:'Что произойдёт: <code>rm -rf $DIR/*</code>, если переменная <code>DIR</code> пустая?',o:['Команда станет rm -rf /* — удаление всего содержимого корня','Ничего, rm проверит пустую переменную','Удалится текущая папка','Будет ошибка синтаксиса'],a:0,e:'Оболочка подставит пустоту → rm -rf /*, а bash раскроет /* в /bin /etc /home … Защита: проверять переменную, set -u в скриптах, кавычки "$DIR".'},
 {t:'c',g:'prac',q:'Лог nginx ротируется каждую ночь (logrotate). Утром <code>tail -f access.log</code> перестал показывать новые строки. Почему и что делать?',o:['tail -f держит старый файл; нужен tail -F','nginx перестал писать логи','Закончилось место','Нужен sudo'],a:0,e:'logrotate переименовал файл, nginx пишет в новый, а tail -f читает старый. -F следит за именем и переоткрывает.'},
 {t:'i',g:'prac',q:'Впиши команду: найти файлы больше 1 ГБ во всей системе, ошибки «Permission denied» скрыть.',a:['find / -size +1G 2>/dev/null','find / -type f -size +1G 2>/dev/null'],ph:'find / …',e:'-size +1G — больше гигабайта. 2>/dev/null — выбросить ошибки (поток ошибок подробно — в модуле «Потоки»).'},
 {t:'i',g:'prac',fix:true,q:'Исправь команду: найти логи старше 7 дней.',code:'find /var/log -name *.log -mtime 7',a:['find /var/log -name "*.log" -mtime +7',"find /var/log -name '*.log' -mtime +7",'find /var/log -type f -name "*.log" -mtime +7'],ph:'find …',e:'Шаблон в кавычки; -mtime +7 — больше 7 суток. -mtime 7 значит «ровно 7».'},
 {t:'c',g:'job',q:'Нужно поправить конфиг сайта nginx. Какой файл редактировать?',o:['Файл в /etc/nginx/sites-available (ссылка из sites-enabled укажет на него)','Ссылку в sites-enabled удалить и создать файл','/var/log/nginx/access.log','/opt/nginx/site'],a:0,e:'Редактируем оригинал. Ссылка в sites-enabled просто включает его. Правку проверить nginx -t (модуль Nginx).'},
 {t:'s',g:'job',q:'Перед правкой прод-конфига. Собери безопасный порядок.',p:['Сделать копию: cp -a app.conf app.conf.bak','Отредактировать app.conf','Проверить синтаксис (например, nginx -t)','Применить (reload сервиса)','Если сломалось — вернуть из .bak'],e:'Бэкап → правка → проверка → применение → путь отката. Так делают всегда, не только с nginx.'},
 {t:'c',g:'job',q:'Где на сервере искать твоё приложение, если его ставили вручную, не из пакета?',o:['Чаще всего /opt/&lt;имя&gt; (или /srv, /home/&lt;пользователь&gt;)','/proc','/boot','/dev'],a:0,e:'/opt — для стороннего софта и самописных сервисов. Узнать наверняка: посмотреть unit-файл systemd (модуль systemd).'},
 {t:'c',g:'job',q:'Где посмотреть, сколько ядер у процессора, если нет утилит?',o:['cat /proc/cpuinfo','cat /etc/cpu','ls /dev/cpu','cat /var/log/cpu'],a:0,e:'/proc/cpuinfo, /proc/meminfo — ядро отдаёт данные как файлы. Быстрее: nproc.'}],
lab:[
 {t:'Экскурсия: найди и открой на своей машине (1) конфиг SSH-сервера или клиента, (2) системный лог, (3) информацию о памяти от ядра, (4) файл с соответствием имён и IP. Для каждого — полный путь.',h:'<p>Смотри карту: /etc, /var/log, /proc. Файл имён — hosts.</p>',sol:C(`less /etc/ssh/ssh_config       # (sshd_config — если стоит сервер)
less /var/log/syslog           # в WSL может быть пусто — тогда journalctl
cat /proc/meminfo
cat /etc/hosts`)},
 {t:'В <code>~/lab</code> создай 30 файлов <code>log1.log … log30.log</code>, папку <code>archive</code>. Перемести туда все логи с номерами 1–9, потом найди <code>find</code>-ом все <code>.log</code> вне archive.',h:'<p>Скобки <code>{1..30}</code> раскрывает bash. Шаблон <code>log?.log</code> — один символ.</p>',sol:C(`cd ~/lab && touch log{1..30}.log && mkdir -p archive
mv log?.log archive/
find . -name "*.log" -not -path "./archive/*"`)},
 {t:'Включи «сайт» как в nginx: создай <code>~/lab/sites-available/shop</code>, сделай на него ссылку в <code>~/lab/sites-enabled/</code>, проверь <code>ls -l</code>. Удали ссылку и убедись, что оригинал жив. Затем удали оригинал при живой ссылке и посмотри, что покажет <code>cat</code> по ссылке.',sol:C(`mkdir -p ~/lab/sites-available ~/lab/sites-enabled
echo "server {}" > ~/lab/sites-available/shop
ln -s ~/lab/sites-available/shop ~/lab/sites-enabled/shop
ls -l ~/lab/sites-enabled/
rm ~/lab/sites-enabled/shop && cat ~/lab/sites-available/shop   # оригинал на месте`)+'<p>Если удалить оригинал — ссылка «висит» (dangling) и cat скажет No such file.</p>'},
 {t:'Найди 5 самых больших файлов в <code>/var</code>. Пока не знаешь <code>sort</code> — используй <code>find -size</code> и уменьшай порог, пока не останется несколько файлов.',sol:C(`sudo find /var -type f -size +100M 2>/dev/null
# после модуля «Текст» это делается одной строкой:
sudo du -ah /var 2>/dev/null | sort -rh | head -5`)}],
qa:[
 ['Что лежит в /etc, /var, /opt?','/etc — конфиги. /var — изменяемые данные: /var/log (логи), /var/lib (данные сервисов: docker, postgres). /opt — сторонний и самописный софт.'],
 ['Что такое /proc?','Виртуальная файловая система: ядро показывает состояние процессов (/proc/&lt;pid&gt;) и системы (cpuinfo, meminfo, loadavg). На диске не хранится.'],
 ['Что значит «всё есть файл»?','Устройства, процессы, сокеты, конфиги представлены как файлы. Поэтому одни и те же инструменты (cat, grep, tail) работают со всем.'],
 ['tail -f и tail -F?','-f следит за дескриптором открытого файла; после ротации читает старый. -F следит за именем и переоткрывает файл — для логов с logrotate.'],
 ['Что такое символическая ссылка?','Файл-указатель на путь другого файла. Если оригинал удалить, ссылка повиснет. Пример — sites-enabled в nginx. Жёсткая ссылка (ln без -s) — второе имя тех же данных.'],
 ['Как найти, что съело диск?','df -h — какой раздел заполнен; du -sh /* и глубже — какая папка; find / -size +1G — крупные файлы. Подробно — модуль «Сервер тормозит».']],
cheat:[['less file','листать, / — поиск'],['tail -f / -F log','следить за логом'],['head -n 20 file','начало файла'],['mkdir -p a/b/c','папки с родителями'],['cp -a src dst','копия с правами'],['mv old new','переместить / переименовать'],['rm -r dir','удалить папку'],['ln -s target link','символьная ссылка'],['find /etc -name "*.conf"','поиск по имени'],['find / -size +1G 2>/dev/null','большие файлы'],['stat file','метаданные файла']]});
/* linux · L1 · Что такое Linux: ядро, дистрибутивы, Ubuntu и LTS */
MOD({id:'linux',title:'Что такое Linux и дистрибутивы',sub:'Ядро, семейства, Ubuntu, LTS — и почему на проде стоит именно оно.',
case:`<p>Первый день на работе. Тимлид кидает в чат: «Вот доступ к серверу, глянь, что там, и поставь htop». Ты заходишь — чёрный экран и мигающий курсор. Ставить через <code>apt</code> или <code>dnf</code>? Это свежая система или её три года никто не обновлял, и в ней дыры? Спросить «а что за Linux?» неловко — это первое, что знает любой админ.</p><p class="goal"><b>Цель модуля:</b> за 30 секунд понять, что за система перед тобой, из какого она «семейства» (значит, какие команды работают) и не устарела ли она. И уметь объяснить на собесе, почему на прод ставят Ubuntu LTS, а не «самую новую».</p>`,
intro:`<p><b>Linux</b> — это <mark>ядро</mark>: программа, которая управляет железом (процессор, память, диски, сеть) и раздаёт его другим программам. Само ядро ничего «не умеет показать» — нет ни команд, ни установщика.</p>
<p><b>Дистрибутив</b> — это ядро + набор программ вокруг него: оболочка (bash), утилиты (ls, cp, grep), менеджер пакетов (apt, dnf), система запуска (systemd) и настройки по умолчанию. Ubuntu, Debian, RHEL, Alpine — разные дистрибутивы на одном и том же ядре.</p>
<p>Зачем DevOps-у: почти все серверы, контейнеры и узлы Kubernetes работают на Linux. Чтобы чинить прод, нужно понимать, <b>что именно</b> у тебя стоит: от этого зависят команды установки, пути к конфигам и сроки обновлений безопасности.</p>`,
theory:`<h2>Из чего состоит система</h2>
${C(`
 Приложения:   nginx, postgres, твой сервис       ┐
 Утилиты:      bash, ls, grep, systemctl          ├ user space (пространство пользователя)
 Библиотеки:   glibc (или musl в Alpine)          ┘
 ─────────────── системные вызовы (syscalls) ───────────────
 Ядро Linux:   процессы, память, файлы, сеть, драйверы   ← kernel space
 Железо:       CPU, RAM, диск, сетевая карта
`,'out')}
<p>Программа не трогает диск напрямую — она просит ядро через <b>системный вызов</b> (open, read, write, fork…). Поэтому ядро может всё контролировать: права, лимиты, изоляцию. На этом позже построены контейнеры (namespaces и cgroups — это функции ядра).</p>
${BOX('Главная идея','<p>Linux = ядро. Ubuntu = ядро Linux + всё остальное, собранное и протестированное одной командой (Canonical). Ядро у Ubuntu и у RHEL одно, а пакеты, пути и сроки поддержки — разные.</p>')}
<h2>Семейства дистрибутивов</h2>
${tbl(['Семейство','Примеры','Пакеты','Где встречается'],[
 ['Debian','Debian, <b>Ubuntu</b>','<code>apt</code>, файлы <code>.deb</code>','облака, стартапы, большинство туториалов'],
 ['Red Hat','RHEL, Rocky, AlmaLinux, Fedora, CentOS Stream','<code>dnf</code> (раньше <code>yum</code>), <code>.rpm</code>','банки, enterprise, платная поддержка Red Hat'],
 ['Alpine','Alpine','<code>apk</code>','Docker-образы: базовый образ ~5 МБ, библиотека musl вместо glibc'],
 ['Arch','Arch, Manjaro','<code>pacman</code>','десктопы энтузиастов; на проде почти не бывает'],
 ['Российские','Astra Linux, РЕД ОС, ALT','разные','госсектор и компании, где нужна сертификация ФСТЭК']])}
<p>Правило на практике: <mark>узнай семейство — и ты знаешь, какой менеджер пакетов и где искать документацию.</mark></p>
<h2>Модели выпуска</h2>
<ul><li><b>Фиксированные релизы</b> (Ubuntu, Debian, RHEL) — версия «замораживается», дальше приходят только исправления и патчи безопасности. Предсказуемо → подходит для прода.</li>
<li><b>Rolling release</b> (Arch) — обновления идут непрерывно, всегда свежее. Для сервера опасно: обновление может принести несовместимые изменения.</li></ul>
<h2>Ubuntu: версии и LTS</h2>
<p>Номер версии — это <b>год.месяц</b> выхода: <code>24.04</code> = апрель 2024. Новая версия выходит каждые 6 месяцев: в апреле (<code>.04</code>) и октябре (<code>.10</code>).</p>
${tbl(['Тип','Когда выходит','Поддержка','Для чего'],[
 ['<b>LTS</b> (Long Term Support)','раз в 2 года, апрель чётного года: 20.04, 22.04, 24.04, 26.04','5 лет обычной поддержки + до 10 лет с Ubuntu Pro (ESM)','<mark>прод</mark>'],
 ['Промежуточный (interim)','остальные: 24.10, 25.04, 25.10…','9 месяцев','попробовать новое, десктоп']])}
<p>Точечные выпуски <code>22.04.1</code>, <code>22.04.5</code> — это та же 22.04 со свежими пакетами и образами установщика, а не новая версия.</p>
<p>У каждой версии есть кодовое имя: 20.04 — <i>focal</i>, 22.04 — <i>jammy</i>, 24.04 — <i>noble</i>. Оно встречается в адресах репозиториев и в именах Docker-образов (<code>ubuntu:jammy</code> = <code>ubuntu:22.04</code>).</p>
<h2>Почему на проде ставят Ubuntu LTS</h2>
<ol><li><b>Предсказуемость.</b> 5+ лет патчей безопасности без смены версий пакетов — сервис не сломается от обновления.</li>
<li><b>Готовые образы везде:</b> AWS, GCP, Azure, Yandex Cloud, Hetzner, DigitalOcean.</li>
<li><b>Огромные репозитории и сообщество</b> — на любую ошибку есть ответ, большинство инструкций пишут под Ubuntu.</li>
<li><b>Автообновления безопасности</b> (<code>unattended-upgrades</code>) и платная поддержка Canonical, если нужна.</li>
<li><b>Ливпатч ядра</b> (Livepatch) — патч ядра без перезагрузки (с Ubuntu Pro).</li></ol>
<p>Когда не Ubuntu: компании с договором Red Hat (RHEL), образы контейнеров (Alpine, distroless), госсектор (сертифицированные отечественные дистрибутивы).</p>
<h2>Как узнать, что у тебя стоит</h2>
${C(`
$ cat /etc/os-release
PRETTY_NAME="Ubuntu 24.04.1 LTS"
NAME="Ubuntu"
VERSION_ID="24.04"
VERSION_CODENAME=noble
ID=ubuntu
ID_LIKE=debian
$ uname -r
6.8.0-45-generic
`,'term')}
${CMDS([['cat /etc/os-release','дистрибутив и версия (работает везде, включая контейнеры)'],['uname -r','версия ядра'],['uname -a','всё о ядре и архитектуре (x86_64 / aarch64)'],['hostnamectl','имя хоста, ОС, ядро, виртуализация'],['lsb_release -a','версия Ubuntu/Debian (может не быть в контейнере)']])}
<p><code>ID_LIKE=debian</code> — подсказка: «я из семейства Debian, значит apt».</p>`,
memo:`<p>Зайди на любой сервер или в контейнер и первым делом спроси систему «кто ты»: ${c('cat /etc/os-release')} и ${c('uname -r')}. Через неделю это станет рефлексом — так делают на собесе в лайв-кодинге и на реальном инциденте.</p>`,

 ['Поставить на прод Ubuntu 25.10, «потому что новее»','Ubuntu 24.04 LTS (или 26.04 LTS)','Промежуточный релиз живёт 9 месяцев, потом патчей безопасности нет — придётся срочно обновляться.'],
 ['Узнавать версию через uname -r','uname -r — ядро, cat /etc/os-release — дистрибутив','Это разные вещи: в контейнере Ubuntu на хосте Debian uname покажет ядро хоста.'],
 ['В Alpine-контейнере писать apt install','apk add …','Менеджер пакетов зависит от семейства: Alpine — apk, RHEL — dnf, Ubuntu — apt.']],

 {t:'c',q:'Что входит в дистрибутив кроме ядра?',o:['Утилиты, оболочка, менеджер пакетов, система запуска и настройки','Только драйверы','Только графический интерфейс','Ничего — дистрибутив и есть ядро'],a:0,e:'Дистрибутив = ядро + user space: bash, coreutils, apt/dnf, systemd, конфиги по умолчанию.'},

 {t:'c',g:'job',q:'Тимлид: «Проверь, не устарела ли ОС на сервере». Ты видишь <code>VERSION_ID="20.04"</code>. Что отвечаешь (сейчас ноябрь 2026)?',o:['20.04 вышла из стандартной поддержки (5 лет → весна 2025), нужен Ubuntu Pro или обновление до 24.04','Всё ок, LTS поддерживается всегда','20.04 — промежуточный релиз, ему 9 месяцев','Надо обновить ядро через uname'],a:0,e:'20.04 + 5 лет = апрель–май 2025. Дальше патчи только через ESM (Ubuntu Pro). План — обновиться до 24.04 LTS.'},
 {t:'s',g:'job',q:'Ты впервые зашёл на незнакомый сервер. Собери разумный порядок первых шагов.',p:['Узнать дистрибутив: cat /etc/os-release','Узнать ядро и архитектуру: uname -a','Понять, какой менеджер пакетов (по ID_LIKE)','Только потом ставить или чинить что-то'],e:'Сначала «кто ты», потом действия. Команда установки на Ubuntu и на Rocky разная.'},
