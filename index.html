/* web · L1 · Модель OSI, инкапсуляция, DHCP, ARP, коммутатор/роутер, L4 vs L7 и сквозной разбор «ввёл google.com и нажал Enter» */
MOD({id:'web',title:'Что происходит, когда вводишь адрес: OSI и путь запроса',sub:'7 уровней OSI и инкапсуляция, DHCP, ARP, коммутатор и роутер, L4 и L7 — и полный путь от Enter до страницы.',
case:`<p>Собеседование. Первый вопрос: «Что происходит, когда вы вводите google.com в браузере и нажимаете Enter?» Ты знаешь про DNS, про TCP, про HTTP — но по отдельности. Начинаешь с DNS, перескакиваешь на HTTP, забываешь TLS, а на уточнение «а как пакет вообще уходит с ноутбука на роутер?» молчишь. Интервьюер кивает и переходит к следующему вопросу — а ты понимаешь, что этот был проверкой, видишь ли ты систему целиком.</p><p class="goal"><b>Цель модуля:</b> уметь за 3–5 минут связно рассказать путь запроса от нажатия Enter до готовой страницы, называя уровень, протокол и инструмент, которым каждый шаг можно увидеть; знать модель OSI настолько, чтобы говорить «это проблема L3, а не L7» и понимать, почему nginx — балансировщик L7, а Service в Kubernetes — L4.</p>`,
intro:`<p>Сеть устроена слоями: каждый слой решает свою задачу и ничего не знает о деталях соседних. HTTP не знает про Wi-Fi, Wi-Fi не знает про HTTP. Данные при отправке «заворачиваются» в конверты слой за слоем, а при получении разворачиваются обратно. Модель <b>OSI</b> — это просто общая карта этих слоёв, чтобы люди могли договариваться: «проблема на L3» значит «маршрутизация», «на L7» — «в самом приложении».</p>
<p>А «что происходит, когда вводишь адрес» — это путешествие одного запроса сквозь все эти слои: DNS из модуля [[mod:dns]], TCP и маршруты из модуля [[mod:net1]], TLS и HTTP из модуля [[mod:dns]], плюс несколько кирпичей, которых ещё не было: откуда ноутбук берёт IP (<b>DHCP</b>) и как узнаёт, кому отдать кадр в локальной сети (<b>ARP</b>).</p>
<p>Зачем DevOps-у: при инциденте ты должен быстро понять, на каком слое рвётся. «Сайт не открывается» может быть и DNS, и маршрут, и порт, и сертификат, и ошибка приложения — у каждого слоя свои симптомы и свой инструмент.</p>`,
theory:`<h2>Модель OSI: 7 уровней</h2>
${tbl(['№','Уровень','Что делает','Протоколы и примеры','Единица данных','Устройство / где живёт'],[
 ['7','Прикладной (Application)','смысл для программы','HTTP, DNS, SSH, SMTP, протокол MS SQL (TDS)','данные','браузер, nginx, приложение'],
 ['6','Представления (Presentation)','формат, кодировка, шифрование','TLS (часто относят к 6/5), JSON, UTF-8, сжатие','данные','библиотеки'],
 ['5','Сеансовый (Session)','установка и поддержание сеанса','сессии TLS, RPC','данные','библиотеки'],
 ['4','Транспортный (Transport)','доставка до <b>программы</b>, надёжность','TCP, UDP (и QUIC поверх UDP)','сегмент / датаграмма','ядро ОС, порты'],
 ['3','Сетевой (Network)','доставка до <b>машины</b> через много сетей','IP, ICMP','пакет','<b>роутер</b>'],
 ['2','Канальный (Data link)','доставка <b>внутри одной сети</b>','Ethernet, Wi-Fi, ARP, VLAN, MAC-адреса','кадр (frame)','<b>коммутатор</b> (switch)'],
 ['1','Физический (Physical)','биты по проводу или в эфире','кабель, оптика, радио Wi-Fi','биты','кабель, сетевая карта']])}
<p>Запоминалка снизу вверх: <b>«Физики Канальщики Сетью Транспортируют Сеансы Представлений Приложений»</b>. На практике пользуются упрощённой моделью <b>TCP/IP из 4 уровней</b> (модуль [[mod:net1]]): уровни 5–7 OSI склеены в «прикладной», 1–2 — в «канальный».</p>
<h2>Инкапсуляция: конверт в конверте</h2>
${C(`
 L7  [ HTTP: GET / Host: google.com ]
 L4  [ TCP: порт 51234 → 443 ][ HTTP … ]                           ← сегмент
 L3  [ IP: 192.168.1.57 → 142.250.74.46 ][ TCP ][ HTTP … ]         ← пакет
 L2  [ MAC: ноутбук → роутер ][ IP ][ TCP ][ HTTP … ][ контр. сумма ] ← кадр
 L1  0101100101…  по Wi-Fi
`,'out')}
<p>На каждом шаге по пути <mark>MAC-адреса меняются</mark> (кадр живёт только внутри одной сети, от устройства до устройства), а <mark>IP-адреса остаются</mark> от отправителя до получателя — кроме NAT, где роутер подменяет частный адрес на публичный.</p>
<h2>Недостающие кирпичи: DHCP, ARP, коммутатор, роутер</h2>
${tbl(['Что','Зачем','Как увидеть'],[
 ['<b>DHCP</b>','ноутбук подключился к Wi-Fi и ничего не знает. Он кричит на всю сеть «дайте адрес», роутер выдаёт: IP, маску, шлюз, DNS-серверы. Четыре шага: Discover → Offer → Request → Ack','<code>ip r</code> (шлюз), <code>resolvectl status</code> (DNS), в Windows <code>ipconfig /all</code>'],
 ['<b>ARP</b>','чтобы отправить кадр шлюзу 192.168.1.1, нужен его MAC. Ноутбук спрашивает всю сеть: «у кого 192.168.1.1?» — шлюз отвечает своим MAC. Ответ кэшируется','<code>ip neigh</code> (кэш ARP)'],
 ['<b>Коммутатор</b> (L2)','пересылает кадры внутри одной сети по MAC-адресам; сам запоминает, какой MAC за каким портом','—'],
 ['<b>Роутер</b> (L3)','соединяет разные сети, решает, куда отправить пакет дальше, по таблице маршрутов; дома он же делает NAT, DHCP и Wi-Fi','<code>traceroute</code>, <code>ip r</code>']])}
<h2>L4 и L7: почему это важно DevOps-у</h2>
${tbl(['','Балансировщик / прокси L4','Балансировщик / прокси L7'],[
 ['видит','только IP и порт (TCP/UDP)','весь HTTP: путь, заголовки, cookie, Host'],
 ['умеет','раскидать соединения по серверам','маршрутизировать по URL (/api → один сервис, / → другой), подменять заголовки, кэшировать, терминировать TLS'],
 ['примеры','Service в Kubernetes (kube-proxy), облачный Network LB, HAProxy в режиме tcp','<b>nginx</b>, Ingress-контроллер, облачный Application LB, HAProxy в режиме http'],
 ['цена','быстрее, проще','гибче, но тяжелее: разбирает каждый запрос']])}
<p>Фраза «проблема на L3» на инциденте значит «маршрут/IP», «на L4» — «порт/соединение», «на L7» — «приложение/HTTP». Так говорят и сетевики, и SRE.</p>
<h2>Сквозной разбор: ввёл google.com и нажал Enter</h2>
${tbl(['Шаг','Что происходит','Уровень','Чем увидеть'],[
 ['1. URL','браузер понимает, что это адрес, а не поиск; добавляет https:// (а для google.com HTTPS ещё и обязателен по списку HSTS)','L7','—'],
 ['2. Кэши','ищет IP в своём кэше, в кэше ОС и в <code>/etc/hosts</code>','L7','<code>getent hosts google.com</code>'],
 ['3. Адрес шлюза','если DNS-сервер в другой сети — кадр надо отдать шлюзу; его MAC берётся из кэша ARP или ARP-запросом','L2','<code>ip neigh</code>'],
 ['4. DNS','запрос по UDP 53 к резолверу (адрес резолвера пришёл по DHCP); резолвер идёт по цепочке (модуль [[mod:dns]]); ответ: ближайший к тебе IP Google (anycast)','L7 поверх UDP','<code>dig google.com</code>'],
 ['5. Маршрут и NAT','пакет уходит на шлюз; роутер подменяет частный адрес на публичный (NAT) и передаёт провайдеру; дальше от роутера к роутеру','L3','<code>traceroute google.com</code>'],
 ['6. TCP','рукопожатие SYN → SYN-ACK → ACK до порта 443 (современные браузеры часто идут по HTTP/3 — QUIC поверх UDP, без отдельного TCP)','L4','<code>ss -tn</code>'],
 ['7. TLS','ClientHello с именем сайта (SNI) → сервер присылает сертификат → проверка цепочки, имени, срока → обмен ключами → дальше всё шифруется','L5–6','<code>openssl s_client</code>, <code>curl -v</code>'],
 ['8. HTTP','<code>GET / HTTP/2</code>, заголовки Host, cookies, Accept-Language','L7','<code>curl -v</code>, DevTools → Network'],
 ['9. Сторона Google','запрос попадает на балансировщики (L4 → L7), дальше на фронтенд-сервер, тот опрашивает внутренние сервисы и собирает ответ','L4–L7','— (это их инфраструктура; у тебя будет так же: nginx → приложение → база)'],
 ['10. Ответ','<code>200 OK</code> + HTML. Браузер разбирает его и запрашивает ещё десятки ресурсов: CSS, JS, картинки — часто по тому же соединению (HTTP/2)','L7','DevTools → Network'],
 ['11. Отрисовка','браузер строит страницу, выполняет JS, показывает результат','—','DevTools → Performance']])}
${BOX('Время каждого шага — видно','<p>В браузере: F12 → Network → кликнуть на запрос → вкладка <b>Timing</b>: DNS Lookup, Initial connection (TCP), SSL (TLS), Waiting (TTFB — сколько думал сервер), Content Download. В консоли — то же самое через curl:</p>'+C(`curl -s -o /dev/null -w "dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\\n" https://google.com`)+'<p>Большое <b>dns</b> — проблема резолвера, большое <b>tcp</b> — сеть или расстояние, большое <b>ttfb</b> при быстрых остальных — медленное приложение или база. Так одна команда показывает, на каком уровне тормозит.</p>','deep')}
<h2>Как отвечать на собесе</h2>
<p>Структура на 3–5 минут: <b>«кэши и DNS → (ARP и шлюз) → маршрут и NAT → TCP → TLS → HTTP → балансировщики и бэкенд → ответ и загрузка ресурсов → рендер»</b>. На каждом шаге одна фраза «что» и, если просят глубже, — инструмент. Лучше сказать коротко про все шаги, чем подробно про один и забыть TLS. А в конце — мостик к работе: «как DevOps я бы диагностировал медленную загрузку так: curl -w по фазам…».</p>`,
memo:`<p>Расскажи разбор вслух 5 раз за неделю — себе, в диктофон, с таймером на 4 минуты. Каждый раз открой DevTools → Network на настоящем сайте и сверься с Timing. Отдельно выучи OSI снизу вверх с примером на каждом уровне: «L1 — кабель, L2 — MAC и коммутатор, L3 — IP и роутер, L4 — TCP и порты, L7 — HTTP».</p>`,
traps:[
 ['Начать ответ на собесе с HTTP и забыть DNS, TCP и TLS','Держать структуру: DNS → маршрут → TCP → TLS → HTTP → бэкенд → ответ → рендер','Оценивают, видишь ли ты цепочку целиком, а не глубину в одной точке.'],
 ['«MAC-адрес идёт от ноутбука до сервера Google»','MAC меняется на каждом участке, IP — сквозной (кроме NAT)','MAC работает только внутри одной сети (L2). Между сетями пакет ведут роутеры по IP (L3).'],
 ['«nginx и Service в Kubernetes — одно и то же, балансировщики»','nginx — L7 (видит URL и заголовки), Service — L4 (только IP и порт)','Маршрутизация по пути /api возможна только на L7.'],
 ['«TLS — это уровень 7»','TLS работает между транспортом и приложением (обычно говорят L5–6, на практике — «над TCP, под HTTP»)','Точный номер спорен, важно место: TCP сначала, потом TLS, потом HTTP.'],
 ['Сайт медленный → «сервер тормозит»','Разложить время по фазам: curl -w или DevTools Timing','Медленным может быть DNS или TLS, а сервер — отвечать мгновенно.']],
ex:[
 {t:'c',q:'Сколько уровней в модели OSI?',o:['7','4','5','3'],a:0,e:'OSI делит сеть на 7 уровней — от физического (биты в проводе) до прикладного (HTTP). На практике пользуются упрощённой TCP/IP-моделью из 4 уровней, но говорят по номерам OSI: «проблема на L3», «балансировщик L7».'},
 {t:'c',q:'На каком уровне OSI работает IP?',o:['3 — сетевой','2 — канальный','4 — транспортный','7 — прикладной'],a:0,e:'L3 (сетевой) отвечает за доставку до машины через много сетей: здесь живут IP-адреса и ICMP (ping), здесь работают роутеры. MAC-адреса — это L2, порты — L4.'},
 {t:'c',q:'На каком уровне работают TCP и UDP?',o:['4 — транспортный','3 — сетевой','2 — канальный','6 — представления'],a:0,e:'L4 (транспортный) доставляет данные до конкретной программы по порту. TCP добавляет соединение и надёжность, UDP — нет. IP (L3) довозит до машины, L4 — до процесса на ней.'},
 {t:'c',q:'Какое устройство работает на L2 и пересылает кадры по MAC-адресам?',o:['Коммутатор (switch)','Роутер','Балансировщик L7','DNS-сервер'],a:0,e:'Коммутатор (L2) соединяет устройства в одной сети и пересылает кадры по MAC-адресам. Роутер работает уровнем выше (L3): соединяет разные сети и выбирает, куда отправить пакет, по IP-адресу.'},
 {t:'c',q:'Что делает DHCP?',o:['Выдаёт устройству IP, маску, шлюз и DNS-серверы при подключении к сети','Переводит имена в адреса','Шифрует трафик','Находит MAC по IP'],a:0,e:'DNS — имена, ARP — MAC по IP, TLS — шифрование.'},
 {t:'c',q:'Зачем ARP?',o:['Узнать MAC-адрес по IP внутри локальной сети','Узнать IP по имени','Получить IP от роутера','Проверить сертификат'],a:0,e:'Чтобы собрать кадр (L2), нужен MAC получателя — например, шлюза.'},
 {t:'c',q:'Что меняется на каждом участке пути пакета через интернет, а что остаётся неизменным?',o:['MAC-адреса меняются, IP-адреса остаются (кроме NAT)','IP меняются, MAC остаются','Меняется всё','Ничего не меняется'],a:0,e:'Кадр живёт в пределах одной сети, пакет — от отправителя до получателя.'},
 {t:'c',q:'Чем балансировщик L7 отличается от L4?',o:['L7 видит HTTP (путь, заголовки) и может маршрутизировать по URL; L4 видит только IP и порт','Ничем','L4 умнее','L7 работает только с UDP'],a:0,e:'L4 видит только IP и порт — может лишь раскидать соединения. L7 разбирает HTTP: видит путь, заголовки, cookie и может отправить /api в один сервис, а / — в другой. Поэтому nginx и Ingress — L7, а Service в Kubernetes — L4.'},
 {t:'i',q:'Впиши: показать кэш ARP (соседей) в Linux.',a:['ip neigh','ip neighbor','ip neigh show','ip n','arp -n'],ph:'ip …',e:'Видно IP шлюза и его MAC — значит, ARP отработал.'},
 {t:'i',q:'Впиши curl, который покажет время DNS-запроса и полное время для <code>https://google.com</code> (переменные time_namelookup и time_total).',a:['curl -s -o /dev/null -w "%{time_namelookup} %{time_total}" https://google.com',"curl -s -o /dev/null -w '%{time_namelookup} %{time_total}' https://google.com",'curl -so /dev/null -w "%{time_namelookup} %{time_total}" https://google.com','curl -s -o /dev/null -w "%{time_namelookup} %{time_total}\\n" https://google.com'],ph:'curl …',e:'Ещё есть time_connect (TCP), time_appconnect (TLS), time_starttransfer (TTFB).'},
 {t:'i',q:'Впиши: проследить путь пакетов (L3) до <code>google.com</code>, показывая узлы цифрами, без разрешения имён.',a:['traceroute -n google.com','tracepath -n google.com','mtr -rn google.com','mtr -nr google.com','mtr -rwn google.com'],ph:'traceroute …',e:'-n не тратит время на обратный DNS для каждого узла. В Windows — tracert -d google.com.'},
 {t:'s',q:'Расставь уровни OSI снизу вверх.',p:['Физический','Канальный','Сетевой','Транспортный','Сеансовый','Представления','Прикладной'],e:'«Физики Канальщики Сетью Транспортируют Сеансы Представлений Приложений».'},
 {t:'s',q:'Собери путь запроса «ввёл google.com и нажал Enter».',p:['Кэши браузера и ОС, /etc/hosts','DNS-запрос к резолверу → IP','Пакет через шлюз (ARP, NAT) по маршруту','TCP-рукопожатие до порта 443','TLS: сертификат и ключи','HTTP-запрос GET /','Балансировщики и бэкенд Google → ответ 200 и HTML','Загрузка CSS/JS/картинок и отрисовка'],e:'Каждый шаг опирается на предыдущий: без IP (DNS) не к кому подключаться, без TCP нет канала для TLS, без TLS нельзя безопасно отправить HTTP. Этот порядок и есть структура ответа на собесе.'},
 {t:'s',q:'Собери инкапсуляцию: от того, что пишет приложение, до того, что уходит в провод.',p:['Данные HTTP','+ заголовок TCP (порты) → сегмент','+ заголовок IP (адреса) → пакет','+ заголовок Ethernet/Wi-Fi (MAC) → кадр','биты по проводу или в эфире'],e:'Каждый уровень добавляет свой заголовок, как конверт в конверт: TCP — порты, IP — адреса, Ethernet/Wi-Fi — MAC. На приёме конверты снимаются в обратном порядке, и каждый уровень читает только свой заголовок.'},
 {t:'r',q:'На каком шаге тормозит загрузка?',code:`$ curl -s -o /dev/null -w "dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\\n" https://shop.kz
dns=0.004 tcp=0.021 tls=0.047 ttfb=3.912 total=3.930`,lang:'term',o:['Сервер долго думает (TTFB ~3.9 с при быстрых DNS, TCP и TLS) — смотреть приложение и базу','DNS','Сеть до сервера','Сертификат'],a:0,e:'Значения накопительные: до TLS всё прошло за 0.05 с, остальное — ожидание ответа приложения.'},
 {t:'r',q:'Какой уровень сломан?',code:`$ ip r
default via 192.168.1.1 dev wlan0
$ ip neigh
192.168.1.1 dev wlan0 FAILED
$ ping -c2 192.168.1.1
From 192.168.1.57 icmp_seq=1 Destination Host Unreachable`,lang:'term',o:['L2: нет ARP-ответа от шлюза — до роутера не достучаться в локальной сети (Wi-Fi, роутер)','L7: сайт упал','DNS','Сертификат'],a:0,e:'FAILED в ARP — шлюз не отвечает. Дальше L3 и выше даже не начинаются.'},
 {t:'r',q:'Что показывает этот вывод?',code:`$ dig +short google.com
142.250.74.46
$ traceroute -n -m 5 142.250.74.46
 1  192.168.1.1   1.2 ms
 2  10.120.0.1    4.8 ms
 3  95.56.240.1   6.1 ms
 4  * * *
 5  72.14.209.21  21.3 ms`,lang:'term',o:['Путь пакета (L3): домашний роутер → сеть провайдера → магистраль → сеть Google; «звёздочки» — узел не отвечает на служебные пакеты, но путь продолжается','Обрыв на 4-м узле','DNS сломан','Работает только L2'],a:0,e:'2-й узел — частный адрес провайдера (за ним NAT). Звёздочки посередине — норма.'},
 {t:'c',g:'prac',q:'nginx должен отдавать <code>/api/*</code> одному сервису, а всё остальное — другому. Какой балансировщик для этого нужен?',o:['L7 (HTTP-прокси, например nginx)','L4 (по IP и порту)','L2 коммутатор','DNS'],a:0,e:'Чтобы разделить трафик по пути /api, нужно прочитать HTTP-запрос, а это уровень L7. Балансировщик L4 видит только IP и порт: для него /api и / неотличимы.'},
 {t:'c',g:'prac',q:'Пользователь жалуется: «сайт открывается 5 секунд». В DevTools Timing: DNS Lookup — 4.8 с, остальное — быстро. Где искать?',o:['DNS: резолвер пользователя или настройки домена (TTL, медленные NS)','Сервер приложения','База данных','Сертификат'],a:0,e:'Если 4,8 из 5 секунд уходят на DNS, ускорять сервер бессмысленно: страница ждёт адрес. Виноват резолвер пользователя или настройки домена (медленные NS-серверы). Разложение по фазам сразу показывает уровень проблемы.'},
 {t:'c',g:'job',q:'Интервьюер: «Что происходит, когда вводишь адрес?» Какой ответ сильнее?',o:['По шагам: кэш и DNS → маршрут и NAT → TCP → TLS → HTTP → балансировщики и бэкенд → ответ и ресурсы → рендер, коротко про каждый; плюс как бы диагностировал','Подробно только про DNS','Браузер загружает страницу с сервера','Сразу про Kubernetes'],a:0,e:'Интервьюер проверяет, видишь ли ты цепочку целиком, а не глубину в одной точке. Лучше коротко пройти все шаги и закончить практикой («вот как я бы искал, где тормозит»), чем подробно рассказать про DNS и забыть TLS.'},
 {t:'c',g:'job',q:'На инциденте сетевик говорит: «На L3 всё ок, пинги и маршруты в порядке». Что это значит для тебя?',o:['Связь до машины есть; искать на L4 (порт, firewall) и L7 (приложение, TLS, HTTP)','Проблема в кабеле','Всё работает','Проблема в DNS обязательно'],a:0,e:'«L3 в порядке» значит: маршруты есть, пакеты до машины доходят. Искать надо выше: открыт ли порт и не режет ли его firewall (L4), работают ли TLS и само приложение (L7). Номер уровня — общий язык между командами, он экономит часы спора.'},
 {t:'c',g:'job',q:'В Kubernetes Service (L4) не умеет маршрутизировать по путям. Что ставят для этого?',o:['Ingress-контроллер (обычно nginx) — L7 перед сервисами','Ещё один Service','DNS-запись','NetworkPolicy'],a:0,e:'Ingress — правила L7 (хосты, пути, TLS). Подробно — уровень Kubernetes.'}],
lab:[
 {h:'<p>В ipconfig /all ищи строки «Основной шлюз», «DNS-серверы», «DHCP включен: Да» и «DHCP-сервер» — это и есть ответ, откуда всё пришло.</p>',t:'Твой ноутбук глазами сети: в Windows <code>ipconfig /all</code> (или <code>Get-NetIPConfiguration</code>) — найди адрес, маску, шлюз, DNS-серверы и откуда они пришли (DHCP). В WSL — <code>ip r</code>, <code>ip neigh</code>, <code>resolvectl status</code>. Объясни, чем сеть WSL отличается от сети Windows.'},
 {t:'Разложи загрузку по фазам: для 3 сайтов (google.com, github.com, любой казахстанский) сними curl -w с dns/tcp/tls/ttfb/total по 3 раза. Почему второй запуск DNS быстрее? У какого сайта самый большой TTFB?',sol:C(`for s in https://google.com https://github.com https://kaspi.kz; do
  for i in 1 2 3; do
    curl -s -o /dev/null -w "$s dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer}\\n" "$s"
  done
done`)},
 {chk:'<p>На обычном сайте десятки запросов: HTML, CSS, JS, картинки, шрифты, аналитика. В Timing главного запроса будут DNS Lookup, Initial connection, SSL, Waiting (TTFB), Content Download. Если колонки Protocol нет — правой кнопкой по заголовку таблицы.</p>',t:'DevTools: открой любой сайт, F12 → Network → обнови страницу. Сколько всего запросов? Открой главный запрос → Timing и сопоставь фазы с шагами разбора. Найди протокол (h2/h3) в колонке Protocol (включи её правой кнопкой по заголовкам).'},
 {chk:'<p>Сверь свой текст с таблицей «Сквозной разбор» в теории: все ли 11 шагов есть, у каждого ли уровень и команда. Не хватает TLS или ARP — допиши. Уложился вслух в 4 минуты — готово.</p>',t:'Главная лаба модуля: напиши текстом (без подсказок и ИИ) полный разбор «ввёл google.com и нажал Enter» по 10–11 шагам с уровнем и командой для каждого шага. Потом проговори его вслух с таймером — уложись в 4 минуты. Сохрани текст: это твоя заготовка к собесу.'}],
qa:[
 ['Что происходит, когда вводишь google.com и нажимаешь Enter?','Браузер проверяет кэши и /etc/hosts → DNS-запрос к резолверу (полученному по DHCP) → IP. Кадр уходит на шлюз (MAC через ARP), роутер делает NAT, пакет идёт по маршруту. TCP-рукопожатие на 443 (или QUIC), TLS: SNI, сертификат, ключи. HTTP GET / с заголовками. У Google — балансировщики L4/L7 и бэкенды, ответ 200 с HTML, затем загрузка CSS/JS/картинок и отрисовка.'],
 ['Назови уровни OSI с примерами.','1 физический — кабель, радио; 2 канальный — Ethernet, MAC, ARP, коммутатор; 3 сетевой — IP, ICMP, роутер; 4 транспортный — TCP, UDP, порты; 5 сеансовый; 6 представления — кодировки, шифрование; 7 прикладной — HTTP, DNS, SSH.'],
 ['Чем коммутатор отличается от роутера?','Коммутатор (L2) пересылает кадры внутри одной сети по MAC. Роутер (L3) соединяет разные сети и выбирает путь по IP и таблице маршрутов.'],
 ['Что такое DHCP и ARP?','DHCP выдаёт устройству IP, маску, шлюз и DNS при подключении. ARP находит MAC-адрес по IP внутри локальной сети.'],
 ['Чем балансировщик L4 отличается от L7?','L4 видит только IP и порт, раскидывает соединения (Service в K8s, Network LB). L7 понимает HTTP: маршрутизация по хосту и пути, заголовки, TLS-терминация (nginx, Ingress, Application LB).'],
 ['Как понять, на каком этапе тормозит загрузка?','curl -w с time_namelookup / time_connect / time_appconnect / time_starttransfer / time_total или DevTools → Timing. Большой DNS — резолвер, большое соединение — сеть, большой TTFB — приложение или база.'],
 ['Что меняется при прохождении пакета через роутеры?','MAC-адреса — на каждом участке (новый кадр), TTL уменьшается на 1; IP-адреса остаются, кроме NAT.']],
cheat:[['ip neigh','кэш ARP (MAC соседей)'],['ip r','шлюз и маршруты'],['resolvectl status','DNS-серверы (пришли по DHCP)'],['ipconfig /all','то же в Windows'],['traceroute -n host','путь по L3'],['curl -s -o /dev/null -w "dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer}" url','время по фазам'],['F12 → Network → Timing','фазы в браузере']]});

/* Словарь инструментов — не определения «как в школе», а: что это → зачем вообще нужно (какую боль решает) → где живёт → когда ты с этим столкнёшься.
   Если инструмент встречается в модуле РАНЬШЕ своего модуля (m), движок сам покажет вверху модуля его карточку. Раздел «Словарь» (#terms) — все сразу.
   Поля: k ключ · n название · re как искать в тексте модуля · m id модуля, где разобрано подробно
         what что это · why зачем, какая проблема без него · where где живёт · when ситуация на работе */
const TERMS=[
 {k:'nginx',n:'Nginx',re:/nginx/i,m:'nginx',
  what:'Веб-сервер — программа, которая сидит на сервере, слушает порт 80/443 и отвечает на запросы из интернета. Браузер пользователя «стучится» именно в nginx.',
  why:'Твоё приложение (на Node, Python, Go) умеет обрабатывать запросы, но плохо умеет быть «лицом» в интернет: держать тысячи соединений, шифровать HTTPS, быстро отдавать картинки, раскидывать нагрузку на несколько копий приложения, прятать внутренние порты. Nginx делает это за него: принимает всё снаружи и передаёт приложению только нужное (это называется reverse proxy). Без него каждому приложению пришлось бы самому решать безопасность, HTTPS и нагрузку.',
  where:'Схема: пользователь → интернет → <b>nginx</b> (порт 443) → твоё приложение (localhost:3000) → база данных. Конфиги — <code>/etc/nginx/</code>, логи — <code>/var/log/nginx/access.log</code> (каждый запрос) и <code>error.log</code> (проблемы самого nginx).',
  when:'Сайт «лежит» или тормозит, пользователи жалуются на ошибки — первое, куда смотришь, это логи nginx: он видит каждый запрос и каждый ответ. По ним понятно, кто пришёл, куда, что получил (200 или 502) и с какого момента началось. Ещё — когда нужно выкатить новый сайт, включить HTTPS или переключить трафик на новую версию приложения.'},
 {k:'http',n:'HTTP и коды ответа',re:/HTTP|\b(?:403|404|500|502)\b/,m:'dns',
  what:'Язык, на котором браузер (или любая программа) разговаривает с сайтом. Запрос: «дай GET /orders». Ответ: код + содержимое.',
  why:'Код ответа — это короткий диагноз, понятный машине и человеку: всё ок или нет, и на чьей стороне проблема. Без кодов пришлось бы читать текст каждой страницы, чтобы понять, ошибка это или нет. Мониторинг, балансировщики и алерты работают именно по кодам.',
  where:'2xx — успех (200 OK). 3xx — «иди туда» (301 переезд). 4xx — <b>клиент</b> попросил что-то не то (404 нет страницы, 403 нельзя, 401 не авторизован). 5xx — <b>сервер</b> сломался (500 ошибка в приложении, 502 nginx не достучался до приложения, 504 приложение не ответило вовремя).',
  when:'В логах и алертах: «выросли 5xx» значит сломалось у нас, надо чинить срочно. «Выросли 404» — чаще битые ссылки или кто-то сканирует сайт. Отличать 4xx от 5xx — первое, что делаешь на инциденте.'},
 {k:'docker',n:'Docker и контейнер',re:/docker|контейнер/i,m:'docker',
  what:'Docker упаковывает приложение вместе со всем, что ему нужно (нужная версия Python/Node, библиотеки, файлы), в <b>образ</b> и запускает его как <b>контейнер</b> — изолированный процесс, который видит только свои файлы.',
  why:'Классическая боль: «у меня на ноуте работает, а на сервере нет» — другая версия библиотеки, другая ОС, забыли что-то поставить. Контейнер везде одинаковый: собрал образ один раз — он одинаково запустится у разработчика, в CI и на проде. Плюс на одном сервере можно запустить десятки приложений, не мешающих друг другу, и легче, чем виртуальные машины (нет своего ядра).',
  where:'Образы и данные — <code>/var/lib/docker</code>. Управление — команда <code>docker</code>, которая общается с фоновым сервисом dockerd через сокет <code>/var/run/docker.sock</code>.',
  when:'Почти всё современное деплоится в контейнерах. Ты будешь собирать образы в CI, смотреть <code>docker logs</code>, когда контейнер упал, и чистить место, когда образы забили диск.'},
 {k:'compose',n:'Docker Compose',re:/compose/i,m:'compose',
  what:'Описание нескольких контейнеров в одном файле <code>docker-compose.yml</code> и запуск всех одной командой <code>docker compose up -d</code>.',
  why:'Реальное приложение — это не один контейнер, а несколько: само приложение, база, кэш, nginx. Запускать каждый руками с кучей флагов (порты, сети, тома) — долго и с ошибками. Compose хранит всю схему в файле, который лежит в git: поднял одной командой, остановил одной командой.',
  where:'Файл <code>docker-compose.yml</code> рядом с проектом. Контейнеры внутри видят друг друга по имени сервиса (приложение ходит в базу по адресу <code>db</code>).',
  when:'Локальная разработка, тестовые стенды, небольшие продакшены без Kubernetes. Деплой «зашёл по SSH → git pull → docker compose up -d» — очень частая схема.'},
 {k:'cron',n:'cron',re:/cron/i,m:'bash2',
  what:'Планировщик задач: сервис, который запускает команды по расписанию. Строка <code>0 3 * * * /opt/backup.sh</code> = «каждый день в 3:00 запусти бэкап».',
  why:'Многое на сервере должно происходить регулярно и без человека: бэкапы базы, чистка старых файлов, отчёты, продление сертификатов. Без планировщика кто-то должен был бы не забывать запускать это руками в 3 ночи.',
  where:'Расписание пользователя — <code>crontab -e</code>, системные — <code>/etc/cron.d/</code>, <code>/etc/crontab</code>. Задачи запускаются без терминала: их вывод никто не видит, если не перенаправить в лог.',
  when:'«Бэкапа нет уже неделю» — идёшь смотреть, есть ли задача в cron, запускалась ли и что писала в лог. Самая частая причина «молча не работает» — забыли <code>2>&1</code> или в cron другие переменные окружения, чем в твоём терминале.'},
 {k:'logrotate',n:'logrotate и ротация логов',re:/logrotate|ротац/i,m:'text',
  what:'Программа, которая по расписанию (обычно раз в сутки) «перекладывает» логи: текущий <code>access.log</code> становится <code>access.log.1</code>, вчерашний сжимается в <code>.2.gz</code>, самые старые удаляются.',
  why:'Логи пишутся непрерывно. Без ротации <code>access.log</code> нагруженного сайта за пару месяцев вырастает до десятков гигабайт, забивает диск — и сервер падает целиком (базы и приложения не могут писать). Ротация держит логи в рамках: например, последние 14 дней, старые сжаты.',
  where:'Правила — <code>/etc/logrotate.conf</code> и <code>/etc/logrotate.d/</code> (у nginx свой файл). Запускается по таймеру systemd или через cron.',
  when:'Ищешь, что было вчера, а в текущем логе пусто — данные в <code>access.log.1</code> или в <code>.gz</code>. Или диск забит логами — значит ротация не настроена или сломалась. Или <code>tail -f</code> «замолчал» после полуночи.'},
 {k:'systemd',n:'systemd / systemctl',re:/systemd|systemctl|unit-файл/i,m:'systemd',
  what:'Главный «надсмотрщик» Linux: первый процесс, который при загрузке запускает все сервисы (nginx, docker, ssh, твоё приложение) и следит за ними дальше.',
  why:'Сервис должен стартовать сам после перезагрузки, подниматься заново, если упал, запускаться в правильном порядке (сначала сеть, потом приложение) и от правильного пользователя. Раньше это делали самописными скриптами, которые часто ломались. systemd делает это по короткому описанию — unit-файлу.',
  where:'Команда <code>systemctl status|start|stop|restart|enable имя</code>. Описания сервисов — <code>/etc/systemd/system/*.service</code>. Логи — журнал, читается через <code>journalctl</code>.',
  when:'«Сервис не работает» → первое: <code>systemctl status имя</code> (запущен ли, когда упал, последние строки лога). Деплой своего приложения без Docker — это почти всегда unit-файл systemd.'},
 {k:'journalctl',n:'journalctl',re:/journalctl/i,m:'systemd',
  what:'Программа для чтения журнала systemd — единого хранилища логов всех сервисов и ядра.',
  why:'Раньше каждый сервис писал лог куда хотел, и искать приходилось по десятку файлов. Журнал собирает всё в одном месте с точным временем и позволяет фильтровать: по сервису, по времени, по важности.',
  where:'<code>journalctl -u nginx</code> — логи одного сервиса, <code>-f</code> — следить, <code>--since "1 hour ago"</code> — за последний час, <code>-p err</code> — только ошибки.',
  when:'Сервис не запускается — <code>systemctl status</code> показал «failed», а подробности смотришь в <code>journalctl -u сервис -n 100</code>.'},
 {k:'cicd',n:'CI/CD и пайплайн',re:/\bCI\b|CI\/CD|пайплайн|pipeline/i,m:'gitlabci',
  what:'Автоматическая «конвейерная лента»: после каждого push специальный сервер сам собирает код, запускает тесты (CI — непрерывная интеграция) и выкатывает на серверы (CD — непрерывная доставка).',
  why:'Руками деплоить долго и опасно: забыл шаг, собрал не ту версию, выкатил непротестированное в пятницу вечером. Конвейер делает одно и то же каждый раз, не пропускает сломанное дальше (тесты упали — деплоя нет) и показывает историю: кто, что и когда выкатил. Настройка и поддержка этих конвейеров — одна из главных задач DevOps.',
  where:'Описание шагов лежит в репозитории: <code>.gitlab-ci.yml</code>, <code>.github/workflows/*.yml</code>. Выполняют их «раннеры» — программы на отдельных машинах. Шаг (job) считается упавшим, если команда вернула ненулевой код.',
  when:'«Пайплайн красный» — открываешь лог упавшего job и ищешь, какая команда вернула ошибку. «Пайплайн зелёный, а на проде сломано» — значит, ошибка где-то проглатывается (пример — пайп без pipefail).'},
 {k:'git',n:'Git',re:/\bgit\b/i,m:'git',
  what:'Система контроля версий: хранит всю историю изменений кода и конфигов — кто, что и когда поменял.',
  why:'Без неё — «final_v2_исправленный.zip» и невозможность понять, какая правка сломала прод. Git даёт историю, откат к любой версии, работу нескольких людей над одним кодом и запуск CI на каждый push. Для DevOps в git лежит ещё и инфраструктура: конфиги, Dockerfile, Terraform.',
  where:'Папка <code>.git</code> в проекте; удалённый репозиторий — GitHub/GitLab. <code>git pull</code> — забрать изменения, <code>git push</code> — отправить.',
  when:'Каждый день. «Что поменялось перед тем, как всё сломалось?» — <code>git log</code>, <code>git diff</code>. Откат неудачного релиза — часто через git.'},
 {k:'ssh',n:'SSH',re:/\bssh\b/i,m:'ssh',
  what:'Защищённый способ получить терминал на удалённом сервере: <code>ssh user@host</code> — и ты печатаешь команды так, будто сидишь за ним.',
  why:'Серверы стоят в дата-центрах, без монитора и клавиатуры. Нужно управлять ими по сети так, чтобы никто не подслушал пароли и команды и не подменил сервер. SSH всё шифрует и проверяет обе стороны: ты — что это тот самый сервер, сервер — что это ты (по ключу).',
  where:'Клиент — команда <code>ssh</code>, сервер — сервис sshd (конфиг <code>/etc/ssh/sshd_config</code>). Твои ключи — <code>~/.ssh/</code>, разрешённые ключи на сервере — <code>~/.ssh/authorized_keys</code>.',
  when:'Каждое подключение к серверу, копирование файлов (<code>scp</code>), деплой из CI. Частые проблемы: ключ не принимается из-за прав на файлы, «host key changed» после переустановки сервера.'},
 {k:'curl',n:'curl',re:/curl/i,m:'net1',
  what:'Консольный HTTP-клиент: «браузер без окна». Отправляет запрос и печатает ответ.',
  why:'На сервере нет браузера, а проверить «отвечает ли сервис» нужно постоянно — и руками, и в скриптах. curl делает любой запрос (GET, POST, с заголовками и телом) и возвращает код возврата, по которому скрипт понимает, жив ли сервис.',
  where:'<code>curl http://localhost:3000</code> — тело ответа, <code>curl -I</code> — только заголовки, <code>curl -v</code> — весь разговор подробно.',
  when:'Сайт не открывается: с сервера делаешь <code>curl localhost:3000</code> — если приложение отвечает, проблема в nginx или сети; если нет — в самом приложении. Так за одну команду делишь проблему пополам.'},
 {k:'k8s',n:'Kubernetes',re:/kubernetes|k8s|kubectl/i,m:'k8sarch',
  what:'Оркестратор контейнеров: система, которая управляет сотнями контейнеров на десятках серверов как единым целым.',
  why:'Когда контейнеров много, руками не уследить: какой упал, на каком сервере свободно, как обновить 50 копий без простоя. Ты описываешь желаемое состояние («хочу 5 копий приложения версии 2.1»), а Kubernetes сам поддерживает его: перезапускает упавшие, переносит с умершего сервера, обновляет по очереди.',
  where:'Кластер: управляющие узлы (control plane) + рабочие узлы, где крутятся контейнеры. Управление — <code>kubectl</code>, описание — YAML-манифесты.',
  when:'В средних и крупных компаниях это основная платформа. Будешь деплоить, смотреть, почему под не стартует, и разбираться с ресурсами.'},
 {k:'postgres',n:'PostgreSQL',re:/postgres/i,m:'sql',
  what:'База данных: хранит данные приложения (пользователи, заказы) в таблицах и отвечает на SQL-запросы.',
  why:'Приложение не может хранить данные просто в файлах: нужны одновременная запись от многих пользователей, отсутствие потерь при сбое, быстрый поиск. База решает это. Для DevOps база — самое ценное на сервере: её бэкапят, мониторят и берегут.',
  where:'Сервис от системного пользователя <code>postgres</code>, данные — <code>/var/lib/postgresql</code>, порт 5432.',
  when:'Приложение тормозит из-за медленных запросов, диск забит данными базы, нужно восстановить бэкап, нужно дать доступ новому сервису.'},
 {k:'mssql',n:'MS SQL Server',re:/MS ?SQL|SQL Server|sqlcmd|SSMS|dbForge/i,m:'sql',
  what:'Реляционная база данных от Microsoft. Работает и на Windows, и на Linux, и в Docker. Клиенты: SSMS и dbForge (графические, на Windows), sqlcmd (консольный — им пользуются на серверах).',
  why:'Приложению нужно надёжно хранить данные: много пользователей пишут одновременно, ничего не теряется при сбое, всё быстро ищется. MS SQL — стандарт в банках, госсекторе и компаниях на стеке Microsoft. Для DevOps база — самое ценное на сервере: её разворачивают, бэкапят, восстанавливают, мониторят и раздают к ней доступы.',
  where:'Порт 1433. На Linux — служба <code>mssql-server</code>, данные в <code>/var/opt/mssql</code>, настройка <code>mssql-conf</code>. В Docker — образ <code>mcr.microsoft.com/mssql/server</code>. Минимум 2 ГБ памяти. Редакции: Developer (бесплатно, только разработка), Express (бесплатно, с лимитами), Standard/Enterprise (платно).',
  when:'Приложение не может подключиться (порт, пароль, сертификат), кончилось место из-за логов транзакций, нужно восстановить бэкап, дать доступ новому сервису, перенести базу в Kubernetes.'},
 {k:'oracle',n:'Oracle Database',re:/oracle/i,m:'sql',
  what:'Одна из самых мощных и дорогих коммерческих баз данных. Есть бесплатная версия Oracle Database Free для обучения и разработки.',
  why:'На Oracle годами работают ядра банков, телеком, крупные госсистемы. Новые сервисы часто пишут на других базах, но им приходится жить рядом со «старшим» Oracle: брать из него данные, синхронизироваться, тестировать на его копии.',
  where:'Порт 1521. Клиенты: sqlplus (консоль), SQL Developer, DBeaver. В Docker — <code>gvenzl/oracle-free</code> или образ из Oracle Container Registry. От 2 ГБ памяти и ~13 ГБ диска.',
  when:'Поднять тестовую копию легаси-базы, перенести данные между Oracle и другой базой, разобраться с подключением из приложения или CI.'},
 {k:'iaas',n:'IaaS / PaaS / SaaS (модели облака)',re:/IaaS|PaaS|SaaS|облак/i,m:'tf1',
  what:'Три уровня того, что ты арендуешь у облака. <b>IaaS</b> — голые виртуальные машины, сети и диски (VPS, AWS EC2, Yandex Compute). <b>PaaS</b> — платформа: отдаёшь код или настройки, а серверы и ОС — забота провайдера (Heroku, управляемая база данных). <b>SaaS</b> — готовая программа через браузер (Gmail, GitHub, Notion).',
  why:'Чем выше уровень, тем меньше тебе обслуживать, но тем меньше контроля и тем дороже. Выбор модели — это решение «что мы делаем сами, а что отдаём провайдеру»: свою базу на VPS надо бэкапить и обновлять самому, управляемую — нет, но она дороже и менее гибкая.',
  where:'Твоя WSL — не облако вообще, это локальная виртуальная машина на ноутбуке. VPS — IaaS. GitLab.com — SaaS. Kubernetes в облаке (managed K8s) — где-то между IaaS и PaaS.',
  when:'На собесе («чем IaaS отличается от PaaS?»), при выборе, где разворачивать проект, и при оценке, сколько работы по обслуживанию ляжет на команду.'},
 {k:'wsl',n:'WSL',re:/\bWSL\b/,m:'linux',
  what:'Windows Subsystem for Linux — настоящая Ubuntu внутри Windows, запускается как обычное приложение.',
  why:'Чтобы учиться Linux, не нужен отдельный компьютер или сервер: WSL даёт полноценный терминал Linux за одну команду <code>wsl --install</code>.',
  where:'Терминал «Ubuntu» в меню Пуск. Файлы Windows видны внутри как <code>/mnt/c/</code>.',
  when:'Твой главный полигон: модули, лабы и почти весь проект. Это локальная виртуальная машина (не облако): у неё нет белого IP и она спит вместе с ноутбуком — поэтому для «настоящего интернета» берут VPS.'},
 {k:'vps',n:'VPS / виртуальная машина',re:/\bVPS\b|VirtualBox|виртуальн/i,m:'ctr',
  what:'Виртуальная машина — «компьютер внутри компьютера» со своей ОС и своим ядром. VPS — такая машина в аренду в дата-центре, с белым IP.',
  why:'Один мощный физический сервер делят на много изолированных виртуальных: дешевле, гибче, можно создать за минуту и удалить. Почти все «серверы» в облаках — это виртуальные машины.',
  where:'В облаке (Yandex Cloud, Selectel, Hetzner, AWS) или локально в VirtualBox.',
  when:'Твой «сервер» на работе почти наверняка VM. Для практики — дешёвый VPS или VirtualBox с Ubuntu Server.'},
 {k:'apt',n:'apt / dnf / apk (менеджеры пакетов)',re:/\bapt\b|\bdnf\b|\bapk\b/,m:'pkgs',
  what:'«Магазин приложений» в консоли: <code>apt install nginx</code> скачивает программу из официального хранилища (репозитория) и ставит со всеми зависимостями.',
  why:'Ставить софт вручную — искать архивы, собирать, следить за зависимостями и обновлениями — долго и опасно. Менеджер пакетов ставит проверенные версии, обновляет их одной командой (включая патчи безопасности) и чисто удаляет.',
  where:'apt — Ubuntu/Debian, dnf — RHEL/Rocky, apk — Alpine. Список репозиториев — <code>/etc/apt/sources.list.d/</code> (в Ubuntu).',
  when:'Поставить утилиту на сервер, обновить систему из-за уязвимости, разобраться, почему «пакет не найден» (другой дистрибутив или не подключён репозиторий).'},
 {k:'sysctl',n:'sysctl',re:/sysctl/i,m:'res',
  what:'Команда для чтения и изменения настроек ядра на лету.',
  why:'Ядро по умолчанию настроено «для всех». Нагруженному серверу иногда нужно другое: больше сетевых соединений, другая политика использования swap. sysctl меняет это без перезагрузки.',
  where:'Текущие значения — <code>sysctl -a</code>, постоянные — файлы <code>/etc/sysctl.d/*.conf</code>.',
  when:'Тонкая настройка под нагрузку, требования Kubernetes или базы данных (например, <code>vm.max_map_count</code> для Elasticsearch).'},
 {k:'npm',n:'npm / make (сборка)',re:/\bnpm\b|\bmake\b/,m:'gitlabci',
  what:'Инструменты сборки проектов: <code>npm</code> — для JavaScript/Node.js (ставит зависимости, запускает тесты), <code>make</code> — запускает шаги сборки, описанные в Makefile.',
  why:'Сборка проекта — это десятки шагов. Их записывают один раз, а дальше любой (и CI) запускает одной командой: <code>npm test</code>, <code>make build</code>.',
  where:'<code>package.json</code> (npm), <code>Makefile</code> (make) в корне проекта.',
  when:'Это команды внутри шагов CI. В модулях они — пример «долгой команды, у которой есть вывод, ошибки и код возврата».'},
 {k:'pwsh',n:'PowerShell',re:/powershell|pwsh|\.ps1/i,m:'shell',
  what:'Оболочка и язык скриптов от Microsoft. Есть в каждой Windows, есть версия для Linux (<code>pwsh</code>).',
  why:'В Windows-инфраструктуре (Active Directory, Windows Server, Azure) автоматизация пишется на PowerShell. Его отличие от bash — по пайпу передаются объекты со свойствами, а не текст.',
  where:'Скрипты — файлы <code>.ps1</code>. Запуск может быть ограничен политикой ExecutionPolicy.',
  when:'Компании со смешанной инфраструктурой, раннеры CI на Windows, автоматизация Azure.'},
 {k:'regex',n:'Регулярные выражения',re:/регуляр|regex/i,m:'text',
  what:'Язык шаблонов для поиска текста: не «найди слово error», а «найди строку, которая начинается с даты, а в конце — число больше 500».',
  why:'Логи и конфиги огромные, а искать нужно не точное слово, а «похожее»: любой IP, любой код 5xx, строку без комментария. Регулярки работают в grep, sed, awk, nginx, мониторинге и почти любом языке.',
  where:'<code>^</code> начало строки, <code>$</code> конец, <code>.</code> любой символ, <code>*</code> повтор, <code>[0-9]</code> цифра, <code>|</code> «или» (в grep -E).',
  when:'Каждый раз, когда фильтруешь логи или массово правишь конфиги.'}];
/* Какие инструменты модуль упоминает раньше их собственного модуля (по плановому порядку LEVELS) */
const PLAN=()=>LEVELS.flatMap(l=>l.ids);
function earlyTerms(id){const m=MODS[id],plan=PLAN(),i=plan.indexOf(id);
  const txt=[m.intro,m.theory,m.memo,JSON.stringify(m.traps),JSON.stringify(m.ex),JSON.stringify(m.lab),JSON.stringify(m.qa)].join(' ').replace(/<[^>]+>/g,' ');
  return TERMS.filter(t=>t.m!==id&&t.re.test(txt)&&plan.indexOf(t.m)>i)}
const termHTML=(t,open)=>`<details class="term"${open?' open':''}><summary>${t.n}</summary><dl>
<dt>Что это</dt><dd>${t.what}</dd><dt>Зачем это вообще нужно</dt><dd>${t.why}</dd><dt>Где живёт</dt><dd>${t.where}</dd><dt>Когда ты с этим столкнёшься</dt><dd>${t.when}</dd></dl>
<p class="muted">${MODS[t.m]?`Подробно: <a href="#m-${t.m}">${MODS[t.m].title}</a>`:'Подробно — в своём модуле (ещё в работе)'}</p></details>`;
/* Сквозной проект «Магазин» — от голого сервера до Kubernetes + CI/CD + мониторинг + Terraform.
   Итог: Node.js CRUD API (товары) в Kubernetes через Helm, CI/CD в GitLab, Prometheus/Grafana, инфраструктура в Terraform. Публичный репо с README и схемой.
   Каждый тикет: id · t (название) · why (зачем — какая боль в проекте) · do (что сделать) · done (как проверить, что готово) · need (модули, которые к нему готовят) · hint (подсказка, раскрывается).
   Модули из need показывают у себя блок «В проекте»: какой тикет теперь можно делать.
   ПРИНЦИП: курс первичен. Модули НЕ подгоняются под проект — проект подстраивается под модули. Поменялся курс → правим тикеты здесь. */
const PROJECT={
 goal:'Простое Node.js CRUD API «Магазин» (товары) с базой MS SQL Server, задеплоенное в Kubernetes через Helm, с CI/CD в GitLab CI, мониторингом Prometheus/Grafana и инфраструктурой в Terraform. Всё в публичном GitLab-репозитории с README и схемой архитектуры — это твоё портфолио на собес.',
 sprints:[
 {id:'s0',n:'Спринт 0 · Голый сервер',goal:'Поднять API и базу на обычном Linux руками — без Docker. «Сервер» — твоя Ubuntu в WSL (там есть systemd, всё как на настоящем сервере). Так ты поймёшь, из чего состоит прод и какие боли потом решают контейнеры. Тикет 0.10 — по желанию на дешёвом VPS: выставить сервер в интернет.',tickets:[
  {id:'0.1',t:'Поднять «сервер»',need:['linux','shell'],why:'Нужна машина, на которой будет жить магазин. На работе это VPS в облаке; для Спринта 0 им будет Ubuntu в WSL на ноутбуке: MS SQL требует минимум 2 ГБ памяти, а VPS с 2 ГБ+ дорогой.',do:'Ubuntu 24.04 в WSL (<code>wsl --install -d Ubuntu-24.04</code>), systemd включён. Дай WSL памяти с запасом: в <code>C:\\Users\\&lt;имя&gt;\\.wslconfig</code> секция <code>[wsl2]</code>, <code>memory=10GB</code>. Узнай дистрибутив, ядро, архитектуру.',done:'<code>cat /etc/os-release</code> — Ubuntu 24.04 LTS; <code>systemctl is-system-running</code> отвечает; <code>free -h</code> показывает выделенную память.',hint:'<p>Если systemd не включён: в <code>/etc/wsl.conf</code> секция <code>[boot]</code>, строка <code>systemd=true</code>, затем в Windows <code>wsl --shutdown</code>.</p>'},
  {id:'0.2',t:'Пользователь deploy и права',need:['perms'],why:'Работать под root опасно: одна опечатка — и сервер сломан. Сервисы и деплой живут под отдельным пользователем с минимумом прав.',do:'Создать пользователя <code>deploy</code> с sudo, папку <code>/opt/shop</code> с владельцем deploy.',done:'<code>id deploy</code> показывает группу sudo, <code>ls -ld /opt/shop</code> — владелец deploy.'},
  {id:'0.3',t:'SSH по ключу',need:['ssh'],why:'Привыкнуть входить на сервер только по ключу — так устроен любой прод. В WSL отрабатываем механику, наружу — в тикете 0.10.',do:'Поставить openssh-server, сгенерировать ed25519-ключ в Windows, зайти по нему в WSL (<code>ssh -p 2222 deploy@localhost</code>), в <code>sshd_config</code> выключить пароль и вход root.',done:'Вход по ключу работает; с <code>-o PubkeyAuthentication=no</code> — отказ.',hint:'<p>Перед перезапуском sshd держи вторую открытую сессию. Проверка конфига: <code>sudo sshd -t</code>.</p>'},
  {id:'0.4',t:'Firewall',need:['fw'],why:'Наружу должны смотреть только нужные порты: SSH и 80/443. Порт базы 1433 и приложения 3000 — только изнутри.',do:'ufw: разрешить SSH и 80/443, остальное входящее запретить. Проверить, что правило не отрезало тебе SSH.',done:'<code>sudo ufw status verbose</code> — нужные правила; база доступна только с localhost.'},
  {id:'0.5',t:'API «Магазин» на Node.js',need:['shell','files'],why:'Нужно само приложение, которое будем деплоить всю дальнейшую жизнь курса.',do:'Node.js API: <code>GET /health</code>, <code>GET /items</code>, <code>POST /items</code>. Пока данные в памяти. Код — в git-репозитории на GitLab.',done:'<code>curl localhost:3000/health</code> → <code>200 OK</code>; POST добавляет товар, GET его показывает.',hint:'<p>Express + 30 строк кода. Порт и прочие настройки — из переменных окружения (<code>process.env.PORT</code>), а не зашиты в код: это понадобится в Docker и Kubernetes.</p>'},
  {id:'0.6',t:'MS SQL Server руками',need:['pkgs','systemd'],why:'Данные в памяти пропадают при перезапуске. Магазину нужна база; берём MS SQL — его используют банки и крупные компании.',do:'Подключить репозиторий Microsoft (ключ + signed-by, модуль 11), поставить <code>mssql-server</code>, настроить <code>sudo /opt/mssql/bin/mssql-conf setup</code> (редакция <b>Developer</b> — бесплатная для разработки), поставить <code>mssql-tools18</code> (sqlcmd). Создать базу <code>shop</code>, логин приложения с правами только на неё. Приложение читает/пишет товары в базу; пароль — в <code>/opt/shop/.env</code> с правами 600.',done:'<code>systemctl status mssql-server</code> — active; <code>sqlcmd -S localhost -U shop_app -C -Q "SELECT COUNT(*) FROM shop.dbo.items"</code> отвечает; в Windows SSMS или dbForge подключается к <code>localhost,1433</code>; перезапуск приложения — товары на месте.',hint:'<p>Минимум 2 ГБ памяти — иначе служба не стартует (смотри <code>journalctl -u mssql-server</code>). Для Node — пакет <code>mssql</code>. Под sa не подключай приложение: отдельный логин с минимальными правами (модуль «Права» — тот же принцип).</p>'},
  {id:'0.7',t:'Приложение как systemd-сервис',need:['systemd','procs'],why:'Запущенное в терминале приложение умрёт, когда закроешь терминал, и не поднимется после перезагрузки.',do:'Unit-файл <code>shop.service</code>: запуск от deploy, After=mssql-server.service, автоперезапуск при падении, автостарт.',done:'<code>wsl --shutdown</code> из Windows и снова открыть Ubuntu → <code>systemctl status shop</code> — active; <code>kill -9</code> процесса — через пару секунд он снова жив.'},
  {id:'0.8',t:'Nginx перед приложением',need:['nginx'],why:'Приложение не должно торчать в интернет само: nginx принимает запросы на 80/443, пишет логи и передаёт их на localhost:3000.',do:'Конфиг reverse proxy в <code>sites-available/shop</code>, ссылка в sites-enabled, <code>nginx -t</code>, reload.',done:'<code>curl http://localhost/items</code> и браузер в Windows на <code>http://localhost</code> отвечают через nginx; приложение слушает только 127.0.0.1:3000.'},
  {id:'0.9',t:'Разбор: логи и ресурсы',need:['text','res'],why:'Прод работает — значит, пора научиться видеть, что с ним происходит.',do:'Нагрузить API (цикл curl), найти в access.log топ адресов и коды ответа, посмотреть, сколько CPU и памяти едят node и sqlservr (MS SQL забирает память под кэш — почему это нормально?).',done:'Можешь одной строкой ответить: сколько запросов было за час, сколько 5xx, кто больше всех нагружает.'},
  {id:'0.10',t:'(по желанию) Наружу: настоящий VPS',need:['ssh','fw','nginx'],why:'Почувствовать настоящий интернет: боты начинают подбирать пароли SSH через минуты после создания сервера.',do:'Дешёвый VPS на 1 ГБ (бесплатный тест или месяц): пользователь deploy, вход только по ключу, ufw, nginx отдаёт страницу магазина (API в режиме «данные в памяти» — MS SQL на 1 ГБ не поместится). Посмотреть <code>journalctl -u ssh</code> через час.',done:'Сайт открывается по IP из интернета; в журнале SSH — сотни отклонённых попыток чужих ботов, ни одного успешного входа.'}]},
 {id:'s1',n:'Спринт 1 · Docker',goal:'Упаковать магазин в контейнеры. Вспомни Спринт 0: ставить Node и Postgres руками, следить за версиями, писать unit-файлы — теперь это одна команда.',tickets:[
  {id:'1.1',t:'Окружение Docker',need:['docker'],why:'Нужен сам инструмент.',do:'Docker Engine внутри WSL (из репозитория Docker, модуль 11), твой пользователь в группе docker (и помни, что это равно root).',done:'<code>docker run hello-world</code> работает без sudo.'},
  {id:'1.2',t:'Dockerfile, multi-stage',need:['dfile','multi'],why:'Образ должен быть маленьким и одинаковым везде: у тебя, в CI, на проде.',do:'Dockerfile для API: multi-stage сборка, <code>.dockerignore</code>, запуск не от root, healthcheck.',done:'<code>docker build -t shop .</code> + <code>docker run -p 3000:3000 shop</code> отвечает; образ меньше 200 МБ (<code>docker images</code>).'},
  {id:'1.3',t:'docker-compose: API + MS SQL + Redis',need:['compose','vol','dnet'],why:'Магазин — это несколько сервисов, которые должны найти друг друга и не терять данные.',do:'<code>docker-compose.yml</code>: api, mssql (<code>mcr.microsoft.com/mssql/server:2022-latest</code>, <code>MSSQL_PID=Developer</code>, пароль из <code>.env</code>, volume для <code>/var/opt/mssql</code>, healthcheck через sqlcmd), redis. API ждёт healthy-базу и ходит в неё по имени сервиса.',done:'<code>docker compose up -d</code>; SSMS/dbForge подключается к <code>localhost,1433</code>; POST → <code>down</code> → <code>up</code> — данные на месте.'},
  {id:'1.4',t:'Переезд прода в контейнеры',need:['compose','nginx'],why:'Закрываем Спринт 0: systemd-сервис и postgres из apt больше не нужны.',do:'Остановить старые сервисы, nginx проксирует на контейнер, деплой = <code>git pull && docker compose up -d --build</code>.',done:'Сайт работает из контейнеров, <code>systemctl status shop</code> — disabled.'},
  {id:'1.5',t:'Легаси: Oracle рядом',need:['compose','sql'],why:'В крупных компаниях и банках рядом с новыми сервисами живут старые системы на Oracle. Типичная задача DevOps — поднять копию такой базы для тестов и перенести данные между системами.',do:'Oracle Database Free в Docker (<code>gvenzl/oracle-free:slim</code>, от 2 ГБ памяти), подключиться через DBeaver, создать таблицу items и перенести туда товары из MS SQL (выгрузка в CSV → загрузка). Остановить Oracle, когда не нужен, — он тяжёлый.',done:'В DBeaver видны обе базы; количество товаров в Oracle и MS SQL совпадает; ты можешь объяснить 3 отличия Oracle от MS SQL (схемы и пользователи, типы, sqlplus vs sqlcmd).'}]},
 {id:'s2',n:'Спринт 2 · Kubernetes',goal:'Перенести магазин в Kubernetes: самовосстановление, несколько копий, обновление без простоя.',tickets:[
  {id:'2.1',t:'Кластер',need:['k8sarch','kubectl'],why:'Нужен учебный кластер.',do:'minikube или kind + kubectl.',done:'<code>kubectl get nodes</code> → Ready.'},
  {id:'2.2',t:'Deployment + Service',need:['pod','deploy','svc'],why:'Описать магазин манифестами: сколько копий и как к ним достучаться.',do:'<code>deployment.yaml</code> (2 реплики) и <code>service.yaml</code>.',done:'Поды Running; удалил под — Kubernetes поднял новый.'},
  {id:'2.3',t:'ConfigMap и Secret',need:['cfg'],why:'Настройки и пароль от базы не должны быть зашиты в образ.',do:'Env — в ConfigMap, пароль SA и логина приложения — в Secret, приложение и MS SQL читают их как переменные окружения.',done:'Поменял значение в ConfigMap + rollout restart — приложение видит новое.'},
  {id:'2.4',t:'Ingress',need:['ingress'],why:'Доступ к магазину по имени, как к настоящему сайту.',do:'Ingress-аддон minikube, правило для <code>myapp.local</code>.',done:'<code>curl http://myapp.local/items</code> работает.'},
  {id:'2.5',t:'Probes и ресурсы',need:['probes','qos'],why:'Kubernetes должен знать, жив ли под и готов ли принимать трафик, и сколько ресурсов ему дать.',do:'liveness и readiness на <code>/health</code>, requests/limits.',done:'Сломал /health — под перезапускается; <code>kubectl describe pod</code> показывает пробы.'}]},
 {id:'s3',n:'Спринт 3 · Helm',goal:'Весь стек одной командой и разные настройки для разных окружений.',tickets:[
  {id:'3.1',t:'Свой чарт',need:['helm'],why:'Десяток YAML-файлов руками применять неудобно и опасно.',do:'<code>helm create shop</code>, перенести манифесты в шаблоны.',done:'<code>helm install shop ./shop</code> разворачивает всё.'},
  {id:'3.2',t:'values.yaml',need:['helm'],why:'Тег образа, число реплик, env — должны меняться без правки шаблонов.',do:'Вынести переменные в values, сделать <code>values-prod.yaml</code>.',done:'<code>helm upgrade --set replicaCount=3</code> меняет реплики; <code>helm rollback</code> возвращает.'},
  {id:'3.3',t:'MS SQL в кластере: свой чарт',need:['helm','sts','storage'],why:'Готового официального Helm-чарта для MS SQL нет — значит, база в Kubernetes делается руками. Это частый вопрос на собесе: как держать базу в кластере и не потерять данные.',do:'Чарт для MS SQL: StatefulSet (1 реплика), PVC для <code>/var/opt/mssql</code>, Secret с паролем, Service, readiness через sqlcmd, requests/limits памяти не меньше 2 ГБ. Redis — Bitnami-чартом.',done:'<code>helm list</code> — 3 релиза; удалил под базы — данные на месте; <code>kubectl port-forward svc/mssql 1433:1433</code> → SSMS видит базу.'},
  {id:'3.4',t:'Бэкап и восстановление базы',need:['helm','jobs'],why:'Бэкап, который ни разу не восстанавливали, — не бэкап. Сохранность данных — прямая ответственность DevOps.',do:'CronJob раз в сутки делает <code>BACKUP DATABASE shop TO DISK</code> на отдельный PVC (позже — в S3). Отдельно — процедура восстановления в новую базу <code>shop_restore</code> и сверка числа строк.',done:'Удалил таблицу items → восстановил из бэкапа → товары на месте. Записано, сколько это заняло.'},
  {id:'3.5',t:'Магазин для нескольких клиентов',need:['helm','kubectl','cfg','vault'],why:'Магазин продаёшь трём компаниям. Если все копии крутятся одной кучей контейнеров на одном сервере, начинается хаос: порты путаются, три одинаковых Redis, клиенты видят сеть друг друга, а секреты лежат вперемешку. Так выглядит реальный прод, который потом переводят в Kubernetes.',do:'Namespace на каждого клиента (<code>shop-a</code>, <code>shop-b</code>, <code>shop-c</code>) и общий <code>shared</code> (Redis, Vault). Один Helm-чарт магазина, отдельный <code>values-&lt;клиент&gt;.yaml</code> (тег образа, CLIENT_ID, реплики). Секреты каждого клиента — из Vault по своему пути через Vault Agent Injector. NetworkPolicy: клиенты видят shared, но не друг друга.',done:'<code>helm list -A</code> — три релиза магазина в трёх namespace; под клиента A не может достучаться до сервиса клиента B; в values нет ни одного пароля. Готов рассказ на собес за минуту: «N копий сервиса для разных клиентов: namespace на клиента, один чарт с разными values, секреты из Vault, деплой — одна команда в CI».'}]},
 {id:'s4',n:'Спринт 4 · CI/CD: GitLab CI и GitHub Actions',goal:'Push в git → образ собран, протестирован и выкачен сам. Основной пайплайн — GitLab CI, такой же — в GitHub Actions (зеркало репозитория): на собесе спросят про оба.',tickets:[
  {id:'4.1',t:'Пайплайн lint → build → test',need:['gitlabci','runners'],why:'Сломанный код не должен доезжать до прода.',do:'<code>.gitlab-ci.yml</code> со стадиями lint, build, test.',done:'MR с ошибкой в тесте — пайплайн красный.'},
  {id:'4.2',t:'Образ в Container Registry',need:['gitlabci','registry'],why:'Кластер должен откуда-то брать образ нужной версии.',do:'Сборка и push в GitLab Registry с тегом <code>$CI_COMMIT_SHA</code>.',done:'Образ виден в Registry, тег совпадает с коммитом.'},
  {id:'4.3',t:'Автодеплой через helm upgrade',need:['gitlabci','helm'],why:'Деплой без рук и без «а кто последний выкатывал?».',do:'Job deploy: <code>helm upgrade --install</code> с новым тегом; main — деплой, MR — только тесты.',done:'Push в main → через пару минут в кластере новая версия.'},
  {id:'4.4',t:'Секреты из Vault',need:['vault'],why:'Пароли не должны лежать в репозитории и переменных CI открытым текстом.',do:'Пайплайн получает пароль БД из Vault и передаёт в Secret.',done:'В репозитории и логах CI пароля нет.'},
  {id:'4.5',t:'Миграции схемы в пайплайне',need:['gitlabci','sql'],why:'Новая версия приложения часто требует новых колонок. Если менять базу руками, рано или поздно прод и код разойдутся.',do:'SQL-миграции в репозитории (файлы с номерами), job в пайплайне применяет их до деплоя приложения; миграции обратно совместимы.',done:'Добавил колонку через MR → пайплайн применил миграцию → новая версия API её использует, старая не сломалась.'},
  {id:'4.6',t:'Ускорить пайплайн в 10 раз',need:['gitlabci','runners','git'],why:'Реальная история: пайплайн шёл 30 минут, после разбора — 3. Причина была не в «медленном раннере», а в том, что в репозиторий годами коммитили собранные артефакты, и каждый job клонировал гигабайты. Чинить наугад бесполезно — нужен метод.',do:'Намеренно испорти свой репозиторий: закоммить пару больших архивов сборки. Засеки время каждой стадии job (Preparing environment, Getting source, Downloading artifacts). Найди причину: <code>du -sh .git</code>, <code>git count-objects -v</code>, поиск самых больших объектов в истории. Почини в <b>GitLab CI</b>: <code>GIT_STRATEGY: none</code> для job, которым код не нужен, <code>GIT_DEPTH</code>; и то же в <b>GitHub Actions</b>: убрать <code>actions/checkout</code> из job, которым код не нужен, <code>fetch-depth: 1</code>, <code>sparse-checkout</code>. Артефакты — через artifacts/Package Registry (GitLab) или <code>actions/upload-artifact</code> / GitHub Packages, а не git; почисти историю (orphan-ветка или git filter-repo) и объясни разницу.',done:'Таблица «было/стало» по стадиям, пайплайн заметно быстрее; можешь объяснить, чем artifacts отличается от cache и needs, и почему удаление тега не всегда освобождает место.'}]},

const TICKETS=PROJECT.sprints.flatMap(s=>s.tickets.map(t=>Object.assign({sp:s},t)));

/* Задания. Общие поля: t (тип), q (вопрос, html), e (почему — обязательно), g (группа), ref (id прошлой темы для ↺), code+lang (блок кода).
   t:'c'  выбор       {o:[варианты], a:индекс верного}        — варианты перемешиваются
   t:'r'  чтение      то же, что 'c', но с логом/конфигом в code
   t:'i'  впиши       {a:['ответ','допустимый вариант'], ph:'подсказка в поле', fix:true — «исправь ошибку»}
   t:'s'  собери      {p:['шаг 1','шаг 2',…]} — в верном порядке, на экране перемешиваются
   Группы g: base Базовые · prac Практика · job Как на работе · mix Смешанные (ставится сам, если есть ref) */
const TYPES={c:['Выбор','t-c'],r:['Чтение','t-r'],i:['Впиши','t-i'],s:['Собери','t-s']};
const GROUPS={base:'Базовые',prac:'Практика',job:'Как на работе',mix:'Смешанные ↺',rev:'Обзор'};
const norm=s=>String(s).trim().replace(/[“”«»]/g,'"').replace(/’/g,"'").replace(/\s+/g,' ').replace(/\s*;$/,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function exHTML(x,i,state){
  const [tn,tc]=TYPES[x.t];const mix=x.ref?` <a class="ref" href="#m-${x.ref}">↺ ${MODS[x.ref]?MODS[x.ref].title:x.ref}</a>`:'';
  let body='';
  if(x.t==='c'||x.t==='r'){const ord=shuffle(x.o.map((_,k)=>k));body=`<div class="opts">${ord.map(k=>`<button class="opt" data-k="${k}">${x.o[k]}</button>`).join('')}</div>`}
  if(x.t==='i')body=`<div class="inrow"><span class="k-pr">${x.fix?'✎':'$'}</span><input class="inp" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="${esc(x.ph||'')}"><button class="go">Проверить</button></div>`;
  if(x.t==='s')body=`<div class="sline"></div><div class="spool">${shuffle(x.p.map((_,k)=>k)).map(k=>`<button class="chip" data-k="${k}">${x.p[k]}</button>`).join('')}</div><button class="go">Проверить</button>`;
  return `<div class="ex ${tc}${x.ref?' mixd':''}${state===1?' ok':state===0?' no':''}" data-i="${i}"><div class="exh"><span class="tag">${tn}${x.fix?' · исправь':''}</span><span class="num">${i+1}</span>${mix}</div><div class="q">${x.q}</div>${x.code?C(x.code,x.lang||'sh'):''}${body}<div class="fb"></div></div>`}
function exCheck(x,el){
  if(x.t==='c'||x.t==='r'){const b=el.querySelector('.opt.sel');return b&&+b.dataset.k===x.a}
  if(x.t==='i'){const v=norm(el.querySelector('.inp').value);return x.a.some(a=>norm(a)===v)}
  if(x.t==='s'){const ks=[...el.querySelectorAll('.sline .chip')].map(b=>x.p[+b.dataset.k]);return ks.length===x.p.length&&ks.every((s,k)=>s===x.p[k])}}
function exRight(x){
  if(x.t==='c'||x.t==='r')return x.o[x.a];
  if(x.t==='i')return `<code>${hlSh(x.a[0])}</code>`;
  return `<ol>${x.p.map(s=>`<li>${s}</li>`).join('')}</ol>`}
/* Приложение: прогресс (localStorage), маршруты, экраны.
   #home главная · #m-<id>-<вкладка> модуль (theory|ex|lab|qa) · #cheat · #qa · #todo «Надо разобрать» */
const KEY='devops-v1';
const P=Object.assign({done:{},open:{},todo:[],lab:{},proj:{}},(()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}})());
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const $=s=>document.querySelector(s);
const score=id=>{const m=MODS[id],d=P.done[id]||{};const n=m.ex.length;const ok=Object.values(d).filter(v=>v===1).length;return {n,ok,pct:n?ok/n:0}};
const unlocked=id=>{const i=ORDER.indexOf(id);if(i<=0||P.open[id])return true;const prev=ORDER[i-1];return score(prev).pct>=PASS&&unlocked(prev)};
const groupOf=x=>x.ref?'mix':x.g||'base';
const linkRefs=h=>String(h).replace(/\[\[mod:(\w+)\]\]/g,(_,id)=>MODS[id]?`<a class="mref" href="#m-${id}" title="${esc(MODS[id].title)}">${ORDER.indexOf(id)+1}</a>`:'«'+id+'» (в работе)');
const plain=s=>String(s).replace(/<[^>]+>/g,'').replace(/\[\[mod:(\w+)\]\]/g,(_,id)=>MODS[id]?String(ORDER.indexOf(id)+1):id);

function side(cur){
  $('#side').innerHTML=`<a class="sl${!cur?' cur':''}" href="#home">⌂ Главная</a><a class="sl" href="#project">🛠 Проект «Магазин»</a><a class="sl" href="#qa">🎴 Собес каждый день</a><a class="sl" href="#cheat">📋 Шпаргалка</a><a class="sl" href="#terms">📖 Словарь инструментов</a><a class="sl" href="#links">🔗 Ссылки</a><a class="sl" href="#todo">🗒 Надо разобрать <span class="cnt">${P.todo.length||''}</span></a>`+
  LEVELS.filter(l=>l.ids.some(id=>MODS[id])).map(l=>`<details open><summary>${l.id} · ${l.name}</summary>${l.ids.filter(id=>MODS[id]).map(id=>{const m=MODS[id],s=score(id),u=unlocked(id);
    return `<a class="sl${m.review?' rev':''}${cur===id?' cur':''}" href="#m-${id}">${u?'':'🔒 '}${ORDER.indexOf(id)+1}. ${m.title}<span class="pg" style="--p:${s.pct*100|0}%"></span></a>`}).join('')}</details>`).join('')}

function home(){
  const total=ORDER.reduce((a,id)=>a+MODS[id].ex.length,0),ok=ORDER.reduce((a,id)=>a+score(id).ok,0);
  return `<h1>DevOps по-тихому</h1><p class="sub">Linux → Docker → Kubernetes → CI/CD → Terraform → Собес. Цель — понимать, что происходит в системе и почему.</p>
  ${BOX('Как работать с тетрадью',`<ol><li><b>Теория</b> — сначала «что это и зачем», потом суть. Команды не зубри: пойми, что они делают.</li><li><b>Практика</b> — задания. Следующий модуль откроется при ${PASS*100}% верных.</li><li><b>Лаба</b> — главное. Делай руками в терминале <b>без ИИ</b>. Застрял — <code>man</code>, <code>--help</code>, потом подсказка, и только потом решение.</li><li><b>Собес</b> — проговори ответ вслух, потом открой. Раздел «Собес каждый день» собирает вопросы всех открытых тем.</li><li>Не понял — жми «В разобрать», тема уйдёт в список.</li></ol>`)}
  <div class="stats"><div><b>${ORDER.length}</b>модулей готово</div><div><b>${ok}/${total}</b>заданий решено</div><div><b>${P.todo.length}</b>надо разобрать</div></div>
  <p class="muted">Прогресс хранится в этом браузере. На другом устройстве открывай модули кнопкой «Открыть без прохождения».</p>`}

function modView(id,tab){
  const m=MODS[id];if(!m)return '<p>Нет такого модуля.</p>';
  const u=unlocked(id),s=score(id),i=ORDER.indexOf(id),next=ORDER[i+1];
  const tabs=[['theory','Теория'],['ex',`Практика ${s.ok}/${s.n}`],['lab',`Лаба ${m.lab.length}`],['qa',`Собес ${m.qa.length}`]]
    .filter(([k])=>(k!=='lab'||m.lab.length)&&(k!=='qa'||m.qa.length)&&(k!=='theory'||m.theory));
  if(!tabs.some(t=>t[0]===tab))tab=tabs[0][0];
  let h=`<div class="mh"><span class="lv">${m.review?'Обзор':m.lvl} · модуль ${i+1}</span><h1>${m.title}</h1><p class="sub">${m.sub||''}</p></div><nav class="tabs">${tabs.map(([k,n])=>`<a class="${k===tab?'on':''}" href="#m-${id}-${k}">${n}</a>`).join('')}</nav>`;
  const early=earlyTerms(id);const caseBox=m.case?`<section class="case"><h2>Ситуация</h2>${m.case}</section>`:'';const earlyBox=early.length?`<details class="early"><summary>В этом модуле встретятся инструменты, которых ещё не было (${early.length}). Что это и зачем они нужны — раскрой</summary>${early.map(t=>termHTML(t)).join('')}</details>`:'';
  const tk=ticketsAfter(id);const projBox=tk.length?`<section class="projbox"><h2>🛠 В проекте «Магазин»</h2><p>После этого модуля можно делать:</p>${tk.map(t=>`<p>→ <a href="#project">Тикет ${t.id} · ${t.t}</a> — ${t.why}</p>`).join('')}</section>`:'';
  const lk=linksFor(id);const linkBox=lk.length?`<section class="linkbox"><h2>📚 Почитать по теме</h2><ul class="links">${lk.map(linkHTML).join('')}</ul></section>`:'';
  if(tab==='theory')h+=caseBox;
  if(tab==='theory'||tab==='ex'||tab==='lab')h+=earlyBox;
  if(tab==='theory')h+=(m.intro?`<section class="intro"><h2>Что это и зачем</h2>${m.intro}</section>`:'')+`<section>${m.theory}</section>`+(m.memo?`<section><h2>Как тренировать</h2>${m.memo}</section>`:'')+(m.traps.length?`<section><h2>Ловушки</h2>${TR(m.traps)}</section>`:'')+projBox+linkBox;
  if(tab==='ex'){
    if(!u)return h+`<div class="lock">🔒 Практика откроется, когда в предыдущем модуле будет ${PASS*100}% верных. Теорию можно читать уже сейчас.<br><button class="force" data-id="${id}">Открыть без прохождения</button></div>`;
    const d=P.done[id]||{};let last='';
    h+=`<div class="bar"><span>Верно: ${s.ok} из ${s.n} (${s.pct*100|0}%)</span><button class="reset" data-id="${id}">Сбросить</button></div>`;
    m.ex.forEach((x,k)=>{const g=m.review?'rev':groupOf(x);if(g!==last){h+=`<h3 class="grp">${GROUPS[g]}</h3>`;last=g}h+=exHTML(x,k,d[k])});
    if(next)h+=`<p class="nextp">${s.pct>=PASS?`<a class="btn" href="#m-${next}">Дальше: ${MODS[next].title} →</a>`:`Для перехода дальше нужно ${PASS*100}%.`}</p>`}
  if(tab==='lab')h+=BOX('Правила лабы','<p>Терминал, без ИИ и без копипасты из решения. Порядок: подумай → <code>man</code> / <code>--help</code> → подсказка → решение. <b>Где делать:</b> бесплатно — GitHub Codespaces (Linux + Docker в браузере, ~60 ч/мес) или Killercoda (песочницы Linux/Kubernetes); для Спринта 0 проекта — свой VPS на 1–2 ГБ (Hoster.kz, PS.kz — ~3 100 ₸/мес, оплата Kaspi; Hetzner CX23 — €5.99/мес, почасовая). WSL/VirtualBox — только если на компьютере включена виртуализация. Не на рабочем сервере. Один раз поставь утилиты, которые нужны лабам курса: <code>sudo apt update && sudo apt install -y bind9-dnsutils traceroute mtr-tiny sysstat iotop stress-ng shellcheck tree netcat-openbsd</code>.</p>','warn')+
    m.lab.map((l,k)=>{const dn=(P.lab[id]||{})[k];return `<div class="lab${dn?' ok':''}"><div class="exh"><span class="tag">Лаба ${k+1}</span><label><input type="checkbox" class="labdone" data-id="${id}" data-k="${k}"${dn?' checked':''}> сделал сам</label></div><div class="q">${l.t}</div>${l.h?`<details><summary>Подсказка</summary>${l.h}</details>`:''}${l.chk?`<details><summary>Как проверить себя</summary>${l.chk}</details>`:''}${l.sol?`<details class="sol"><summary>Решение (только после попытки)</summary>${l.sol}</details>`:''}</div>`}).join('');
  if(tab==='lab')h+=projBox;
  if(tab==='qa')h+=`<p class="muted">Сначала ответь вслух сам, потом раскрой.</p>`+m.qa.map(([q,a])=>`<details class="qa"><summary>${q}</summary><div>${a}</div></details>`).join('');
  return h}

function cheat(){return `<h1>Шпаргалка</h1><input id="cs" class="inp wide" placeholder="Поиск: tail, права, порт…">`+ORDER.filter(id=>MODS[id].cheat.length).map(id=>`<section class="cs"><h3><a href="#m-${id}">${MODS[id].title}</a></h3>${CMDS(MODS[id].cheat)}</section>`).join('')}
function qaDaily(){const all=ORDER.filter(unlocked).flatMap(id=>MODS[id].qa.map(([q,a])=>[q,a,id]));
  return `<h1>Собес каждый день</h1><p class="sub">Пробегись глазами. Не знаешь — «В разобрать». Вопросы только из открытых модулей, порядок случайный.</p>`+
    shuffle(all).map(([q,a,id])=>`<details class="qa"><summary>${q}</summary><div>${a}<p class="muted">→ <a href="#m-${id}">${MODS[id].title}</a> · <button class="totodo" data-t="${esc(plain(q))}">В разобрать</button></p></div></details>`).join('')}
const modLink=id=>MODS[id]?`<a href="#m-${id}">${MODS[id].title}</a>${score(id).pct>=PASS?' ✓':''}`:`<span class="muted">${id} (модуль в работе)</span>`;
const ready=t=>t.need.every(id=>MODS[id]&&score(id).pct>=PASS);
function ticketHTML(t){const dn=P.proj[t.id],r=ready(t);return `<div class="ticket${dn?' ok':''}"><div class="exh"><span class="tag">Тикет ${t.id}</span><span class="${r?'rdy':'nrdy'}">${dn?'сделано':r?'можно делать':'сначала пройди модули'}</span><label><input type="checkbox" class="projdone" data-id="${t.id}"${dn?' checked':''}> сделал</label></div><h3>${t.t}</h3><p><b>Зачем:</b> ${t.why}</p><p><b>Что сделать:</b> ${t.do}</p><p><b>Готово, когда:</b> ${t.done}</p>${t.hint?`<details><summary>Подсказка</summary>${t.hint}</details>`:''}<p class="muted">Готовят модули: ${t.need.map(modLink).join(' · ')}</p></div>`}
function project(){const n=TICKETS.length,d=TICKETS.filter(t=>P.proj[t.id]).length;
  return `<h1>Проект «Магазин»</h1><p class="sub">${PROJECT.goal}</p>`+BOX('Как работать с проектом','<p>Это не задания с ответами, а настоящая работа: делаешь руками на своём сервере, без ИИ, и коммитишь в свой GitLab. Тикет становится «можно делать», когда пройдены модули, которые к нему готовят. Модули объясняют, <b>как</b>; проект показывает, <b>зачем</b> всё это вместе.</p>')+`<div class="stats"><div><b>${d}/${n}</b>тикетов сделано</div></div>`+PROJECT.sprints.map(s=>`<section><h2>${s.n}</h2><p class="sub">${s.goal}</p>${s.tickets.map(ticketHTML).join('')}</section>`).join('')}
const linkHTML=l=>`<li><a href="${l.u}" target="_blank" rel="noopener noreferrer">${l.t}</a><span class="muted"> — ${l.n}</span></li>`;
function links(){const gs=[...new Set(LINKS.map(l=>l.g))];return `<h1>Ссылки</h1><p class="sub">Из твоих заметок. Ссылки по теме также показываются внизу теории нужного модуля.</p>`+gs.map(g=>`<section><h2>${g}</h2><ul class="links">${LINKS.filter(l=>l.g===g).map(linkHTML).join('')}</ul></section>`).join('')}
function terms(){return `<h1>Словарь инструментов</h1><p class="sub">Каждый инструмент: что это, зачем он вообще нужен, где живёт на сервере и в какой ситуации ты с ним столкнёшься.</p>`+TERMS.map(t=>termHTML(t)).join('')}
function todo(){return `<h1>Надо разобрать</h1><p class="sub">Сюда — всё, что не понял. Разобрал — отмечай ✓.</p><div class="inrow"><input id="tdi" class="inp" placeholder="Тема или команда"><button id="tda" class="go">Добавить</button></div><ul class="todo">${P.todo.map((t,k)=>`<li><span>${esc(t)}</span><button class="tdx" data-k="${k}">✓</button></li>`).join('')}</ul>`}

function route(){
  let [a,id,tab]=location.hash.slice(1).split('-');a=a||'home';
  $('#main').innerHTML=linkRefs(a==='m'?modView(id,tab):a==='cheat'?cheat():a==='qa'?qaDaily():a==='todo'?todo():a==='terms'?terms():a==='project'?project():a==='links'?links():home());
  side(a==='m'?id:null);document.body.classList.remove('menu');scrollTo(0,0)}
addEventListener('hashchange',route);

document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,input[type=checkbox]');if(!t)return;
  const cl=n=>t.classList.contains(n);
  if(t.id==='burger')return document.body.classList.toggle('menu');
  if(cl('force')){P.open[t.dataset.id]=true;save();return route()}
  if(cl('reset')){if(t.dataset.sure){delete P.done[t.dataset.id];save();route()}else{t.dataset.sure=1;t.textContent='Точно сбросить? Нажми ещё раз'}return}
  if(cl('projdone')){P.proj[t.dataset.id]=t.checked;save();return route()}
  if(cl('labdone')){(P.lab[t.dataset.id]=P.lab[t.dataset.id]||{})[t.dataset.k]=t.checked;save();t.closest('.lab').classList.toggle('ok',t.checked);return}
  if(cl('totodo')){if(!P.todo.includes(t.dataset.t))P.todo.push(t.dataset.t);save();t.textContent='Добавлено ✓';return}
  if(t.id==='tda'){const v=$('#tdi').value.trim();if(v){P.todo.push(v);save();route()}return}
  if(cl('tdx')){P.todo.splice(+t.dataset.k,1);save();return route()}
  const el=t.closest('.ex');if(!el)return;
  const id=location.hash.slice(1).split('-')[1],k=+el.dataset.i,x=MODS[id].ex[k];
  if(cl('chip')){(t.parentNode.classList.contains('spool')?el.querySelector('.sline'):el.querySelector('.spool')).appendChild(t);return}
  if(cl('opt')){el.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));t.classList.add('sel')}
  if(cl('opt')||cl('go')){
    const ok=!!exCheck(x,el);(P.done[id]=P.done[id]||{})[k]=ok?1:0;save();
    el.classList.toggle('ok',ok);el.classList.toggle('no',!ok);
    el.querySelector('.fb').innerHTML=linkRefs(`<div class="res">${ok?'✓ Верно':'✗ Неверно'}</div>${ok?'':`<div class="right">Правильно: ${exRight(x)}</div>`}<div class="why">${x.e}</div><button class="totodo" data-t="${esc((MODS[id].title+': '+plain(x.q)).slice(0,140))}">В разобрать</button>`);
    const s=score(id),b=$('.bar span');if(b)b.textContent=`Верно: ${s.ok} из ${s.n} (${s.pct*100|0}%)`;side(id)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.classList.contains('inp')){const g=ev.target.parentNode.querySelector('.go');g&&g.click()}});
document.addEventListener('input',ev=>{if(ev.target.id==='cs'){const v=ev.target.value.toLowerCase();document.querySelectorAll('.cs tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(v)?'':'none')}});
route();</script></body></html>
