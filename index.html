/* net1 · L1 · Сеть: уровни, IP и маски, порты, TCP/UDP, ss, curl, nc, ping, диагностика «не подключается» */
MOD({id:'net1',title:'Сеть: IP, порты, TCP/UDP и «не подключается»',sub:'Уровни сети, IP и /24, частные адреса и NAT, порты и 0.0.0.0 vs 127.0.0.1, TCP и UDP, ip, ss, nc, curl, ping, traceroute.',
case:`<p>Приложение в логах пишет: <i>Failed to connect to db-01:1433</i>. Разработчик говорит «сеть сломалась», сетевики — «у нас всё работает», администратор базы — «база запущена». Все правы и все ждут тебя. Через неделю похожее: сервис в контейнере запущен, порт открыт, а снаружи не отвечает. А на третий раз <code>ping</code> до сервера не проходит, хотя сайт на нём прекрасно открывается.</p><p class="goal"><b>Цель модуля:</b> понимать, как пакет добирается от программы до программы, отличать «отказано» от «таймаута», и за несколько команд определять, на каком шаге рвётся связь: имя, маршрут, порт, кто слушает, firewall или само приложение.</p>`,
intro:`<p>Когда приложение подключается к базе, происходит цепочка: найти адрес по имени → проложить путь до машины → достучаться до нужной <b>программы</b> на этой машине (порт) → договориться о соединении → обменяться данными. Сломаться может любое звено, и у каждого свой симптом.</p>
<p>DevOps не обязан быть сетевым инженером, но обязан понимать эту цепочку: почти любой инцидент «не работает» начинается с вопроса «а связь вообще есть?». И именно ты обычно стоишь между разработчиками, сетевиками и админами баз — нужно уметь показать, на чьей стороне разрыв, а не гадать.</p>
<p>Главная идея: <mark>IP-адрес находит машину, порт находит программу на ней</mark>.</p>`,
theory:`<h2>Уровни: кто за что отвечает</h2>
${tbl(['Уровень','Что делает','Адрес','Примеры','Чем проверять'],[
 ['Прикладной','смысл данных','—','HTTP, DNS, SSH, протокол MS SQL (TDS)','curl, dig, ssh, sqlcmd'],
 ['Транспортный','доставка до <b>программы</b>','порт (0–65535)','TCP, UDP','ss, nc'],
 ['Сетевой','доставка до <b>машины</b> через сети','IP-адрес','IP, ICMP (ping)','ping, ip route, traceroute'],
 ['Канальный','доставка в пределах одной сети','MAC-адрес','Ethernet, Wi-Fi','ip link']])}
<p>Это упрощённая модель TCP/IP (в учебниках — модель OSI из 7 уровней). Диагностика идёт <b>снизу вверх</b> или по цепочке подключения — так находят звено, которое рвётся.</p>
<h2>IP-адрес и маска</h2>
${C(`
$ ip -br a                       # кратко все интерфейсы
lo      UNKNOWN  127.0.0.1/8
eth0    UP       10.0.12.34/24
$ ip r                           # таблица маршрутов
default via 10.0.12.1 dev eth0   # всё «чужое» — на шлюз 10.0.12.1
10.0.12.0/24 dev eth0            # своя сеть — напрямую
`,'term')}
<p><b>/24</b> — сколько первых бит адреса описывают <b>сеть</b>. <code>10.0.12.34/24</code>: сеть <code>10.0.12.0</code>, в ней адреса от .0 до .255 (256 штук, 254 для машин: .0 — адрес сети, .255 — широковещательный). Машины одной сети общаются напрямую, в другие сети — через <b>шлюз</b> (default gateway).</p>
${tbl(['Запись','Маска','Адресов','Где встречается'],[['/32','255.255.255.255','1','один конкретный хост в правилах firewall'],['/24','255.255.255.0','256','типичная подсеть офиса или облака'],['/16','255.255.0.0','65 536','вся сеть VPC, сеть подов Kubernetes'],['/8','255.0.0.0','16,7 млн','10.0.0.0/8 — весь частный диапазон']])}
<h2>Частные адреса и NAT</h2>
${tbl(['Диапазон','Что это'],[
 ['<code>10.0.0.0/8</code>, <code>172.16.0.0/12</code>, <code>192.168.0.0/16</code>','<b>частные</b>: внутри офисов, облаков, Docker. Из интернета напрямую недоступны'],
 ['<code>127.0.0.0/8</code> (<code>127.0.0.1</code>, localhost)','<b>сама машина</b>. Пакет никуда не уходит'],
 ['<code>0.0.0.0</code>','при прослушивании — «на <b>всех</b> интерфейсах этой машины»'],
 ['всё остальное','публичные адреса интернета']])}
<p><b>NAT</b>: роутер подменяет частный адрес на свой публичный, когда машина ходит в интернет. Поэтому ноутбук дома (192.168.1.10) открывает сайты, но из интернета до него не достучаться — у него нет «белого» адреса. То же с WSL и Docker: у них свои внутренние сети за NAT.</p>
<h2>Порты</h2>
${tbl(['Порт','Кто обычно'],[['22','SSH'],['53','DNS'],['80 / 443','HTTP / HTTPS (nginx)'],['1433','MS SQL Server'],['1521','Oracle'],['5432','PostgreSQL'],['6379','Redis'],['3000, 8080','приложения (условно)']])}
<p>Порты до 1024 — «привилегированные»: слушать их может только root (или с особыми правами). Поэтому приложение слушает 3000, а на 80/443 стоит nginx.</p>
${BOX('127.0.0.1 или 0.0.0.0 — самая частая ловушка','<p>Программа «слушает порт» не вообще, а <b>на конкретном адресе</b>. <code>127.0.0.1:3000</code> — доступна <b>только с этой же машины</b>. <code>0.0.0.0:3000</code> — со всех интерфейсов, то есть и снаружи. Приложение на 127.0.0.1 за nginx — правильно и безопасно. Но если ты ждёшь подключения снаружи (из другого контейнера, с другого сервера), а оно слушает 127.0.0.1 — будет «Connection refused», хотя «всё запущено».</p>','warn')}
${C(`
$ ss -tlnp                 # t — TCP, l — слушающие, n — цифрами, p — процесс
State   Local Address:Port   Process
LISTEN  127.0.0.1:3000       users:(("node",pid=1950))      ← только локально
LISTEN  0.0.0.0:80           users:(("nginx",pid=812))      ← все интерфейсы
LISTEN  0.0.0.0:1433         users:(("sqlservr",pid=640))
`,'term')}
<h2>TCP и UDP</h2>
${tbl(['','TCP','UDP'],[['соединение','есть: рукопожатие перед данными','нет: просто отправил'],['надёжность','гарантирует доставку и порядок, переспрашивает потерянное','может потерять, перепутать'],['где','HTTP, SSH, базы данных — почти всё','DNS, видео/голос, метрики (statsd)']])}
${C(`
 клиент                 сервер
   │──── SYN ────────────▶│   «хочу соединиться с портом 1433»
   │◀─── SYN-ACK ─────────│   «давай» (если там кто-то слушает)
   │──── ACK ────────────▶│   соединение установлено (ESTABLISHED)
   │◀═══ данные ═════════▶│
`,'out')}
<p>Если на порту <b>никто не слушает</b>, сервер отвечает на SYN сразу отказом (RST) — это «Connection refused». Если пакет <b>выбросил firewall</b> или машины нет — ответа нет вообще, клиент ждёт до таймаута.</p>
<h2>Три ошибки — три разных диагноза</h2>
${tbl(['Ошибка','Что значит','Куда смотреть'],[
 ['<b>Connection refused</b>','машина доступна и ответила: на этом порту <b>никто не слушает</b> (или firewall отвечает отказом)','сервис запущен? <code>ss -tlnp</code>: порт и адрес (127.0.0.1?)'],
 ['<b>Connection timed out</b>','ответа нет совсем: пакеты <b>выбрасываются</b> по пути','firewall (свой, облака, сетевиков), маршрут, машина выключена'],
 ['<b>No route to host</b> / Network unreachable','непонятно, куда слать: нет маршрута','ip route, шлюз, VPN не подключён'],
 ['<b>Name or service not known</b>','не нашёлся IP по имени','DNS, /etc/hosts (модуль [[mod:dns]])']])}
<h2>Инструменты</h2>
${CMDS([['ip -br a','адреса интерфейсов'],['ip r','маршруты и шлюз по умолчанию'],['ss -tlnp','кто какие TCP-порты слушает (sudo — чтобы видеть процессы)'],['ss -tnp','установленные соединения'],['ping -c 4 host','доходит ли ICMP (часто <b>закрыт</b> firewall — это не значит, что машина недоступна)'],['traceroute host / mtr host','через какие узлы идёт и где обрывается'],['nc -zv host 1433','открыт ли TCP-порт (z — без данных, v — подробно)'],['curl -v http://host:3000/health','весь HTTP-разговор: подключение, заголовки, ответ'],['curl -s -o /dev/null -w "%{http_code} %{time_total}s\\n" url','только код и время ответа'],['curl -I https://site','только заголовки']])}
<h2>Лестница диагностики «не подключается к host:port»</h2>
${C(`
1. Имя → адрес        getent hosts db-01   (или dig db-01)     — резолвится ли
2. Маршрут            ping db-01 / traceroute db-01           — доходим ли до машины (ICMP может быть закрыт!)
3. Порт снаружи       nc -zv db-01 1433                       — refused? timeout? succeeded?
4. Порт изнутри       на db-01: ss -tlnp | grep 1433          — слушает? на 0.0.0.0 или 127.0.0.1?
5. Firewall           на db-01: sudo ufw status, правила облака — пускает ли
6. Само приложение    логи сервиса, логин/пароль, TLS         — сеть ок, проблема выше
`,'out')}
<p>Каждый шаг отвечает «да/нет» и делит проблему пополам. Обычно уже на шаге 3 по типу ошибки понятно, куда идти.</p>`,
memo:`<p>Выучи наизусть: «refused — никто не слушает, timeout — кто-то выбрасывает». И тренируй лестницу: возьми любой сервис (свой nginx, MS SQL в WSL) и пройди все 6 шагов, даже когда всё работает. Потом ломай по одному звену (остановить сервис, слушать на 127.0.0.1, закрыть ufw) и смотри, как меняется ответ на каждом шаге.</p>`,
traps:[
 ['SSH до сервера работает, значит, «сеть есть» — а docker login внутри сессии висит','Проверять связь с того хоста, откуда идёт запрос: ssh host, потом curl -sS -o /dev/null -w "%{http_code}" --max-time 10 https://registry/ изнутри','Это два разных маршрута. Таймаут самого ssh (kex_exchange_identification) — нет пути до сервера (VPN не поднят, другой сегмент). SSH есть, а curl изнутри висит — нет пути от сервера (например, из DMZ) до registry. А ответ 401/403 значит: сеть есть, просто нет авторизации.'],
 ['ping не проходит → «сервер лежит»','Проверить порт: nc -zv host 443 или curl','ICMP часто закрыт в облаках и firewall. Сайт при этом работает.'],
 ['Сервис запущен, порт «открыт» — а снаружи refused','ss -tlnp: если 127.0.0.1:порт — слушать на 0.0.0.0 (или нужном IP)','Слушающий 127.0.0.1 доступен только с самой машины.'],
 ['Timeout — «перезапущу сервис»','Искать firewall и маршрут','Таймаут — пакеты не доходят. Сервис может быть вполне жив.'],
 ['«Сеть сломалась» без проверки','Пройти лестницу: имя → маршрут → порт → слушает → firewall → приложение','Без проверки спор «у нас всё работает» бесконечен. Вывод nc -zv решает его за секунду.'],
 ['Открыть порт базы 1433 в интернет «для удобства»','База — только во внутренней сети или через VPN / SSH-туннель','Открытые базы находят боты за минуты и подбирают пароль sa.'],
 ['Путать /24 и «24 адреса»','/24 — 24 бита сети, адресов 2^(32−24) = 256','Префикс — число бит сети, а не число машин.']],
ex:[
 {t:'c',q:'Что находит машину в сети, а что — программу на этой машине?',o:['IP-адрес — машину, порт — программу','Порт — машину, IP — программу','MAC — программу','DNS — порт'],a:0,e:'IP + порт = сокет, конечная точка соединения.'},

lab:[
 {chk:'<p>В Windows адрес вида 192.168.x.x от домашнего роутера; в WSL — адрес внутренней сети WSL (часто 172.x.x.x), а его шлюз — сам Windows. Обе сети частные, наружу всё выходит через NAT.</p>',t:'Разведка своей сети (WSL и Windows): найди свой IP, маску, шлюз в WSL (<code>ip -br a</code>, <code>ip r</code>) и в Windows (<code>ipconfig</code> или <code>Get-NetIPConfiguration</code>). Почему адреса разные? Что из этого частные адреса?'},
 {t:'Кто слушает: выведи все слушающие порты в WSL с процессами. Запусти <code>python3 -m http.server 8000</code> и найди его. Запусти второй раз с <code>--bind 127.0.0.1</code> на 8001 и сравни строки в ss. Открой оба из браузера Windows (localhost:8000 и :8001).',sol:C(`sudo ss -tlnp
python3 -m http.server 8000 &
python3 -m http.server 8001 --bind 127.0.0.1 &
ss -tlnp | grep -E "8000|8001"   # 0.0.0.0:8000 и 127.0.0.1:8001
kill %1 %2`)},
 {t:'Три ошибки своими руками: получи «refused» (порт, где никто не слушает, на localhost), «timeout» (недоступный адрес, например 10.255.255.1:80) и «name not known» (несуществующее имя). Используй nc -zv с таймаутом <code>-w 3</code> и curl. Запиши, как выглядит каждая.',sol:C(`nc -zv -w 3 localhost 9999        # refused
nc -zv -w 3 10.255.255.1 80       # timeout
nc -zv -w 3 no-such-host.invalid 80
curl -v --max-time 3 http://localhost:9999`)},
 {t:'curl под лупой: <code>curl -v https://example.com</code> — найди в выводе DNS-адрес, подключение к порту 443, рукопожатие TLS, строку запроса, код ответа и заголовки. Потом выведи через <code>-w</code> время подключения и полное время.',sol:C(`curl -v https://example.com -o /dev/null
curl -s -o /dev/null -w "connect=%{time_connect}s total=%{time_total}s code=%{http_code}\\n" https://example.com`)},
 {t:'Маршрут: <code>traceroute 8.8.8.8</code> (или <code>mtr -rw 8.8.8.8</code>, или <code>tracert</code> в Windows). Сколько узлов до Google? Где «звёздочки» и что они значат?',sol:'<p>Звёздочки — узел не ответил на служебный пакет (часто так настроены роутеры). Если после них маршрут продолжается — это не обрыв.</p>'}],

/* perms · L1 · Пользователи, группы и права */
MOD({id:'perms',title:'Пользователи и права',sub:'Кто владеет файлом, кто может читать, писать, запускать — rwx, 755, chown, sudo.',
case:`<p>Выкатили новый сайт. Файлы на месте, nginx запущен, а в браузере <b>403 Forbidden</b>. Приложение пишет в лог <i>Permission denied</i>. SSH не принимает новый ключ. Коллега советует: «Да сделай <code>chmod 777</code>, и всё заработает». Работать будет — до первого взлома.</p><p class="goal"><b>Цель модуля:</b> видеть, от какого пользователя работает процесс и что ему разрешено, читать права с полувзгляда (755, 640, 600) и чинить любой <i>Permission denied</i> точечно, не открывая дыр.</p>`,
intro:`<p>Linux — многопользовательская система: на одном сервере работают люди (ты, коллега) и <b>сервисы</b> (nginx работает от пользователя <code>www-data</code>, postgres — от <code>postgres</code>). Каждый процесс запущен от какого-то пользователя, и ядро при <b>каждом</b> обращении к файлу проверяет: а можно ли ему?</p>
<p>Зачем это DevOps-у: половина ошибок на проде — <code>Permission denied</code>. Nginx не может прочитать статику, приложение не может писать лог, SSH не принимает ключ, потому что у файла «слишком открытые» права. Чинить это наугад через <code>chmod 777</code> — дыра в безопасности.</p>
<p>Главная идея: <mark>у файла есть владелец, группа и три набора прав — для владельца, для группы и для всех остальных</mark>.</p>`,
theory:`<h2>Пользователи и группы</h2>
${C(`
$ id
uid=1000(kostya) gid=1000(kostya) groups=1000(kostya),27(sudo),998(docker)
$ grep www-data /etc/passwd
www-data:x:33:33:www-data:/var/www:/usr/sbin/nologin
`,'term')}
${tbl(['Файл','Что там'],[
 ['<code>/etc/passwd</code>','пользователи: <code>имя:x:UID:GID:описание:домашняя папка:оболочка</code>. Читать могут все'],
 ['<code>/etc/shadow</code>','хэши паролей. Читает только root'],
 ['<code>/etc/group</code>','группы и кто в них состоит']])}
<ul><li><b>root</b> — UID 0. Ядро не проверяет для него обычные права.</li>
<li><b>Системные пользователи</b> (www-data, postgres, nobody) — UID меньше 1000, оболочка <code>/usr/sbin/nologin</code>: войти под ними нельзя, они существуют только чтобы сервис работал с минимумом прав.</li>
<li><b>Обычные</b> — UID от 1000.</li></ul>
<h2>Как читать права</h2>
${C(`
$ ls -l deploy.sh
-rwxr-x--- 1 deploy devops 512 Nov 24 deploy.sh
│└┬┘└┬┘└┬┘   └─┬──┘ └─┬──┘
│ │  │  │      │      └ группа-владелец
│ │  │  │      └ пользователь-владелец
│ │  │  └ остальные (others): ---  ничего
│ │  └ группа (group):        r-x  читать и запускать
│ └ владелец (user):          rwx  всё
└ тип: - файл, d папка, l ссылка
`,'out')}
${tbl(['Буква','Число','Для файла','Для папки'],[
 ['<b>r</b>','4','читать содержимое','видеть список имён (ls)'],
 ['<b>w</b>','2','менять содержимое','создавать, удалять, переименовывать файлы <b>внутри</b>'],
 ['<b>x</b>','1','запускать как программу','<mark>входить</mark> (cd) и обращаться к файлам внутри']])}
<p>Число — сумма: <code>rwx</code> = 4+2+1 = <b>7</b>, <code>r-x</code> = 4+1 = <b>5</b>, <code>rw-</code> = 4+2 = <b>6</b>, <code>r--</code> = <b>4</b>. Три цифры — владелец, группа, остальные.</p>
${tbl(['Права','Буквами','Типично для'],[
 ['<code>755</code>','rwxr-xr-x','программы, скрипты, папки'],
 ['<code>644</code>','rw-r--r--','обычные файлы, конфиги'],
 ['<code>600</code>','rw-------','секреты: приватный SSH-ключ, .env с паролями'],
 ['<code>700</code>','rwx------','личные папки: <code>~/.ssh</code>'],
 ['<code>640</code>','rw-r-----','конфиг, который читает сервис через группу'],
 ['<code>777</code>','rwxrwxrwx','<b>никогда</b> на проде — любой может всё']])}
${BOX('Как ядро проверяет доступ','<p>Ты владелец? → берутся права владельца, и всё. Иначе ты в группе файла? → права группы. Иначе → права остальных. Проверяется <b>только один</b> набор: если владельцу дать <code>---</code>, а остальным <code>rwx</code>, владелец не прочитает свой же файл.</p><p>И ещё: чтобы открыть <code>/opt/app/conf/app.yml</code>, нужно право <b>x на каждую папку</b> пути: /opt, /opt/app, /opt/app/conf. Проверить весь путь разом: <code>namei -l /opt/app/conf/app.yml</code>.</p>','deep')}
<h2>Менять права и владельца</h2>
${CMDS([['chmod 640 app.conf','права числом'],['chmod u+x run.sh','добавить x владельцу (u — user, g — group, o — others, a — all)'],['chmod go-w file','убрать запись у группы и остальных'],['chmod -R 755 dir/','рекурсивно (осторожно: и файлам даст x)'],['chown deploy file','сменить владельца'],['chown deploy:devops file','владелец и группа'],['chown -R www-data:www-data /var/www/site','рекурсивно'],['chgrp devops file','только группа']])}
<p>Сменить владельца может только root. Сменить права — владелец или root.</p>
<h2>Пользователи и sudo</h2>
${CMDS([['whoami','кто я'],['id user','UID, GID и группы'],['sudo команда','выполнить от root (пароль — твой, а не root)'],['sudo -i','войти в оболочку root'],['sudo -u postgres psql','выполнить от другого пользователя'],['adduser deploy','создать пользователя (Debian/Ubuntu, интерактивно)'],['useradd -m -s /bin/bash deploy','то же, вручную: -m создать домашнюю папку'],['usermod -aG docker deploy','добавить в группу (<b>-a</b> обязательно!)'],['passwd deploy','задать пароль'],['visudo','безопасно править /etc/sudoers (проверяет синтаксис)']])}
<p>Кто может делать sudo: в Ubuntu — участники группы <code>sudo</code> (в RHEL — <code>wheel</code>) и те, кто прописан в <code>/etc/sudoers</code> или <code>/etc/sudoers.d/</code>. Новая группа начинает действовать <mark>после перелогина</mark> — в текущей сессии <code>id</code> её ещё не покажет.</p>
<h2>Особые биты</h2>
${tbl(['Бит','Видно как','Что делает','Пример'],[
 ['setuid (4000)','<code>-rwsr-xr-x</code>','программа выполняется с правами <b>владельца файла</b>','<code>/usr/bin/passwd</code> — меняет /etc/shadow от root'],
 ['setgid на папке (2000)','<code>drwxrwsr-x</code>','новые файлы получают <b>группу папки</b>','общая папка команды'],
 ['sticky (1000)','<code>drwxrwxrwt</code>','удалять файл может только его владелец','<code>/tmp</code>']])}
<p><b>umask</b> — какие права <i>отнять</i> у новых файлов. Обычно <code>022</code>: файлы создаются 644, папки 755.</p>`,
memo:`<p>Тренируй перевод туда-обратно: увидел <code>rw-r-----</code> — скажи «640, владелец читает и пишет, группа читает, остальным ничего». Увидел <code>Permission denied</code> — задай три вопроса: <b>кто</b> (от какого пользователя процесс), <b>что</b> (права и владелец файла), <b>путь</b> (есть ли x на всех папках).</p>`,
traps:[
 ['chmod 777, «чтобы заработало»','Выдать нужное право нужному субъекту: chown на пользователя сервиса + 640/750','777 даёт любому процессу на сервере писать в файл. Взломанный сервис сможет подменить скрипт или конфиг.'],
 ['usermod -G docker deploy','usermod -aG docker deploy','Без -a список групп заменяется целиком: пользователь вылетит из sudo и всех остальных групп.'],
 ['sudo echo "1" > /etc/sysctl.d/x.conf → Permission denied','echo "1" | sudo tee /etc/sysctl.d/x.conf','Перенаправление > делает твоя оболочка (не root) до запуска sudo. tee открывает файл уже от root.'],

ex:[
 {t:'c',q:'Что означает <code>rwx</code> в правах файла?',o:['Чтение, запись, выполнение','Root, write, execute','Read, wait, exit','Удалённый доступ, запись, обмен'],a:0,e:'r — read (4), w — write (2), x — execute (1).'},

 {t:'c',q:'Что значит <code>chmod 755 script.sh</code>?',o:['Владелец — всё; группа и остальные — читать и запускать','Все могут всё','Только владелец может читать','Владелец читает, остальные пишут'],a:0,e:'7 = rwx, 5 = r-x. Стандарт для скриптов и программ.'},
 {t:'c',q:'Право <b>x</b> на <b>папку</b> даёт…',o:['Войти в неё и обращаться к файлам внутри','Запустить папку как программу','Удалить папку','Видеть список файлов'],a:0,e:'Для папки x = «проход». Список имён даёт r, а создание и удаление внутри — w.'},
 {t:'c',q:'Где хранятся хэши паролей пользователей?',o:['/etc/shadow','/etc/passwd','/etc/group','/root/.passwords'],a:0,e:'/etc/passwd читают все, поэтому хэши вынесли в /etc/shadow (доступ только root).'},
 {t:'c',q:'У пользователя <code>www-data</code> оболочка <code>/usr/sbin/nologin</code>. Зачем?',o:['Под ним нельзя войти — он нужен только для работы сервиса','Это ошибка установки','Чтобы он работал быстрее','Чтобы скрыть его от ls'],a:0,e:'Системные пользователи существуют для изоляции сервисов. Интерактивный вход им не нужен.'},
 {t:'c',q:'У root UID равен…',o:['0','1','1000','65534'],a:0,e:'UID 0 — суперпользователь. 65534 — обычно nobody, 1000 — первый обычный пользователь.'},
 {t:'i',q:'Впиши права числом для приватного SSH-ключа (читать и писать может только владелец).',a:['600','0600'],ph:'…',e:'rw------- = 600. С более открытыми правами ssh ключ не примет.'},
 {t:'i',q:'Впиши команду: сделать владельцем <code>/var/www/site</code> и всего внутри пользователя и группу <code>www-data</code>.',a:['chown -R www-data:www-data /var/www/site','sudo chown -R www-data:www-data /var/www/site','chown -R www-data: /var/www/site','sudo chown -R www-data: /var/www/site'],ph:'chown …',e:'-R — рекурсивно, user:group через двоеточие. Нужен root, поэтому обычно через sudo.'},
 {t:'i',q:'Впиши команду: добавить пользователя <code>deploy</code> в группу <code>docker</code>, не выкидывая его из остальных групп.',a:['usermod -aG docker deploy','sudo usermod -aG docker deploy','gpasswd -a deploy docker','sudo gpasswd -a deploy docker'],ph:'usermod …',e:'-a (append) + -G (группы). Без -a все прочие группы будут заменены.'},
 {t:'i',q:'Впиши команду: добавить право на выполнение только владельцу файла <code>run.sh</code> (буквами).',a:['chmod u+x run.sh'],ph:'chmod …',e:'u — владелец, + — добавить, x — выполнение. chmod +x дал бы x всем трём.'},

 {t:'c',g:'prac',q:'Nginx отдаёт 403 на <code>/srv/site/index.html</code>. Права файла 644, а у <code>/srv/site</code> — <code>drwx------ root root</code>. В чём причина?',o:['У www-data нет права x на папку — он не может в неё войти','Файлу нужно 777','Nginx не умеет читать /srv','Нужно перезагрузить сервер'],a:0,e:'Права папки 700: остальным (www-data) ни r, ни x. Чинить: chmod 755 /srv/site или сделать группу www-data с r-x.'},
 {t:'c',g:'prac',q:'Ты добавил себя в группу <code>docker</code>, но <code>docker ps</code> всё равно пишет <i>permission denied … docker.sock</i>. Почему?',o:['Новая группа применяется только после перелогина','Docker не установлен','Нужно chmod 777 docker.sock','Группа docker не существует'],a:0,e:'Группы процесса задаются при входе. Выйди и зайди снова (или newgrp docker). chmod 777 на сокет — плохая идея.'},

 {t:'s',g:'job',q:'Приложение пишет <i>Permission denied</i> при записи в <code>/opt/app/logs/app.log</code>. Собери порядок диагностики.',p:['Узнать, от какого пользователя работает процесс: ps -o user= -p PID','Посмотреть права и владельца файла: ls -l /opt/app/logs/app.log','Проверить x на всех папках пути: namei -l /opt/app/logs/app.log','Выдать минимальное право: chown appuser /opt/app/logs (а не 777)'],e:'Кто → что → путь → точечное исправление.'},
 {t:'c',g:'job',q:'Нужна общая папка <code>/srv/shared</code> для группы <code>devops</code>, чтобы все новые файлы автоматически были с группой devops. Что поставить?',o:['chgrp devops /srv/shared и chmod 2775 /srv/shared (setgid)','chmod 777 /srv/shared','chmod 1777 /srv/shared','chown root /srv/shared'],a:0,e:'setgid на папке (2xxx) — новые файлы наследуют группу папки. 775 — группа может писать.'},
 {t:'c',g:'job',q:'Как безопасно дать пользователю <code>deploy</code> перезапускать только nginx через sudo?',o:['Файл в /etc/sudoers.d/ (через visudo -f) с правилом только на systemctl restart nginx','Добавить deploy в группу sudo','Дать deploy пароль root','chmod 4755 /usr/bin/systemctl'],a:0,e:'Принцип минимальных прав: deploy ALL=(root) NOPASSWD: /usr/bin/systemctl restart nginx. visudo проверит синтаксис — ошибка в sudoers может отрезать sudo совсем.'}],

 {t:'Найди в системе все файлы с setuid-битом и объясни, зачем он нужен хотя бы у <code>passwd</code> и <code>sudo</code>.',h:'<p>У find есть <code>-perm -4000</code>.</p>',sol:C(`find / -perm -4000 -type f 2>/dev/null`)+'<p>passwd запускает обычный пользователь, но писать нужно в /etc/shadow (только root). setuid запускает программу с правами владельца файла — root.</p>'}],
qa:[

 ['Что значат r, w, x для папки?','r — видеть список имён, w — создавать/удалять/переименовывать файлы внутри, x — входить в папку и обращаться к файлам по имени.'],
 ['Почему chmod 777 — плохо?','Любой процесс на сервере сможет менять файл. Взломанный сервис подменит скрипт или конфиг. Правильно — выдать доступ конкретному пользователю/группе.'],

/* pkgs · L1 · Пакеты: apt, dpkg, репозитории, ключи, версии, обновления безопасности */
MOD({id:'pkgs',title:'Пакеты: apt, репозитории, версии',sub:'Как софт попадает на сервер, откуда, какой версии — и как обновлять, ничего не сломав.',
case:`<p>Утром приходит новость: в OpenSSL нашли критическую уязвимость, нужно срочно обновить все серверы. Ты делаешь <code>apt upgrade</code> — и заодно обновляется ещё 140 пакетов, среди них Postgres, и прод встаёт. На другом сервере коллега пытается поставить Docker: <code>apt install docker-ce</code> → <i>Unable to locate package</i>. В интернете советуют «просто выполни <code>curl https://… | sudo bash</code>». А сканер безопасности ругается, что у вас «старая версия OpenSSL 3.0.2», хотя вы обновлялись вчера.</p><p class="goal"><b>Цель модуля:</b> понимать, откуда берутся программы на сервере, ставить их из правильных источников, точечно обновлять нужное (особенно безопасность), фиксировать версии и не путаться в «старых» номерах версий в Ubuntu.</p>`,
intro:`<p><b>Пакет</b> — это архив с программой: файлы, которые надо разложить по системе (<code>/usr/bin</code>, <code>/etc</code>…), плюс описание — версия, от каких других пакетов зависит, какие скрипты выполнить при установке. В Ubuntu пакеты — файлы <code>.deb</code>.</p>
<p><b>Репозиторий</b> — сервер-склад пакетов с подписанным списком всего, что там лежит. <b>apt</b> — программа, которая знает, какие склады подключены, скачивает список, находит нужный пакет и <mark>сама ставит всё, от чего он зависит</mark>.</p>
<p>Зачем это DevOps-у: любой сервер, Dockerfile и CI-раннер начинается с установки пакетов. Ошибка здесь — это и сломанный прод после «обновил всё подряд», и дыра в безопасности из-за пакета из непроверенного источника.</p>`,
theory:`<h2>Как всё устроено</h2>
${C(`
 Репозитории (archive.ubuntu.com, download.docker.com …)
        │  список пакетов, подписанный ключом GPG
        ▼
 apt update      → скачать свежие СПИСКИ (сами программы не трогает)
        ▼
 /var/lib/apt/lists/   ← локальная копия списков
        ▼
 apt install nginx → найти пакет + зависимости → скачать .deb → dpkg распаковывает и настраивает
`,'out')}
<p><b>dpkg</b> — нижний уровень: ставит и удаляет конкретный <code>.deb</code>, но зависимостей не ищет. <b>apt</b> — верхний: работает с репозиториями и зависимостями, а для самой установки вызывает dpkg.</p>
<h2>Основные команды</h2>
${CMDS([['sudo apt update','обновить <b>списки</b> пакетов (делать перед install/upgrade)'],['sudo apt install nginx','установить с зависимостями'],['sudo apt install nginx=1.24.0-2ubuntu7','установить конкретную версию'],['sudo apt remove nginx','удалить программу, конфиги в /etc оставить'],['sudo apt purge nginx','удалить вместе с конфигами'],['sudo apt autoremove','удалить зависимости, которые больше никому не нужны'],['apt list --upgradable','что можно обновить'],['sudo apt upgrade','обновить всё установленное (ничего не удаляет)'],['sudo apt install --only-upgrade openssl','обновить только один пакет'],['apt search nginx','найти пакет'],['apt show nginx','описание, версия, зависимости'],['apt policy nginx','какая версия стоит, какая доступна и из какого репозитория']])}
${CMDS([['dpkg -l | grep nginx','установлен ли пакет и какая версия'],['dpkg -L nginx','какие файлы поставил пакет'],['dpkg -S /usr/sbin/nginx','какому пакету принадлежит файл'],['sudo apt install ./app_1.0_amd64.deb','поставить скачанный .deb <b>с зависимостями</b> (./ обязательно)']])}
<h2>Откуда apt берёт пакеты</h2>
${C(`
$ cat /etc/apt/sources.list.d/ubuntu.sources
Types: deb
URIs: http://archive.ubuntu.com/ubuntu/
Suites: noble noble-updates noble-backports
Components: main restricted universe multiverse
Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
`,'term')}
${tbl(['Что','Значит'],[
 ['<b>noble</b>','кодовое имя Ubuntu 24.04 (модуль [[mod:linux]]): пакеты на момент выхода'],
 ['<b>noble-updates</b>','исправления ошибок после выхода'],
 ['<b>noble-security</b>','<mark>патчи безопасности</mark> (отдельный адрес security.ubuntu.com)'],
 ['<b>main</b> / <b>restricted</b>','поддерживает Canonical: открытое / проприетарные драйверы'],
 ['<b>universe</b> / <b>multiverse</b>','поддерживает сообщество / несвободные лицензии'],
 ['<b>Signed-By</b>','ключ, которым проверяется подпись списка: подменённый репозиторий не пройдёт']])}
<p>В Ubuntu 24.04 источники лежат в <code>/etc/apt/sources.list.d/*.sources</code>; в старых версиях — одной строкой в <code>/etc/apt/sources.list</code>.</p>
<h2>Сторонний репозиторий — правильно</h2>
<p>Свежий Docker, PostgreSQL новее, чем в Ubuntu, GitLab Runner ставят из репозиториев их разработчиков. Порядок всегда одинаковый:</p>
${C(`# 1. ключ разработчика — в отдельный файл
sudo install -m 0755 -d /etc/apt/keyrings
sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
# 2. источник, который разрешено проверять только этим ключом (signed-by)
echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" | sudo tee /etc/apt/sources.list.d/docker.list
# 3. обновить списки и ставить
sudo apt update && sudo apt install docker-ce`)}
${BOX('Почему не curl … | sudo bash','<p>Такая команда выполняет от root скрипт, которого ты не видел, прямо из интернета. Если сайт взломан или адрес с опечаткой — ты сам отдал серверу команду. Минимум — скачать скрипт, прочитать, потом запустить. Лучше — репозиторий с ключом, как выше: каждый пакет проверяется подписью. Старый способ <code>apt-key add</code> устарел: ключ становился доверенным <b>для всех</b> репозиториев сразу.</p>','warn')}
<h2>Версии в Ubuntu: почему «старая» версия может быть свежей</h2>
${C(`
$ apt policy openssl
openssl:
  Installed: 3.0.13-0ubuntu3.4
  Candidate: 3.0.13-0ubuntu3.4
`,'term')}
<p>В LTS-версии Ubuntu номер версии программы <b>заморожен</b> (3.0.13), а исправления безопасности <mark>переносятся внутрь той же версии</mark> (backport). Меняется только хвост: <code>-0ubuntu3.4</code>. Поэтому сканер, который смотрит лишь на «3.0.13», может кричать об уязвимости, которая уже закрыта. Проверять надо по базе Ubuntu (ubuntu.com/security/cves), а не по номеру upstream-версии.</p>
<h2>Обновления без сюрпризов</h2>
${CMDS([['apt list --upgradable','сначала посмотреть, что обновится'],['sudo apt install --only-upgrade openssl libssl3t64','срочно закрыть одну уязвимость, не трогая остальное'],['sudo apt-mark hold postgresql-16','запретить обновление пакета (unhold — снять)'],['apt-mark showhold','что заморожено'],['cat /var/run/reboot-required','нужна ли перезагрузка (обновилось ядро или libc)'],['systemctl status unattended-upgrades','автоматические обновления безопасности']])}
<p><b>unattended-upgrades</b> в Ubuntu по умолчанию сам ставит патчи безопасности. Из-за него бывает ошибка <i>Could not get lock /var/lib/dpkg/lock-frontend</i>: идёт фоновое обновление. Решение — подождать (<code>ps aux | grep -i apt</code>), а <mark>не удалять lock-файл</mark> — так можно сломать базу пакетов.</p>
<h2>То же в других дистрибутивах и в Docker</h2>
${tbl(['Действие','Ubuntu/Debian','RHEL/Rocky','Alpine'],[['обновить списки','<code>apt update</code>','<code>dnf makecache</code>','<code>apk update</code>'],['установить','<code>apt install x</code>','<code>dnf install x</code>','<code>apk add x</code>'],['удалить','<code>apt remove x</code>','<code>dnf remove x</code>','<code>apk del x</code>'],['чей файл','<code>dpkg -S</code>','<code>rpm -qf</code>','<code>apk info --who-owns</code>']])}
${C(`# Dockerfile: update и install — в одном RUN, списки — удалить
RUN apt-get update \\
 && apt-get install -y --no-install-recommends curl ca-certificates \\
 && rm -rf /var/lib/apt/lists/*`)}
<p>В скриптах и Dockerfile пишут <code>apt-get</code>: у него стабильный вывод, а <code>apt</code> рассчитан на человека (сам предупреждает об этом).</p>`,
memo:`<p>Для любого пакета на своём сервере научись отвечать на четыре вопроса: какая версия стоит (<code>apt policy</code>), из какого репозитория (там же), какие файлы он поставил (<code>dpkg -L</code>), кто от него зависит. И правило обновления: сначала <code>apt list --upgradable</code>, потом решение — обновлять всё, точечно или заморозить.</p>`,

MOD({id:'procs',title:'Процессы и сигналы',sub:'PID, дерево процессов, kill и сигналы, фон и nohup, зомби, коды 137 и 143.',
case:`<p>Вечер, ты по SSH запускаешь на сервере перенос данных — скрипт на 40 минут. Через 10 минут закрываешь ноутбук и едешь домой. Утром оказывается, что скрипт умер на середине вместе с твоей SSH-сессией, и половина данных перенесена. Днём другая история: приложение зависло, коллега делает <code>kill -9</code>, и после этого сервис полчаса восстанавливает повреждённый кэш. А в Kubernetes под постоянно перезапускается с непонятным <i>exit code 137</i>.</p><p class="goal"><b>Цель модуля:</b> видеть, какие процессы работают и кто кого запустил, останавливать их правильно (вежливо, а не «топором»), запускать долгие задачи так, чтобы они пережили закрытие терминала, и читать коды завершения вроде 137 и 143.</p>`,
intro:`<p><b>Процесс</b> — это запущенная программа. Файл <code>/usr/sbin/nginx</code> на диске — просто программа; когда её запустили, ядро создаёт процесс: выделяет память, даёт номер (<b>PID</b>) и начинает выполнять. Одну программу можно запустить много раз — будет много процессов.</p>
<p>Процессами нужно уметь управлять, потому что на сервере всё — процесс: nginx, база, твоё приложение, твоя SSH-сессия и даже bash, в котором ты печатаешь. Остановить, перезапустить, перечитать конфиг, понять, почему что-то «висит», — это всё работа с процессами.</p>
<p>Общаются с процессом через <mark>сигналы</mark> — короткие уведомления от ядра: «заверши работу», «перечитай конфиг», «умри немедленно». Правильный сигнал — это разница между аккуратной остановкой и потерянными данными.</p>`,
theory:`<h2>PID, родитель и дерево</h2>
<p>У каждого процесса есть <b>PID</b> (номер) и <b>PPID</b> — номер родителя, того, кто его запустил. Все процессы растут из одного корня — <b>PID 1</b> (в Ubuntu это systemd).</p>
${C(`
$ pstree -p | head
systemd(1)─┬─nginx(812)─┬─nginx(813)
           │            └─nginx(814)
           ├─sshd(640)───sshd(2101)───bash(2120)───pstree(2310)
           └─node(950)
`,'term')}
<p>Видно: ты (bash 2120) запущен через sshd, nginx — главный процесс 812 и два рабочих (worker). Когда SSH-сессия закрывается, её дочерние процессы по умолчанию получают сигнал и завершаются — именно так умер скрипт из ситуации.</p>
<h2>Как смотреть процессы</h2>
${CMDS([['ps aux','все процессы: пользователь, PID, %CPU, %MEM, состояние, команда'],['ps -ef','то же в другом формате, с PPID'],['ps aux | grep node','найти процесс по имени'],['pgrep -a node','то же короче: PID + команда'],['pstree -p','дерево с PID'],['top / htop','живой список, сортировка по CPU/памяти (подробно — модуль «Сервер тормозит»)'],['ls /proc/950/','всё о процессе 950: cmdline, environ, fd (открытые файлы)'],['cat /proc/950/status','состояние, память, PPID, UID']])}
${C(`
$ ps aux | head -3
USER   PID %CPU %MEM    VSZ   RSS TTY  STAT START  TIME COMMAND
root     1  0.0  0.1 167k 12k   ?    Ss   Nov24  0:03 /sbin/init
www-data 813 0.2 0.3  56k  9k   ?    S    Nov24  1:12 nginx: worker process
`,'term')}
${tbl(['STAT','Что значит'],[
 ['<b>R</b>','выполняется или готов выполняться'],
 ['<b>S</b>','спит, ждёт события (обычное состояние сервиса, ждущего запросов)'],
 ['<b>D</b>','непрерываемый сон — ждёт диск/сеть. Не убивается даже kill -9, пока не дождётся. Много D — проблема с диском или NFS'],
 ['<b>Z</b>','зомби: процесс завершился, но родитель ещё не «забрал» его код возврата'],
 ['<b>T</b>','остановлен (Ctrl+Z или SIGSTOP)']])}
<h2>Сигналы</h2>
${tbl(['Сигнал','Номер','Что значит','Кто шлёт'],[
 ['<b>SIGTERM</b>','15','«пожалуйста, завершись»: процесс может доделать работу, закрыть соединения, сохранить данные','<code>kill PID</code> (по умолчанию), <code>systemctl stop</code>, <code>docker stop</code>, Kubernetes'],
 ['<b>SIGKILL</b>','9','убить немедленно. Процесс не может ни перехватить, ни отказаться — ядро просто удаляет его','<code>kill -9 PID</code>, OOM killer (кончилась память)'],
 ['<b>SIGINT</b>','2','прерывание — то же, что Ctrl+C','терминал'],
 ['<b>SIGHUP</b>','1','«терминал закрылся»; многие демоны понимают его как «перечитай конфиг»','закрытие SSH, <code>kill -HUP</code>, <code>nginx -s reload</code>'],
 ['<b>SIGSTOP / SIGCONT</b>','19 / 18','заморозить / разморозить','Ctrl+Z (SIGTSTP), <code>kill -STOP</code>']])}
${BOX('Почему не надо сразу kill -9','<p>SIGTERM — вежливая просьба: приложение дописывает файл, завершает транзакцию, отвечает текущим клиентам, удаляет lock-файл. SIGKILL — выдернуть шнур: ничего из этого не случится, могут остаться битые данные и lock-файлы, из-за которых сервис потом не запустится. Порядок: <code>kill PID</code> → подождать несколько секунд → только если не помогло, <code>kill -9 PID</code>. Так же работают <code>docker stop</code> (SIGTERM, через 10 секунд SIGKILL) и Kubernetes (через 30 секунд).</p>','warn')}
${CMDS([['kill 950','SIGTERM процессу 950'],['kill -9 950','SIGKILL — последнее средство'],['kill -HUP 812','SIGHUP: многие сервисы перечитают конфиг'],['pkill node','сигнал всем процессам с именем node'],['killall nginx','то же по точному имени'],['kill -l','список всех сигналов']])}
<h2>Коды завершения от сигналов</h2>
<p>Если процесс убит сигналом, его код возврата = <mark>128 + номер сигнала</mark>. Это видно в <code>echo $?</code>, в <code>docker ps -a</code> и в Kubernetes:</p>
${tbl(['Код','Значит','Типичная причина'],[['<b>137</b>','128 + 9 → SIGKILL','кончилась память (OOM killer), или не завершился за отведённое время после SIGTERM'],['<b>143</b>','128 + 15 → SIGTERM','штатная остановка (docker stop, деплой)'],['<b>130</b>','128 + 2 → SIGINT','прервали Ctrl+C']])}
<h2>Передний план, фон и жизнь после выхода</h2>
${CMDS([['long_task &','запустить в фоне, терминал свободен'],['jobs','фоновые задачи этой оболочки'],['Ctrl+Z, потом bg','приостановить и продолжить в фоне'],['fg %1','вернуть задачу 1 на передний план'],['nohup ./migrate.sh > migrate.log 2>&1 &','запустить так, чтобы пережил закрытие SSH (игнорирует SIGHUP)'],['disown','отвязать уже запущенную фоновую задачу от оболочки'],['tmux / screen','терминал, который живёт на сервере после отключения: ушёл, вернулся — всё на месте']])}
<p>Для долгих ручных задач лучший выбор — <b>tmux</b>: <code>tmux new -s migr</code>, запустил, отключился (Ctrl+B, затем D), вернулся <code>tmux attach -t migr</code>. Для постоянных сервисов — не фон и не nohup, а systemd (модуль [[mod:systemd]]).</p>
${BOX('Зомби и сироты','<p><b>Зомби</b> (Z) — процесс уже завершился, от него осталась строчка в таблице процессов с кодом возврата, который родитель должен прочитать. Убить зомби нельзя — он уже мёртв; лечится исправлением или перезапуском <b>родителя</b>. Пара зомби — не страшно, тысячи — родитель сломан.</p><p><b>Сирота</b> — процесс, у которого умер родитель. Его «усыновляет» PID 1 и потом корректно убирает. В контейнере PID 1 — твоё приложение, и если оно не умеет убирать за детьми, копятся зомби; поэтому иногда используют <code>docker run --init</code>.</p>','deep')}
<h2>Приоритет</h2>
${CMDS([['nice -n 10 ./backup.sh','запустить с пониженным приоритетом (от −20 до 19, больше = «вежливее»)'],['renice -n 15 -p 950','изменить приоритет уже работающего']])}
<p>Тяжёлый бэкап или сжатие логов на проде запускай через <code>nice</code>, чтобы оно не отнимало CPU у сайта.</p>`,
memo:`<p>Открой два терминала. В первом запускай процессы (<code>sleep 1000</code>, скрипт с бесконечным циклом), во втором находи их (<code>pgrep</code>, <code>pstree</code>) и шли разные сигналы. После каждого — <code>echo $?</code> в первом и посчитай: 128 + номер сигнала. Через полчаса коды 130, 137, 143 станут для тебя очевидными.</p>`,
traps:[
 ['Сразу kill -9, «чтобы точно»','kill PID → подождать → kill -9 только если не завершился','SIGKILL не даёт приложению закрыть транзакции и файлы. Остаются битые данные и lock-файлы.'],
 ['Запустить долгую задачу по SSH и закрыть ноутбук','tmux (или nohup … &) и только потом отключаться','При закрытии SSH процессы сессии получают SIGHUP и завершаются.'],
 ['kill -9 зомби-процессу','Разобраться с родителем (PPID) — перезапустить или починить его','Зомби уже мёртв, убивать нечего. Убирает его только родитель (или PID 1 после смерти родителя).'],
 ['ps aux | grep nginx показывает строку grep nginx и кажется, что nginx жив','pgrep -a nginx (или grep [n]ginx)','grep находит сам себя. Если nginx не запущен, останется только строка grep.'],
 ['Exit code 137 — «приложение упало с ошибкой»','137 = 128 + 9: процесс убили SIGKILL — чаще всего OOM killer','Ищи не баг в коде, а нехватку памяти или слишком маленький лимит: dmesg | grep -i oom, лимиты контейнера.'],
 ['Сервис запустил через nohup … & и считает, что всё готово','Постоянные сервисы — через systemd','nohup не перезапустит процесс после падения и не поднимет после перезагрузки.']],
ex:[
 {t:'c',q:'Что такое PID?',o:['Уникальный номер процесса','Номер порта','Идентификатор пользователя','Номер файла'],a:0,e:'Process ID. PPID — PID родителя, UID — пользователь.'},
 {t:'c',q:'Какой процесс имеет PID 1 в Ubuntu?',o:['systemd (init)','bash','kernel','sshd'],a:0,e:'Первый процесс, запускаемый ядром. Он предок всех остальных и «усыновляет» сирот.'},
 {t:'c',q:'Какой сигнал посылает <code>kill PID</code> без флагов?',o:['SIGTERM (15)','SIGKILL (9)','SIGHUP (1)','SIGINT (2)'],a:0,e:'По умолчанию — вежливый SIGTERM. Процесс может корректно завершиться.'},
 {t:'c',q:'Чем SIGKILL отличается от SIGTERM?',o:['SIGKILL нельзя перехватить — процесс удаляется сразу, без уборки','SIGKILL — вежливая просьба','Ничем, разные названия','SIGTERM нельзя перехватить'],a:0,e:'SIGTERM процесс может обработать и аккуратно завершиться. SIGKILL выполняет ядро без участия процесса.'},
 {t:'c',q:'Что делает Ctrl+Z?',o:['Приостанавливает процесс (не убивает)','Убивает процесс','Отправляет в фон и продолжает','Закрывает терминал'],a:0,e:'Процесс замораживается (состояние T). Дальше bg — продолжить в фоне, fg — вернуть.'},
 {t:'c',q:'Процесс в состоянии <b>Z</b> — это…',o:['Зомби: завершился, но родитель не забрал код возврата','Процесс, ждущий диск','Остановленный Ctrl+Z','Процесс с высшим приоритетом'],a:0,e:'Зомби уже мёртв, занимает только строку в таблице процессов.'},
 {t:'c',q:'Код завершения <b>143</b> означает…',o:['Процесс завершён сигналом SIGTERM (128+15)','Нехватку памяти','Ошибку синтаксиса','Успех'],a:0,e:'128 + номер сигнала. 143 — штатная остановка, например docker stop.'},
 {t:'i',q:'Впиши: отправить процессу 4242 сигнал SIGKILL.',a:['kill -9 4242','kill -KILL 4242','kill -SIGKILL 4242','kill -s KILL 4242','kill -s SIGKILL 4242'],ph:'kill …',e:'Последнее средство, когда SIGTERM не помог.'},
 {t:'i',q:'Впиши: найти PID и командную строку всех процессов node (одной короткой командой).',a:['pgrep -a node','pgrep -af node','pgrep -la node'],ph:'pgrep …',e:'pgrep -a печатает PID и полную команду. Не находит сам себя, в отличие от ps | grep.'},
 {t:'i',q:'Впиши: запустить <code>./migrate.sh</code> так, чтобы он пережил закрытие SSH, а вывод и ошибки шли в <code>migrate.log</code>.',a:['nohup ./migrate.sh > migrate.log 2>&1 &','nohup ./migrate.sh &> migrate.log &'],ph:'nohup …',e:'nohup — игнорировать SIGHUP, & — в фон, перенаправление — чтобы вывод не терялся. Ещё лучше — tmux.'},
 {t:'i',q:'Впиши: попросить nginx (главный процесс PID 812) перечитать конфиг через сигнал.',a:['kill -HUP 812','kill -1 812','kill -SIGHUP 812','kill -s HUP 812'],ph:'kill …',e:'nginx по SIGHUP перечитывает конфиг без остановки. То же делает nginx -s reload.'},
 {t:'s',q:'Собери правильный порядок остановки зависшего приложения.',p:['Найти PID: pgrep -a app','Вежливо: kill PID (SIGTERM)','Подождать несколько секунд и проверить: pgrep app','Если всё ещё жив — kill -9 PID'],e:'Сначала дать шанс завершиться аккуратно, SIGKILL — последним.'},
 {t:'r',q:'Почему скрипт не завершился?',code:`$ sudo kill -9 3311
$ ps -o pid,stat,cmd -p 3311
  PID STAT CMD
 3311 D    cp /data/big.img /mnt/nfs/`,lang:'term',o:['Состояние D: процесс ждёт ввод-вывод (NFS), сигналы доставятся после','kill -9 не работает под sudo','Процесс — зомби','Неверный PID'],a:0,e:'В непрерываемом сне процесс не обрабатывает даже SIGKILL. Причина — подвисший диск или сетевая ФС.'},
 {t:'r',q:'Почему контейнер перезапускается?',code:`$ docker ps -a
CONTAINER ID  IMAGE     STATUS
a1b2c3d4e5f6  shop:1.4  Exited (137) 5 seconds ago`,lang:'term',o:['137 = SIGKILL — вероятнее всего, кончилась память (OOM)','Ошибка в коде приложения, код 137','Штатная остановка docker stop','Не найден образ'],a:0,e:'128 + 9. Проверь лимиты памяти и dmesg / docker inspect (OOMKilled: true).'},
 {t:'r',q:'Что не так в этом выводе?',code:`$ ps aux | grep nginx
kostya  2411  0.0  0.0  6480  2200 pts/0  S+  10:02  0:00 grep --color=auto nginx`,lang:'term',o:['nginx не запущен — найдена только сама команда grep','nginx работает от kostya','nginx завис','Всё в порядке'],a:0,e:'Единственная строка — сам grep. Используй pgrep или grep [n]ginx, чтобы не путаться.'},
 {t:'c',g:'prac',q:'В <code>ps</code> видно 300 зомби с одним и тем же PPID 950. Что делать?',o:['Разобраться с процессом 950: он не забирает детей — перезапустить или починить его','kill -9 всем зомби','Перезагрузить сервер немедленно','Ничего, это норма'],a:0,e:'Зомби убирает родитель. Если родитель 950 перезапустить, зомби усыновит PID 1 и очистит.'},
 {t:'c',g:'prac',q:'Нужно на проде пожать гигабайт логов, не мешая сайту. Как запустить?',o:['nice -n 19 tar -czf logs.tgz /var/log/app','kill -STOP nginx на время сжатия','tar с sudo','В tmux'],a:0,e:'nice с высоким значением — процесс получит CPU только когда он свободен.'},
 {t:'c',g:'prac',q:'Ты запустил <code>./import.sh</code> на переднем плане и понял, что он будет идти час, а терминал нужен. Что сделать, не перезапуская?',o:['Ctrl+Z, затем bg (и disown, если будешь отключаться)','Ctrl+C и запустить заново с &','Закрыть терминал — процесс продолжит','kill -CONT'],a:0,e:'Ctrl+Z замораживает, bg продолжает в фоне. disown отвязывает от оболочки, чтобы пережил выход.'},

 {t:'s',g:'job',q:'Долгая миграция на проде по SSH. Собери надёжный порядок.',p:['tmux new -s migr','Запустить ./migrate.sh 2>&1 | tee migrate.log','Отключиться от tmux: Ctrl+B, затем D','Позже: tmux attach -t migr и проверить результат'],e:'tmux держит сессию на сервере: обрыв связи или закрытый ноутбук ничего не убьют.'},

 {t:'c',g:'job',q:'Где посмотреть, с какими переменными окружения запущен процесс 950?',o:['cat /proc/950/environ (или tr "\\0" "\\n" < /proc/950/environ)','ps aux | grep 950','echo $ENV','/etc/environment'],a:0,e:'/proc/PID/environ — окружение процесса на момент запуска (разделитель — нулевой байт). Нужны права владельца или root.'}],
lab:[
 {t:'Дерево процессов: найди свой bash в <code>pstree -p</code> и пройди по родителям до PID 1. Запиши цепочку. Потом найди nginx/sshd/любой сервис и посмотри, сколько у него дочерних процессов.',sol:C(`echo $$                       # PID твоего bash
pstree -p -s $$               # цепочка предков
ps -o pid,ppid,cmd -p $$`)},
 {t:'Сигналы и коды: запусти <code>sleep 1000</code> и по очереди заверши его Ctrl+C, <code>kill</code>, <code>kill -9</code> (из второго терминала). После каждого — <code>echo $?</code>. Сверь с формулой 128 + номер.',sol:C(`sleep 1000      # Ctrl+C → echo $? → 130
sleep 1000      # во 2-м терминале: kill $(pgrep sleep) → 143
sleep 1000      # kill -9 $(pgrep sleep) → 137`)},
 {t:'Graceful shutdown своими руками: напиши bash-скрипт, который в бесконечном цикле пишет время в файл и на SIGTERM пишет «saving…», ждёт 2 секунды и выходит. Проверь <code>kill</code> и <code>kill -9</code> — в каком случае «saving…» появился?',h:'<p>Команда <code>trap \'…\' TERM</code> задаёт, что делать при сигнале.</p>',sol:C(`cat > ~/lab/worker.sh <<'EOF'
#!/usr/bin/env bash
trap 'echo "saving..." >> ~/lab/worker.log; sleep 2; exit 0' TERM
while true; do date >> ~/lab/worker.log; sleep 1; done
EOF
chmod +x ~/lab/worker.sh && ~/lab/worker.sh &
kill %1        # в логе появится saving...
# повтори с kill -9 — «saving...» не будет: SIGKILL не перехватить`)},
 {chk:'<p>После повторного входа выполни <code>pgrep -a sleep</code>: простой запуск умер (при закрытии сессии пришёл SIGHUP), nohup и tmux выжили. К процессу в tmux можно вернуться: <code>tmux attach</code>.</p>',t:'Пережить отключение: запусти <code>sleep 600</code> тремя способами (просто, через nohup …&amp;, в tmux), закрой SSH-сессию (или терминал WSL), зайди снова и проверь <code>pgrep -a sleep</code>, какие выжили.'},
 {t:'Сделай зомби и убери его: запусти <code>bash -c \'sleep 1 &amp; exec sleep 300\'</code> — через секунду у процесса sleep 300 появится ребёнок-зомби. Найди его в <code>ps</code> (STAT Z), найди родителя и избавься от зомби правильным способом.',sol:C(`bash -c 'sleep 1 & exec sleep 300' &
sleep 2; ps -o pid,ppid,stat,cmd --ppid $(pgrep -f "sleep 300")
kill $(pgrep -f "sleep 300")   # убили родителя → зомби усыновлён PID 1 и убран
ps aux | awk '$8 ~ /Z/'`)}],
qa:[
 ['Что такое процесс и чем отличается от программы?','Программа — файл на диске. Процесс — запущенный экземпляр: память, PID, открытые файлы, состояние. Одна программа — много процессов.'],
 ['Чем SIGTERM отличается от SIGKILL?','SIGTERM (15) — просьба завершиться, процесс может её обработать и аккуратно закрыться. SIGKILL (9) — ядро убивает сразу, без возможности перехватить и прибраться.'],
 ['Почему не стоит сразу делать kill -9?','Приложение не закроет транзакции, не допишет файлы, не удалит lock-файлы — возможны битые данные и проблемы при следующем старте. Сначала SIGTERM, потом подождать.'],
 ['Что такое зомби-процесс и как от него избавиться?','Процесс завершился, но родитель не прочитал его код возврата (wait). Убить нельзя — уже мёртв. Лечат родителя: перезапуск/исправление; после смерти родителя зомби убирает PID 1.'],
 ['Что значит exit code 137?','128 + 9 = SIGKILL. Чаще всего OOM killer (кончилась память / лимит контейнера) или процесс не завершился вовремя после SIGTERM и был добит.'],
 ['Как запустить задачу, чтобы она пережила закрытие SSH?','tmux/screen (лучше всего), nohup cmd > log 2>&1 &, или disown для уже запущенной. Для постоянных сервисов — systemd.'],
 ['Что такое состояние D?','Непрерываемый сон: процесс ждёт ввод-вывод (диск, NFS). Не реагирует даже на SIGKILL. Много D-процессов и высокий load average при свободном CPU — проблема с дисками.'],
 ['Что происходит при docker stop?','Docker шлёт главному процессу контейнера SIGTERM, ждёт 10 секунд (настраивается), затем SIGKILL. В Kubernetes так же, по умолчанию 30 секунд.']],
cheat:[['ps aux','все процессы'],['pgrep -a name','PID + команда'],['pstree -p','дерево процессов'],['kill PID','SIGTERM'],['kill -9 PID','SIGKILL — последнее средство'],['kill -HUP PID','перечитать конфиг'],['pkill name','сигнал по имени'],['cmd &','в фон'],['jobs / fg / bg','управление фоновыми задачами'],['nohup cmd > log 2>&1 &','пережить выход из SSH'],['tmux new -s name / tmux attach -t name','сессия на сервере'],['nice -n 19 cmd','низкий приоритет'],['cat /proc/PID/status','всё о процессе']]});
/* pwsh · L1 · PowerShell для DevOps: объекты, конвейер, скрипты .ps1, ошибки, соответствия bash */
MOD({id:'pwsh',title:'PowerShell (.ps1) для DevOps',sub:'Объекты вместо текста, Get-Command / Get-Help / Get-Member, конвейер, .ps1 с параметрами, ошибки, ExecutionPolicy и шпаргалка bash ↔ PowerShell.',
case:`<p>В компании MS SQL Server стоит на Windows-серверах, а один из GitLab-раннеров — Windows-машина. Тебя просят: «Сделай скрипт, который проверит на 10 серверах, запущена ли служба SQL Server и сколько свободно на диске D:». Ты по привычке пишешь <code>ps aux | grep sql</code> — ошибка. <code>ls -la</code> — ошибка. <code>curl -s</code> в старом PowerShell — вообще не curl. Скрипт, скачанный из репозитория, не запускается: «выполнение сценариев отключено в этой системе».</p><p class="goal"><b>Цель модуля:</b> уверенно работать в PowerShell: находить нужные команды без гугла, обрабатывать вывод как объекты, писать .ps1 с параметрами и обработкой ошибок, понимать ExecutionPolicy — и переводить свои bash-привычки на PowerShell.</p>`,
intro:`<p><b>PowerShell</b> — оболочка и язык скриптов от Microsoft. Он есть в каждой Windows, а версия 7 (<code>pwsh</code>) работает и на Linux, и на macOS.</p>
<p>Главное отличие от bash: по пайпу <code>|</code> идёт <mark>не текст, а объекты</mark> со свойствами. В bash, чтобы достать из <code>ps</code> память процесса, ты вырезаешь нужную колонку через awk и надеешься, что формат не поменяется. В PowerShell у процесса просто есть свойство <code>WorkingSet</code> — сортируй, фильтруй, считай.</p>
<p>Зачем DevOps-у: Windows-серверы (MS SQL, IIS, Active Directory), Azure, раннеры CI на Windows и твой собственный ноутбук. Даже если основная работа в Linux, PowerShell встретится — и лучше, чтобы bash-привычки не подводили.</p>`,
theory:`<h2>Две версии</h2>
${tbl(['','Windows PowerShell 5.1','PowerShell 7+'],[
 ['запуск','<code>powershell.exe</code>','<code>pwsh</code>'],
 ['где','встроен в Windows, больше не развивается','ставится отдельно (winget install Microsoft.PowerShell), Windows/Linux/macOS'],
 ['что брать','только если нет выбора','<mark>для новых скриптов</mark>']])}
<p>Версия: <code>$PSVersionTable.PSVersion</code>.</p>
<h2>Команды: Глагол-Существительное</h2>
<p>Все команды (cmdlet) называются <b>Verb-Noun</b>: <code>Get-Process</code>, <code>Stop-Service</code>, <code>New-Item</code>, <code>Remove-Item</code>. Зная правило, команду можно угадать. Три команды, чтобы <mark>не гуглить</mark>:</p>
${CMDS([['Get-Command *service*','найти команды по куску имени'],['Get-Help Restart-Service -Examples','справка с примерами (Update-Help — скачать полную)'],['Get-Process | Get-Member','какие у объектов свойства и методы — главная команда PowerShell']])}
<h2>Объекты в конвейере</h2>
${C(`# топ-5 процессов по памяти, только имя, PID и память в МБ
Get-Process |
  Sort-Object WorkingSet -Descending |
  Select-Object -First 5 Name, Id, @{n='MB'; e={[math]::Round($_.WorkingSet/1MB)}}

# службы SQL, которые остановлены
Get-Service *sql* | Where-Object Status -eq 'Stopped'`,'ps')}
${tbl(['Командлет','Что делает','Аналог в bash'],[
 ['<code>Where-Object</code> (<code>?</code>)','фильтр по свойству','grep / awk с условием'],
 ['<code>Sort-Object</code>','сортировка по свойству','sort -k'],
 ['<code>Select-Object</code>','выбрать свойства, -First N','cut, head'],
 ['<code>ForEach-Object</code> (<code>%</code>)','сделать что-то с каждым','while read / xargs'],
 ['<code>Measure-Object</code>','посчитать, сумма, среднее','wc -l, awk sum'],
 ['<code>Group-Object</code>','сгруппировать и посчитать','sort | uniq -c']])}
<p>Внутри блоков <code>{ }</code> текущий объект — <code>$_</code> (или <code>$PSItem</code>).</p>
<h2>Язык: переменные, сравнения, условия</h2>
${C(`$port = 3000                      # пробелы вокруг = можно (в bash — нельзя!)
$name = "shop"
"Сервис $name на порту $port"     # двойные кавычки подставляют
'Буквально $name'                 # одинарные — нет
$env:DB_HOST = 'localhost'        # переменная окружения (как export в bash)

if ($port -gt 1024 -and $name -like 'sh*') { 'ok' } elseif ($port -eq 80) { 'web' } else { 'нет' }

foreach ($s in 'web-01','web-02') { Test-Connection $s -Count 1 -Quiet }`,'ps')}
${tbl(['Сравнение','Значит'],[['<code>-eq -ne</code>','равно / не равно (<b>не</b> == и !=)'],['<code>-gt -ge -lt -le</code>','больше, ≥, меньше, ≤'],['<code>-like \'*.log\'</code>','шаблон со звёздочкой'],['<code>-match \'^err\'</code>','регулярное выражение'],['<code>-and -or -not</code>','логика'],['<code>-contains</code>','есть ли элемент в списке']])}
<p>По умолчанию сравнение строк <b>без учёта регистра</b>: <code>'ABC' -eq 'abc'</code> — True. С учётом — <code>-ceq</code>. Экранирующий символ — обратная кавычка <code>\`</code>, а не <code>\\</code>.</p>
<h2>Скрипт .ps1 с параметрами и строгими ошибками</h2>
${C(`# check-sql.ps1
param(
  [Parameter(Mandatory)] [string[]] $Servers,
  [int] $MinFreeGB = 10
)
$ErrorActionPreference = 'Stop'          # любая ошибка командлета — исключение (аналог set -e)
Set-StrictMode -Version Latest           # необъявленная переменная — ошибка (аналог set -u)

foreach ($s in $Servers) {
  try {
    $svc  = Get-Service -ComputerName $s -Name 'MSSQLSERVER'
    $disk = Get-CimInstance Win32_LogicalDisk -ComputerName $s -Filter "DeviceID='D:'"
    $free = [math]::Round($disk.FreeSpace / 1GB, 1)
    [pscustomobject]@{ Server=$s; SQL=$svc.Status; FreeGB=$free; OK=($svc.Status -eq 'Running' -and $free -ge $MinFreeGB) }
  } catch {
    Write-Error "$s : $($_.Exception.Message)"
  }
}
# запуск: .\\check-sql.ps1 -Servers db-01,db-02 -MinFreeGB 20 | Format-Table`,'ps')}
${BOX('Ошибки: $? и $LASTEXITCODE','<p>У командлетов ошибки — объекты; их ловят <code>try/catch</code> (при <code>$ErrorActionPreference = \'Stop\'</code>). У <b>внешних программ</b> (git, docker, sqlcmd, kubectl) ошибка — это только код возврата, он лежит в <code>$LASTEXITCODE</code>. <code>$ErrorActionPreference</code> на них не действует, поэтому после важных внешних команд проверяй: <code>if ($LASTEXITCODE -ne 0) { throw "docker build упал" }</code>. Это главная ловушка скриптов CI на Windows.</p>','deep')}
<h2>ExecutionPolicy</h2>
${tbl(['Политика','Значит'],[
 ['<b>Restricted</b>','скрипты запрещены (по умолчанию на клиентских Windows)'],
 ['<b>RemoteSigned</b>','свои локальные — можно; скачанные — только подписанные (по умолчанию на Windows Server)'],
 ['<b>Bypass</b>','ничего не проверять (для разового запуска в CI)']])}
${CMDS([['Get-ExecutionPolicy -List','политики по уровням'],['Set-ExecutionPolicy -Scope CurrentUser RemoteSigned','разрешить себе локальные скрипты'],['pwsh -ExecutionPolicy Bypass -File .\\deploy.ps1','запустить один раз без изменения настроек'],['Unblock-File .\\deploy.ps1','снять метку «скачано из интернета»']])}
<p>ExecutionPolicy — <b>защита от случайного запуска</b>, а не граница безопасности: её легко обойти. От злоумышленника она не защищает.</p>
<h2>Шпаргалка bash → PowerShell</h2>
${tbl(['bash','PowerShell'],[
 ['<code>ls -la</code>','<code>Get-ChildItem -Force</code> (<code>ls -Force</code>)'],
 ['<code>cat f</code> / <code>tail -f f</code>','<code>Get-Content f</code> / <code>Get-Content f -Wait -Tail 20</code>'],
 ['<code>grep error f</code>','<code>Select-String error f</code>'],
 ['<code>ps aux | grep node</code>','<code>Get-Process *node*</code>'],
 ['<code>kill PID</code>','<code>Stop-Process -Id PID</code>'],
 ['<code>curl -s url</code>','<code>Invoke-RestMethod url</code> (JSON сразу в объекты); <code>curl.exe</code> — настоящий curl'],
 ['<code>export X=1</code> / <code>echo $X</code>','<code>$env:X = 1</code> / <code>$env:X</code>'],
 ['<code>which git</code>','<code>Get-Command git</code>'],
 ['<code>nc -zv host 1433</code>','<code>Test-NetConnection host -Port 1433</code>'],
 ['<code>systemctl status/restart x</code>','<code>Get-Service x</code> / <code>Restart-Service x</code>'],
 ['<code>journalctl</code>','<code>Get-WinEvent -LogName System -MaxEvents 50</code>'],
 ['<code>df -h</code>','<code>Get-Volume</code> / <code>Get-PSDrive</code>'],
 ['<code>cmd &gt; f 2&gt;&amp;1</code>','<code>cmd *&gt; f</code> (все потоки)'],
 ['<code>ssh host cmd</code>','<code>Invoke-Command -ComputerName host { cmd }</code> (WinRM) или ssh в PS 7']])}
<p>В Windows PowerShell 5.1 <code>curl</code> и <code>wget</code> — <mark>алиасы</mark> Invoke-WebRequest с другими флагами. Настоящий curl — <code>curl.exe</code>.</p>
<h2>Где пригодится с MS SQL</h2>
<p>Модуль <b>dbatools</b> (<code>Install-Module dbatools -Scope CurrentUser</code>) — сотни командлетов для администрирования SQL Server: <code>Get-DbaDatabase</code>, <code>Backup-DbaDatabase</code>, <code>Test-DbaLastBackup</code> (проверить, что бэкап реально восстанавливается). Его используют DBA и DevOps по всему миру — пригодится в проекте.</p>`,
memo:`<p>Неделю делай повседневное на Windows только в PowerShell 7 (<code>pwsh</code>). Для каждой незнакомой задачи: <code>Get-Command *слово*</code> → <code>Get-Help … -Examples</code> → <code>… | Get-Member</code>. И каждый раз, когда хочется вырезать колонку из текста, вспоминай: тут это свойство объекта.</p>`,
traps:[
 ['ls -la, ps aux в PowerShell','Get-ChildItem -Force, Get-Process','ls и ps тут — алиасы других команд с другими параметрами.'],
 ['if ($a == 5)','if ($a -eq 5)','== в PowerShell нет; = — присваивание. Сравнение — -eq, -gt, -like…'],
 ['$ErrorActionPreference = "Stop" — значит, упавший docker build остановит скрипт','if ($LASTEXITCODE -ne 0) { throw … } после внешних команд','Настройка действует на командлеты. Внешние программы сообщают об ошибке только кодом в $LASTEXITCODE.'],
 ['curl -s https://… в Windows PowerShell 5.1','Invoke-RestMethod или curl.exe','curl там — алиас Invoke-WebRequest, флаг -s он не знает.'],
 ['Set-ExecutionPolicy Unrestricted на сервере, «чтобы работало»','Разовый запуск: pwsh -ExecutionPolicy Bypass -File …, или RemoteSigned для CurrentUser','Не ослабляй политику для всей машины ради одного скрипта.'],
 ['Get-Process | Select-String node, как grep','Get-Process | Where-Object Name -like \'*node*\'','Фильтруй по свойствам объекта, а не по тексту — надёжнее и быстрее.']],
ex:[
 {t:'c',q:'Чем конвейер PowerShell отличается от bash?',o:['По пайпу идут объекты со свойствами, а не текст','Ничем','PowerShell не умеет пайпы','В PowerShell пайп только для файлов'],a:0,e:'Поэтому не надо вырезать колонки awk — берёшь свойство.'},
 {t:'c',q:'Как называются команды PowerShell?',o:['Глагол-Существительное: Get-Process, Restart-Service','Существительное-глагол','Как в bash: ps, kill','Только аббревиатурами'],a:0,e:'Verb-Noun. Список разрешённых глаголов: Get-Verb.'},

 {t:'c',q:'Как в PowerShell проверить «равно»?',o:['-eq','==','=','.equals'],a:0,e:'В PowerShell знаки заняты: > — перенаправление, = — присваивание. Поэтому сравнения пишут словами: -eq, -ne, -gt, -lt, -like (шаблон), -match (регулярное выражение). Оператора == в PowerShell нет.'},

 {t:'c',q:'Что такое <code>$_</code>?',o:['Текущий объект в блоке Where-Object / ForEach-Object','Последний код возврата','Домашняя папка','Аргументы скрипта'],a:0,e:'Внутри блока { } у Where-Object и ForEach-Object $_ — это объект, который сейчас идёт по конвейеру. Например, $_.Name — имя текущего процесса. Длинное имя той же переменной — $PSItem.'},
