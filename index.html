 {t:'r',q:'Что вернёт команда?',code:`PS> Get-Service *sql* | Where-Object Status -eq 'Running' | Measure-Object | Select-Object -ExpandProperty Count
2`,lang:'out',o:['Количество запущенных служб, в имени которых есть sql — их 2','Имена служб','Статус первой службы','Ошибку'],a:0,e:'Фильтр по свойству → подсчёт → вытащить число Count.'},
 {t:'c',g:'prac',q:'Нужно получить JSON от API и вывести поле <code>status</code>. Как в PowerShell проще всего?',o:['(Invoke-RestMethod https://api/health).status','curl https://api/health | jq .status','Invoke-WebRequest и разбирать текст регуляркой','Get-Content https://api/health'],a:0,e:'Invoke-RestMethod сам превращает JSON в объект.'},
 {t:'c',g:'prac',q:'Нужно выполнить команду на 5 Windows-серверах сразу. Что использовать?',o:['Invoke-Command -ComputerName s1,s2,… -ScriptBlock { … }','foreach + Enter-PSSession','RDP на каждый','ssh в цикле через cmd'],a:0,e:'Invoke-Command (WinRM) выполняет блок параллельно и возвращает объекты с полем PSComputerName.'},
 {t:'i',g:'prac',fix:true,q:'Исправь условие: должно сработать, если свободно меньше 10 ГБ.',code:'if ($freeGB < 10) { Write-Warning "мало места" }',a:['if ($freeGB -lt 10) { Write-Warning "мало места" }',"if ($freeGB -lt 10) { Write-Warning 'мало места' }"],ph:'if (…) { … }',e:'< в PowerShell — перенаправление (зарезервировано), а не сравнение. Нужно -lt.'},
 {t:'c',g:'job',q:'Нужно регулярно проверять, что бэкапы MS SQL реально восстанавливаются. Что разумно взять в PowerShell?',o:['Модуль dbatools: Test-DbaLastBackup','Get-ChildItem по папке бэкапов','Ничего — если файл есть, значит, всё ок','Invoke-RestMethod'],a:0,e:'Test-DbaLastBackup восстанавливает последний бэкап на тестовый сервер и проверяет целостность. Наличие файла — не доказательство.'},
 {t:'c',g:'job',q:'Скрипт пишут для Windows и для Linux-раннеров. Что выбрать?',o:['PowerShell 7 (pwsh) — он кроссплатформенный','Windows PowerShell 5.1','cmd.exe','Два разных скрипта всегда'],a:0,e:'pwsh есть на всех платформах. Учти различия путей (/ и \\) и регистра в Linux.'},
 {t:'c',g:'job',q:'Коллега предлагает выполнить на сервере <code>Set-ExecutionPolicy Unrestricted -Scope LocalMachine</code>, чтобы раннер запускал скрипты. Что лучше?',o:['Запускать в CI через pwsh -ExecutionPolicy Bypass -File …, не меняя политику машины','Согласиться','Отключить антивирус','Переписать всё на bat'],a:0,e:'Минимальное изменение: политика только для конкретного запуска. Машину не ослабляем.'}],
lab:[
 {t:'Поставь PowerShell 7 и сравни версии: <code>winget install Microsoft.PowerShell</code>, потом в обоих (powershell и pwsh) выполни <code>$PSVersionTable.PSVersion</code>. Посмотри свою ExecutionPolicy по уровням.',sol:C(`winget install Microsoft.PowerShell
$PSVersionTable.PSVersion
Get-ExecutionPolicy -List`,'ps')},
 {t:'Разведка без гугла: найди командлет, который показывает IP-адреса сетевых интерфейсов, и командлет, который показывает свободное место на дисках. Используй только Get-Command, Get-Help и Get-Member.',h:'<p>Существительные: NetIPAddress, Volume.</p>',sol:C(`Get-Command *ipaddress*
Get-NetIPAddress -AddressFamily IPv4 | Select-Object InterfaceAlias, IPAddress
Get-Volume | Select-Object DriveLetter, @{n='FreeGB';e={[math]::Round($_.SizeRemaining/1GB,1)}}`,'ps')},
 {t:'Перепиши на PowerShell однострочники из модулей [[mod:text]] и [[mod:res]]: топ-5 процессов по CPU; сколько файлов .log в папке и их общий размер в МБ; строки с «error» в файле с номерами.',sol:C(`Get-Process | Sort-Object CPU -Descending | Select-Object -First 5 Name, Id, CPU
Get-ChildItem C:\\Windows\\Logs -Recurse -Filter *.log -ErrorAction SilentlyContinue |
  Measure-Object Length -Sum | ForEach-Object { "{0} файлов, {1:N1} МБ" -f $_.Count, ($_.Sum/1MB) }
Select-String -Path .\\app.log -Pattern error | Select-Object LineNumber, Line`,'ps')},
 {t:'Скрипт <code>check.ps1</code>: параметр <code>-Services</code> (массив имён служб), строгий режим, для каждой службы — объект {Name, Status}, в конце — код выхода 1, если хоть одна не Running. Запусти: <code>pwsh -File .\\check.ps1 -Services Spooler,wuauserv; $LASTEXITCODE</code>.',sol:C(`param([Parameter(Mandatory)][string[]]$Services)
$ErrorActionPreference = 'Stop'; Set-StrictMode -Version Latest
$bad = 0
foreach ($s in $Services) {
  $svc = Get-Service -Name $s
  [pscustomobject]@{ Name = $svc.Name; Status = $svc.Status }
  if ($svc.Status -ne 'Running') { $bad++ }
}
exit ([int]($bad -gt 0))`,'ps')},
 {chk:'<p>Без проверки «готово» напечатается, хотя git вернул ошибку: $ErrorActionPreference на внешние программы не действует. С <code>if ($LASTEXITCODE -ne 0) { throw "git упал" }</code> скрипт остановится.</p>',t:'Ловушка внешних команд: напиши скрипт с <code>$ErrorActionPreference = \'Stop\'</code>, где выполняется <code>git status</code> в папке, которая не является репозиторием, а потом печатается «готово». Убедись, что «готово» печатается. Добавь проверку $LASTEXITCODE и убедись, что теперь скрипт падает.'}],
qa:[
 ['Чем PowerShell отличается от bash?','По пайпу передаются объекты, а не текст: фильтруешь и сортируешь по свойствам. Команды Verb-Noun, сравнения -eq/-gt, переменные с $ и при присвоении. Есть встроенная справка и Get-Member.'],
 ['Как найти нужную команду без интернета?','Get-Command *слово*, Get-Help команда -Examples, объект | Get-Member — посмотреть свойства.'],
 ['Что такое ExecutionPolicy?','Политика запуска скриптов: Restricted, RemoteSigned, Bypass и др. Защищает от случайного запуска, но не является границей безопасности. В CI — pwsh -ExecutionPolicy Bypass -File.'],
 ['Как обрабатывать ошибки в PowerShell-скрипте?','$ErrorActionPreference = "Stop" + try/catch для командлетов; для внешних программ проверять $LASTEXITCODE; Set-StrictMode для необъявленных переменных.'],
 ['PowerShell 5.1 или 7?','5.1 встроен в Windows и не развивается. 7 (pwsh) — кроссплатформенный, быстрее, новые возможности. Новые скрипты — под 7.'],
 ['Как выполнить команду на удалённых Windows-серверах?','Invoke-Command -ComputerName … -ScriptBlock {…} через WinRM (параллельно), Enter-PSSession — интерактивно. В PS 7 можно и через SSH.'],
 ['Чем полезен PowerShell для MS SQL?','Модуль dbatools: бэкапы, восстановление, миграции, проверка бэкапов (Test-DbaLastBackup), инвентаризация серверов — сотни готовых командлетов.']],
cheat:[['Get-Command *x*','найти команду'],['Get-Help cmd -Examples','примеры'],['obj | Get-Member','свойства объекта'],['Where-Object Prop -eq v','фильтр'],['Sort-Object Prop -Descending','сортировка'],['Select-Object -First 5 A,B','выбрать'],['Get-Content f -Wait -Tail 20','tail -f'],['Select-String err f','grep'],['Invoke-RestMethod url','HTTP + JSON'],['Test-NetConnection h -Port 1433','проверить порт'],['$env:X = 1','переменная окружения'],['$LASTEXITCODE','код внешней программы'],["$ErrorActionPreference = 'Stop'",'падать на ошибках'],['pwsh -ExecutionPolicy Bypass -File x.ps1','разовый запуск']]});
/* r1 · Обзор 1 — накопительный по модулям [[mod:linux]]–7 (linux, shell, files, perms, streams, text, procs) */
REV({id:'r1',title:'Обзор 1: первые шаги на сервере',
case:`<p>Ты дежурный. За смену прилетает десяток мелких задач: незнакомый сервер, скрипт не запускается, сайт не открывается, бэкапа нет, в логе что-то странное. Подсказок нет — как на настоящей работе.</p><p class="goal"><b>Цель модуля:</b> проверить, что темы первых модулей работают вместе: соединить в одной задаче дистрибутив, пути, права, потоки и логи.</p>`,
theory:`<p>Без подсказок. Каждое задание — ситуация, где нужно соединить несколько тем: дистрибутив, оболочку, пути и файлы. Ошибся — перечитай модуль по ссылке ↺.</p>`,
ex:[
 {t:'r',ref:'linux',q:'Ты зашёл на сервер. Какой командой ставить пакеты?',code:`$ cat /etc/os-release | head -4
NAME="AlmaLinux"
VERSION="9.4 (Seafoam Ocelot)"
ID="almalinux"
ID_LIKE="rhel centos fedora"`,lang:'term',o:['dnf install','apt install','apk add','pacman -S'],a:0,e:'ID_LIKE=rhel → семейство Red Hat → dnf.'},
 {t:'c',ref:'linux',q:'На проде <code>VERSION_ID="23.10"</code>. Какой главный риск?',o:['Промежуточный релиз давно без патчей безопасности','Слишком новое ядро','Не работает SSH','Нет менеджера пакетов'],a:0,e:'23.10 — interim, 9 месяцев поддержки (до середины 2024). Сервер годами без патчей.'},
 {t:'i',ref:'files',q:'Впиши одной командой: следить за логом ошибок nginx так, чтобы чтение пережило ротацию.',a:['tail -F /var/log/nginx/error.log','sudo tail -F /var/log/nginx/error.log'],ph:'tail …',e:'Логи nginx — /var/log/nginx, ротация → -F.'},
 {t:'r',ref:'shell',q:'Что не так?',code:`$ cd /opt/app
$ ls -l
-rw-r--r-- 1 deploy deploy 412 Nov 20 run.sh
$ ./run.sh
-bash: ./run.sh: Permission denied`,lang:'term',o:['У файла нет права x — нужен chmod +x run.sh','Нет шебанга','Неверный путь','Скрипт с CRLF'],a:0,e:'В правах rw-r--r-- нигде нет x. chmod +x или bash run.sh.'},
 {t:'r',ref:'shell',q:'Скрипт написан в VS Code на Windows и залит на сервер. Что видим?',code:`$ cat -A deploy.sh | head -2
#!/usr/bin/env bash^M$
set -e^M$`,lang:'term',o:['CRLF-переносы: ^M — это \\r, нужно dos2unix','Скрипт зашифрован','Нет прав на чтение','Скрипт для PowerShell'],a:0,e:'cat -A показывает \\r как ^M. Убираем: dos2unix deploy.sh.'},
 {t:'c',ref:'files',q:'Диск забит. Где искать в первую очередь на сервере с Docker и nginx?',o:['/var/log и /var/lib/docker','/etc и /boot','/proc и /sys','/usr/bin'],a:0,e:'Растут логи и данные сервисов — /var. /proc и /sys не занимают диск вообще.'},
 {t:'s',ref:'files',q:'Нужно поменять порт в <code>/etc/myapp/app.conf</code> на проде. Собери порядок.',p:['cp -a /etc/myapp/app.conf /etc/myapp/app.conf.bak','Отредактировать app.conf','Проверить конфиг средствами приложения','Перезапустить сервис','Убедиться по логу в /var/log, что поднялся'],e:'Бэкап → правка → проверка → применение → проверка по логу.'},
 {t:'i',ref:'files',fix:true,q:'Исправь: должна найти все .conf в /etc, а выдаёт мусор или ошибку <i>paths must precede expression</i>.',code:'find /etc -name *.conf',a:['find /etc -name "*.conf"',"find /etc -name '*.conf'"],ph:'find …',e:'Bash раскрыл *.conf по текущей папке до запуска find. Кавычки отдают шаблон find.'},
 {t:'c',ref:'linux',q:'В контейнере <code>ubuntu:22.04</code> на хосте с ядром 6.8 команда <code>uname -r</code> покажет…',o:['6.8 — ядро хоста','5.15 — ядро Ubuntu 22.04','Ошибку','22.04'],a:0,e:'У контейнера нет своего ядра. А /etc/os-release внутри покажет Ubuntu 22.04.'},
 {t:'c',ref:'shell',q:'<code>env.sh</code> делает <code>export DB_HOST=db</code>. После <code>./env.sh</code> переменной в терминале нет. Почему?',o:['Скрипт выполнился в дочернем процессе; нужно source env.sh','export работает только в PowerShell','Нужен sudo','Переменная записалась в /etc'],a:0,e:'Дочерний процесс не может изменить окружение родителя. source выполняет в текущей оболочке.'},
 {t:'i',ref:'shell',q:'Впиши команду: найти, где лежит программа <code>docker</code>.',a:['which docker','command -v docker','type docker','type -p docker'],ph:'…',e:'which ищет по $PATH. command -v — POSIX-вариант, удобен в скриптах.'},
 {t:'r',ref:'files',q:'Почему сайт не работает, хотя ссылка есть?',code:`$ ls -l /etc/nginx/sites-enabled/
lrwxrwxrwx 1 root root 33 shop -> /etc/nginx/sites-available/shp
$ ls /etc/nginx/sites-available/
default  shop`,lang:'term',o:['Ссылка ведёт на несуществующий файл shp — опечатка, ссылка висит','Нужно перезагрузить сервер','Файл shop пустой','Ссылки nginx не читает'],a:0,e:'Цель ссылки — shp, а файл называется shop. Пересоздать: ln -sf /etc/nginx/sites-available/shop …'},
 {t:'c',ref:'shell',q:'Ты под root (<code>#</code>) и набираешь <code>rm -rf /opt/app /</code> — пробел перед последним /. Что произойдёт?',o:['/opt/app удалится, а на / GNU rm откажется (защита --preserve-root); с /* такой защиты уже нет','Ничего не удалится — ошибка синтаксиса','Удалится вся система без предупреждений','rm спросит подтверждение для каждого файла'],a:0,e:'Два аргумента: /opt/app и /. Современный rm по умолчанию не трогает сам корень, но rm -rf /* (bash раскроет в /bin /etc …) снесёт всё. Перед rm -rf — ls того же пути.'},
 {t:'i',ref:'files',q:'Впиши: последние 30 строк системного лога Ubuntu.',a:['tail -n 30 /var/log/syslog','tail -30 /var/log/syslog','sudo tail -n 30 /var/log/syslog','tail -n30 /var/log/syslog'],ph:'tail …',e:'/var/log/syslog — общий лог в Ubuntu (в RHEL — /var/log/messages).'},
 {t:'c',ref:'linux',q:'На собесе: «Почему вы выбрали бы Ubuntu LTS, а не Arch для прода?» Лучший короткий ответ:',o:['Фиксированная версия с патчами безопасности на 5+ лет — обновления не ломают совместимость','Arch нельзя поставить на сервер','В Ubuntu быстрее ядро','В Arch нет SSH'],a:0,e:'Суть — предсказуемость: rolling release несёт непрерывные изменения, LTS — только исправления.'},
 {t:'s',ref:'shell',q:'Скрипт из репозитория не запускается. Собери порядок диагностики.',p:['ls -l script.sh — есть ли x','head -1 script.sh — какой шебанг','cat -A script.sh | head — нет ли ^M','Запустить bash -x script.sh — где падает'],e:'Права → интерпретатор → переносы → трассировка (bash -x печатает каждую команду).'},
 {t:'c',ref:'files',q:'Нужна точная копия <code>/etc/nginx</code> перед обновлением, с правами и владельцами. Что выбрать?',o:['cp -a /etc/nginx /root/nginx.bak','cp /etc/nginx /root/nginx.bak','mv /etc/nginx /root/nginx.bak','ln -s /etc/nginx /root/nginx.bak'],a:0,e:'cp без -r не скопирует папку, mv унесёт оригинал, ссылка — не копия.'},
 {t:'r',ref:'files',q:'Что это за файл и можно ли его читать как текст?',code:`$ file /usr/bin/ls /etc/hosts /var/log/syslog.2.gz
/usr/bin/ls:            ELF 64-bit LSB pie executable, x86-64
/etc/hosts:             ASCII text
/var/log/syslog.2.gz:   gzip compressed data`,lang:'term',o:['ls — бинарник, hosts — текст, syslog.2.gz — сжатый лог (читать zcat/zless)','Все три — текст','Все три — бинарники','hosts — архив'],a:0,e:'Старые логи после ротации сжаты. Читать без распаковки: zless, zcat, zgrep.'},
 {t:'c',ref:'shell',q:'В PowerShell на Windows нужно запустить <code>build.ps1</code> из текущей папки. Как?',o:['.\\build.ps1','build.ps1','sh build.ps1','./build.sh'],a:0,e:'Как и в bash, явный путь к текущей папке. ExecutionPolicy может ещё запретить запуск — тогда Get-ExecutionPolicy.'},
 {t:'i',ref:'files',q:'Впиши одной командой: создать <code>/opt/app/releases/2026-11-24</code> и <code>/opt/app/shared/logs</code>.',a:['mkdir -p /opt/app/releases/2026-11-24 /opt/app/shared/logs','sudo mkdir -p /opt/app/releases/2026-11-24 /opt/app/shared/logs'],ph:'mkdir …',e:'mkdir принимает несколько путей; -p создаёт родителей.'},
 {t:'c',ref:'linux',q:'Какая команда скажет, ARM у тебя или x86 (важно для выбора Docker-образа)?',o:['uname -m','uname -r','cat /etc/os-release','hostname'],a:0,e:'uname -m → x86_64 или aarch64. Образ под чужую архитектуру упадёт с exec format error.'},
 {t:'r',ref:'files',q:'Почему <code>tail -f</code> молчит, хотя сайт работает?',code:`$ ls -l /var/log/nginx/
-rw-r----- 1 www-data adm 52881 Nov 24 09:14 access.log
-rw-r----- 1 www-data adm 9912044 Nov 24 00:00 access.log.1
$ tail -f access.log.1`,lang:'term',o:['Следим за старым, ротированным файлом — новые записи идут в access.log','Нет прав','nginx завис','Сломан tail'],a:0,e:'access.log.1 — вчерашний. Нужен tail -F access.log.'},
 {t:'r',ref:'perms',q:'Nginx отдаёт 403. Что чинить?',code:`$ namei -l /srv/shop/index.html
f: /srv/shop/index.html
drwxr-xr-x root root /
drwxr-xr-x root root srv
drwx------ deploy deploy shop
-rw-r--r-- deploy deploy index.html`,lang:'term',o:['У www-data нет x на /srv/shop — дать chmod 755 /srv/shop (или доступ через группу)','chmod 777 index.html','Перезапустить nginx','Сменить владельца / на www-data'],a:0,e:'Файл читаем всеми, но войти в папку shop может только deploy. Права на файл не помогут без x на каждой папке пути.'},
 {t:'i',ref:'streams',q:'Впиши строку для cron-задачи: запуск <code>/opt/backup.sh</code> с дописыванием и вывода, и ошибок в <code>/var/log/backup.log</code> (только команду, без расписания).',a:['/opt/backup.sh >> /var/log/backup.log 2>&1','/opt/backup.sh &>> /var/log/backup.log'],ph:'/opt/backup.sh …',e:'>> — не затирать прошлые запуски, 2>&1 — ошибки туда же, иначе «молча не работает».'},
 {t:'s',ref:'text',q:'Собери: топ-5 адресов, которые чаще всего получают 404.',p:["awk '$9 == 404 {print $7}' /var/log/nginx/access.log",'| sort','| uniq -c','| sort -rn','| head -5'],e:'Отбор по полю кода → поле пути → группировка → подсчёт → по убыванию.'},
 {t:'r',ref:'procs',q:'Что случилось с сервисом?',code:`$ docker ps -a --format '{{.Names}} {{.Status}}'
shop-api  Exited (137) 2 minutes ago
$ dmesg | tail -2
Out of memory: Killed process 4120 (node) total-vm:2105440kB
oom_reaper: reaped process 4120 (node)`,lang:'term',o:['Процесс убит OOM killer (SIGKILL → 137): не хватило памяти','Ошибка в коде, приложение упало само','Его остановили docker stop','Образ повреждён'],a:0,e:'137 = 128+9, а dmesg прямо говорит про Out of memory. Смотреть лимиты и утечки памяти.'},
 {t:'c',ref:'procs',q:'Импорт по SSH идёт уже 20 минут, нужно уехать, ноутбук закрыть. Процесс запущен на переднем плане в обычном терминале. Как спасти, не перезапуская?',o:['Ctrl+Z → bg → disown, затем отключаться','Просто закрыть ноутбук — продолжит','Ctrl+C и запустить в tmux','kill -HUP'],a:0,e:'bg продолжает в фоне, disown отвязывает от оболочки — SIGHUP при выходе его не тронет. На будущее — сразу запускать в tmux.'},
 {t:'i',ref:'perms',fix:true,q:'Исправь: добавили deploy в группу docker, а он выпал из sudo.',code:'sudo usermod -G docker deploy',a:['sudo usermod -aG docker deploy','usermod -aG docker deploy','sudo usermod -a -G docker deploy'],ph:'sudo usermod …',e:'Без -a список групп заменяется целиком. Вернуть sudo: sudo usermod -aG sudo deploy (из-под другого админа).'}]});
/* r2 · Обзор 2 — накопительный по модулям [[mod:linux]]–15: половина по свежим 9–15 (res, systemd, pkgs, bash1, bash2, pwsh, net1), половина по 1–8 */
REV({id:'r2',title:'Обзор 2: дежурство на сервере',
case:`<p>Ты на дежурстве неделю. За это время: сайт тормозит, сервис не поднимается после перезагрузки, бэкап молча не делается, приложение не видит базу, обновление пакетов чуть не уронило прод, а скрипт коллеги удалил не то. Подсказок нет — только вывод команд, как в реальном чате инцидента.</p><p class="goal"><b>Цель обзора:</b> соединять темы: по выводу нескольких команд найти причину, выбрать безопасное действие и объяснить его. Это ближе всего к вопросам на собеседовании и к реальной работе.</p>`,
theory:`<p>Обзор на 20% сложнее модулей: в каждом задании 2–3 темы, длинный вывод, нет подсказок. Ошибся — открой модуль по ссылке ↺ и перечитай ловушки.</p>`,
ex:[
 {t:'r',ref:'res',q:'Что тормозит сервер?',code:`$ uptime

$ nproc
2

Mem:     3.8Gi  3.6Gi   80Mi   10Mi        120Mi      95Mi
Swap:    2.0Gi  1.9Gi  100Mi
$ vmstat 1 2 | tail -1

/* res · L1 · «Сервер тормозит»: метод, CPU, память, диск, сеть → кто виноват → почему */
MOD({id:'res',title:'«Сервер тормозит»: найти, кто и почему',sub:'load average, top, free, vmstat, iostat, df/du, ss → виновный процесс → strace, lsof, логи.',
case:`<p>Понедельник, 10:05. В чат: «Сайт открывается по 10 секунд, клиенты уходят!». Ты заходишь на сервер — он и сам отвечает с задержкой, каждая команда думает пару секунд. Что делать? Перезагрузить — «помогло», а через час всё повторилось, и причину ты уже не узнаешь: улики стёрты. Тимлид спрашивает не «починил?», а «что это было?».</p><p class="goal"><b>Цель модуля:</b> за 5 минут по шагам определить, какого ресурса не хватает (процессор, память, диск или сеть), найти процесс-виновника и выяснить <b>почему</b> он так себя ведёт — не перезагружая сервер и не стирая улики.</p>`,
intro:`<p>У сервера четыре ресурса: <b>процессор</b> (считает), <b>память</b> (держит данные под рукой), <b>диск</b> (хранит), <b>сеть</b> (общается). «Тормозит» почти всегда значит, что <mark>один из них закончился</mark>, и все остальные стоят в очереди к нему.</p>
<p>Новичок открывает <code>top</code> и смотрит на цифры наугад. Опытный идёт по методу: сначала общая картина, потом каждый ресурс по очереди, потом конкретный процесс, потом причина. Тогда даже незнакомый сервер разбирается за минуты.</p>
<p>Зачем это DevOps-у: это самый частый вопрос и на собесе («что будешь делать, если сервер тормозит?»), и в реальной работе. Хороший ответ — не список команд, а <b>порядок рассуждения</b>.</p>`,
theory:`<h2>Метод: картина → ресурс → процесс → причина</h2>
${C(`
1. Общая картина   uptime, top              — насколько плохо, с какого времени
2. Какой ресурс    CPU / память / диск / сеть — что именно закончилось
3. Кто             ps, top, pidstat, iotop  — какой процесс съел
4. Почему          strace, lsof, логи, что менялось — причина, а не симптом
`,'out')}
<p>Для каждого ресурса задаём три вопроса (метод <b>USE</b>): насколько он <b>занят</b> (Utilization), есть ли <b>очередь</b> к нему (Saturation), есть ли <b>ошибки</b> (Errors).</p>
<h2>Шаг 1. Общая картина: uptime и load average</h2>
${C(`
$ uptime
 10:07:12 up 41 days,  3:12,  1 user,  load average: 7.92, 6.10, 2.31
$ nproc
2
`,'term')}
<p><b>Load average</b> — три числа: среднее за 1, 5 и 15 минут. Это сколько процессов в среднем <b>хотят работать</b>: выполняются, ждут процессор или ждут диск (состояние D, модуль [[mod:procs]]). Сравнивать надо с числом ядер (<code>nproc</code>):</p>
${tbl(['Load на 2 ядрах','Значит'],[['около 1','загружено наполовину, всё нормально'],['около 2','заняты все ядра, очереди ещё нет'],['<b>7.9</b>','на каждое ядро ~4 желающих — очередь, всё тормозит']])}
<p>Тренд читается по трём числам: <code>7.92, 6.10, 2.31</code> — за последние 15 минут нагрузка <mark>растёт</mark>, проблема началась недавно. Обратный порядок — проблема уходит.</p>
<h2>Шаг 2а. Процессор</h2>
${C(`
$ top
%Cpu(s): 92.1 us,  5.3 sy,  0.0 ni,  0.4 id,  1.8 wa,  0.0 hi,  0.2 si,  0.2 st
  PID USER     %CPU %MEM COMMAND
 1950 deploy  185.0 12.1 node
`,'term')}
${tbl(['Поле','Что это','Если много'],[
 ['<b>us</b>','время на код программ','программа много считает: цикл, тяжёлый запрос, нагрузка'],
 ['<b>sy</b>','время ядра','очень много системных вызовов, сети, переключений'],
 ['<b>id</b>','простой','мало id = процессор занят'],
 ['<b>wa</b>','ожидание диска','<mark>процессор свободен, но всё ждёт диск</mark> → смотри диск'],
 ['<b>st</b>','steal — у VPS «украли» время соседи по физическому серверу','проблема у хостинга, не у тебя']])}
<p>В <code>top</code>: <b>P</b> — сортировать по CPU, <b>M</b> — по памяти, <b>1</b> — показать каждое ядро, <b>c</b> — полные команды. 185% у node — это не ошибка: процент считается на одно ядро, процесс занял почти два.</p>
<h2>Шаг 2б. Память</h2>
${C(`
$ free -h
               total   used   free  shared  buff/cache  available
Mem:           3.8Gi  3.5Gi   90Mi    12Mi       210Mi      120Mi
Swap:          2.0Gi  1.9Gi  100Mi
`,'term')}
${BOX('Главное про free','<p>Смотри на <b>available</b>, а не на free. Linux специально занимает свободную память кэшем файлов (<b>buff/cache</b>) — так диск читается быстрее, и при нужде кэш мгновенно отдаётся программам. «free 90 МБ» само по себе ничего не значит, а вот <b>available 120 МБ из 3.8 ГБ</b> и почти полный <b>swap</b> — значит, памяти реально не хватает.</p><p><b>Swap</b> — запас памяти на диске. Он в тысячи раз медленнее RAM: когда система активно им пользуется, всё начинает дико тормозить. Когда и его не хватает, ядро запускает <b>OOM killer</b> и убивает самый «толстый» процесс (SIGKILL, код 137).</p>','deep')}
${CMDS([['free -h','память и swap'],['ps aux --sort=-%mem | head','кто ест больше всего памяти'],['dmesg -T | grep -i -E "oom|killed process"','кого убил OOM killer'],['vmstat 1 5','si/so ≠ 0 — идёт активная подкачка из swap: тормоза отсюда']])}
<h2>Шаг 2в. Диск: место и скорость</h2>
<p>У диска две разные беды: <b>кончилось место</b> (запись невозможна, сервисы падают) и <b>диск не успевает</b> (места полно, но всё ждёт чтения/записи).</p>
${CMDS([['df -h','место на разделах'],['df -i','кончились inode — «No space left», хотя место есть (миллионы мелких файлов)'],['du -sh /var/* | sort -h','какая папка большая — и идём глубже'],['sudo lsof +L1','удалённые, но всё ещё открытые файлы: место не освободилось, пока процесс их держит'],['iostat -x 1','нагрузка на диск: %util, await (пакет sysstat)'],['sudo iotop -o','кто именно сейчас читает/пишет']])}
${C(`
$ iostat -x 1
Device   r/s    w/s   rkB/s   wkB/s  await  %util
sda     12.0  850.0   96.0  98200.0  142.3   99.8
`,'term')}
<p><b>%util ≈ 100</b> — диск занят всё время, <b>await 142 мс</b> — каждая операция ждёт 142 мс (норма для SSD — единицы мс). Вместе с высоким <code>wa</code> в top это классика: «процессор свободен, а всё тормозит».</p>
<h2>Шаг 2г. Сеть</h2>
${CMDS([['ss -s','сводка: сколько соединений и в каких состояниях'],['ss -tan state established | wc -l','сколько открытых TCP-соединений'],['ss -tanp | awk \'{print $5}\' | cut -d: -f1 | sort | uniq -c | sort -rn | head','с каких IP больше всего соединений'],['ss -tlnp','кто какие порты слушает'],['sudo iftop / nload','кто и сколько гонит трафика']])}
<p>Тысячи соединений с пары IP — похоже на атаку или зациклившегося клиента. Много <code>TIME-WAIT</code> или <code>CLOSE-WAIT</code> — приложение неправильно закрывает соединения.</p>
<h2>Шаг 3. Кто виноват</h2>
${CMDS([['ps aux --sort=-%cpu | head','топ по процессору'],['ps aux --sort=-%mem | head','топ по памяти'],['pidstat 1','по процессам каждую секунду: CPU (pidstat -d — диск, -r — память)'],['top -p 1950','следить только за одним процессом'],['systemctl status --no-pager &lt;сервис&gt;','что это за процесс, к какому сервису относится']])}
<h2>Шаг 4. Почему — не останавливаемся на «кто»</h2>
<p>«node ест 185% CPU» — это симптом. Причина может быть в коде, в нагрузке, в соседнем сервисе или в настройках. Инструменты:</p>
${CMDS([['sudo strace -p 1950 -f -c','какие системные вызовы делает процесс и сколько (Ctrl+C — итог)'],['sudo strace -p 1950 -f -e trace=network,file','в реальном времени: куда стучится, какие файлы открывает'],['sudo lsof -p 1950','все открытые файлы и сокеты процесса'],['journalctl -u shop --since "30 min ago"','что сервис писал перед бедой'],['tail -n 200 /var/log/nginx/access.log','что пришло снаружи: всплеск запросов? бот?'],['last, journalctl --since …, git log','что менялось: деплой, cron, обновление пакетов']])}
${BOX('Главный вопрос: что изменилось?','<p>Сервер, который работал неделю и вдруг затормозил, почти всегда «затормозили». Ищи событие: деплой новой версии, задача cron (бэкап в 3:00, ротация логов), рост трафика (реклама, бот, атака), закончилось место, обновились пакеты. Совпадение времени начала проблемы с событием — половина ответа.</p>','warn')}
<h2>Типичные картины</h2>
${tbl(['Симптомы','Вероятная причина','Куда дальше'],[
 ['load высокий, us высокий, id ≈ 0','процесс много считает','ps по CPU → strace/логи → нагрузка или баг'],
 ['load высокий, <b>wa высокий, id большой</b>','диск не успевает','iostat → iotop → кто пишет (бэкап? логи? база?)'],
 ['available мало, swap растёт, si/so ≠ 0','не хватает памяти','ps по памяти → утечка? лимиты? dmesg на OOM'],
 ['сервисы падают «No space left on device»','кончилось место или inode','df -h, df -i → du → lsof +L1'],
 ['st высокий на VPS','шумные соседи у хостинга','мерить, писать в поддержку, менять тариф'],
 ['ресурсы в норме, а сайт медленный','ждём что-то внешнее: база, API, DNS','логи приложения, strace -e network, curl до зависимостей']])}`,
memo:`<p>Выучи не команды, а <b>порядок</b>: uptime → top (us/wa/st) → free → df/iostat → ss → кто → почему. Тренируйся вслух: «load 8 на 2 ядрах — перегруз; wa 60% — ждём диск; iostat util 100%; iotop — пишет бэкап; запущен cron в 10:00; переносим на ночь и ставим nice/ionice». Такой рассказ и есть хороший ответ на собесе.</p>`,

 ['«free показывает 90 МБ свободно — память кончилась»','Смотреть available и swap','Linux держит память под кэш файлов, это нормально. Нехватка — когда мало available и активно используется swap.'],
 ['Load 4 — «это много»','Сравнить с числом ядер: nproc','На 16 ядрах load 4 — отдых, на 1 ядре — перегруз в 4 раза.'],

 ['Нашёл процесс — убил kill -9 и «починил»','Выяснить почему: strace, lsof, логи, что менялось','Убийство — это лечение симптома. Причина (бот, утечка, cron, баг) никуда не делась.']],

sudo iotop -o -b -n 3
rm ~/lab/big`)},
 {t:'Ловушка удалённого файла: запусти процесс, который держит открытым большой файл, удали файл, убедись через df и lsof +L1, что место не вернулось. Освободи место, не убивая процесс.',sol:C(`dd if=/dev/zero of=~/lab/hold bs=1M count=500
tail -f ~/lab/hold > /dev/null &
rm ~/lab/hold; df -h ~; lsof +L1 | grep hold
: > /proc/$(pgrep -f "tail -f")/fd/3   # номер fd смотри в lsof (колонка FD)
df -h ~; kill %1`)},
 {t:'Почему, а не кто: запусти <code>strace -c</code> на <code>curl -s https://example.com</code> и на <code>ls -R /usr</code>. Какие системные вызовы преобладают в каждом случае и почему?',sol:C(`strace -c -f curl -s https://example.com > /dev/null
strace -c ls -R /usr > /dev/null`)+'<p>У curl — сетевые (connect, poll, recvfrom), у ls — файловые (getdents64, newfstatat). Так strace подсказывает, чем процесс на самом деле занят.</p>'}],
qa:[
 ['Сервер тормозит. Твои действия?','Не перезагружаю. uptime — load и тренд; top — us/sy/wa/st и кто сверху; free — available и swap; df -h/-i и iostat — диск; ss -s — сеть. Нашёл ресурс → процесс (ps --sort, pidstat, iotop) → почему (логи, strace, lsof, что менялось: деплой, cron, трафик) → лечу причину.'],
 ['Что такое load average и как его оценивать?','Средняя длина очереди процессов, которые выполняются или ждут CPU/диск, за 1/5/15 минут. Сравнивать с числом ядер. По трём числам видно тренд.'],
 ['Чем free отличается от available?','free — совсем не используемая память. available — сколько можно отдать программам, включая кэш файлов, который ядро освободит. Ориентироваться на available.'],
 ['Что такое iowait?','Доля времени, когда процессор простаивает, потому что процессы ждут диск. Высокий wa при свободном CPU — узкое место в дисках.'],
 ['Удалил большой файл, а место не освободилось. Почему?','Процесс держит файл открытым: запись из папки удалена, данные живы. lsof +L1 покажет. Перезапустить процесс или обнулить через /proc/PID/fd/N. Логи лучше обнулять truncate, а не rm.'],
 ['Что такое OOM killer?','Механизм ядра: когда кончились RAM и swap, ядро убивает процесс с наибольшим «весом» (SIGKILL). Следы — в dmesg; у контейнера — код 137.'],
 ['Что такое steal time?','На VPS — время, когда гипервизор отдавал физический процессор другим машинам. Высокий st — проблема у хостинга.'],
 ['Как узнать, почему процесс жрёт ресурсы?','strace -p (какие системные вызовы и куда), lsof -p (файлы, сокеты), логи сервиса, access.log (что пришло), сопоставление по времени с деплоем, cron, ростом трафика.']],
cheat:[['uptime','load average'],['nproc','число ядер'],['top (P, M, 1)','процессы; сортировка CPU/память'],['free -h','память: смотреть available'],['vmstat 1','r, b, si/so, wa'],['df -h / df -i','место / inode'],['du -sh /var/* | sort -h','большие папки'],['lsof +L1','удалённые открытые файлы'],['truncate -s 0 file','обнулить лог'],['iostat -x 1','нагрузка диска (%util, await)'],['iotop -o','кто пишет на диск'],['ss -s','сводка соединений'],['ps aux --sort=-%cpu | head','топ по CPU'],['pidstat 1','CPU по процессам'],['dmesg -T | grep -i oom','убийства OOM'],['strace -p PID -c','системные вызовы процесса']]});
/* shell · L1 · Терминал, оболочка, навигация, .sh / .bash / .ps1 */
MOD({id:'shell',title:'Терминал, навигация и .sh / .ps1',sub:'Оболочка, пути, флаги, справка — и чем скрипт .sh отличается от .ps1.',
case:`<p>Коллега присылает <code>deploy.sh</code>: «Запусти на сервере». Пишешь <code>deploy.sh</code> — <i>command not found</i>. Пишешь <code>./deploy.sh</code> — <i>Permission denied</i>. Исправил права — теперь <i>bash\r: No such file</i>. А второй коллега прислал <code>deploy.ps1</code> и говорит, что «у него всё работает».</p><p class="goal"><b>Цель модуля:</b> свободно ходить по серверу без мышки, находить справку у самой системы, а не в гугле, и понимать, почему скрипт не запускается и как это исправить, будь он .sh или .ps1.</p>`,
intro:`<p><b>Терминал</b> — это окно, куда ты печатаешь. <b>Оболочка (shell)</b> — программа внутри него, которая читает твою строку, разбирает её и запускает нужную программу. В Linux обычно оболочка <b>bash</b>, в Windows — <b>PowerShell</b>.</p>
<p>У серверов нет мышки и окон: ты заходишь по SSH и делаешь всё командами. Поэтому навигация, пути и чтение справки — это базовый навык, как умение пользоваться рулём.</p>
<p>Главная идея: <mark>команда = программа + флаги + аргументы</mark>. Не помнишь флаг — не гугли сразу, спроси систему: <code>man</code> и <code>--help</code>.</p>`,
theory:`<h2>Приглашение (prompt)</h2>
${C(`
user@web-01:~$          ← обычный пользователь ($), сейчас в домашней папке (~)
root@web-01:/etc#       ← root (#), сейчас в /etc
`,'out')}
<p><b>$</b> — обычный пользователь, <b>#</b> — root (суперпользователь, может всё, в том числе сломать систему). Видишь <code>#</code> — будь вдвое внимательнее.</p>
<h2>Как устроена команда</h2>
${C(`ls -l -a /var/log
ls -la /var/log            # короткие флаги можно склеить
ls --all --human-readable  # длинные флаги — через два дефиса`)}
${tbl(['Часть','Пример','Что это'],[['команда','<code>ls</code>','программа, которую запускаем'],['флаги (опции)','<code>-la</code>, <code>--all</code>','как именно работать'],['аргументы','<code>/var/log</code>','с чем работать']])}
<p>Откуда оболочка знает, где лежит <code>ls</code>? Она ищет файл в папках из переменной <code>$PATH</code>. Проверить: ${c('which ls')} → <code>/usr/bin/ls</code>.</p>
<h2>Пути</h2>
${tbl(['Запись','Значит','Пример'],[
 ['<code>/</code>','корень всей файловой системы','<code>cd /</code>'],
 ['<code>/etc/nginx</code>','<b>абсолютный</b> путь — от корня, работает откуда угодно','<code>cd /etc/nginx</code>'],
 ['<code>logs/app.log</code>','<b>относительный</b> — от текущей папки','<code>cat logs/app.log</code>'],
 ['<code>.</code>','текущая папка','<code>./deploy.sh</code>'],
 ['<code>..</code>','папка выше','<code>cd ../..</code>'],
 ['<code>~</code>','домашняя папка (<code>/home/user</code>, у root — <code>/root</code>)','<code>cd ~</code> или просто <code>cd</code>'],
 ['<code>-</code> (в cd)','предыдущая папка','<code>cd -</code>']])}
<h2>Навигация</h2>
${CMDS([['pwd','где я сейчас (print working directory)'],['ls','что в папке'],['ls -la','всё, включая скрытые (имя с точки: .env, .ssh), с правами и размером'],['ls -lh','размеры в K/M/G'],['cd /path','перейти'],['cd ..','на уровень выше'],['cd -','вернуться туда, где был'],['tree -L 2','дерево папок на 2 уровня (если установлен)']])}
<h2>Горячие клавиши — экономят часы</h2>
${tbl(['Клавиши','Что делает'],[['<b>Tab</b>','дописать имя файла/команды; два раза — показать варианты'],['<b>↑ / ↓</b>','прошлые команды'],['<b>Ctrl+R</b>','поиск по истории: начни печатать кусок команды'],['<b>Ctrl+C</b>','прервать текущую команду'],['<b>Ctrl+D</b>','конец ввода / выйти из оболочки (и из SSH-сессии)'],['<b>Ctrl+L</b>','очистить экран'],['<b>Ctrl+A / Ctrl+E</b>','в начало / в конец строки']])}
<h2>Справка — спроси систему сама</h2>
${CMDS([['man ls','полное руководство. Поиск внутри: /слово, следующее — n, выход — q'],['ls --help','краткая справка по флагам'],['type cd','что это: встроенная команда оболочки, алиас или файл'],['which nginx','где лежит программа'],['history','история команд']])}
<h2>Скрипты: .sh, .bash, .ps1</h2>
<p>Скрипт — это файл с командами, которые выполняются по очереди. <mark>В Linux расширение ничего не решает</mark> — это только подсказка человеку. Решают две вещи: <b>шебанг</b> в первой строке и <b>право на выполнение</b>.</p>
${C(`#!/usr/bin/env bash
# deploy.sh — первая строка (шебанг) говорит ядру, каким интерпретатором выполнять файл
echo "Привет с $(hostname)"`)}
${tbl(['Как запустить','Что происходит'],[
 ['<code>./deploy.sh</code>','нужен <code>chmod +x</code>; ядро читает шебанг и запускает bash. <code>./</code> обязательно: текущей папки нет в PATH'],
 ['<code>bash deploy.sh</code>','права на выполнение не нужны, шебанг игнорируется — явно bash'],
 ['<code>sh deploy.sh</code>','запустит <b>sh</b>, а в Ubuntu это <b>dash</b> — более простая оболочка. Bash-фишки (<code>[[ ]]</code>, массивы) сломаются'],
 ['<code>source deploy.sh</code> или <code>. deploy.sh</code>','выполнить <b>в текущей</b> оболочке: переменные и <code>cd</code> останутся после скрипта']])}
${tbl(['Расширение','Что это','Где'],[
 ['<code>.sh</code>','скрипт оболочки (обычно bash или sh) — соглашение','Linux, macOS, CI'],
 ['<code>.bash</code>','то же, но подчёркивает: нужен именно bash','Linux'],
 ['<code>.ps1</code>','скрипт <b>PowerShell</b>','Windows; на Linux — через <code>pwsh</code>']])}
${BOX('PowerShell — другой мир',`<p>Bash передаёт по пайпу <b>текст</b>, PowerShell — <b>объекты</b> со свойствами. В PowerShell есть алиасы <code>ls</code>, <code>cd</code>, <code>cat</code>, но это другие команды (<code>Get-ChildItem</code>…), и флаги у них другие: <code>ls -la</code> там не сработает.</p>
<p>Запуск: <code>.\\deploy.ps1</code> (обратный слэш) или <code>pwsh -File deploy.ps1</code>. Windows может запретить запуск скриптов политикой <b>ExecutionPolicy</b> — смотреть <code>Get-ExecutionPolicy</code>. Подробно — в модуле «PowerShell».</p>`,'deep')}
${BOX('Ловушка переносов строк',`<p>Windows заканчивает строки символами <b>CRLF</b> (\\r\\n), Linux — <b>LF</b> (\\n). Скрипт .sh, сохранённый в Windows, на сервере упадёт с ошибкой <code>/usr/bin/env: 'bash\\r': No such file or directory</code>. Лечение: <code>sed -i 's/\\r$//' deploy.sh</code> или <code>dos2unix deploy.sh</code>, а в редакторе выбрать LF.</p>`,'warn')}`,
memo:`<p>Неделю не трогай мышку в файловом менеджере: всё, что делаешь с файлами, делай в терминале. Каждую незнакомую команду сначала смотри через <code>--help</code>, потом через <code>man</code>. Ctrl+R вместо стрелки вверх 20 раз.</p>`,
traps:[
 ['deploy.sh → «command not found»','./deploy.sh','Оболочка ищет команды только в папках из $PATH. Текущей папки там нет (защита от подложенных программ), поэтому путь указываем явно.'],
 ['./deploy.sh → «Permission denied»','chmod +x deploy.sh, затем ./deploy.sh (или bash deploy.sh)','Чтобы запустить файл как программу, нужно право на выполнение (x).'],
 ['sh script.sh для скрипта с [[ ]] и массивами','bash script.sh или ./script.sh с шебангом bash','В Ubuntu sh — это dash, он не понимает bash-расширения: «[[: not found».'],
 ['«Расширение .sh делает файл исполняемым»','Исполняемым делает chmod +x, а интерпретатор — шебанг','Linux не смотрит на расширение. Файл run без расширения с шебангом и +x работает так же.'],
 ['Скрипт из Windows: «bash\\r: No such file»','Перевести переносы в LF: dos2unix или sed -i \'s/\\r$//\'','CRLF-переносы — невидимый \\r в конце каждой строки, в том числе в шебанге.']],

/* streams · L1 · Потоки, перенаправления, пайпы, коды возврата */
MOD({id:'streams',title:'Потоки, пайпы и коды возврата',sub:'stdin / stdout / stderr, > >> 2>&1, | , tee, xargs, $? и && ||.',
case:`<p>Бэкап базы настроен в cron и «работает» уже месяц. В день, когда он понадобился, оказалось, что последний удачный бэкап был три недели назад. Лог пустой — ни одной ошибки. Тогда же выясняется, что в CI тесты падали неделю, а пайплайн был зелёным.</p><p class="goal"><b>Цель модуля:</b> управлять тем, куда уходит вывод и куда — ошибки, склеивать команды пайпами и понимать коды возврата. На этом держится любой скрипт, cron и CI: без этого ошибки теряются молча.</p>`,
intro:`<p>У каждой программы в Linux есть три «трубы»: <b>вход</b> (stdin), <b>нормальный вывод</b> (stdout) и <b>вывод ошибок</b> (stderr). По умолчанию все три подключены к терминалу: ты печатаешь — программа читает, программа пишет — ты видишь.</p>
<p>Оболочка умеет <mark>переподключать эти трубы</mark>: вывод — в файл, ошибки — в мусорку, вывод одной программы — на вход другой. Из маленьких утилит, соединённых пайпами, собирается любая обработка логов — это и есть «философия Unix».</p>
<p>Зачем DevOps-у: логи cron и скриптов теряются, если не перенаправить stderr; пайплайн CI «зелёный», хотя команда упала, если не понимать коды возврата. Каждый скрипт деплоя держится на <code>&amp;&amp;</code>, <code>||</code> и <code>$?</code>.</p>`,
theory:`<h2>Три стандартных потока</h2>
${tbl(['Номер (fd)','Имя','Куда по умолчанию','Что туда идёт'],[
 ['<b>0</b>','stdin','клавиатура','входные данные'],
 ['<b>1</b>','stdout','терминал','нормальный результат'],
 ['<b>2</b>','stderr','терминал','ошибки и диагностика']])}
<p>В терминале stdout и stderr смешаны, поэтому кажется, что это одно и то же. Разница видна, когда начинаешь перенаправлять.</p>
<h2>Перенаправления</h2>
${CMDS([['cmd > out.txt','stdout в файл, файл <b>перезаписывается</b>'],['cmd >> out.txt','stdout в конец файла (дописать)'],['cmd 2> err.txt','stderr в файл'],['cmd > all.log 2>&1','и вывод, и ошибки в один файл'],['cmd &> all.log','то же самое, короткая запись bash'],['cmd 2>/dev/null','ошибки выбросить'],['cmd > /dev/null 2>&1','выбросить всё (только код возврата важен)'],['cmd < input.txt','stdin из файла']])}
${BOX('Как читать 2>&1','<p>«Поток 2 направь туда же, куда <b>сейчас</b> направлен поток 1». Оболочка обрабатывает перенаправления <mark>слева направо</mark>:</p>'+C(`cmd > file 2>&1    # 1 → file, потом 2 → туда же (file). Всё в файле.
cmd 2>&1 > file    # 2 → туда, где сейчас 1 (терминал), потом 1 → file. Ошибки на экране!`)+'<p><code>/dev/null</code> — устройство-«чёрная дыра»: всё, что туда пишут, исчезает.</p>','deep')}
<h2>Пайп |</h2>
<p><code>a | b</code> — stdout программы <b>a</b> подключается к stdin программы <b>b</b>. Обе запускаются <b>одновременно</b>, данные текут потоком — поэтому можно обработать лог на 10 ГБ, не загружая его в память.</p>
${C(`ps aux | grep nginx                 # процессы → только строки с nginx
cat access.log | grep " 500 " | wc -l   # сколько ответов 500
journalctl -u app | tail -n 50`)}
<p>В пайп попадает <b>только stdout</b>. Ошибки идут мимо, на экран. Чтобы отправить в пайп и их: <code>cmd 2>&amp;1 | grep error</code> (или <code>cmd |&amp; grep error</code> в bash).</p>
<h2>tee и xargs</h2>
${CMDS([['cmd | tee out.log','показать на экране <b>и</b> записать в файл'],['cmd | tee -a out.log','то же, дописывая'],['echo x | sudo tee /etc/f','запись в файл от root (см. модуль «Права»)'],['find . -name "*.tmp" | xargs rm','превратить строки из stdin в <b>аргументы</b> команды'],['find . -name "*.tmp" -print0 | xargs -0 rm','то же, безопасно для имён с пробелами']])}
<h2>Код возврата: $?</h2>
<p>Каждая программа при завершении возвращает число: <mark>0 — успех, всё остальное — ошибка</mark>. Последний код хранится в <code>$?</code>.</p>
${C(`
$ ls /etc/hosts
/etc/hosts
$ echo $?
0
$ ls /nope
ls: cannot access '/nope': No such file or directory
$ echo $?
2
`,'term')}
${CMDS([['a && b','b выполнится, только если a успешна (код 0)'],['a || b','b выполнится, только если a упала'],['a ; b','b выполнится в любом случае'],['a && echo OK || echo FAIL','короткое «если-иначе»']])}
<p>Код пайплайна — это код <b>последней</b> команды. <code>false | true</code> вернёт 0. Поэтому в скриптах пишут <code>set -o pipefail</code>: тогда пайп вернёт ошибку, если упала любая его часть.</p>
<h2>Подстановка вывода и here-doc</h2>
${C(`echo "Сегодня $(date +%F), хост $(hostname)"   # $(...) — подставить вывод команды
cat > app.conf <<EOF                            # here-doc: многострочный stdin
port=8080
env=prod
EOF`)}`,
memo:`<p>Для любой команды, которую запускаешь, спрашивай себя: «что тут идёт в stdout, а что в stderr, и какой код вернётся?». Проверяй: <code>cmd &gt;/dev/null</code> — что осталось на экране, то и было stderr; потом <code>echo $?</code>.</p>`,

 ['В CI шаг «build | tee build.log» упал, а job зелёный','set -o pipefail в начале скрипта','Код пайпа — код последней команды (tee), а она успешна. pipefail возвращает ошибку любой части.']],

ls /etc/hosts /nope > /dev/null 2>&1; echo $?   # 2 — одна из целей не найдена`)},
 {chk:'<p>В первом случае обе строки (вывод и ошибка) окажутся в файле, во втором ошибка останется на экране. Почему: перенаправления выполняются слева направо, и 2&gt;&amp;1 копирует то, куда stdout указывает <b>в этот момент</b>.</p>',t:'Докажи порядок перенаправлений: сравни <code>ls /etc/hosts /nope &gt; f 2&gt;&amp;1</code> и <code>ls /etc/hosts /nope 2&gt;&amp;1 &gt; f</code>. Запиши своими словами, почему результат разный.'},
 {t:'Сломай файл и пойми почему: создай файл с 5 строками в случайном порядке, выполни <code>sort f &gt; f</code>. Потом отсортируй правильно.',sol:C(`printf "c\\na\\ne\\nb\\nd\\n" > f
sort f > f; cat f          # пусто
printf "c\\na\\ne\\nb\\nd\\n" > f
sort f > f.tmp && mv f.tmp f; cat f
# или: sort -o f f  (sort сам безопасно пишет в тот же файл)`)},
 {t:'Pipefail вживую: проверь код <code>false | true</code> без и с <code>set -o pipefail</code>. Объясни, чем это грозит в CI.',sol:C(`false | true; echo $?          # 0
set -o pipefail
false | true; echo $?          # 1
set +o pipefail                # вернуть как было`)},
 {t:'Напиши однострочник-проверку: если в <code>/etc/os-release</code> есть <code>ubuntu</code>, печатает <code>Debian-family: apt</code>, иначе <code>not ubuntu</code>. Без if — только <code>grep -q</code>, <code>&amp;&amp;</code>, <code>||</code>.',sol:C(`grep -qi ubuntu /etc/os-release && echo "Debian-family: apt" || echo "not ubuntu"`)}],
qa:[
 ['Что такое stdin, stdout, stderr?','Три стандартных потока процесса: 0 — вход, 1 — нормальный вывод, 2 — ошибки. По умолчанию подключены к терминалу, оболочка может их перенаправить.'],
 ['Что значит 2>&1 и почему важен порядок?','stderr направить туда же, куда сейчас указывает stdout. Перенаправления читаются слева направо: > file 2>&1 — всё в файл; 2>&1 > file — ошибки остались в терминале.'],
 ['Чем > отличается от >>?','> перезаписывает файл (обнуляет до запуска команды), >> дописывает в конец.'],
 ['Что делает пайп?','Соединяет stdout левой команды со stdin правой. Команды работают параллельно, данные текут потоком. stderr через пайп не идёт.'],
 ['Что такое код возврата и $??','Число, которое процесс возвращает при выходе: 0 — успех, иначе ошибка. $? — код последней команды. На нём работают &&, ||, if и CI.'],
 ['Зачем set -o pipefail?','По умолчанию код пайпа — код последней команды, и падение в середине теряется. pipefail возвращает ошибку, если упала любая часть.'],
 ['Зачем tee и xargs?','tee — раздваивает поток: на экран и в файл (и запись от root через sudo tee). xargs — превращает строки stdin в аргументы команды, которая stdin не читает (rm, kill).']],
cheat:[['cmd > file 2>&1','всё в файл'],['cmd >> file','дописать'],['cmd 2>/dev/null','скрыть ошибки'],['cmd 2>&1 | grep x','ошибки тоже в пайп'],['cmd | tee file','экран + файл'],['echo $?','код последней команды'],['a && b || c','если успех — b, иначе c'],['set -o pipefail','ошибка любой части пайпа'],['find … -print0 | xargs -0 cmd','строки → аргументы'],['x=$(cmd)','вывод в переменную']]});
/* systemd · L1 · systemd, unit-файлы, journalctl, таймеры */
MOD({id:'systemd',title:'systemd и журнал',sub:'Сервисы: запуск, автозапуск, автоперезапуск, unit-файлы, journalctl, таймеры вместо cron.',
case:`<p>Ты запустил своё приложение на сервере командой <code>node app.js &amp;</code>. Всё работает. Ночью хостинг перезагрузил сервер для обновления — утром сайт лежит: приложение никто не запустил. Через неделю другая беда: приложение упало от ошибки в 3 часа ночи и пролежало до утра, потому что никто его не поднял. А когда ты спрашиваешь «почему упало?» — логов нет: вывод шёл в терминал, который давно закрыт.</p><p class="goal"><b>Цель модуля:</b> превращать любую программу в нормальный сервис — сам стартует при загрузке, сам поднимается после падения, работает от нужного пользователя, а все его логи лежат в одном месте и ищутся за секунды.</p>`,
intro:`<p><b>systemd</b> — первый процесс системы (PID 1, модуль [[mod:procs]]). Он запускает всё остальное при загрузке и дальше <mark>присматривает</mark> за сервисами: кто должен работать, в каком порядке стартовать, что делать при падении.</p>
<p>Без него каждый сервис пришлось бы запускать руками или самописными скриптами, и после перезагрузки или падения кто-то должен был бы проснуться ночью и поднять всё заново. С ним ты один раз описываешь сервис в коротком файле — и дальше он «живёт сам».</p>
<p>Второй половиной идёт <b>журнал</b> (journald): systemd собирает вывод всех сервисов и ядра в одно место с точным временем. Вместо поиска по десятку файлов — одна команда <code>journalctl</code>. Это первое, куда ты смотришь, когда «сервис не работает».</p>`,
theory:`<h2>Юниты</h2>
<p>Всё, чем управляет systemd, называется <b>unit</b> (юнит). Тип — по окончанию имени:</p>
${tbl(['Тип','Пример','Что это'],[
 ['<code>.service</code>','<code>nginx.service</code>','сервис — программа, которая работает (главный тип для нас)'],
 ['<code>.timer</code>','<code>logrotate.timer</code>','расписание запуска сервиса (замена cron)'],
 ['<code>.socket</code>','<code>docker.socket</code>','запуск сервиса при первом обращении к сокету'],
 ['<code>.target</code>','<code>multi-user.target</code>','группа юнитов, «состояние системы» (обычная загрузка без графики)'],
 ['<code>.mount</code>','<code>home.mount</code>','точка монтирования']])}
<h2>systemctl — пульт управления</h2>
${CMDS([['systemctl status nginx','состояние, PID, последние строки лога — <b>первая команда при любой проблеме</b>'],['sudo systemctl start nginx','запустить сейчас'],['sudo systemctl stop nginx','остановить (SIGTERM, потом SIGKILL)'],['sudo systemctl restart nginx','остановить и запустить — короткий простой'],['sudo systemctl reload nginx','перечитать конфиг без остановки (если сервис умеет)'],['sudo systemctl enable nginx','включить <b>автозапуск</b> при загрузке'],['sudo systemctl enable --now nginx','включить автозапуск и сразу запустить'],['sudo systemctl disable nginx','убрать из автозапуска'],['systemctl is-active nginx','active / inactive / failed — удобно в скриптах'],['systemctl --failed','все упавшие юниты'],['systemctl cat nginx','показать unit-файл сервиса'],['sudo systemctl daemon-reload','перечитать unit-файлы после их правки']])}
${BOX('start ≠ enable','<p><code>start</code> — запустить <b>сейчас</b>. <code>enable</code> — запускать <b>при каждой загрузке</b>. Это независимые вещи: можно запустить и забыть включить автозапуск (после перезагрузки сервис не поднимется), а можно включить автозапуск и не запустить сейчас. Поэтому почти всегда пишут <code>enable --now</code>.</p>','warn')}
<h2>Как читать systemctl status</h2>
${C(`
$ systemctl status shop
● shop.service - Shop API (Node.js)
     Loaded: loaded (/etc/systemd/system/shop.service; enabled; preset: enabled)
     Active: failed (Result: exit-code) since Tue 2026-11-25 03:12:44 UTC; 6h ago
    Process: 1950 ExecStart=/usr/bin/node /opt/shop/app.js (code=exited, status=1/FAILURE)
   Main PID: 1950 (code=exited, status=1/FAILURE)

Nov 25 03:12:44 web-01 node[1950]: Error: connect ECONNREFUSED 127.0.0.1:5432
Nov 25 03:12:44 web-01 systemd[1]: shop.service: Failed with result 'exit-code'.
`,'term')}
${tbl(['Строка','Что говорит'],[
 ['<b>Loaded</b>','где лежит unit-файл и включён ли автозапуск (<code>enabled</code>)'],
 ['<b>Active</b>','<code>active (running)</code> — работает; <code>failed</code> — упал; <code>inactive (dead)</code> — остановлен. И с какого времени'],
 ['<b>Main PID / status</b>','код выхода: 1 — ошибка программы, 137 — убит SIGKILL (модуль [[mod:procs]])'],
 ['последние строки','хвост журнала — часто там сразу причина (здесь: база на 5432 не отвечает)']])}
<h2>Unit-файл своего сервиса</h2>
${C(`# /etc/systemd/system/shop.service
[Unit]
Description=Shop API (Node.js)
After=network-online.target postgresql.service   # стартовать после сети и базы
Wants=network-online.target

[Service]
Type=simple
User=deploy                                       # не от root!
WorkingDirectory=/opt/shop
EnvironmentFile=/opt/shop/.env                    # переменные: PORT, DB_PASSWORD…
ExecStart=/usr/bin/node /opt/shop/app.js          # путь только абсолютный
Restart=on-failure                                # поднимать после падения
RestartSec=3

[Install]
WantedBy=multi-user.target                        # к какой «цели» привязать enable`,'out')}
${tbl(['Секция','Зачем'],[
 ['<b>[Unit]</b>','описание и порядок: <code>After=</code> — после чего стартовать, <code>Wants=/Requires=</code> — что нужно рядом'],
 ['<b>[Service]</b>','как запускать: команда, пользователь, папка, переменные, политика перезапуска'],
 ['<b>[Install]</b>','что делает <code>enable</code>: к какой цели загрузки привязать сервис']])}
${CMDS([['sudo nano /etc/systemd/system/shop.service','свои юниты — в /etc/systemd/system'],['sudo systemctl daemon-reload','после любой правки unit-файла'],['sudo systemctl enable --now shop','включить и запустить'],['sudo systemctl edit nginx','добавить свои настройки к чужому юниту (drop-in override), не трогая файл пакета']])}
<p>Юниты из пакетов лежат в <code>/lib/systemd/system/</code> (или <code>/usr/lib/…</code>) — их не правят: обновление пакета затрёт изменения. Для своих поправок есть <code>systemctl edit</code> — создаёт <code>/etc/systemd/system/nginx.service.d/override.conf</code>.</p>
${BOX('Почему «в терминале работает, а как сервис — нет»','<p>Сервис запускается не из твоей оболочки: у него нет твоего <code>~/.bashrc</code>, другой <code>PATH</code>, другая текущая папка, другой пользователь. Отсюда классика: относительные пути, переменные окружения, которых нет (они были в твоём <code>export</code>), права пользователя сервиса на файлы. Лечение: абсолютные пути, <code>WorkingDirectory</code>, <code>EnvironmentFile</code>, правильный <code>User</code>.</p>','deep')}
<h2>journalctl — журнал</h2>
${CMDS([['journalctl -u shop','весь журнал сервиса'],['journalctl -u shop -f','следить в реальном времени'],['journalctl -u shop -n 100 --no-pager','последние 100 строк'],['journalctl -u shop --since "1 hour ago"','за последний час (или --since "2026-11-25 03:00")'],['journalctl -p err -b','только ошибки с текущей загрузки'],['journalctl -b -1','журнал прошлой загрузки — что было перед перезагрузкой/падением'],['journalctl -k','только ядро (то же, что dmesg)'],['journalctl --disk-usage','сколько места занимает журнал'],['sudo journalctl --vacuum-time=14d','удалить записи старше 14 дней']])}
<p>Если в <code>/var/log/journal/</code> пусто, журнал хранится только в памяти и <mark>пропадает при перезагрузке</mark>. Тогда <code>journalctl -b -1</code> ничего не покажет. Включить постоянное хранение: <code>sudo mkdir -p /var/log/journal &amp;&amp; sudo systemctl restart systemd-journald</code>.</p>
<h2>Таймеры — расписание без cron</h2>
${C(`# /etc/systemd/system/backup.service        — что делать
[Service]
Type=oneshot
ExecStart=/opt/scripts/backup.sh

# /etc/systemd/system/backup.timer          — когда
[Timer]
OnCalendar=*-*-* 03:00:00
Persistent=true          # если сервер был выключен в 3:00 — выполнить при включении

[Install]
WantedBy=timers.target`,'out')}
${CMDS([['sudo systemctl enable --now backup.timer','включить таймер (не сервис!)'],['systemctl list-timers','все таймеры: когда последний раз и следующий'],['journalctl -u backup','вывод каждого запуска — сам, без >> log 2>&1']])}
<p>Плюсы таймеров перед cron: вывод сам попадает в журнал, видно, когда был прошлый запуск и чем кончился, есть <code>Persistent</code>. Cron остаётся простым и привычным — встретишь оба.</p>`,
memo:`<p>Цикл, который надо довести до автоматизма: написал unit → <code>daemon-reload</code> → <code>enable --now</code> → <code>status</code> → <code>journalctl -u … -f</code>. И при любой проблеме с сервисом — сначала <code>systemctl status</code>, потом <code>journalctl -u … -n 100</code>, и только потом догадки.</p>`,
traps:[
 ['Поправил unit-файл и сделал restart — ничего не поменялось','sudo systemctl daemon-reload, потом restart','systemd держит юниты в памяти. Без daemon-reload он не видит изменений (и сам предупредит в status).'],
 ['systemctl start shop — «готово», а после перезагрузки сервиса нет','sudo systemctl enable --now shop','start запускает один раз. Автозапуск включает enable.'],
 ['ExecStart=node app.js','ExecStart=/usr/bin/node /opt/shop/app.js','systemd требует абсолютный путь к программе и не ищет файлы относительно «текущей папки» без WorkingDirectory.'],
 ['Сервис без User= — работает от root','User=deploy (или отдельный пользователь сервиса)','Уязвимость в приложении сразу даёт атакующему root на сервере.'],
 ['Править /lib/systemd/system/nginx.service','sudo systemctl edit nginx (drop-in override)','Файлы пакетов перезапишет обновление. Свои настройки — в /etc.'],
 ['restart nginx после правки конфига на проде','nginx -t, затем reload','restart рвёт текущие соединения, а при ошибке в конфиге сервис не поднимется. reload мягко перечитает и при ошибке оставит старый конфиг работать.']],
ex:[
 {t:'c',q:'Что такое systemd?',o:['Система инициализации (PID 1): запускает сервисы и следит за ними','Менеджер пакетов','Веб-сервер','Файловая система'],a:0,e:'Запускает всё при загрузке, перезапускает упавшее, собирает журнал.'},
 {t:'c',q:'Чем <code>systemctl enable</code> отличается от <code>systemctl start</code>?',o:['enable — автозапуск при загрузке, start — запуск сейчас','Ничем','enable запускает сейчас, start — при загрузке','enable удаляет сервис'],a:0,e:'Это независимые действия. enable --now делает оба.'},

 {t:'c',q:'Что делает <code>Restart=on-failure</code>?',o:['Перезапускает сервис, если он завершился с ошибкой или был убит сигналом','Перезагружает сервер при ошибке','Запрещает перезапуск','Перезапускает каждые 5 минут'],a:0,e:'Сервис поднимется сам. RestartSec задаёт паузу перед перезапуском.'},
 {t:'c',q:'Что значит <code>Active: inactive (dead)</code>?',o:['Сервис остановлен (не работает, но и не падал)','Сервис упал с ошибкой','Сервис работает','Сервис удалён'],a:0,e:'failed — упал с ошибкой. inactive — просто не запущен (или штатно остановлен).'},
 {t:'i',q:'Впиши: включить автозапуск сервиса <code>shop</code> и сразу его запустить.',a:['sudo systemctl enable --now shop','systemctl enable --now shop','sudo systemctl enable --now shop.service','systemctl enable --now shop.service'],ph:'sudo systemctl …',e:'enable --now = enable + start.'},
 {t:'i',q:'Впиши: следить за журналом сервиса <code>nginx</code> в реальном времени.',a:['journalctl -u nginx -f','sudo journalctl -u nginx -f','journalctl -fu nginx','journalctl -f -u nginx','journalctl -u nginx.service -f'],ph:'journalctl …',e:'-u — юнит, -f — follow, как tail -f.'},
 {t:'i',q:'Впиши: перечитать unit-файлы после их изменения.',a:['sudo systemctl daemon-reload','systemctl daemon-reload'],ph:'sudo systemctl …',e:'Без этого systemd использует старую версию из памяти.'},
 {t:'i',q:'Впиши: показать только ошибки журнала с текущей загрузки.',a:['journalctl -p err -b','journalctl -b -p err','sudo journalctl -p err -b','journalctl -p 3 -b'],ph:'journalctl …',e:'-p err — приоритет «ошибка» и важнее, -b — текущая загрузка.'},
 {t:'s',q:'Собери порядок: превратить своё приложение в сервис.',p:['Написать /etc/systemd/system/shop.service','sudo systemctl daemon-reload','sudo systemctl enable --now shop','systemctl status shop','journalctl -u shop -f — убедиться, что стартовало без ошибок'],e:'Файл → перечитать → включить и запустить → проверить состояние → проверить лог.'},

Nov 25 03:12:44 web-01 node[1950]: Error: connect ECONNREFUSED 127.0.0.1:5432`,lang:'out',o:['Приложение не может подключиться к базе на порту 5432 — проверить postgresql','Нет прав на unit-файл','Сервис не включён в автозапуск','Ошибка в nginx'],a:0,e:'ECONNREFUSED — по адресу никто не слушает. 5432 — Postgres. Дальше: systemctl status postgresql. Заодно — After=postgresql.service в unit.'},

 {t:'c',g:'prac',q:'Сервер ночью сам перезагрузился. Как увидеть, что было в журнале перед перезагрузкой?',o:['journalctl -b -1 (если журнал постоянный — есть /var/log/journal)','journalctl -f','systemctl status','dmesg после перезагрузки'],a:0,e:'-b -1 — прошлая загрузка. Если журнал хранится только в памяти, он уже потерян — поэтому включают постоянное хранение.'},

 {t:'s',g:'job',q:'Тимлид: «shop не работает». Собери порядок разбора.',p:['systemctl status shop — состояние, код выхода, последние строки','journalctl -u shop -n 100 --no-pager — что было перед падением','Проверить зависимости из лога (база, порт, файлы, права)','Исправить причину','sudo systemctl restart shop и journalctl -u shop -f'],e:'Состояние → журнал → причина → исправление → проверка. Без догадок.'},
 {t:'c',g:'job',q:'Нужно, чтобы nginx мог открыть больше файлов (LimitNOFILE). Как правильно?',o:['sudo systemctl edit nginx → в override добавить [Service] LimitNOFILE=65535 → restart','Отредактировать /lib/systemd/system/nginx.service','Переустановить nginx','Прописать в ~/.bashrc'],a:0,e:'Drop-in переживёт обновление пакета. systemctl edit сам сделает daemon-reload.'},

 {t:'Разведка: найди все упавшие юниты, все включённые сервисы, посмотри unit-файл ssh или cron через <code>systemctl cat</code> и объясни каждую строку секции [Service].',sol:C(`systemctl --failed
systemctl list-unit-files --type=service --state=enabled

 {t:'Сервис своими руками: напиши скрипт <code>/opt/heartbeat/beat.sh</code>, который раз в 5 секунд печатает «alive» и время. Сделай из него сервис heartbeat от своего пользователя с Restart=on-failure, включи автозапуск, найди его вывод в журнале.',sol:C(`sudo mkdir -p /opt/heartbeat
printf '#!/usr/bin/env bash\\nwhile true; do echo "alive $(date +%%T)"; sleep 5; done\\n' | sudo tee /opt/heartbeat/beat.sh
sudo chmod +x /opt/heartbeat/beat.sh
sudo tee /etc/systemd/system/heartbeat.service <<EOF
[Unit]
Description=Heartbeat demo
[Service]
User=$USER
ExecStart=/opt/heartbeat/beat.sh
Restart=on-failure
RestartSec=3
[Install]
WantedBy=multi-user.target
EOF
sudo systemctl daemon-reload && sudo systemctl enable --now heartbeat
journalctl -u heartbeat -f`)},
 {t:'Проверь самовосстановление: убей процесс сервиса через <code>kill -9</code> и посмотри, что сделает systemd. Потом останови штатно <code>systemctl stop</code> — поднимется ли он теперь? Почему разница?',sol:'<p>После kill -9 сервис «упал» (сигнал) → Restart=on-failure поднимет его через 3 с (в журнале видно). systemctl stop — штатная остановка, это не failure → не перезапускается.</p>'},
 {h:'<p>Причину ищи в <code>systemctl status heartbeat</code> и <code>journalctl -u heartbeat -n 20</code> — там будет про путь. Абсолютный путь к скрипту знаешь из прошлой лабы. После правки — <code>daemon-reload</code>.</p>',t:'Сломай и почини: поставь в unit <code>ExecStart=beat.sh</code> (без пути), сделай daemon-reload и restart. Прочитай ошибку в status и journalctl, почини.'},
 {t:'Таймер вместо cron: сделай таймер, который каждые 2 минуты пишет <code>df -h /</code> в журнал. Найди его в <code>list-timers</code> и вывод в <code>journalctl</code>.',sol:C(`sudo tee /etc/systemd/system/diskcheck.service <<'EOF'
[Service]
Type=oneshot
ExecStart=/usr/bin/df -h /
EOF
sudo tee /etc/systemd/system/diskcheck.timer <<'EOF'
[Timer]
OnCalendar=*:0/2
[Install]
WantedBy=timers.target
EOF
sudo systemctl daemon-reload && sudo systemctl enable --now diskcheck.timer
systemctl list-timers | grep diskcheck
journalctl -u diskcheck -n 20`)},
 {t:'Включи постоянный журнал (если <code>/var/log/journal</code> нет), перезагрузись (в WSL: <code>wsl --shutdown</code> из Windows) и посмотри журнал прошлой загрузки.',sol:C(`sudo mkdir -p /var/log/journal && sudo systemctl restart systemd-journald
journalctl --list-boots
journalctl -b -1 -n 30`)+'<p>В WSL systemd должен быть включён: в <code>/etc/wsl.conf</code> секция <code>[boot]</code> со строкой <code>systemd=true</code> (в свежих Ubuntu для WSL уже так).</p>'}],
qa:[

 ['Разница enable и start, reload и restart?','start — запустить сейчас, enable — автозапуск при загрузке. restart — остановить и запустить (рвёт соединения), reload — перечитать конфиг без остановки.'],
 ['Из чего состоит unit-файл сервиса?','[Unit] — описание и зависимости (After, Wants); [Service] — ExecStart, User, WorkingDirectory, Environment, Restart; [Install] — WantedBy для enable.'],

 ['Почему программа работает из терминала, но не как сервис?','У сервиса другое окружение: нет ~/.bashrc и export, другой PATH, текущая папка, пользователь. Нужны абсолютные пути, WorkingDirectory, EnvironmentFile, правильный User.'],
 ['Зачем daemon-reload?','systemd держит конфигурацию юнитов в памяти. После правки unit-файла нужно перечитать, иначе используется старая версия.'],
 ['systemd timer или cron?','Таймер: вывод в журнале, видно прошлый/следующий запуск и результат, Persistent для пропущенных запусков, зависимости. Cron: проще и привычнее. Оба встречаются.'],

MOD({id:'text',title:'Текст и логи: grep, sort, uniq, awk, sed',sub:'Как за минуту ответить на вопрос «что происходит с сайтом» по логу на миллион строк.',
case:`<p>Пятница, 18:40. Менеджер пишет в общий чат: «Клиенты жалуются, что оплата не проходит!» Сайт при этом открывается. У тебя есть доступ к серверу и лог nginx на миллион строк. Через 5 минут нужно ответить: с какого времени это началось, сколько людей задело, какой именно адрес ломается, проблема у нас или у клиентов, атака это или баг после релиза.</p><p class="goal"><b>Цель модуля:</b> превращать гигабайтный лог в ответы на такие вопросы одной строкой из маленьких утилит (grep, awk, sort, uniq) и безопасно массово править конфиги (sed).</p>`,
intro:`<p>Почти всё на сервере — текст: логи, конфиги, вывод команд. Когда на проде что-то не так, ответ обычно лежит в логе. Но лог — это миллион строк, глазами его не прочитать.</p>
<p>Для этого есть набор маленьких утилит, каждая делает одно дело: <b>grep</b> отбирает строки, <b>cut</b> и <b>awk</b> вырезают нужные столбцы, <b>sort</b> сортирует, <b>uniq</b> схлопывает повторы, <b>wc</b> считает, <b>sed</b> заменяет. Соединяешь их пайпами (модуль [[mod:streams]]) — и получаешь ответ на вопрос вроде «с каких IP больше всего ошибок за последний час».</p>
<p>Учиться будем на логе <b>nginx</b> — это самый частый лог, который ты будешь разбирать. Ниже сначала коротко: что это за программа и что в её логе.</p>`,
theory:`<h2>Сначала: что такое nginx и его лог</h2>
<p><b>Nginx</b> (читается «энджин-икс») — веб-сервер. Он стоит «на входе» сайта: принимает запросы браузеров и либо сам отдаёт файлы (HTML, картинки), либо передаёт запрос твоему приложению и возвращает ответ. Подробно (настройка, reverse proxy) — в модуле «Nginx», сейчас нам нужен только его лог.</p>
<p>На <b>каждый</b> запрос nginx дописывает одну строку в <code>/var/log/nginx/access.log</code>. Формат по умолчанию называется <i>combined</i>:</p>
${C(`203.0.113.7 - - [24/Nov/2026:10:15:32 +0300] "GET /api/orders HTTP/1.1" 500 162 "-" "curl/8.5.0"`,'out')}
${tbl(['Поле (номер при делении по пробелам)','Значение','Что это'],[
 ['$1','<code>203.0.113.7</code>','IP клиента'],
 ['$2, $3','<code>- -</code>','не используется / имя пользователя (обычно пусто)'],
 ['$4, $5','<code>[24/Nov/2026:10:15:32 +0300]</code>','время запроса и часовой пояс'],
 ['$6, $7, $8','<code>"GET /api/orders HTTP/1.1"</code>','метод, путь, версия протокола'],
 ['<b>$9</b>','<code>500</code>','<mark>код ответа</mark>: 2xx ок, 3xx перенаправление, 4xx ошибка клиента (404 — нет такой страницы), 5xx ошибка сервера'],
 ['$10','<code>162</code>','размер ответа в байтах'],
 ['$11','<code>"-"</code>','referer — откуда пришёл'],
 ['$12…','<code>"curl/8.5.0"</code>','user agent — чем пришёл (браузер, бот, curl)']])}
<p>Ошибки самого nginx (не смог соединиться с приложением, нет прав на файл) — в соседнем <code>error.log</code>. Старые логи каждую ночь переименовываются в <code>access.log.1</code>, потом сжимаются в <code>access.log.2.gz</code> — это <b>ротация</b> (программа logrotate), чтобы логи не съели диск.</p>
<h2>grep — отобрать строки</h2>
${CMDS([['grep "500" access.log','строки, где есть 500'],['grep -i error app.log','без учёта регистра'],['grep -v healthcheck access.log','всё, <b>кроме</b> строк с healthcheck'],['grep -c " 404 " access.log','только число совпадений'],['grep -n error app.log','с номерами строк'],['grep -r "listen 80" /etc/nginx/','рекурсивно по папке'],['grep -A 5 -B 2 Exception app.log','2 строки до и 5 после — увидеть контекст'],['grep -E "500|502|503" access.log','несколько вариантов (расширенные регулярки)'],['grep -o "GET [^ ]*" access.log','вывести только совпавший кусок'],['zgrep " 500 " access.log.2.gz','искать в сжатом логе']])}
${BOX('Регулярные выражения — минимум','<p>grep, sed и awk ищут по <b>шаблонам</b>: <code>^</code> — начало строки, <code>$</code> — конец, <code>.</code> — любой символ, <code>*</code> — предыдущее сколько угодно раз, <code>[0-9]</code> — одна цифра, <code>[^ ]</code> — любой символ, кроме пробела. <code>^#</code> — строки-комментарии, <code>^$</code> — пустые строки. Пример: <code>grep -v -E "^#|^$" nginx.conf</code> — конфиг без комментариев и пустых строк.</p>','deep')}
<h2>cut, sort, uniq, wc — столбцы и подсчёт</h2>
${CMDS([['cut -d" " -f1 access.log','первое поле при делении по пробелу (IP)'],['cut -d: -f1 /etc/passwd','имена пользователей'],['sort file','по алфавиту'],['sort -n','как числа (иначе 10 &lt; 9)'],['sort -rn','числа по убыванию'],['sort -h','понимает 1K, 2M, 3G (для du -h)'],['sort -k2 -n','по второму столбцу'],['uniq','схлопнуть <b>соседние</b> повторы'],['uniq -c','и посчитать, сколько раз'],['sort -u','отсортировать и оставить уникальные'],['wc -l','строки (-w слова, -c байты)']])}
<p><mark>uniq видит только соседние одинаковые строки</mark>, поэтому перед ним всегда <code>sort</code>.</p>
<h2>awk — столбцы с условиями и арифметикой</h2>
<p>awk делит каждую строку на поля <code>$1, $2, …</code> (по пробелам; другой разделитель — <code>-F</code>), <code>$0</code> — вся строка, <code>NF</code> — число полей. Программа: <code>условие { действие }</code>.</p>
${C(`awk '{print $1}' access.log                 # IP
awk '$9 == 500' access.log                  # только строки с кодом 500
awk '$9 >= 500 {print $1, $7}' access.log   # IP и путь для всех 5xx
awk -F: '$3 >= 1000 {print $1}' /etc/passwd # обычные пользователи
awk '{s += $10} END {print s/1024/1024 " MB"}' access.log   # трафик за файл`)}
<h2>sed — найти и заменить</h2>
${C(`sed 's/http:/https:/' file           # заменить первое вхождение в каждой строке
sed 's/http:/https:/g' file          # g — все вхождения
sed -i 's/^port=.*/port=9090/' app.conf   # -i — прямо в файле!
sed -i.bak 's/a/b/g' app.conf        # то же, но сохранить копию app.conf.bak
sed -n '100,120p' big.log            # показать строки 100–120
sed '/^#/d' nginx.conf               # удалить строки-комментарии (в выводе)`)}
<h2>Главный приём: «топ» чего угодно</h2>
${C(`awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -10`)}
<p>Читаем по шагам: вырезать IP → отсортировать (чтобы одинаковые оказались рядом) → посчитать повторы → отсортировать по числу по убыванию → первые 10. Меняешь <code>$1</code> на <code>$9</code> — топ кодов ответа, на <code>$7</code> — топ страниц. Это самый частый однострочник на собеседованиях и инцидентах.</p>`,
memo:`<p>Возьми любой реальный лог (или сгенерируй в лабе) и задай ему 5 вопросов: сколько всего запросов, сколько 5xx, топ-10 IP, топ-10 страниц с ошибкой 404, в какую минуту было больше всего запросов. Каждый ответ — одна строка из пайпов. Собирай её по одному звену и смотри промежуточный вывод через <code>| head</code>.</p>`,
traps:[
 ['sort | uniq -c без sort: awk … | uniq -c','awk … | sort | uniq -c','uniq схлопывает только соседние строки. Без сортировки один IP посчитается много раз кусками.'],
 ['sort -r для чисел из uniq -c','sort -rn','Без -n сортировка по тексту: «9» окажется выше «10», «100».'],
 ['grep 500 access.log — «это ошибки 500»','awk \'$9 == 500\' access.log','grep 500 найдёт и размер 1500 байт, и время 10:15:00, и /page500. Точнее — сравнивать именно поле кода.'],
 ['sed -i … сразу на проде','Сначала sed без -i (смотришь результат), потом sed -i.bak','-i меняет файл без подтверждения. Ошибка в выражении испортит конфиг, а бэкапа не будет.'],
 ['grep по access.log, а нужные данные во вчерашнем access.log.2.gz','zgrep … access.log*  или  zcat access.log.*.gz | grep …','После ротации старые логи сжаты. Обычный grep по .gz ищет в бинарных данных.']],
ex:[
 {t:'c',q:'Что делает nginx?',o:['Принимает HTTP-запросы и отдаёт файлы или передаёт запрос приложению','Хранит данные как база данных','Планирует задачи по расписанию','Управляет пакетами'],a:0,e:'Nginx — веб-сервер и обратный прокси: «вход» сайта.'},
 {t:'c',q:'В строке combined-лога nginx код ответа — это поле номер…',o:['9','1','7','4'],a:0,e:'$1 IP, $4–$5 время, $6–$8 запрос, $9 код, $10 байты.'},
 {t:'c',q:'Что делает <code>grep -v healthcheck</code>?',o:['Показывает все строки, КРОМЕ содержащих healthcheck','Показывает только healthcheck','Считает healthcheck','Ищет без учёта регистра'],a:0,e:'-v — инвертировать отбор. Удобно убрать шум от проверок балансировщика.'},
 {t:'c',q:'Почему перед <code>uniq -c</code> ставят <code>sort</code>?',o:['uniq схлопывает только соседние одинаковые строки','sort ускоряет uniq','Без sort uniq не запустится','Чтобы убрать пустые строки'],a:0,e:'Одинаковые строки должны стоять рядом — это и делает sort.'},
 {t:'c',q:'<code>sort</code> без флагов выдал 10, 100, 9. Что добавить?',o:['-n','-r','-u','-k'],a:0,e:'-n — числовая сортировка. Без неё строки сравниваются посимвольно.'},

 {t:'i',q:'Впиши awk: показать только строки <code>access.log</code>, где код ответа равен 404.',a:["awk '$9 == 404' access.log","awk '$9==404' access.log","awk '$9 == \"404\"' access.log","awk '$9 == 404 {print}' access.log","awk '$9==404 {print $0}' access.log"],ph:"awk '…' access.log",e:'Условие без действия печатает строку целиком.'},

lab:[
 {t:'Сгенерируй учебный лог nginx на 5000 строк (скрипт в решении — сначала попробуй прочитать и понять его сам, это повторение пайпов и awk). Потом ответь одной строкой на каждый вопрос: всего запросов; сколько 5xx; топ-5 IP; топ-5 страниц с 404; какой процент запросов — ошибки 5xx.',h:'<p>Для процента в awk есть END: <code>awk \'{n++} $9>=500{e++} END{print e/n*100}\'</code>.</p>',sol:C(`for i in $(seq 5000); do
  ip="10.0.0.$((RANDOM % 20))"; code=$(shuf -n1 -e 200 200 200 200 301 404 404 500 502)
  path=$(shuf -n1 -e / /login /api/orders /api/pay /static/app.js /admin)
  echo "$ip - - [25/Nov/2026:10:$((RANDOM%60)):00 +0300] \\"GET $path HTTP/1.1\\" $code $((RANDOM%5000)) \\"-\\" \\"curl/8.5\\""
done > ~/lab/access.log

wc -l ~/lab/access.log
awk '$9 >= 500' ~/lab/access.log | wc -l
awk '{print $1}' ~/lab/access.log | sort | uniq -c | sort -rn | head -5
awk '$9 == 404 {print $7}' ~/lab/access.log | sort | uniq -c | sort -rn | head -5
awk '{n++} $9>=500{e++} END{printf "%.1f%%\\n", e/n*100}' ~/lab/access.log`)},
 {chk:'<p>grep -c 500 даст число больше, чем awk: он ловит 500 и в размере ответа, и во времени, и в пути. uniq -c без sort покажет одно и то же значение несколькими строками. sort -r поставит «9» выше «100».</p>',t:'Докажи себе ловушки: на том же логе сравни <code>grep -c 500</code> и <code>awk \'$9==500\' | wc -l</code>; сравни <code>uniq -c</code> с <code>sort</code> и без; <code>sort -r</code> и <code>sort -rn</code> на выводе uniq -c. Запиши, где и почему разошлось.'},
 {t:'Безопасная правка конфига: скопируй <code>/etc/ssh/sshd_config</code> (или любой конфиг) в <code>~/lab</code>, выведи его без комментариев и пустых строк, затем через sed поменяй <code>#Port 22</code> на <code>Port 2222</code> — сначала без -i, потом с <code>-i.bak</code>. Проверь <code>diff</code> между файлом и .bak.',sol:C(`cp /etc/ssh/sshd_config ~/lab/sshd_config 2>/dev/null || cp /etc/ssh/ssh_config ~/lab/sshd_config
grep -v -E "^#|^\\s*$" ~/lab/sshd_config
sed 's/^#Port 22/Port 2222/' ~/lab/sshd_config | grep Port
sed -i.bak 's/^#Port 22/Port 2222/' ~/lab/sshd_config
diff ~/lab/sshd_config.bak ~/lab/sshd_config`)},
 {t:'Найди в <code>/etc/passwd</code> всех пользователей, у которых есть настоящая оболочка (не nologin и не false), и выведи имя и оболочку. Затем — всех с UID ≥ 1000.',sol:C(`grep -v -E "nologin|false" /etc/passwd | cut -d: -f1,7
awk -F: '$3 >= 1000 {print $1, $3}' /etc/passwd`)}],
