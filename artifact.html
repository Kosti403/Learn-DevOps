<title>DevOps по-тихому</title><style>:root{color-scheme:dark;--bg:#0f1417;--pn:#161d21;--pn2:#1d262b;--ln:#2a363d;--tx:#d7e0e4;--mu:#8a9aa2;--ac:#4fd18b;

.ticket{background:var(--pn);border:1px solid var(--ln);border-left:4px solid var(--mix);border-radius:10px;padding:10px 16px;margin:12px 0}.ticket.ok{opacity:.7;border-left-color:var(--ok)}.ticket h3{margin:.2em 0 .5em}.ticket .tag{color:var(--mix)}
.rdy{color:var(--ok)}.nrdy{color:var(--mu)}
.projbox{background:var(--pn);border:1px dashed var(--mix);border-radius:8px;padding:2px 18px 10px;margin-top:20px}.projbox h2{color:var(--mix)}</style><button id="burger" aria-label="Меню">☰ Модули</button>
<nav id="side"></nav>
<main id="main"></main><script>/* Помощники для текста модулей. Всё глобально (один файл после сборки).
   esc(s)             — экранировать HTML
   C(code,lang)       — блок кода с раскраской. lang: 'sh' (по умолч.), 'term' ($ команда + вывод), 'out' (как есть), 'yaml', 'ps' (PowerShell)
   c(code)            — команда в строке текста (inline)
   tbl(head,rows)     — таблица
   CMDS([[cmd,что делает],…]) — таблица команд с раскраской
   TR([[ошибка,правильно,почему],…]) — ловушки
   BOX(title,html,kind) — врезка: kind 'idea' | 'warn' | 'deep' (глубже: механизм под капотом) */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const CMDWORD=/^(sudo|time|watch|xargs|exec|env)$/;
function hlSh(line){
  if(/^\s*#/.test(line))return `<i class="k-com">${esc(line)}</i>`;
  let out='',first=true,m;const re=/(\s+)|("(?:[^"\\]|\\.)*"|'[^']*')|(\|\||&&|\||;|>>|2>&1|>|<)|(#.*$)|([^\s|;&<>]+)/g;
  while((m=re.exec(line))){
    if(m[1]){out+=m[1];continue}
    if(m[2]){out+=`<span class="k-str">${esc(m[2])}</span>`;continue}
    if(m[3]){out+=`<span class="k-op">${esc(m[3])}</span>`;if(/^(\|\||&&|\||;)$/.test(m[3]))first=true;continue}
    if(m[4]){out+=`<i class="k-com">${esc(m[4])}</i>`;continue}
    const t=m[5];let k;
    if(first){k='k-cmd';if(!CMDWORD.test(t)&&!/=/.test(t))first=false}
    else if(/^-/.test(t))k='k-flag';
    else if(/^\$/.test(t))k='k-var';
    else if(/^(\/|~|\.\/|\.\.\/)/.test(t))k='k-path';
    out+=k?`<span class="${k}">${esc(t)}</span>`:esc(t)}
  return out}
function hlYaml(line){
  if(/^\s*#/.test(line))return `<i class="k-com">${esc(line)}</i>`;
  const m=line.match(/^(\s*-?\s*)([\w.\-\/]+)(:)(.*)$/);
  return m?esc(m[1])+`<span class="k-cmd">${esc(m[2])}</span>`+m[3]+`<span class="k-str">${esc(m[4])}</span>`:esc(line)}
function C(code,lang='sh'){
  const lines=code.replace(/^\n|\n\s*$/g,'').split('\n');
  const body=lines.map(l=>{
    if(lang==='term')return /^\$ /.test(l)?`<span class="k-pr">$ </span>`+hlSh(l.slice(2)):`<span class="k-outl">${esc(l)}</span>`;
    if(lang==='out')return esc(l);
    if(lang==='yaml')return hlYaml(l);
    return hlSh(l)}).join('\n');
  return `<pre class="code">${body}</pre>`}
const c=s=>`<code>${hlSh(s)}</code>`;
const tbl=(h,rows)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const CMDS=rows=>`<div class="tw"><table class="cmds"><tbody>${rows.map(([k,v])=>`<tr><td><code>${hlSh(k)}</code></td><td>${v}</td></tr>`).join('')}</tbody></table></div>`;
const TR=rows=>`<ul class="traps">${rows.map(([w,r,y])=>`<li><div><span class="bad">✗ ${w}</span></div><div><span class="good">✓ ${r}</span></div><div class="why">${y}</div></li>`).join('')}</ul>`;
const BOX=(t,h,k='idea')=>`<div class="box ${k}"><b>${t}</b>${h}</div>`;
/* Реестр. Каждый файл src/modules/** вызывает MOD({...}) или REV({...}). Порядок — в course/order.js.
   MOD({
     id, lvl:'L1', title, sub,
     intro:  'html — Что это и зачем (3–6 предложений)',
     theory: 'html — суть: механизм, команды, схемы',
     memo:   'html — Как тренировать',
     traps:  [[ошибка, правильно, почему], …],
     ex:     [задания — формат в engine/ex.js],
     lab:    [{t:'задача руками', h:'подсказка', chk:'как проверить себя', sol:'решение'}],
     qa:     [[вопрос собеса, ответ], …],
     cheat:  [[команда, что делает], …]   — уходит в общую шпаргалку
   }) */
const MODS={};
const MOD=m=>{if(MODS[m.id])throw new Error('Дубль модуля: '+m.id);MODS[m.id]=Object.assign({ex:[],lab:[],qa:[],cheat:[],traps:[]},m)};
const REV=r=>MOD(Object.assign({review:true,lvl:'',sub:'Накопительный обзор: без подсказок, темы смешаны.'},r));
/* files · L1 · Иерархия ФС и работа с файлами */
MOD({id:'files',title:'Файлы и иерархия ФС',sub:'Где что лежит на сервере (/etc, /var, /opt…) и как читать, копировать, искать файлы.',
case:`<p>В 2 часа ночи приходит алерт: «Диск на web-01 заполнен на 95%». Через час сервер встанет: база не сможет писать. Утром другая задача: «Поменяй порт в конфиге приложения». Где этот конфиг? Где логи? Что можно удалять, а что — нельзя ни в коем случае?</p><p class="goal"><b>Цель модуля:</b> на любом незнакомом сервере за минуту находить конфиги, логи и данные сервисов, читать огромные файлы, искать файлы по имени и размеру, безопасно копировать и править — с бэкапом и путём отката.</p>`,
intro:`<p>В Linux нет дисков C: и D: — есть <b>одно дерево</b>, которое растёт из корня <code>/</code>. Все диски, флешки и даже информация о процессах «подвешены» в это дерево в виде папок.</p>
<p>У каждой папки есть назначение, и оно <mark>одинаковое на всех серверах</mark> (стандарт FHS). Поэтому на незнакомом сервере ты сразу знаешь: конфиги — в <code>/etc</code>, логи — в <code>/var/log</code>, данные сервисов — в <code>/var/lib</code>.</p>
<p>Принцип «<b>всё есть файл</b>»: конфиг — файл, лог — файл, диск — файл в <code>/dev</code>, сведения о процессе — файлы в <code>/proc</code>. Значит, одни и те же <code>cat</code>, <code>grep</code>, <code>tail</code> работают со всем.</p>`,
theory:`<h2>Карта файловой системы</h2>
${tbl(['Папка','Что там','Пример'],[
 ['<code>/etc</code>','<mark>конфиги</mark> системы и сервисов','<code>/etc/nginx/nginx.conf</code>, <code>/etc/ssh/sshd_config</code>'],
 ['<code>/var/log</code>','<mark>логи</mark>','<code>/var/log/nginx/error.log</code>, <code>/var/log/syslog</code>'],
 ['<code>/var/lib</code>','данные сервисов (меняются в работе)','<code>/var/lib/docker</code>, <code>/var/lib/postgresql</code>'],
 ['<code>/opt</code>','сторонние приложения, часто — твой сервис','<code>/opt/app</code>'],
 ['<code>/home</code>','домашние папки пользователей','<code>/home/deploy/.ssh</code>'],
 ['<code>/root</code>','домашняя папка root','<code>/root/.bashrc</code>'],
 ['<code>/usr/bin</code>, <code>/bin</code>','программы (в современных системах /bin → /usr/bin)','<code>/usr/bin/ls</code>'],
 ['<code>/tmp</code>','временные файлы, могут удаляться при перезагрузке','—'],
 ['<code>/proc</code>, <code>/sys</code>','<b>виртуальные</b>: ядро показывает своё состояние в виде файлов','<code>/proc/cpuinfo</code>, <code>/proc/1234/</code>'],
 ['<code>/dev</code>','устройства','<code>/dev/sda</code>, <code>/dev/null</code>'],
 ['<code>/boot</code>','ядро и загрузчик','<code>/boot/vmlinuz-…</code>'],
 ['<code>/mnt</code>, <code>/media</code>','точки монтирования дисков','—']])}
${BOX('Как запомнить','<p><b>etc</b> — «настройки», <b>var</b> — «variable», то, что меняется в работе (логи, данные), <b>opt</b> — «optional», то, что поставили сверху. Сервер сломался → смотришь <code>/var/log</code>, хочешь поменять поведение → <code>/etc</code>.</p>')}
<h2>Чтение файлов</h2>
${CMDS([['cat file','вывести целиком (только для маленьких файлов)'],['less file','листать: / — поиск, n — дальше, G — в конец, q — выход'],['head -n 20 file','первые 20 строк'],['tail -n 50 file','последние 50 строк'],['tail -f app.log','следить, как дописывается лог (Ctrl+C — выйти)'],['tail -F app.log','то же, но переживает ротацию лога (файл пересоздали)'],['wc -l file','сколько строк'],['file x','что это за файл: текст, бинарник, архив'],['stat file','размер, права, владелец, даты изменения']])}
<h2>Создание, копирование, удаление</h2>
${CMDS([['touch a.txt','создать пустой файл (или обновить дату)'],['mkdir -p a/b/c','создать папки вместе с родителями'],['cp a.txt b.txt','копировать файл'],['cp -r src/ dst/','копировать папку (рекурсивно)'],['cp -a src/ dst/','копировать с сохранением прав, владельца и дат (для бэкапов)'],['mv old new','переместить или <b>переименовать</b>'],['rm file','удалить файл'],['rm -r dir/','удалить папку со всем содержимым'],['ln -s target link','символическая ссылка (ярлык)']])}
${BOX('Корзины нет','<p><code>rm</code> удаляет сразу и навсегда. <code>rm -rf</code> не спрашивает подтверждения и не жалуется на ошибки. Перед удалением — <code>ls</code> того же пути. Особенно опасно с переменной: если <code>$DIR</code> пустая, <code>rm -rf $DIR/*</code> превращается в <code>rm -rf /*</code> — удаление всего содержимого корня (защита rm --preserve-root спасает только от голого <code>/</code>, но не от <code>/*</code>).</p>','warn')}
<h2>Поиск файлов</h2>
${C(`find /etc -name "*.conf"                # по имени (кавычки обязательны!)
find /var/log -name "*.log" -mtime +7    # изменённые больше 7 дней назад
find / -size +500M 2>/dev/null           # больше 500 МБ, ошибки доступа скрыть
find /opt/app -type d                    # только папки (-type f — только файлы)`)}
<p>Шаблоны <code>*</code> (любые символы) и <code>?</code> (один символ) раскрывает <b>оболочка</b> до запуска команды. Поэтому в <code>find -name</code> шаблон берут в кавычки — иначе bash раскроет его сам по файлам текущей папки.</p>
<h2>Символические ссылки</h2>
${C(`
$ ls -l /etc/nginx/sites-enabled/
lrwxrwxrwx 1 root root 34 May 3 myapp -> /etc/nginx/sites-available/myapp
`,'term')}
<p>Буква <b>l</b> в начале и стрелка <code>-&gt;</code> — это ссылка. Nginx включает сайт ссылкой из <code>sites-enabled</code> на файл в <code>sites-available</code>: удалил ссылку — сайт выключен, а конфиг остался.</p>`,
memo:`<p>Зайди на свою Ubuntu и пройди по карте: открой по одному файлу из <code>/etc</code>, <code>/var/log</code>, <code>/proc</code>. Для каждой папки скажи вслух, что там лежит. Потом найди через <code>find</code> 5 самых больших файлов в системе.</p>`,
traps:[
 ['cat /var/log/syslog на 2 ГБ','less /var/log/syslog или tail -n 200','cat вывалит гигабайты в терминал, и SSH-сессия «зависнет». Большие файлы читаем постранично или с конца.'],
 ['find / -name *.log','find / -name "*.log"','Без кавычек bash раскроет *.log по текущей папке ещё до запуска find, и поиск будет не тот (или ошибка).'],
 ['cp /etc/nginx /backup/','cp -r /etc/nginx /backup/ (а лучше cp -a)','Без -r папки не копируются: «omitting directory». -a ещё и сохраняет права и владельца.'],
 ['rm -rf $APP_DIR/* без проверки','[ -n "$APP_DIR" ] && rm -rf "$APP_DIR"/* — и сначала ls','Пустая переменная превращает команду в rm -rf /* — удаление всего. Кавычки защищают имена с пробелами.'],
 ['tail -f на лог, который ротируется','tail -F','После ротации старый файл переименован, -f продолжает читать его и «молчит». -F переоткрывает файл по имени.']],
ex:[
 {t:'c',q:'Где лежат конфигурационные файлы системы и сервисов?',o:['/etc','/var','/opt','/usr/bin'],a:0,e:'/etc — конфиги: /etc/nginx, /etc/ssh, /etc/hosts.'},
 {t:'c',q:'Где искать логи nginx в первую очередь?',o:['/var/log/nginx','/etc/nginx/log','/opt/nginx','/tmp/nginx'],a:0,e:'Логи — в /var/log: access.log и error.log.'},
 {t:'c',q:'Где Docker хранит образы и данные контейнеров по умолчанию?',o:['/var/lib/docker','/etc/docker','/opt/docker','/home/docker'],a:0,e:'/var/lib — изменяемые данные сервисов. В /etc/docker лежит только конфиг daemon.json.'},
 {t:'c',q:'Что такое <code>/proc</code>?',o:['Виртуальная ФС: ядро показывает процессы и своё состояние как файлы','Папка с программами','Папка с логами процессов','Временные файлы'],a:0,e:'/proc не хранится на диске. /proc/cpuinfo, /proc/meminfo, /proc/&lt;pid&gt;/ — живые данные ядра.'},
 {t:'c',q:'Какая команда подходит, чтобы <b>следить</b> за логом в реальном времени?',o:['tail -f','head -f','cat -f','less -n'],a:0,e:'tail -f дописывает новые строки по мере появления. Выход — Ctrl+C.'},
 {t:'c',q:'Как переименовать файл <code>app.conf</code> в <code>app.conf.bak</code>?',o:['mv app.conf app.conf.bak','rename app.conf','cp -r app.conf','ln app.conf.bak'],a:0,e:'Отдельной команды rename в базе нет: переименование = перемещение в то же место под новым именем.'},
 {t:'i',q:'Впиши команду: создать папки <code>/opt/app/releases/v1</code> одним махом, даже если родителей нет.',a:['mkdir -p /opt/app/releases/v1'],ph:'mkdir …',e:'-p создаёт всю цепочку и не ругается, если папка уже есть.'},
 {t:'i',q:'Впиши команду: показать последние 100 строк файла <code>/var/log/syslog</code>.',a:['tail -n 100 /var/log/syslog','tail -100 /var/log/syslog','tail -n100 /var/log/syslog'],ph:'tail …',e:'tail -n 100 — последние 100 строк. По умолчанию tail показывает 10.'},
 {t:'i',q:'Впиши команду: скопировать папку <code>conf</code> в <code>conf.bak</code> с сохранением прав и владельца.',a:['cp -a conf conf.bak','cp -a conf/ conf.bak','cp -a conf/ conf.bak/','cp -rp conf conf.bak'],ph:'cp …',e:'-a (archive) = рекурсивно + права + владелец + даты + ссылки. Для бэкапов конфигов — то, что нужно.'},
 {t:'i',q:'Впиши команду: найти в <code>/etc</code> все файлы с именем, оканчивающимся на <code>.conf</code>.',a:['find /etc -name "*.conf"',"find /etc -name '*.conf'",'find /etc -type f -name "*.conf"',"find /etc -type f -name '*.conf'"],ph:'find …',e:'Шаблон в кавычках, чтобы его разобрал find, а не bash.'},
 {t:'s',q:'Собери путь к главному конфигу nginx.',p:['/etc','/nginx','/nginx.conf'],e:'/etc/nginx/nginx.conf — главный конфиг. Сайты — в /etc/nginx/sites-available и sites-enabled.'},
 {t:'r',q:'Что это за объект?',code:`$ ls -l /etc/nginx/sites-enabled/
lrwxrwxrwx 1 root root 34 May  3 10:12 shop -> /etc/nginx/sites-available/shop`,lang:'term',o:['Символическая ссылка на файл в sites-available','Обычный файл конфига','Папка','Сломанный файл'],a:0,e:'l в первом символе и стрелка -> — symlink. Конфиг живёт в sites-available, ссылка включает сайт.'},
 {t:'r',q:'Почему ничего не скопировалось?',code:`$ cp /etc/nginx /root/backup/
cp: -r not specified; omitting directory '/etc/nginx'`,lang:'term',o:['Это папка, нужен флаг -r (или -a)','Нет прав root','Папки /root/backup нет','nginx запущен и файл занят'],a:0,e:'cp без -r копирует только файлы. Папки — cp -r или cp -a.'},
 {t:'c',g:'prac',q:'Сервис пишет лог 3 ГБ. Ты хочешь найти в нём первое упоминание <code>timeout</code>. Что лучше?',o:['less app.log, потом /timeout','cat app.log','head app.log','nano app.log'],a:0,e:'less не грузит файл целиком в терминал и умеет искать. cat вывалит 3 ГБ, редактор может съесть всю память.'},
 {t:'c',g:'prac',q:'Что произойдёт: <code>rm -rf $DIR/*</code>, если переменная <code>DIR</code> пустая?',o:['Команда станет rm -rf /* — удаление всего содержимого корня','Ничего, rm проверит пустую переменную','Удалится текущая папка','Будет ошибка синтаксиса'],a:0,e:'Оболочка подставит пустоту → rm -rf /*, а bash раскроет /* в /bin /etc /home … Защита: проверять переменную, set -u в скриптах, кавычки "$DIR".'},
 {t:'c',g:'prac',q:'Лог nginx ротируется каждую ночь (logrotate). Утром <code>tail -f access.log</code> перестал показывать новые строки. Почему и что делать?',o:['tail -f держит старый файл; нужен tail -F','nginx перестал писать логи','Закончилось место','Нужен sudo'],a:0,e:'logrotate переименовал файл, nginx пишет в новый, а tail -f читает старый. -F следит за именем и переоткрывает.'},
 {t:'i',g:'prac',q:'Впиши команду: найти файлы больше 1 ГБ во всей системе, ошибки «Permission denied» скрыть.',a:['find / -size +1G 2>/dev/null','find / -type f -size +1G 2>/dev/null'],ph:'find / …',e:'-size +1G — больше гигабайта. 2>/dev/null — выбросить ошибки (поток ошибок подробно — в модуле «Потоки»).'},
 {t:'i',g:'prac',fix:true,q:'Исправь команду: найти логи старше 7 дней.',code:'find /var/log -name *.log -mtime 7',a:['find /var/log -name "*.log" -mtime +7',"find /var/log -name '*.log' -mtime +7",'find /var/log -type f -name "*.log" -mtime +7'],ph:'find …',e:'Шаблон в кавычки; -mtime +7 — больше 7 суток. -mtime 7 значит «ровно 7».'},
 {t:'c',g:'job',q:'Нужно поправить конфиг сайта nginx. Какой файл редактировать?',o:['Файл в /etc/nginx/sites-available (ссылка из sites-enabled укажет на него)','Ссылку в sites-enabled удалить и создать файл','/var/log/nginx/access.log','/opt/nginx/site'],a:0,e:'Редактируем оригинал. Ссылка в sites-enabled просто включает его. Правку проверить nginx -t (модуль Nginx).'},
 {t:'s',g:'job',q:'Перед правкой прод-конфига. Собери безопасный порядок.',p:['Сделать копию: cp -a app.conf app.conf.bak','Отредактировать app.conf','Проверить синтаксис (например, nginx -t)','Применить (reload сервиса)','Если сломалось — вернуть из .bak'],e:'Бэкап → правка → проверка → применение → путь отката. Так делают всегда, не только с nginx.'},
 {t:'c',g:'job',q:'Где на сервере искать твоё приложение, если его ставили вручную, не из пакета?',o:['Чаще всего /opt/&lt;имя&gt; (или /srv, /home/&lt;пользователь&gt;)','/proc','/boot','/dev'],a:0,e:'/opt — для стороннего софта и самописных сервисов. Узнать наверняка: посмотреть unit-файл systemd (модуль systemd).'},
 {t:'c',g:'job',q:'Где посмотреть, сколько ядер у процессора, если нет утилит?',o:['cat /proc/cpuinfo','cat /etc/cpu','ls /dev/cpu','cat /var/log/cpu'],a:0,e:'/proc/cpuinfo, /proc/meminfo — ядро отдаёт данные как файлы. Быстрее: nproc.'}],
lab:[
 {t:'Экскурсия: найди и открой на своей машине (1) конфиг SSH-сервера или клиента, (2) системный лог, (3) информацию о памяти от ядра, (4) файл с соответствием имён и IP. Для каждого — полный путь.',h:'<p>Смотри карту: /etc, /var/log, /proc. Файл имён — hosts.</p>',sol:C(`less /etc/ssh/ssh_config       # (sshd_config — если стоит сервер)
less /var/log/syslog           # в WSL может быть пусто — тогда journalctl
cat /proc/meminfo
cat /etc/hosts`)},
 {t:'В <code>~/lab</code> создай 30 файлов <code>log1.log … log30.log</code>, папку <code>archive</code>. Перемести туда все логи с номерами 1–9, потом найди <code>find</code>-ом все <code>.log</code> вне archive.',h:'<p>Скобки <code>{1..30}</code> раскрывает bash. Шаблон <code>log?.log</code> — один символ.</p>',sol:C(`cd ~/lab && touch log{1..30}.log && mkdir -p archive
mv log?.log archive/
find . -name "*.log" -not -path "./archive/*"`)},
 {t:'Включи «сайт» как в nginx: создай <code>~/lab/sites-available/shop</code>, сделай на него ссылку в <code>~/lab/sites-enabled/</code>, проверь <code>ls -l</code>. Удали ссылку и убедись, что оригинал жив. Затем удали оригинал при живой ссылке и посмотри, что покажет <code>cat</code> по ссылке.',sol:C(`mkdir -p ~/lab/sites-available ~/lab/sites-enabled
echo "server {}" > ~/lab/sites-available/shop
ln -s ~/lab/sites-available/shop ~/lab/sites-enabled/shop
ls -l ~/lab/sites-enabled/
rm ~/lab/sites-enabled/shop && cat ~/lab/sites-available/shop   # оригинал на месте`)+'<p>Если удалить оригинал — ссылка «висит» (dangling) и cat скажет No such file.</p>'},
 {t:'Найди 5 самых больших файлов в <code>/var</code>. Пока не знаешь <code>sort</code> — используй <code>find -size</code> и уменьшай порог, пока не останется несколько файлов.',sol:C(`sudo find /var -type f -size +100M 2>/dev/null
# после модуля «Текст» это делается одной строкой:
sudo du -ah /var 2>/dev/null | sort -rh | head -5`)}],

/* linux · L1 · Что такое Linux: ядро, дистрибутивы, Ubuntu и LTS */
MOD({id:'linux',title:'Что такое Linux и дистрибутивы',sub:'Ядро, семейства, Ubuntu, LTS — и почему на проде стоит именно оно.',
case:`<p>Первый день на работе. Тимлид кидает в чат: «Вот доступ к серверу, глянь, что там, и поставь htop». Ты заходишь — чёрный экран и мигающий курсор. Ставить через <code>apt</code> или <code>dnf</code>? Это свежая система или её три года никто не обновлял, и в ней дыры? Спросить «а что за Linux?» неловко — это первое, что знает любой админ.</p><p class="goal"><b>Цель модуля:</b> за 30 секунд понять, что за система перед тобой, из какого она «семейства» (значит, какие команды работают) и не устарела ли она. И уметь объяснить на собесе, почему на прод ставят Ubuntu LTS, а не «самую новую».</p>`,
intro:`<p><b>Linux</b> — это <mark>ядро</mark>: программа, которая управляет железом (процессор, память, диски, сеть) и раздаёт его другим программам. Само ядро ничего «не умеет показать» — нет ни команд, ни установщика.</p>
<p><b>Дистрибутив</b> — это ядро + набор программ вокруг него: оболочка (bash), утилиты (ls, cp, grep), менеджер пакетов (apt, dnf), система запуска (systemd) и настройки по умолчанию. Ubuntu, Debian, RHEL, Alpine — разные дистрибутивы на одном и том же ядре.</p>
<p>Зачем DevOps-у: почти все серверы, контейнеры и узлы Kubernetes работают на Linux. Чтобы чинить прод, нужно понимать, <b>что именно</b> у тебя стоит: от этого зависят команды установки, пути к конфигам и сроки обновлений безопасности.</p>`,
theory:`<h2>Из чего состоит система</h2>
${C(`
 Приложения:   nginx, postgres, твой сервис       ┐
 Утилиты:      bash, ls, grep, systemctl          ├ user space (пространство пользователя)
 Библиотеки:   glibc (или musl в Alpine)          ┘
 ─────────────── системные вызовы (syscalls) ───────────────
 Ядро Linux:   процессы, память, файлы, сеть, драйверы   ← kernel space
 Железо:       CPU, RAM, диск, сетевая карта
`,'out')}
<p>Программа не трогает диск напрямую — она просит ядро через <b>системный вызов</b> (open, read, write, fork…). Поэтому ядро может всё контролировать: права, лимиты, изоляцию. На этом позже построены контейнеры (namespaces и cgroups — это функции ядра).</p>
${BOX('Главная идея','<p>Linux = ядро. Ubuntu = ядро Linux + всё остальное, собранное и протестированное одной командой (Canonical). Ядро у Ubuntu и у RHEL одно, а пакеты, пути и сроки поддержки — разные.</p>')}
<h2>Семейства дистрибутивов</h2>
${tbl(['Семейство','Примеры','Пакеты','Где встречается'],[
 ['Debian','Debian, <b>Ubuntu</b>','<code>apt</code>, файлы <code>.deb</code>','облака, стартапы, большинство туториалов'],
 ['Red Hat','RHEL, Rocky, AlmaLinux, Fedora, CentOS Stream','<code>dnf</code> (раньше <code>yum</code>), <code>.rpm</code>','банки, enterprise, платная поддержка Red Hat'],
 ['Alpine','Alpine','<code>apk</code>','Docker-образы: базовый образ ~5 МБ, библиотека musl вместо glibc'],
 ['Arch','Arch, Manjaro','<code>pacman</code>','десктопы энтузиастов; на проде почти не бывает'],
 ['Российские','Astra Linux, РЕД ОС, ALT','разные','госсектор и компании, где нужна сертификация ФСТЭК']])}
<p>Правило на практике: <mark>узнай семейство — и ты знаешь, какой менеджер пакетов и где искать документацию.</mark></p>
<h2>Модели выпуска</h2>
<ul><li><b>Фиксированные релизы</b> (Ubuntu, Debian, RHEL) — версия «замораживается», дальше приходят только исправления и патчи безопасности. Предсказуемо → подходит для прода.</li>
<li><b>Rolling release</b> (Arch) — обновления идут непрерывно, всегда свежее. Для сервера опасно: обновление может принести несовместимые изменения.</li></ul>
<h2>Ubuntu: версии и LTS</h2>
<p>Номер версии — это <b>год.месяц</b> выхода: <code>24.04</code> = апрель 2024. Новая версия выходит каждые 6 месяцев: в апреле (<code>.04</code>) и октябре (<code>.10</code>).</p>
${tbl(['Тип','Когда выходит','Поддержка','Для чего'],[
 ['<b>LTS</b> (Long Term Support)','раз в 2 года, апрель чётного года: 20.04, 22.04, 24.04, 26.04','5 лет обычной поддержки + до 10 лет с Ubuntu Pro (ESM)','<mark>прод</mark>'],
 ['Промежуточный (interim)','остальные: 24.10, 25.04, 25.10…','9 месяцев','попробовать новое, десктоп']])}
<p>Точечные выпуски <code>22.04.1</code>, <code>22.04.5</code> — это та же 22.04 со свежими пакетами и образами установщика, а не новая версия.</p>
<p>У каждой версии есть кодовое имя: 20.04 — <i>focal</i>, 22.04 — <i>jammy</i>, 24.04 — <i>noble</i>. Оно встречается в адресах репозиториев и в именах Docker-образов (<code>ubuntu:jammy</code> = <code>ubuntu:22.04</code>).</p>
<h2>Почему на проде ставят Ubuntu LTS</h2>
<ol><li><b>Предсказуемость.</b> 5+ лет патчей безопасности без смены версий пакетов — сервис не сломается от обновления.</li>
<li><b>Готовые образы везде:</b> AWS, GCP, Azure, Yandex Cloud, Hetzner, DigitalOcean.</li>
<li><b>Огромные репозитории и сообщество</b> — на любую ошибку есть ответ, большинство инструкций пишут под Ubuntu.</li>
<li><b>Автообновления безопасности</b> (<code>unattended-upgrades</code>) и платная поддержка Canonical, если нужна.</li>
<li><b>Ливпатч ядра</b> (Livepatch) — патч ядра без перезагрузки (с Ubuntu Pro).</li></ol>
<p>Когда не Ubuntu: компании с договором Red Hat (RHEL), образы контейнеров (Alpine, distroless), госсектор (сертифицированные отечественные дистрибутивы).</p>
<h2>Как узнать, что у тебя стоит</h2>
${C(`
$ cat /etc/os-release
PRETTY_NAME="Ubuntu 24.04.1 LTS"
NAME="Ubuntu"
VERSION_ID="24.04"
VERSION_CODENAME=noble
ID=ubuntu
ID_LIKE=debian
$ uname -r
6.8.0-45-generic
`,'term')}
${CMDS([['cat /etc/os-release','дистрибутив и версия (работает везде, включая контейнеры)'],['uname -r','версия ядра'],['uname -a','всё о ядре и архитектуре (x86_64 / aarch64)'],['hostnamectl','имя хоста, ОС, ядро, виртуализация'],['lsb_release -a','версия Ubuntu/Debian (может не быть в контейнере)']])}

/* perms · L1 · Пользователи, группы и права */
MOD({id:'perms',title:'Пользователи и права',sub:'Кто владеет файлом, кто может читать, писать, запускать — rwx, 755, chown, sudo.',
case:`<p>Выкатили новый сайт. Файлы на месте, nginx запущен, а в браузере <b>403 Forbidden</b>. Приложение пишет в лог <i>Permission denied</i>. SSH не принимает новый ключ. Коллега советует: «Да сделай <code>chmod 777</code>, и всё заработает». Работать будет — до первого взлома.</p><p class="goal"><b>Цель модуля:</b> видеть, от какого пользователя работает процесс и что ему разрешено, читать права с полувзгляда (755, 640, 600) и чинить любой <i>Permission denied</i> точечно, не открывая дыр.</p>`,
intro:`<p>Linux — многопользовательская система: на одном сервере работают люди (ты, коллега) и <b>сервисы</b> (nginx работает от пользователя <code>www-data</code>, postgres — от <code>postgres</code>). Каждый процесс запущен от какого-то пользователя, и ядро при <b>каждом</b> обращении к файлу проверяет: а можно ли ему?</p>
<p>Зачем это DevOps-у: половина ошибок на проде — <code>Permission denied</code>. Nginx не может прочитать статику, приложение не может писать лог, SSH не принимает ключ, потому что у файла «слишком открытые» права. Чинить это наугад через <code>chmod 777</code> — дыра в безопасности.</p>
<p>Главная идея: <mark>у файла есть владелец, группа и три набора прав — для владельца, для группы и для всех остальных</mark>.</p>`,
theory:`<h2>Пользователи и группы</h2>
${C(`
$ id
uid=1000(kostya) gid=1000(kostya) groups=1000(kostya),27(sudo),998(docker)
$ grep www-data /etc/passwd
www-data:x:33:33:www-data:/var/www:/usr/sbin/nologin
`,'term')}
${tbl(['Файл','Что там'],[
 ['<code>/etc/passwd</code>','пользователи: <code>имя:x:UID:GID:описание:домашняя папка:оболочка</code>. Читать могут все'],
 ['<code>/etc/shadow</code>','хэши паролей. Читает только root'],
 ['<code>/etc/group</code>','группы и кто в них состоит']])}
<ul><li><b>root</b> — UID 0. Ядро не проверяет для него обычные права.</li>
<li><b>Системные пользователи</b> (www-data, postgres, nobody) — UID меньше 1000, оболочка <code>/usr/sbin/nologin</code>: войти под ними нельзя, они существуют только чтобы сервис работал с минимумом прав.</li>
<li><b>Обычные</b> — UID от 1000.</li></ul>
<h2>Как читать права</h2>
${C(`
$ ls -l deploy.sh
-rwxr-x--- 1 deploy devops 512 Nov 24 deploy.sh
│└┬┘└┬┘└┬┘   └─┬──┘ └─┬──┘
│ │  │  │      │      └ группа-владелец
│ │  │  │      └ пользователь-владелец
│ │  │  └ остальные (others): ---  ничего
│ │  └ группа (group):        r-x  читать и запускать
│ └ владелец (user):          rwx  всё
└ тип: - файл, d папка, l ссылка
`,'out')}
${tbl(['Буква','Число','Для файла','Для папки'],[
 ['<b>r</b>','4','читать содержимое','видеть список имён (ls)'],
 ['<b>w</b>','2','менять содержимое','создавать, удалять, переименовывать файлы <b>внутри</b>'],
 ['<b>x</b>','1','запускать как программу','<mark>входить</mark> (cd) и обращаться к файлам внутри']])}
<p>Число — сумма: <code>rwx</code> = 4+2+1 = <b>7</b>, <code>r-x</code> = 4+1 = <b>5</b>, <code>rw-</code> = 4+2 = <b>6</b>, <code>r--</code> = <b>4</b>. Три цифры — владелец, группа, остальные.</p>
${tbl(['Права','Буквами','Типично для'],[
 ['<code>755</code>','rwxr-xr-x','программы, скрипты, папки'],
 ['<code>644</code>','rw-r--r--','обычные файлы, конфиги'],
 ['<code>600</code>','rw-------','секреты: приватный SSH-ключ, .env с паролями'],
 ['<code>700</code>','rwx------','личные папки: <code>~/.ssh</code>'],
 ['<code>640</code>','rw-r-----','конфиг, который читает сервис через группу'],
 ['<code>777</code>','rwxrwxrwx','<b>никогда</b> на проде — любой может всё']])}
${BOX('Как ядро проверяет доступ','<p>Ты владелец? → берутся права владельца, и всё. Иначе ты в группе файла? → права группы. Иначе → права остальных. Проверяется <b>только один</b> набор: если владельцу дать <code>---</code>, а остальным <code>rwx</code>, владелец не прочитает свой же файл.</p><p>И ещё: чтобы открыть <code>/opt/app/conf/app.yml</code>, нужно право <b>x на каждую папку</b> пути: /opt, /opt/app, /opt/app/conf. Проверить весь путь разом: <code>namei -l /opt/app/conf/app.yml</code>.</p>','deep')}
<h2>Менять права и владельца</h2>
${CMDS([['chmod 640 app.conf','права числом'],['chmod u+x run.sh','добавить x владельцу (u — user, g — group, o — others, a — all)'],['chmod go-w file','убрать запись у группы и остальных'],['chmod -R 755 dir/','рекурсивно (осторожно: и файлам даст x)'],['chown deploy file','сменить владельца'],['chown deploy:devops file','владелец и группа'],['chown -R www-data:www-data /var/www/site','рекурсивно'],['chgrp devops file','только группа']])}
<p>Сменить владельца может только root. Сменить права — владелец или root.</p>
<h2>Пользователи и sudo</h2>
${CMDS([['whoami','кто я'],['id user','UID, GID и группы'],['sudo команда','выполнить от root (пароль — твой, а не root)'],['sudo -i','войти в оболочку root'],['sudo -u postgres psql','выполнить от другого пользователя'],['adduser deploy','создать пользователя (Debian/Ubuntu, интерактивно)'],['useradd -m -s /bin/bash deploy','то же, вручную: -m создать домашнюю папку'],['usermod -aG docker deploy','добавить в группу (<b>-a</b> обязательно!)'],['passwd deploy','задать пароль'],['visudo','безопасно править /etc/sudoers (проверяет синтаксис)']])}
<p>Кто может делать sudo: в Ubuntu — участники группы <code>sudo</code> (в RHEL — <code>wheel</code>) и те, кто прописан в <code>/etc/sudoers</code> или <code>/etc/sudoers.d/</code>. Новая группа начинает действовать <mark>после перелогина</mark> — в текущей сессии <code>id</code> её ещё не покажет.</p>
<h2>Особые биты</h2>
${tbl(['Бит','Видно как','Что делает','Пример'],[
 ['setuid (4000)','<code>-rwsr-xr-x</code>','программа выполняется с правами <b>владельца файла</b>','<code>/usr/bin/passwd</code> — меняет /etc/shadow от root'],
 ['setgid на папке (2000)','<code>drwxrwsr-x</code>','новые файлы получают <b>группу папки</b>','общая папка команды'],
 ['sticky (1000)','<code>drwxrwxrwt</code>','удалять файл может только его владелец','<code>/tmp</code>']])}
<p><b>umask</b> — какие права <i>отнять</i> у новых файлов. Обычно <code>022</code>: файлы создаются 644, папки 755.</p>`,
memo:`<p>Тренируй перевод туда-обратно: увидел <code>rw-r-----</code> — скажи «640, владелец читает и пишет, группа читает, остальным ничего». Увидел <code>Permission denied</code> — задай три вопроса: <b>кто</b> (от какого пользователя процесс), <b>что</b> (права и владелец файла), <b>путь</b> (есть ли x на всех папках).</p>`,
traps:[
 ['chmod 777, «чтобы заработало»','Выдать нужное право нужному субъекту: chown на пользователя сервиса + 640/750','777 даёт любому процессу на сервере писать в файл. Взломанный сервис сможет подменить скрипт или конфиг.'],
 ['usermod -G docker deploy','usermod -aG docker deploy','Без -a список групп заменяется целиком: пользователь вылетит из sudo и всех остальных групп.'],
 ['sudo echo "1" > /etc/sysctl.d/x.conf → Permission denied','echo "1" | sudo tee /etc/sysctl.d/x.conf','Перенаправление > делает твоя оболочка (не root) до запуска sudo. tee открывает файл уже от root.'],
 ['chmod 644 ~/.ssh/id_ed25519 «и так ок»','chmod 600 ~/.ssh/id_ed25519, chmod 700 ~/.ssh','SSH откажется использовать приватный ключ, который могут читать другие: «UNPROTECTED PRIVATE KEY FILE».'],
 ['Добавил себя в группу docker — команда всё равно Permission denied','Перелогиниться (или newgrp docker)','Группы процесса фиксируются при входе. Текущая сессия о новой группе не знает.'],
 ['Добавить в группу docker «для удобства» любого','Только доверенных','Группа docker = фактически root: можно запустить контейнер с примонтированным / хоста.']],
ex:[
 {t:'c',q:'Что означает <code>rwx</code> в правах файла?',o:['Чтение, запись, выполнение','Root, write, execute','Read, wait, exit','Удалённый доступ, запись, обмен'],a:0,e:'r — read (4), w — write (2), x — execute (1).'},
 {t:'c',q:'Права <code>-rw-r--r--</code> числом — это…',o:['644','755','600','664'],a:0,e:'rw- = 6, r-- = 4, r-- = 4.'},
 {t:'c',q:'Что значит <code>chmod 755 script.sh</code>?',o:['Владелец — всё; группа и остальные — читать и запускать','Все могут всё','Только владелец может читать','Владелец читает, остальные пишут'],a:0,e:'7 = rwx, 5 = r-x. Стандарт для скриптов и программ.'},
 {t:'c',q:'Право <b>x</b> на <b>папку</b> даёт…',o:['Войти в неё и обращаться к файлам внутри','Запустить папку как программу','Удалить папку','Видеть список файлов'],a:0,e:'Для папки x = «проход». Список имён даёт r, а создание и удаление внутри — w.'},
 {t:'c',q:'Где хранятся хэши паролей пользователей?',o:['/etc/shadow','/etc/passwd','/etc/group','/root/.passwords'],a:0,e:'/etc/passwd читают все, поэтому хэши вынесли в /etc/shadow (доступ только root).'},
 {t:'c',q:'У пользователя <code>www-data</code> оболочка <code>/usr/sbin/nologin</code>. Зачем?',o:['Под ним нельзя войти — он нужен только для работы сервиса','Это ошибка установки','Чтобы он работал быстрее','Чтобы скрыть его от ls'],a:0,e:'Системные пользователи существуют для изоляции сервисов. Интерактивный вход им не нужен.'},
 {t:'c',q:'У root UID равен…',o:['0','1','1000','65534'],a:0,e:'UID 0 — суперпользователь. 65534 — обычно nobody, 1000 — первый обычный пользователь.'},
 {t:'i',q:'Впиши права числом для приватного SSH-ключа (читать и писать может только владелец).',a:['600','0600'],ph:'…',e:'rw------- = 600. С более открытыми правами ssh ключ не примет.'},
 {t:'i',q:'Впиши команду: сделать владельцем <code>/var/www/site</code> и всего внутри пользователя и группу <code>www-data</code>.',a:['chown -R www-data:www-data /var/www/site','sudo chown -R www-data:www-data /var/www/site','chown -R www-data: /var/www/site','sudo chown -R www-data: /var/www/site'],ph:'chown …',e:'-R — рекурсивно, user:group через двоеточие. Нужен root, поэтому обычно через sudo.'},
 {t:'i',q:'Впиши команду: добавить пользователя <code>deploy</code> в группу <code>docker</code>, не выкидывая его из остальных групп.',a:['usermod -aG docker deploy','sudo usermod -aG docker deploy','gpasswd -a deploy docker','sudo gpasswd -a deploy docker'],ph:'usermod …',e:'-a (append) + -G (группы). Без -a все прочие группы будут заменены.'},
 {t:'i',q:'Впиши команду: добавить право на выполнение только владельцу файла <code>run.sh</code> (буквами).',a:['chmod u+x run.sh'],ph:'chmod …',e:'u — владелец, + — добавить, x — выполнение. chmod +x дал бы x всем трём.'},
 {t:'s',q:'Расставь проверку доступа ядром в правильном порядке.',p:['Процесс — root? Тогда обычные права не проверяются','Процесс — владелец файла? Берутся права владельца','Процесс в группе файла? Берутся права группы','Иначе — права остальных'],e:'Применяется первый подходящий набор, остальные не смотрятся.'},
 {t:'r',q:'Кто может изменить этот файл?',code:`$ ls -l /etc/app/app.conf
-rw-r----- 1 root app 820 Nov 24 /etc/app/app.conf`,lang:'term',o:['Только root (и всё, что через sudo)','Все участники группы app','Любой пользователь','Никто'],a:0,e:'Владелец root: rw-. Группа app: только r--. Остальным ничего. Писать может только root.'},
 {t:'r',q:'Что это за бит и зачем он здесь?',code:`$ ls -ld /tmp
drwxrwxrwt 18 root root 4096 Nov 24 /tmp`,lang:'term',o:['Sticky bit: писать могут все, но удалять — только свои файлы','setuid: всё выполняется от root','Папка заблокирована','Файлы в /tmp временные'],a:0,e:'t в конце — sticky. Без него любой мог бы удалить чужие файлы в общей /tmp.'},
 {t:'r',q:'Почему не работает?',code:`$ sudo echo "vm.swappiness=10" > /etc/sysctl.d/99-swap.conf
bash: /etc/sysctl.d/99-swap.conf: Permission denied`,lang:'term',o:['Перенаправление > выполняет твоя оболочка без root; нужен ... | sudo tee файл','sudo не установлен','Файл заблокирован ядром','Нужно sudo sudo'],a:0,e:'sudo поднял права только для echo. Файл открывал твой bash. Правильно: echo "…" | sudo tee /etc/sysctl.d/99-swap.conf.'},
 {t:'c',g:'prac',q:'Nginx отдаёт 403 на <code>/srv/site/index.html</code>. Права файла 644, а у <code>/srv/site</code> — <code>drwx------ root root</code>. В чём причина?',o:['У www-data нет права x на папку — он не может в неё войти','Файлу нужно 777','Nginx не умеет читать /srv','Нужно перезагрузить сервер'],a:0,e:'Права папки 700: остальным (www-data) ни r, ни x. Чинить: chmod 755 /srv/site или сделать группу www-data с r-x.'},
 {t:'c',g:'prac',q:'Ты добавил себя в группу <code>docker</code>, но <code>docker ps</code> всё равно пишет <i>permission denied … docker.sock</i>. Почему?',o:['Новая группа применяется только после перелогина','Docker не установлен','Нужно chmod 777 docker.sock','Группа docker не существует'],a:0,e:'Группы процесса задаются при входе. Выйди и зайди снова (или newgrp docker). chmod 777 на сокет — плохая идея.'},
 {t:'c',g:'prac',q:'Почему членство в группе <code>docker</code> считают равным root?',o:['Можно запустить контейнер с примонтированным / хоста и делать с ним что угодно','Группа docker имеет UID 0','Docker отключает права','Это не так, группа безопасна'],a:0,e:'docker run -v /:/host … даёт полный доступ к ФС хоста от root внутри контейнера.'},
 {t:'i',g:'prac',fix:true,q:'Исправь: SSH пишет <i>UNPROTECTED PRIVATE KEY FILE</i>.',code:'chmod 644 ~/.ssh/id_ed25519',a:['chmod 600 ~/.ssh/id_ed25519','chmod 400 ~/.ssh/id_ed25519','chmod go-rwx ~/.ssh/id_ed25519'],ph:'chmod …',e:'Приватный ключ должен быть доступен только владельцу: 600 (или 400 — только чтение).'},
 {t:'s',g:'job',q:'Приложение пишет <i>Permission denied</i> при записи в <code>/opt/app/logs/app.log</code>. Собери порядок диагностики.',p:['Узнать, от какого пользователя работает процесс: ps -o user= -p PID','Посмотреть права и владельца файла: ls -l /opt/app/logs/app.log','Проверить x на всех папках пути: namei -l /opt/app/logs/app.log','Выдать минимальное право: chown appuser /opt/app/logs (а не 777)'],e:'Кто → что → путь → точечное исправление.'},
 {t:'c',g:'job',q:'Нужна общая папка <code>/srv/shared</code> для группы <code>devops</code>, чтобы все новые файлы автоматически были с группой devops. Что поставить?',o:['chgrp devops /srv/shared и chmod 2775 /srv/shared (setgid)','chmod 777 /srv/shared','chmod 1777 /srv/shared','chown root /srv/shared'],a:0,e:'setgid на папке (2xxx) — новые файлы наследуют группу папки. 775 — группа может писать.'},
 {t:'c',g:'job',q:'Как безопасно дать пользователю <code>deploy</code> перезапускать только nginx через sudo?',o:['Файл в /etc/sudoers.d/ (через visudo -f) с правилом только на systemctl restart nginx','Добавить deploy в группу sudo','Дать deploy пароль root','chmod 4755 /usr/bin/systemctl'],a:0,e:'Принцип минимальных прав: deploy ALL=(root) NOPASSWD: /usr/bin/systemctl restart nginx. visudo проверит синтаксис — ошибка в sudoers может отрезать sudo совсем.'}],
lab:[
 {t:'Создай пользователя <code>deploy</code> с домашней папкой и bash, группу <code>devops</code>, добавь в неё себя и deploy. Проверь <code>id</code> — почему у тебя группа ещё не видна? Что нужно сделать?',h:'<p>adduser / useradd -m -s, groupadd, usermod -aG.</p>',sol:C(`sudo useradd -m -s /bin/bash deploy
sudo groupadd devops
sudo usermod -aG devops deploy
sudo usermod -aG devops $USER
id            # devops ещё нет — нужен перелогин
id deploy     # у deploy уже есть`)},
 {t:'Сделай общую папку <code>/srv/shared</code>: группа devops, участники могут писать, остальные — ничего, новые файлы наследуют группу. Проверь, создав файл от deploy (<code>sudo -u deploy touch …</code>).',sol:C(`sudo mkdir -p /srv/shared
sudo chgrp devops /srv/shared
sudo chmod 2770 /srv/shared
sudo -u deploy touch /srv/shared/a.txt
ls -l /srv/shared/    # группа a.txt — devops`)},
 {t:'Сломай и почини: создай <code>/srv/site/index.html</code>, поставь папке 700 от root. Попробуй прочитать файл от другого пользователя (<code>sudo -u deploy cat …</code>). Найди причину через <code>namei -l</code> и почини минимальными правами.',sol:C(`sudo mkdir -p /srv/site && echo hi | sudo tee /srv/site/index.html
sudo chmod 700 /srv/site
sudo -u deploy cat /srv/site/index.html   # Permission denied
namei -l /srv/site/index.html             # видно drwx------ на /srv/site

 {t:'Запиши строку в системный файл двумя способами: <code>sudo echo … &gt; файл</code> и через <code>tee</code>. Объясни своими словами, почему первый способ падает.',sol:C(`sudo echo "test" > /etc/mytest.conf            # Permission denied
echo "test" | sudo tee /etc/mytest.conf        # работает
echo "more" | sudo tee -a /etc/mytest.conf     # -a — дописать`)+'<p>Перенаправление выполняет твоя оболочка до запуска команды, а она не root.</p>'},
 {t:'Найди в системе все файлы с setuid-битом и объясни, зачем он нужен хотя бы у <code>passwd</code> и <code>sudo</code>.',h:'<p>У find есть <code>-perm -4000</code>.</p>',sol:C(`find / -perm -4000 -type f 2>/dev/null`)+'<p>passwd запускает обычный пользователь, но писать нужно в /etc/shadow (только root). setuid запускает программу с правами владельца файла — root.</p>'}],
qa:[
 ['Объясни chmod 755 и 644.','Три цифры — владелец, группа, остальные; r=4, w=2, x=1. 755 — rwxr-xr-x (программы, папки). 644 — rw-r--r-- (обычные файлы).'],
 ['Что значат r, w, x для папки?','r — видеть список имён, w — создавать/удалять/переименовывать файлы внутри, x — входить в папку и обращаться к файлам по имени.'],
 ['Почему chmod 777 — плохо?','Любой процесс на сервере сможет менять файл. Взломанный сервис подменит скрипт или конфиг. Правильно — выдать доступ конкретному пользователю/группе.'],
 ['Что такое setuid, setgid, sticky bit?','setuid — программа выполняется с правами владельца файла (passwd). setgid на папке — новые файлы наследуют её группу. Sticky на папке — удалять файлы может только их владелец (/tmp).'],
 ['Как диагностировать Permission denied?','Кто: от какого пользователя процесс (ps -o user). Что: ls -l на файл. Путь: namei -l — x на всех папках. Потом выдать минимальное право через chown/chmod или группу.'],
 ['Почему sudo echo > /etc/file не работает?','Перенаправление делает текущая оболочка до запуска sudo, без прав root. Решение: echo … | sudo tee /etc/file.'],
 ['Чем опасна группа docker?','Через неё можно запустить контейнер с примонтированным / хоста и получить root. Это фактически root-доступ.'],
 ['Где хранятся пользователи и пароли?','/etc/passwd — пользователи (UID, GID, home, shell), /etc/shadow — хэши паролей (только root), /etc/group — группы.']],
cheat:[['ls -l file','права и владелец'],['chmod 640 file','права числом'],['chmod u+x file','добавить x владельцу'],['chown user:group file','сменить владельца'],['chown -R user:group dir','рекурсивно'],['id user','UID и группы'],['sudo usermod -aG group user','добавить в группу'],['namei -l /path/to/file','права по всему пути'],['echo x | sudo tee /etc/file','запись в системный файл'],['sudo visudo -f /etc/sudoers.d/name','правило sudo'],['find / -perm -4000 2>/dev/null','файлы с setuid']]});
/* procs · L1 · Процессы и сигналы */
MOD({id:'procs',title:'Процессы и сигналы',sub:'PID, дерево процессов, kill и сигналы, фон и nohup, зомби, коды 137 и 143.',
case:`<p>Вечер, ты по SSH запускаешь на сервере перенос данных — скрипт на 40 минут. Через 10 минут закрываешь ноутбук и едешь домой. Утром оказывается, что скрипт умер на середине вместе с твоей SSH-сессией, и половина данных перенесена. Днём другая история: приложение зависло, коллега делает <code>kill -9</code>, и после этого сервис полчаса восстанавливает повреждённый кэш. А в Kubernetes под постоянно перезапускается с непонятным <i>exit code 137</i>.</p><p class="goal"><b>Цель модуля:</b> видеть, какие процессы работают и кто кого запустил, останавливать их правильно (вежливо, а не «топором»), запускать долгие задачи так, чтобы они пережили закрытие терминала, и читать коды завершения вроде 137 и 143.</p>`,
intro:`<p><b>Процесс</b> — это запущенная программа. Файл <code>/usr/sbin/nginx</code> на диске — просто программа; когда её запустили, ядро создаёт процесс: выделяет память, даёт номер (<b>PID</b>) и начинает выполнять. Одну программу можно запустить много раз — будет много процессов.</p>
<p>Процессами нужно уметь управлять, потому что на сервере всё — процесс: nginx, база, твоё приложение, твоя SSH-сессия и даже bash, в котором ты печатаешь. Остановить, перезапустить, перечитать конфиг, понять, почему что-то «висит», — это всё работа с процессами.</p>
<p>Общаются с процессом через <mark>сигналы</mark> — короткие уведомления от ядра: «заверши работу», «перечитай конфиг», «умри немедленно». Правильный сигнал — это разница между аккуратной остановкой и потерянными данными.</p>`,
theory:`<h2>PID, родитель и дерево</h2>
<p>У каждого процесса есть <b>PID</b> (номер) и <b>PPID</b> — номер родителя, того, кто его запустил. Все процессы растут из одного корня — <b>PID 1</b> (в Ubuntu это systemd).</p>
${C(`
$ pstree -p | head
systemd(1)─┬─nginx(812)─┬─nginx(813)
           │            └─nginx(814)
           ├─sshd(640)───sshd(2101)───bash(2120)───pstree(2310)
           └─node(950)
`,'term')}
<p>Видно: ты (bash 2120) запущен через sshd, nginx — главный процесс 812 и два рабочих (worker). Когда SSH-сессия закрывается, её дочерние процессы по умолчанию получают сигнал и завершаются — именно так умер скрипт из ситуации.</p>
<h2>Как смотреть процессы</h2>
${CMDS([['ps aux','все процессы: пользователь, PID, %CPU, %MEM, состояние, команда'],['ps -ef','то же в другом формате, с PPID'],['ps aux | grep node','найти процесс по имени'],['pgrep -a node','то же короче: PID + команда'],['pstree -p','дерево с PID'],['top / htop','живой список, сортировка по CPU/памяти (подробно — модуль «Сервер тормозит»)'],['ls /proc/950/','всё о процессе 950: cmdline, environ, fd (открытые файлы)'],['cat /proc/950/status','состояние, память, PPID, UID']])}
${C(`
$ ps aux | head -3
USER   PID %CPU %MEM    VSZ   RSS TTY  STAT START  TIME COMMAND
root     1  0.0  0.1 167k 12k   ?    Ss   Nov24  0:03 /sbin/init
www-data 813 0.2 0.3  56k  9k   ?    S    Nov24  1:12 nginx: worker process
`,'term')}
${tbl(['STAT','Что значит'],[
 ['<b>R</b>','выполняется или готов выполняться'],
 ['<b>S</b>','спит, ждёт события (обычное состояние сервиса, ждущего запросов)'],
 ['<b>D</b>','непрерываемый сон — ждёт диск/сеть. Не убивается даже kill -9, пока не дождётся. Много D — проблема с диском или NFS'],
 ['<b>Z</b>','зомби: процесс завершился, но родитель ещё не «забрал» его код возврата'],
 ['<b>T</b>','остановлен (Ctrl+Z или SIGSTOP)']])}
<h2>Сигналы</h2>
${tbl(['Сигнал','Номер','Что значит','Кто шлёт'],[
 ['<b>SIGTERM</b>','15','«пожалуйста, завершись»: процесс может доделать работу, закрыть соединения, сохранить данные','<code>kill PID</code> (по умолчанию), <code>systemctl stop</code>, <code>docker stop</code>, Kubernetes'],
 ['<b>SIGKILL</b>','9','убить немедленно. Процесс не может ни перехватить, ни отказаться — ядро просто удаляет его','<code>kill -9 PID</code>, OOM killer (кончилась память)'],
 ['<b>SIGINT</b>','2','прерывание — то же, что Ctrl+C','терминал'],
 ['<b>SIGHUP</b>','1','«терминал закрылся»; многие демоны понимают его как «перечитай конфиг»','закрытие SSH, <code>kill -HUP</code>, <code>nginx -s reload</code>'],
 ['<b>SIGSTOP / SIGCONT</b>','19 / 18','заморозить / разморозить','Ctrl+Z (SIGTSTP), <code>kill -STOP</code>']])}
${BOX('Почему не надо сразу kill -9','<p>SIGTERM — вежливая просьба: приложение дописывает файл, завершает транзакцию, отвечает текущим клиентам, удаляет lock-файл. SIGKILL — выдернуть шнур: ничего из этого не случится, могут остаться битые данные и lock-файлы, из-за которых сервис потом не запустится. Порядок: <code>kill PID</code> → подождать несколько секунд → только если не помогло, <code>kill -9 PID</code>. Так же работают <code>docker stop</code> (SIGTERM, через 10 секунд SIGKILL) и Kubernetes (через 30 секунд).</p>','warn')}
${CMDS([['kill 950','SIGTERM процессу 950'],['kill -9 950','SIGKILL — последнее средство'],['kill -HUP 812','SIGHUP: многие сервисы перечитают конфиг'],['pkill node','сигнал всем процессам с именем node'],['killall nginx','то же по точному имени'],['kill -l','список всех сигналов']])}
<h2>Коды завершения от сигналов</h2>
<p>Если процесс убит сигналом, его код возврата = <mark>128 + номер сигнала</mark>. Это видно в <code>echo $?</code>, в <code>docker ps -a</code> и в Kubernetes:</p>
${tbl(['Код','Значит','Типичная причина'],[['<b>137</b>','128 + 9 → SIGKILL','кончилась память (OOM killer), или не завершился за отведённое время после SIGTERM'],['<b>143</b>','128 + 15 → SIGTERM','штатная остановка (docker stop, деплой)'],['<b>130</b>','128 + 2 → SIGINT','прервали Ctrl+C']])}
<h2>Передний план, фон и жизнь после выхода</h2>
${CMDS([['long_task &','запустить в фоне, терминал свободен'],['jobs','фоновые задачи этой оболочки'],['Ctrl+Z, потом bg','приостановить и продолжить в фоне'],['fg %1','вернуть задачу 1 на передний план'],['nohup ./migrate.sh > migrate.log 2>&1 &','запустить так, чтобы пережил закрытие SSH (игнорирует SIGHUP)'],['disown','отвязать уже запущенную фоновую задачу от оболочки'],['tmux / screen','терминал, который живёт на сервере после отключения: ушёл, вернулся — всё на месте']])}
<p>Для долгих ручных задач лучший выбор — <b>tmux</b>: <code>tmux new -s migr</code>, запустил, отключился (Ctrl+B, затем D), вернулся <code>tmux attach -t migr</code>. Для постоянных сервисов — не фон и не nohup, а systemd (модуль 10).</p>
${BOX('Зомби и сироты','<p><b>Зомби</b> (Z) — процесс уже завершился, от него осталась строчка в таблице процессов с кодом возврата, который родитель должен прочитать. Убить зомби нельзя — он уже мёртв; лечится исправлением или перезапуском <b>родителя</b>. Пара зомби — не страшно, тысячи — родитель сломан.</p><p><b>Сирота</b> — процесс, у которого умер родитель. Его «усыновляет» PID 1 и потом корректно убирает. В контейнере PID 1 — твоё приложение, и если оно не умеет убирать за детьми, копятся зомби; поэтому иногда используют <code>docker run --init</code>.</p>','deep')}
<h2>Приоритет</h2>
${CMDS([['nice -n 10 ./backup.sh','запустить с пониженным приоритетом (от −20 до 19, больше = «вежливее»)'],['renice -n 15 -p 950','изменить приоритет уже работающего']])}
<p>Тяжёлый бэкап или сжатие логов на проде запускай через <code>nice</code>, чтобы оно не отнимало CPU у сайта.</p>`,

lab:[
 {t:'Дерево процессов: найди свой bash в <code>pstree -p</code> и пройди по родителям до PID 1. Запиши цепочку. Потом найди nginx/sshd/любой сервис и посмотри, сколько у него дочерних процессов.',sol:C(`echo $$                       # PID твоего bash
pstree -p -s $$               # цепочка предков
ps -o pid,ppid,cmd -p $$`)},
 {t:'Сигналы и коды: запусти <code>sleep 1000</code> и по очереди заверши его Ctrl+C, <code>kill</code>, <code>kill -9</code> (из второго терминала). После каждого — <code>echo $?</code>. Сверь с формулой 128 + номер.',sol:C(`sleep 1000      # Ctrl+C → echo $? → 130
sleep 1000      # во 2-м терминале: kill $(pgrep sleep) → 143
sleep 1000      # kill -9 $(pgrep sleep) → 137`)},
 {t:'Graceful shutdown своими руками: напиши bash-скрипт, который в бесконечном цикле пишет время в файл и на SIGTERM пишет «saving…», ждёт 2 секунды и выходит. Проверь <code>kill</code> и <code>kill -9</code> — в каком случае «saving…» появился?',h:'<p>Команда <code>trap \'…\' TERM</code> задаёт, что делать при сигнале.</p>',sol:C(`cat > ~/lab/worker.sh <<'EOF'
#!/usr/bin/env bash
trap 'echo "saving..." >> ~/lab/worker.log; sleep 2; exit 0' TERM
while true; do date >> ~/lab/worker.log; sleep 1; done
EOF
chmod +x ~/lab/worker.sh && ~/lab/worker.sh &
kill %1        # в логе появится saving...
# повтори с kill -9 — «saving...» не будет: SIGKILL не перехватить`)},
 {t:'Пережить отключение: запусти <code>sleep 600</code> тремя способами (просто, через nohup …&amp;, в tmux), закрой SSH-сессию (или терминал WSL), зайди снова и проверь <code>pgrep -a sleep</code>, какие выжили.'},
 {t:'Сделай зомби и убери его: запусти <code>bash -c \'sleep 1 &amp; exec sleep 300\'</code> — через секунду у процесса sleep 300 появится ребёнок-зомби. Найди его в <code>ps</code> (STAT Z), найди родителя и избавься от зомби правильным способом.',sol:C(`bash -c 'sleep 1 & exec sleep 300' &
sleep 2; ps -o pid,ppid,stat,cmd --ppid $(pgrep -f "sleep 300")
kill $(pgrep -f "sleep 300")   # убили родителя → зомби усыновлён PID 1 и убран
ps aux | awk '$8 ~ /Z/'`)}],

/* shell · L1 · Терминал, оболочка, навигация, .sh / .bash / .ps1 */
MOD({id:'shell',title:'Терминал, навигация и .sh / .ps1',sub:'Оболочка, пути, флаги, справка — и чем скрипт .sh отличается от .ps1.',
case:`<p>Коллега присылает <code>deploy.sh</code>: «Запусти на сервере». Пишешь <code>deploy.sh</code> — <i>command not found</i>. Пишешь <code>./deploy.sh</code> — <i>Permission denied</i>. Исправил права — теперь <i>bash\r: No such file</i>. А второй коллега прислал <code>deploy.ps1</code> и говорит, что «у него всё работает».</p><p class="goal"><b>Цель модуля:</b> свободно ходить по серверу без мышки, находить справку у самой системы, а не в гугле, и понимать, почему скрипт не запускается и как это исправить, будь он .sh или .ps1.</p>`,
intro:`<p><b>Терминал</b> — это окно, куда ты печатаешь. <b>Оболочка (shell)</b> — программа внутри него, которая читает твою строку, разбирает её и запускает нужную программу. В Linux обычно оболочка <b>bash</b>, в Windows — <b>PowerShell</b>.</p>
<p>У серверов нет мышки и окон: ты заходишь по SSH и делаешь всё командами. Поэтому навигация, пути и чтение справки — это базовый навык, как умение пользоваться рулём.</p>
<p>Главная идея: <mark>команда = программа + флаги + аргументы</mark>. Не помнишь флаг — не гугли сразу, спроси систему: <code>man</code> и <code>--help</code>.</p>`,
theory:`<h2>Приглашение (prompt)</h2>
${C(`
user@web-01:~$          ← обычный пользователь ($), сейчас в домашней папке (~)
root@web-01:/etc#       ← root (#), сейчас в /etc
`,'out')}
<p><b>$</b> — обычный пользователь, <b>#</b> — root (суперпользователь, может всё, в том числе сломать систему). Видишь <code>#</code> — будь вдвое внимательнее.</p>
<h2>Как устроена команда</h2>
${C(`ls -l -a /var/log
ls -la /var/log            # короткие флаги можно склеить
ls --all --human-readable  # длинные флаги — через два дефиса`)}
${tbl(['Часть','Пример','Что это'],[['команда','<code>ls</code>','программа, которую запускаем'],['флаги (опции)','<code>-la</code>, <code>--all</code>','как именно работать'],['аргументы','<code>/var/log</code>','с чем работать']])}
<p>Откуда оболочка знает, где лежит <code>ls</code>? Она ищет файл в папках из переменной <code>$PATH</code>. Проверить: ${c('which ls')} → <code>/usr/bin/ls</code>.</p>
<h2>Пути</h2>
${tbl(['Запись','Значит','Пример'],[
 ['<code>/</code>','корень всей файловой системы','<code>cd /</code>'],
 ['<code>/etc/nginx</code>','<b>абсолютный</b> путь — от корня, работает откуда угодно','<code>cd /etc/nginx</code>'],
 ['<code>logs/app.log</code>','<b>относительный</b> — от текущей папки','<code>cat logs/app.log</code>'],
 ['<code>.</code>','текущая папка','<code>./deploy.sh</code>'],
 ['<code>..</code>','папка выше','<code>cd ../..</code>'],
 ['<code>~</code>','домашняя папка (<code>/home/user</code>, у root — <code>/root</code>)','<code>cd ~</code> или просто <code>cd</code>'],
 ['<code>-</code> (в cd)','предыдущая папка','<code>cd -</code>']])}
<h2>Навигация</h2>
${CMDS([['pwd','где я сейчас (print working directory)'],['ls','что в папке'],['ls -la','всё, включая скрытые (имя с точки: .env, .ssh), с правами и размером'],['ls -lh','размеры в K/M/G'],['cd /path','перейти'],['cd ..','на уровень выше'],['cd -','вернуться туда, где был'],['tree -L 2','дерево папок на 2 уровня (если установлен)']])}
<h2>Горячие клавиши — экономят часы</h2>
${tbl(['Клавиши','Что делает'],[['<b>Tab</b>','дописать имя файла/команды; два раза — показать варианты'],['<b>↑ / ↓</b>','прошлые команды'],['<b>Ctrl+R</b>','поиск по истории: начни печатать кусок команды'],['<b>Ctrl+C</b>','прервать текущую команду'],['<b>Ctrl+D</b>','конец ввода / выйти из оболочки (и из SSH-сессии)'],['<b>Ctrl+L</b>','очистить экран'],['<b>Ctrl+A / Ctrl+E</b>','в начало / в конец строки']])}
<h2>Справка — спроси систему сама</h2>
${CMDS([['man ls','полное руководство. Поиск внутри: /слово, следующее — n, выход — q'],['ls --help','краткая справка по флагам'],['type cd','что это: встроенная команда оболочки, алиас или файл'],['which nginx','где лежит программа'],['history','история команд']])}
<h2>Скрипты: .sh, .bash, .ps1</h2>
<p>Скрипт — это файл с командами, которые выполняются по очереди. <mark>В Linux расширение ничего не решает</mark> — это только подсказка человеку. Решают две вещи: <b>шебанг</b> в первой строке и <b>право на выполнение</b>.</p>
${C(`#!/usr/bin/env bash
# deploy.sh — первая строка (шебанг) говорит ядру, каким интерпретатором выполнять файл
echo "Привет с $(hostname)"`)}
${tbl(['Как запустить','Что происходит'],[
 ['<code>./deploy.sh</code>','нужен <code>chmod +x</code>; ядро читает шебанг и запускает bash. <code>./</code> обязательно: текущей папки нет в PATH'],
 ['<code>bash deploy.sh</code>','права на выполнение не нужны, шебанг игнорируется — явно bash'],
 ['<code>sh deploy.sh</code>','запустит <b>sh</b>, а в Ubuntu это <b>dash</b> — более простая оболочка. Bash-фишки (<code>[[ ]]</code>, массивы) сломаются'],
 ['<code>source deploy.sh</code> или <code>. deploy.sh</code>','выполнить <b>в текущей</b> оболочке: переменные и <code>cd</code> останутся после скрипта']])}
${tbl(['Расширение','Что это','Где'],[
 ['<code>.sh</code>','скрипт оболочки (обычно bash или sh) — соглашение','Linux, macOS, CI'],
 ['<code>.bash</code>','то же, но подчёркивает: нужен именно bash','Linux'],
 ['<code>.ps1</code>','скрипт <b>PowerShell</b>','Windows; на Linux — через <code>pwsh</code>']])}
${BOX('PowerShell — другой мир',`<p>Bash передаёт по пайпу <b>текст</b>, PowerShell — <b>объекты</b> со свойствами. В PowerShell есть алиасы <code>ls</code>, <code>cd</code>, <code>cat</code>, но это другие команды (<code>Get-ChildItem</code>…), и флаги у них другие: <code>ls -la</code> там не сработает.</p>
<p>Запуск: <code>.\\deploy.ps1</code> (обратный слэш) или <code>pwsh -File deploy.ps1</code>. Windows может запретить запуск скриптов политикой <b>ExecutionPolicy</b> — смотреть <code>Get-ExecutionPolicy</code>. Подробно — в модуле «PowerShell».</p>`,'deep')}
${BOX('Ловушка переносов строк',`<p>Windows заканчивает строки символами <b>CRLF</b> (\\r\\n), Linux — <b>LF</b> (\\n). Скрипт .sh, сохранённый в Windows, на сервере упадёт с ошибкой <code>/usr/bin/env: 'bash\\r': No such file or directory</code>. Лечение: <code>sed -i 's/\\r$//' deploy.sh</code> или <code>dos2unix deploy.sh</code>, а в редакторе выбрать LF.</p>`,'warn')}`,
memo:`<p>Неделю не трогай мышку в файловом менеджере: всё, что делаешь с файлами, делай в терминале. Каждую незнакомую команду сначала смотри через <code>--help</code>, потом через <code>man</code>. Ctrl+R вместо стрелки вверх 20 раз.</p>`,
traps:[
 ['deploy.sh → «command not found»','./deploy.sh','Оболочка ищет команды только в папках из $PATH. Текущей папки там нет (защита от подложенных программ), поэтому путь указываем явно.'],
 ['./deploy.sh → «Permission denied»','chmod +x deploy.sh, затем ./deploy.sh (или bash deploy.sh)','Чтобы запустить файл как программу, нужно право на выполнение (x).'],
 ['sh script.sh для скрипта с [[ ]] и массивами','bash script.sh или ./script.sh с шебангом bash','В Ubuntu sh — это dash, он не понимает bash-расширения: «[[: not found».'],
 ['«Расширение .sh делает файл исполняемым»','Исполняемым делает chmod +x, а интерпретатор — шебанг','Linux не смотрит на расширение. Файл run без расширения с шебангом и +x работает так же.'],
 ['Скрипт из Windows: «bash\\r: No such file»','Перевести переносы в LF: dos2unix или sed -i \'s/\\r$//\'','CRLF-переносы — невидимый \\r в конце каждой строки, в том числе в шебанге.']],
ex:[
 {t:'c',q:'Чем терминал отличается от оболочки (shell)?',o:['Терминал — окно ввода, оболочка — программа, которая разбирает и выполняет команды','Это одно и то же','Оболочка — это окно, терминал — интерпретатор','Терминал есть только в Windows'],a:0,e:'Терминал (GNOME Terminal, Windows Terminal) показывает текст. Bash/zsh/PowerShell — интерпретатор внутри.'},
 {t:'c',q:'Приглашение заканчивается на <code>#</code>. Что это значит?',o:['Ты работаешь как root','Ты в папке /root','Команда закомментирована','Нет подключения'],a:0,e:'$ — обычный пользователь, # — root. У root нет «защиты от дурака».'},
 {t:'c',q:'Что делает <code>ls -la</code>?',o:['Показывает все файлы, включая скрытые, в подробном виде','Показывает только скрытые файлы','Удаляет все файлы','Показывает только папки'],a:0,e:'-l — длинный формат (права, владелец, размер, дата), -a — all, включая файлы с точки (.env, .ssh).'},
 {t:'c',q:'Какой путь — абсолютный?',o:['/var/log/nginx','var/log/nginx','../log/nginx','./nginx'],a:0,e:'Абсолютный начинается с / (корня) и одинаков из любой папки. Остальные считаются от текущей.'},
 {t:'c',q:'Куда приведёт <code>cd ~</code>?',o:['В домашнюю папку пользователя','В корень /','В предыдущую папку','В /tmp'],a:0,e:'~ — домашняя папка: /home/имя (у root — /root). Просто cd без аргументов делает то же самое.'},
 {t:'c',q:'Что делает <code>cd -</code>?',o:['Возвращает в предыдущую папку','Переходит на уровень выше','Переходит в корень','Выдаёт ошибку'],a:0,e:'cd - переключает между двумя последними папками. На уровень выше — cd ..'},

/* streams · L1 · Потоки, перенаправления, пайпы, коды возврата */
MOD({id:'streams',title:'Потоки, пайпы и коды возврата',sub:'stdin / stdout / stderr, > >> 2>&1, | , tee, xargs, $? и && ||.',
case:`<p>Бэкап базы настроен в cron и «работает» уже месяц. В день, когда он понадобился, оказалось, что последний удачный бэкап был три недели назад. Лог пустой — ни одной ошибки. Тогда же выясняется, что в CI тесты падали неделю, а пайплайн был зелёным.</p><p class="goal"><b>Цель модуля:</b> управлять тем, куда уходит вывод и куда — ошибки, склеивать команды пайпами и понимать коды возврата. На этом держится любой скрипт, cron и CI: без этого ошибки теряются молча.</p>`,
intro:`<p>У каждой программы в Linux есть три «трубы»: <b>вход</b> (stdin), <b>нормальный вывод</b> (stdout) и <b>вывод ошибок</b> (stderr). По умолчанию все три подключены к терминалу: ты печатаешь — программа читает, программа пишет — ты видишь.</p>
<p>Оболочка умеет <mark>переподключать эти трубы</mark>: вывод — в файл, ошибки — в мусорку, вывод одной программы — на вход другой. Из маленьких утилит, соединённых пайпами, собирается любая обработка логов — это и есть «философия Unix».</p>
<p>Зачем DevOps-у: логи cron и скриптов теряются, если не перенаправить stderr; пайплайн CI «зелёный», хотя команда упала, если не понимать коды возврата. Каждый скрипт деплоя держится на <code>&amp;&amp;</code>, <code>||</code> и <code>$?</code>.</p>`,
theory:`<h2>Три стандартных потока</h2>
${tbl(['Номер (fd)','Имя','Куда по умолчанию','Что туда идёт'],[
 ['<b>0</b>','stdin','клавиатура','входные данные'],
 ['<b>1</b>','stdout','терминал','нормальный результат'],
 ['<b>2</b>','stderr','терминал','ошибки и диагностика']])}
<p>В терминале stdout и stderr смешаны, поэтому кажется, что это одно и то же. Разница видна, когда начинаешь перенаправлять.</p>
<h2>Перенаправления</h2>
${CMDS([['cmd > out.txt','stdout в файл, файл <b>перезаписывается</b>'],['cmd >> out.txt','stdout в конец файла (дописать)'],['cmd 2> err.txt','stderr в файл'],['cmd > all.log 2>&1','и вывод, и ошибки в один файл'],['cmd &> all.log','то же самое, короткая запись bash'],['cmd 2>/dev/null','ошибки выбросить'],['cmd > /dev/null 2>&1','выбросить всё (только код возврата важен)'],['cmd < input.txt','stdin из файла']])}
${BOX('Как читать 2>&1','<p>«Поток 2 направь туда же, куда <b>сейчас</b> направлен поток 1». Оболочка обрабатывает перенаправления <mark>слева направо</mark>:</p>'+C(`cmd > file 2>&1    # 1 → file, потом 2 → туда же (file). Всё в файле.
cmd 2>&1 > file    # 2 → туда, где сейчас 1 (терминал), потом 1 → file. Ошибки на экране!`)+'<p><code>/dev/null</code> — устройство-«чёрная дыра»: всё, что туда пишут, исчезает.</p>','deep')}
<h2>Пайп |</h2>
<p><code>a | b</code> — stdout программы <b>a</b> подключается к stdin программы <b>b</b>. Обе запускаются <b>одновременно</b>, данные текут потоком — поэтому можно обработать лог на 10 ГБ, не загружая его в память.</p>
${C(`ps aux | grep nginx                 # процессы → только строки с nginx
cat access.log | grep " 500 " | wc -l   # сколько ответов 500
journalctl -u app | tail -n 50`)}
<p>В пайп попадает <b>только stdout</b>. Ошибки идут мимо, на экран. Чтобы отправить в пайп и их: <code>cmd 2>&amp;1 | grep error</code> (или <code>cmd |&amp; grep error</code> в bash).</p>
<h2>tee и xargs</h2>
${CMDS([['cmd | tee out.log','показать на экране <b>и</b> записать в файл'],['cmd | tee -a out.log','то же, дописывая'],['echo x | sudo tee /etc/f','запись в файл от root (см. модуль «Права»)'],['find . -name "*.tmp" | xargs rm','превратить строки из stdin в <b>аргументы</b> команды'],['find . -name "*.tmp" -print0 | xargs -0 rm','то же, безопасно для имён с пробелами']])}
<h2>Код возврата: $?</h2>
<p>Каждая программа при завершении возвращает число: <mark>0 — успех, всё остальное — ошибка</mark>. Последний код хранится в <code>$?</code>.</p>
${C(`
$ ls /etc/hosts
/etc/hosts
$ echo $?
0
$ ls /nope
ls: cannot access '/nope': No such file or directory
$ echo $?
2
`,'term')}
${CMDS([['a && b','b выполнится, только если a успешна (код 0)'],['a || b','b выполнится, только если a упала'],['a ; b','b выполнится в любом случае'],['a && echo OK || echo FAIL','короткое «если-иначе»']])}
<p>Код пайплайна — это код <b>последней</b> команды. <code>false | true</code> вернёт 0. Поэтому в скриптах пишут <code>set -o pipefail</code>: тогда пайп вернёт ошибку, если упала любая его часть.</p>
<h2>Подстановка вывода и here-doc</h2>
${C(`echo "Сегодня $(date +%F), хост $(hostname)"   # $(...) — подставить вывод команды
cat > app.conf <<EOF                            # here-doc: многострочный stdin
port=8080
env=prod
EOF`)}`,
memo:`<p>Для любой команды, которую запускаешь, спрашивай себя: «что тут идёт в stdout, а что в stderr, и какой код вернётся?». Проверяй: <code>cmd &gt;/dev/null</code> — что осталось на экране, то и было stderr; потом <code>echo $?</code>.</p>`,

lab:[
 {t:'Разведи потоки: выполни <code>ls /etc/hosts /nope</code> четырьмя способами — только вывод в файл, только ошибки в файл, всё в один файл, всё выбросить. После каждого посмотри, что на экране, что в файле, и <code>echo $?</code>.',sol:C(`ls /etc/hosts /nope > out.txt;        cat out.txt
ls /etc/hosts /nope 2> err.txt;       cat err.txt
ls /etc/hosts /nope > all.txt 2>&1;   cat all.txt
ls /etc/hosts /nope > /dev/null 2>&1; echo $?   # 2 — одна из целей не найдена`)},
 {t:'Докажи порядок перенаправлений: сравни <code>ls /etc/hosts /nope &gt; f 2&gt;&amp;1</code> и <code>ls /etc/hosts /nope 2&gt;&amp;1 &gt; f</code>. Запиши своими словами, почему результат разный.'},
 {t:'Сломай файл и пойми почему: создай файл с 5 строками в случайном порядке, выполни <code>sort f &gt; f</code>. Потом отсортируй правильно.',sol:C(`printf "c\\na\\ne\\nb\\nd\\n" > f
