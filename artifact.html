# или: sort -o f f  (sort сам безопасно пишет в тот же файл)`)},
 {t:'Pipefail вживую: проверь код <code>false | true</code> без и с <code>set -o pipefail</code>. Объясни, чем это грозит в CI.',sol:C(`false | true; echo $?          # 0
set -o pipefail
false | true; echo $?          # 1
set +o pipefail                # вернуть как было`)},
 {t:'Напиши однострочник-проверку: если в <code>/etc/os-release</code> есть <code>ubuntu</code>, печатает <code>Debian-family: apt</code>, иначе <code>not ubuntu</code>. Без if — только <code>grep -q</code>, <code>&amp;&amp;</code>, <code>||</code>.',sol:C(`grep -qi ubuntu /etc/os-release && echo "Debian-family: apt" || echo "not ubuntu"`)}],
qa:[
 ['Что такое stdin, stdout, stderr?','Три стандартных потока процесса: 0 — вход, 1 — нормальный вывод, 2 — ошибки. По умолчанию подключены к терминалу, оболочка может их перенаправить.'],
 ['Что значит 2>&1 и почему важен порядок?','stderr направить туда же, куда сейчас указывает stdout. Перенаправления читаются слева направо: > file 2>&1 — всё в файл; 2>&1 > file — ошибки остались в терминале.'],
 ['Чем > отличается от >>?','> перезаписывает файл (обнуляет до запуска команды), >> дописывает в конец.'],
 ['Что делает пайп?','Соединяет stdout левой команды со stdin правой. Команды работают параллельно, данные текут потоком. stderr через пайп не идёт.'],
 ['Что такое код возврата и $??','Число, которое процесс возвращает при выходе: 0 — успех, иначе ошибка. $? — код последней команды. На нём работают &&, ||, if и CI.'],
 ['Зачем set -o pipefail?','По умолчанию код пайпа — код последней команды, и падение в середине теряется. pipefail возвращает ошибку, если упала любая часть.'],
 ['Зачем tee и xargs?','tee — раздваивает поток: на экран и в файл (и запись от root через sudo tee). xargs — превращает строки stdin в аргументы команды, которая stdin не читает (rm, kill).']],
cheat:[['cmd > file 2>&1','всё в файл'],['cmd >> file','дописать'],['cmd 2>/dev/null','скрыть ошибки'],['cmd 2>&1 | grep x','ошибки тоже в пайп'],['cmd | tee file','экран + файл'],['echo $?','код последней команды'],['a && b || c','если успех — b, иначе c'],['set -o pipefail','ошибка любой части пайпа'],['find … -print0 | xargs -0 cmd','строки → аргументы'],['x=$(cmd)','вывод в переменную']]});
/* text · L1 · Обработка текста: grep, cut, sort, uniq, wc, awk, sed — на логе nginx */
MOD({id:'text',title:'Текст и логи: grep, sort, uniq, awk, sed',sub:'Как за минуту ответить на вопрос «что происходит с сайтом» по логу на миллион строк.',
case:`<p>Пятница, 18:40. Менеджер пишет в общий чат: «Клиенты жалуются, что оплата не проходит!» Сайт при этом открывается. У тебя есть доступ к серверу и лог nginx на миллион строк. Через 5 минут нужно ответить: с какого времени это началось, сколько людей задело, какой именно адрес ломается, проблема у нас или у клиентов, атака это или баг после релиза.</p><p class="goal"><b>Цель модуля:</b> превращать гигабайтный лог в ответы на такие вопросы одной строкой из маленьких утилит (grep, awk, sort, uniq) и безопасно массово править конфиги (sed).</p>`,
intro:`<p>Почти всё на сервере — текст: логи, конфиги, вывод команд. Когда на проде что-то не так, ответ обычно лежит в логе. Но лог — это миллион строк, глазами его не прочитать.</p>
<p>Для этого есть набор маленьких утилит, каждая делает одно дело: <b>grep</b> отбирает строки, <b>cut</b> и <b>awk</b> вырезают нужные столбцы, <b>sort</b> сортирует, <b>uniq</b> схлопывает повторы, <b>wc</b> считает, <b>sed</b> заменяет. Соединяешь их пайпами (модуль 5) — и получаешь ответ на вопрос вроде «с каких IP больше всего ошибок за последний час».</p>
<p>Учиться будем на логе <b>nginx</b> — это самый частый лог, который ты будешь разбирать. Ниже сначала коротко: что это за программа и что в её логе.</p>`,
theory:`<h2>Сначала: что такое nginx и его лог</h2>
<p><b>Nginx</b> (читается «энджин-икс») — веб-сервер. Он стоит «на входе» сайта: принимает запросы браузеров и либо сам отдаёт файлы (HTML, картинки), либо передаёт запрос твоему приложению и возвращает ответ. Подробно (настройка, reverse proxy) — в модуле «Nginx», сейчас нам нужен только его лог.</p>
<p>На <b>каждый</b> запрос nginx дописывает одну строку в <code>/var/log/nginx/access.log</code>. Формат по умолчанию называется <i>combined</i>:</p>
${C(`203.0.113.7 - - [24/Nov/2026:10:15:32 +0300] "GET /api/orders HTTP/1.1" 500 162 "-" "curl/8.5.0"`,'out')}
${tbl(['Поле (номер при делении по пробелам)','Значение','Что это'],[
 ['$1','<code>203.0.113.7</code>','IP клиента'],
 ['$2, $3','<code>- -</code>','не используется / имя пользователя (обычно пусто)'],
 ['$4, $5','<code>[24/Nov/2026:10:15:32 +0300]</code>','время запроса и часовой пояс'],
 ['$6, $7, $8','<code>"GET /api/orders HTTP/1.1"</code>','метод, путь, версия протокола'],
 ['<b>$9</b>','<code>500</code>','<mark>код ответа</mark>: 2xx ок, 3xx перенаправление, 4xx ошибка клиента (404 — нет такой страницы), 5xx ошибка сервера'],
 ['$10','<code>162</code>','размер ответа в байтах'],
 ['$11','<code>"-"</code>','referer — откуда пришёл'],
 ['$12…','<code>"curl/8.5.0"</code>','user agent — чем пришёл (браузер, бот, curl)']])}
<p>Ошибки самого nginx (не смог соединиться с приложением, нет прав на файл) — в соседнем <code>error.log</code>. Старые логи каждую ночь переименовываются в <code>access.log.1</code>, потом сжимаются в <code>access.log.2.gz</code> — это <b>ротация</b> (программа logrotate), чтобы логи не съели диск.</p>
<h2>grep — отобрать строки</h2>
${CMDS([['grep "500" access.log','строки, где есть 500'],['grep -i error app.log','без учёта регистра'],['grep -v healthcheck access.log','всё, <b>кроме</b> строк с healthcheck'],['grep -c " 404 " access.log','только число совпадений'],['grep -n error app.log','с номерами строк'],['grep -r "listen 80" /etc/nginx/','рекурсивно по папке'],['grep -A 5 -B 2 Exception app.log','2 строки до и 5 после — увидеть контекст'],['grep -E "500|502|503" access.log','несколько вариантов (расширенные регулярки)'],['grep -o "GET [^ ]*" access.log','вывести только совпавший кусок'],['zgrep " 500 " access.log.2.gz','искать в сжатом логе']])}
${BOX('Регулярные выражения — минимум','<p>grep, sed и awk ищут по <b>шаблонам</b>: <code>^</code> — начало строки, <code>$</code> — конец, <code>.</code> — любой символ, <code>*</code> — предыдущее сколько угодно раз, <code>[0-9]</code> — одна цифра, <code>[^ ]</code> — любой символ, кроме пробела. <code>^#</code> — строки-комментарии, <code>^$</code> — пустые строки. Пример: <code>grep -v -E "^#|^$" nginx.conf</code> — конфиг без комментариев и пустых строк.</p>','deep')}
<h2>cut, sort, uniq, wc — столбцы и подсчёт</h2>
${CMDS([['cut -d" " -f1 access.log','первое поле при делении по пробелу (IP)'],['cut -d: -f1 /etc/passwd','имена пользователей'],['sort file','по алфавиту'],['sort -n','как числа (иначе 10 &lt; 9)'],['sort -rn','числа по убыванию'],['sort -h','понимает 1K, 2M, 3G (для du -h)'],['sort -k2 -n','по второму столбцу'],['uniq','схлопнуть <b>соседние</b> повторы'],['uniq -c','и посчитать, сколько раз'],['sort -u','отсортировать и оставить уникальные'],['wc -l','строки (-w слова, -c байты)']])}
<p><mark>uniq видит только соседние одинаковые строки</mark>, поэтому перед ним всегда <code>sort</code>.</p>
<h2>awk — столбцы с условиями и арифметикой</h2>
<p>awk делит каждую строку на поля <code>$1, $2, …</code> (по пробелам; другой разделитель — <code>-F</code>), <code>$0</code> — вся строка, <code>NF</code> — число полей. Программа: <code>условие { действие }</code>.</p>
${C(`awk '{print $1}' access.log                 # IP
awk '$9 == 500' access.log                  # только строки с кодом 500
awk '$9 >= 500 {print $1, $7}' access.log   # IP и путь для всех 5xx
awk -F: '$3 >= 1000 {print $1}' /etc/passwd # обычные пользователи
awk '{s += $10} END {print s/1024/1024 " MB"}' access.log   # трафик за файл`)}
<h2>sed — найти и заменить</h2>
${C(`sed 's/http:/https:/' file           # заменить первое вхождение в каждой строке
sed 's/http:/https:/g' file          # g — все вхождения
sed -i 's/^port=.*/port=9090/' app.conf   # -i — прямо в файле!
sed -i.bak 's/a/b/g' app.conf        # то же, но сохранить копию app.conf.bak
sed -n '100,120p' big.log            # показать строки 100–120
sed '/^#/d' nginx.conf               # удалить строки-комментарии (в выводе)`)}
<h2>Главный приём: «топ» чего угодно</h2>
${C(`awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -10`)}
<p>Читаем по шагам: вырезать IP → отсортировать (чтобы одинаковые оказались рядом) → посчитать повторы → отсортировать по числу по убыванию → первые 10. Меняешь <code>$1</code> на <code>$9</code> — топ кодов ответа, на <code>$7</code> — топ страниц. Это самый частый однострочник на собеседованиях и инцидентах.</p>`,
memo:`<p>Возьми любой реальный лог (или сгенерируй в лабе) и задай ему 5 вопросов: сколько всего запросов, сколько 5xx, топ-10 IP, топ-10 страниц с ошибкой 404, в какую минуту было больше всего запросов. Каждый ответ — одна строка из пайпов. Собирай её по одному звену и смотри промежуточный вывод через <code>| head</code>.</p>`,
traps:[
 ['sort | uniq -c без sort: awk … | uniq -c','awk … | sort | uniq -c','uniq схлопывает только соседние строки. Без сортировки один IP посчитается много раз кусками.'],
 ['sort -r для чисел из uniq -c','sort -rn','Без -n сортировка по тексту: «9» окажется выше «10», «100».'],
 ['grep 500 access.log — «это ошибки 500»','awk \'$9 == 500\' access.log','grep 500 найдёт и размер 1500 байт, и время 10:15:00, и /page500. Точнее — сравнивать именно поле кода.'],
 ['sed -i … сразу на проде','Сначала sed без -i (смотришь результат), потом sed -i.bak','-i меняет файл без подтверждения. Ошибка в выражении испортит конфиг, а бэкапа не будет.'],
 ['grep по access.log, а нужные данные во вчерашнем access.log.2.gz','zgrep … access.log*  или  zcat access.log.*.gz | grep …','После ротации старые логи сжаты. Обычный grep по .gz ищет в бинарных данных.']],
ex:[
 {t:'c',q:'Что делает nginx?',o:['Принимает HTTP-запросы и отдаёт файлы или передаёт запрос приложению','Хранит данные как база данных','Планирует задачи по расписанию','Управляет пакетами'],a:0,e:'Nginx — веб-сервер и обратный прокси: «вход» сайта.'},
 {t:'c',q:'В строке combined-лога nginx код ответа — это поле номер…',o:['9','1','7','4'],a:0,e:'$1 IP, $4–$5 время, $6–$8 запрос, $9 код, $10 байты.'},
 {t:'c',q:'Что делает <code>grep -v healthcheck</code>?',o:['Показывает все строки, КРОМЕ содержащих healthcheck','Показывает только healthcheck','Считает healthcheck','Ищет без учёта регистра'],a:0,e:'-v — инвертировать отбор. Удобно убрать шум от проверок балансировщика.'},
 {t:'c',q:'Почему перед <code>uniq -c</code> ставят <code>sort</code>?',o:['uniq схлопывает только соседние одинаковые строки','sort ускоряет uniq','Без sort uniq не запустится','Чтобы убрать пустые строки'],a:0,e:'Одинаковые строки должны стоять рядом — это и делает sort.'},
 {t:'c',q:'<code>sort</code> без флагов выдал 10, 100, 9. Что добавить?',o:['-n','-r','-u','-k'],a:0,e:'-n — числовая сортировка. Без неё строки сравниваются посимвольно.'},
 {t:'c',q:'Что делает <code>sed -i</code>?',o:['Меняет файл прямо на месте','Выводит результат без изменения файла','Ищет без учёта регистра','Показывает номера строк'],a:0,e:'Без -i sed печатает результат в stdout, а файл не трогает.'},
 {t:'c',q:'Что выведет <code>awk -F: \'{print $1}\' /etc/passwd</code>?',o:['Имена всех пользователей','Пароли','UID','Домашние папки'],a:0,e:'-F: — разделитель двоеточие. Первое поле в /etc/passwd — имя.'},
 {t:'i',q:'Впиши: посчитать количество строк в <code>access.log</code>.',a:['wc -l access.log','wc -l < access.log','cat access.log | wc -l'],ph:'wc …',e:'wc -l — число строк = число запросов.'},
 {t:'i',q:'Впиши: вывести только IP (первое поле) из <code>access.log</code> через cut.',a:['cut -d" " -f1 access.log',"cut -d' ' -f1 access.log",'cut -d " " -f1 access.log',"cut -d ' ' -f1 access.log",'cut -f1 -d" " access.log'],ph:'cut …',e:'-d — разделитель, -f — номер поля.'},
 {t:'i',q:'Впиши: найти строки с <code>Exception</code> в <code>app.log</code> и показать по 3 строки после каждой.',a:['grep -A 3 Exception app.log','grep -A3 Exception app.log','grep -A 3 "Exception" app.log','grep -A3 "Exception" app.log'],ph:'grep …',e:'-A — after, -B — before, -C — вокруг. Стектрейс обычно ниже строки с исключением.'},
 {t:'i',q:'Впиши awk: показать только строки <code>access.log</code>, где код ответа равен 404.',a:["awk '$9 == 404' access.log","awk '$9==404' access.log","awk '$9 == \"404\"' access.log","awk '$9 == 404 {print}' access.log","awk '$9==404 {print $0}' access.log"],ph:"awk '…' access.log",e:'Условие без действия печатает строку целиком.'},
 {t:'i',q:'Впиши sed: заменить во всём файле <code>app.conf</code> все <code>localhost</code> на <code>db</code>, прямо в файле, сохранив копию <code>.bak</code>.',a:["sed -i.bak 's/localhost/db/g' app.conf",'sed -i.bak "s/localhost/db/g" app.conf'],ph:'sed …',e:'-i.bak — правка на месте с бэкапом, g — все вхождения в строке.'},
 {t:'s',q:'Собери «топ-10 IP по числу запросов».',p:["awk '{print $1}' access.log",'| sort','| uniq -c','| sort -rn','| head -10'],e:'Вырезать → сгруппировать → посчитать → упорядочить по числу → первые 10.'},
 {t:'r',q:'Какой IP сделал больше всего запросов?',code:`$ awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -3
   8812 198.51.100.23
    412 203.0.113.7
     97 192.0.2.44`,lang:'term',o:['198.51.100.23 — 8812 запросов','203.0.113.7','192.0.2.44','Нельзя сказать'],a:0,e:'uniq -c ставит число слева. 8812 против сотен — похоже на бота или атаку.'},
 {t:'r',q:'Что произошло с этим запросом?',code:`10.0.0.5 - - [25/Nov/2026:09:01:12 +0300] "POST /api/pay HTTP/1.1" 502 157 "-" "Mozilla/5.0"`,lang:'out',o:['Ошибка 502: nginx не получил нормальный ответ от приложения','Успешная оплата','Страница не найдена','Клиент отменил запрос'],a:0,e:'5xx — проблема на сервере. 502 Bad Gateway — nginx как прокси не смог получить ответ от приложения (упало, не слушает порт). Причину ищем в error.log.'},
 {t:'r',q:'Почему результат подсчёта неверный?',code:`$ awk '{print $9}' access.log | uniq -c
   3 200
   1 404
   5 200
   2 500
   4 200`,lang:'term',o:['Нет sort перед uniq — 200 посчитано кусками','awk неверно выбрал поле','uniq -c не умеет считать','Лог повреждён'],a:0,e:'uniq склеил только соседние строки. Нужно … | sort | uniq -c.'},
 {t:'c',g:'prac',q:'Ты ищешь ответы 500 командой <code>grep 500 access.log</code>, и в выдаче много строк с кодом 200. Почему?',o:['500 встречается в других полях: размер, время, путь','grep сломан','Логи перемешаны','Нужно grep -i'],a:0,e:'grep ищет подстроку в любом месте. Точно: awk \'$9 == 500\' или хотя бы grep " 500 ".'},
 {t:'c',g:'prac',q:'Как посмотреть конфиг nginx без комментариев и пустых строк?',o:['grep -v -E "^#|^\\s*$" nginx.conf','grep "#" nginx.conf','cut -d# -f1 nginx.conf | sort','sed -i "/#/d" nginx.conf'],a:0,e:'-v с шаблоном «начинается с # или пустая». Последний вариант испортит файл (-i) и удалит строки, где # в середине.'},
 {t:'i',g:'prac',q:'Впиши: сколько всего ответов с кодом 5xx (500–599) в access.log? Одной строкой, через awk и wc.',a:["awk '$9 >= 500' access.log | wc -l","awk '$9 ~ /^5/' access.log | wc -l","awk '$9>=500' access.log | wc -l","awk '$9 >= 500 && $9 < 600' access.log | wc -l"],ph:"awk …",e:'Условие на поле кода, потом подсчёт строк. Можно и без wc: awk \'$9>=500{n++} END{print n}\'.'},
 {t:'i',g:'prac',fix:true,q:'Исправь: должна вывести топ страниц, но выводит странный порядок (сначала 9, потом 87, потом 1200).',code:"awk '{print $7}' access.log | sort | uniq -c | sort -r | head",a:["awk '{print $7}' access.log | sort | uniq -c | sort -rn | head","awk '{print $7}' access.log | sort | uniq -c | sort -nr | head"],ph:'awk …',e:'Числа из uniq -c надо сортировать численно: sort -rn.'},
 {t:'s',g:'job',q:'Сайт начал отдавать 502. Собери порядок разбора по логам.',p:["Сколько и с какого времени: awk '$9 == 502' access.log | head","На какие адреса: awk '$9 == 502 {print $7}' access.log | sort | uniq -c | sort -rn","Почему — в error.log: tail -n 50 /var/log/nginx/error.log","Проверить само приложение (его лог / жив ли процесс)"],e:'Масштаб → что затронуто → причина со стороны nginx → причина в приложении.'},
 {t:'c',g:'job',q:'Тимлид: «Вчера ночью был всплеск 404, глянь». Сегодняшний <code>access.log</code> чистый. Где искать?',o:['В ротированных логах: access.log.1 и access.log.N.gz (через zgrep/zcat)','В error.log','В /etc/nginx','Логи за вчера уже удалены'],a:0,e:'logrotate каждую ночь сдвигает файлы. Вчера — access.log.1, раньше — сжатые .gz.'},
 {t:'c',g:'job',q:'Нужно поменять порт в 30 конфигах <code>/etc/app/*.conf</code> с 8080 на 9090. Что разумно?',o:['Сначала sed без -i на один файл посмотреть, потом sed -i.bak \'s/8080/9090/g\' /etc/app/*.conf','Открыть каждый в редакторе','sed -i \'s/8080/9090/\' /etc/*','rm и создать заново'],a:0,e:'Проверить выражение на сухую → массовая правка с бэкапами. Вариант с /etc/* заденет всё подряд.'}],
lab:[
 {t:'Сгенерируй учебный лог nginx на 5000 строк (скрипт в решении — сначала попробуй прочитать и понять его сам, это повторение пайпов и awk). Потом ответь одной строкой на каждый вопрос: всего запросов; сколько 5xx; топ-5 IP; топ-5 страниц с 404; какой процент запросов — ошибки 5xx.',h:'<p>Для процента в awk есть END: <code>awk \'{n++} $9>=500{e++} END{print e/n*100}\'</code>.</p>',sol:C(`for i in $(seq 5000); do
  ip="10.0.0.$((RANDOM % 20))"; code=$(shuf -n1 -e 200 200 200 200 301 404 404 500 502)
  path=$(shuf -n1 -e / /login /api/orders /api/pay /static/app.js /admin)
  echo "$ip - - [25/Nov/2026:10:$((RANDOM%60)):00 +0300] \\"GET $path HTTP/1.1\\" $code $((RANDOM%5000)) \\"-\\" \\"curl/8.5\\""
done > ~/lab/access.log

wc -l ~/lab/access.log
awk '$9 >= 500' ~/lab/access.log | wc -l
awk '{print $1}' ~/lab/access.log | sort | uniq -c | sort -rn | head -5
awk '$9 == 404 {print $7}' ~/lab/access.log | sort | uniq -c | sort -rn | head -5
awk '{n++} $9>=500{e++} END{printf "%.1f%%\\n", e/n*100}' ~/lab/access.log`)},
 {t:'Докажи себе ловушки: на том же логе сравни <code>grep -c 500</code> и <code>awk \'$9==500\' | wc -l</code>; сравни <code>uniq -c</code> с <code>sort</code> и без; <code>sort -r</code> и <code>sort -rn</code> на выводе uniq -c. Запиши, где и почему разошлось.'},
 {t:'Безопасная правка конфига: скопируй <code>/etc/ssh/sshd_config</code> (или любой конфиг) в <code>~/lab</code>, выведи его без комментариев и пустых строк, затем через sed поменяй <code>#Port 22</code> на <code>Port 2222</code> — сначала без -i, потом с <code>-i.bak</code>. Проверь <code>diff</code> между файлом и .bak.',sol:C(`cp /etc/ssh/sshd_config ~/lab/sshd_config 2>/dev/null || cp /etc/ssh/ssh_config ~/lab/sshd_config
grep -v -E "^#|^\\s*$" ~/lab/sshd_config
sed 's/^#Port 22/Port 2222/' ~/lab/sshd_config | grep Port
sed -i.bak 's/^#Port 22/Port 2222/' ~/lab/sshd_config
diff ~/lab/sshd_config.bak ~/lab/sshd_config`)},
 {t:'Найди в <code>/etc/passwd</code> всех пользователей, у которых есть настоящая оболочка (не nologin и не false), и выведи имя и оболочку. Затем — всех с UID ≥ 1000.',sol:C(`grep -v -E "nologin|false" /etc/passwd | cut -d: -f1,7
awk -F: '$3 >= 1000 {print $1, $3}' /etc/passwd`)}],
qa:[
 ['Как найти топ IP по запросам в логе nginx?',"awk '{print $1}' access.log | sort | uniq -c | sort -rn | head. Вырезать поле → сгруппировать → посчитать → по убыванию."],
 ['Почему uniq используют после sort?','uniq схлопывает только подряд идущие одинаковые строки. sort ставит одинаковые рядом.'],
 ['Чем grep отличается от awk?','grep отбирает строки по шаблону. awk работает с полями: условия на конкретный столбец, вывод нужных столбцов, арифметика и итоги в END.'],
 ['Как sed заменить текст в файле безопасно?',"Сначала без -i посмотреть результат, потом sed -i.bak 's/old/new/g' file — правка на месте с резервной копией."],
 ['Что в строке access.log nginx?','IP, время, запрос (метод, путь, протокол), код ответа, размер, referer, user agent. Ошибки самого nginx — в error.log.'],
 ['Чем отличаются 4xx и 5xx?','4xx — ошибка клиента (404 нет страницы, 403 запрещено, 401 не авторизован). 5xx — ошибка сервера (500 упало приложение, 502 прокси не получил ответ, 504 таймаут).'],
 ['Как искать в старых сжатых логах?','zgrep, zcat, zless работают с .gz без распаковки: zgrep " 500 " access.log.*.gz.']],
cheat:[["awk '{print $1}' log | sort | uniq -c | sort -rn | head",'топ значений поля'],['grep -v x','всё, кроме x'],['grep -c x','сколько строк с x'],['grep -A 5 -B 2 x','контекст вокруг'],['grep -E "a|b"','несколько вариантов'],['grep -r x /etc/nginx/','рекурсивно'],['zgrep x log.gz','в сжатом логе'],['cut -d: -f1 /etc/passwd','поле по разделителю'],['sort -rn','числа по убыванию'],['sort -h','1K/2M/3G'],["awk '$9 >= 500' access.log",'условие на столбец'],["awk -F: '{print $1}'",'другой разделитель'],["sed -i.bak 's/a/b/g' f",'замена в файле с бэкапом'],["sed -n '10,20p' f",'строки 10–20'],['wc -l','число строк']]});
/* Единственный источник порядка. Модуль, которого ещё нет в src/modules, просто пропускается. */

/* Словарь инструментов — не определения «как в школе», а: что это → зачем вообще нужно (какую боль решает) → где живёт → когда ты с этим столкнёшься.
   Если инструмент встречается в модуле РАНЬШЕ своего модуля (m), движок сам покажет вверху модуля его карточку. Раздел «Словарь» (#terms) — все сразу.
   Поля: k ключ · n название · re как искать в тексте модуля · m id модуля, где разобрано подробно
         what что это · why зачем, какая проблема без него · where где живёт · when ситуация на работе */
const TERMS=[
 {k:'nginx',n:'Nginx',re:/nginx/i,m:'nginx',
  what:'Веб-сервер — программа, которая сидит на сервере, слушает порт 80/443 и отвечает на запросы из интернета. Браузер пользователя «стучится» именно в nginx.',
  why:'Твоё приложение (на Node, Python, Go) умеет обрабатывать запросы, но плохо умеет быть «лицом» в интернет: держать тысячи соединений, шифровать HTTPS, быстро отдавать картинки, раскидывать нагрузку на несколько копий приложения, прятать внутренние порты. Nginx делает это за него: принимает всё снаружи и передаёт приложению только нужное (это называется reverse proxy). Без него каждому приложению пришлось бы самому решать безопасность, HTTPS и нагрузку.',
  where:'Схема: пользователь → интернет → <b>nginx</b> (порт 443) → твоё приложение (localhost:3000) → база данных. Конфиги — <code>/etc/nginx/</code>, логи — <code>/var/log/nginx/access.log</code> (каждый запрос) и <code>error.log</code> (проблемы самого nginx).',
  when:'Сайт «лежит» или тормозит, пользователи жалуются на ошибки — первое, куда смотришь, это логи nginx: он видит каждый запрос и каждый ответ. По ним понятно, кто пришёл, куда, что получил (200 или 502) и с какого момента началось. Ещё — когда нужно выкатить новый сайт, включить HTTPS или переключить трафик на новую версию приложения.'},
 {k:'http',n:'HTTP и коды ответа',re:/HTTP|\b(?:403|404|500|502)\b/,m:'dns',
  what:'Язык, на котором браузер (или любая программа) разговаривает с сайтом. Запрос: «дай GET /orders». Ответ: код + содержимое.',
  why:'Код ответа — это короткий диагноз, понятный машине и человеку: всё ок или нет, и на чьей стороне проблема. Без кодов пришлось бы читать текст каждой страницы, чтобы понять, ошибка это или нет. Мониторинг, балансировщики и алерты работают именно по кодам.',
  where:'2xx — успех (200 OK). 3xx — «иди туда» (301 переезд). 4xx — <b>клиент</b> попросил что-то не то (404 нет страницы, 403 нельзя, 401 не авторизован). 5xx — <b>сервер</b> сломался (500 ошибка в приложении, 502 nginx не достучался до приложения, 504 приложение не ответило вовремя).',
  when:'В логах и алертах: «выросли 5xx» значит сломалось у нас, надо чинить срочно. «Выросли 404» — чаще битые ссылки или кто-то сканирует сайт. Отличать 4xx от 5xx — первое, что делаешь на инциденте.'},
 {k:'docker',n:'Docker и контейнер',re:/docker|контейнер/i,m:'docker',
  what:'Docker упаковывает приложение вместе со всем, что ему нужно (нужная версия Python/Node, библиотеки, файлы), в <b>образ</b> и запускает его как <b>контейнер</b> — изолированный процесс, который видит только свои файлы.',
  why:'Классическая боль: «у меня на ноуте работает, а на сервере нет» — другая версия библиотеки, другая ОС, забыли что-то поставить. Контейнер везде одинаковый: собрал образ один раз — он одинаково запустится у разработчика, в CI и на проде. Плюс на одном сервере можно запустить десятки приложений, не мешающих друг другу, и легче, чем виртуальные машины (нет своего ядра).',
  where:'Образы и данные — <code>/var/lib/docker</code>. Управление — команда <code>docker</code>, которая общается с фоновым сервисом dockerd через сокет <code>/var/run/docker.sock</code>.',
  when:'Почти всё современное деплоится в контейнерах. Ты будешь собирать образы в CI, смотреть <code>docker logs</code>, когда контейнер упал, и чистить место, когда образы забили диск.'},
 {k:'compose',n:'Docker Compose',re:/compose/i,m:'compose',
  what:'Описание нескольких контейнеров в одном файле <code>docker-compose.yml</code> и запуск всех одной командой <code>docker compose up -d</code>.',
  why:'Реальное приложение — это не один контейнер, а несколько: само приложение, база, кэш, nginx. Запускать каждый руками с кучей флагов (порты, сети, тома) — долго и с ошибками. Compose хранит всю схему в файле, который лежит в git: поднял одной командой, остановил одной командой.',
  where:'Файл <code>docker-compose.yml</code> рядом с проектом. Контейнеры внутри видят друг друга по имени сервиса (приложение ходит в базу по адресу <code>db</code>).',
  when:'Локальная разработка, тестовые стенды, небольшие продакшены без Kubernetes. Деплой «зашёл по SSH → git pull → docker compose up -d» — очень частая схема.'},
 {k:'cron',n:'cron',re:/cron/i,m:'bash2',
  what:'Планировщик задач: сервис, который запускает команды по расписанию. Строка <code>0 3 * * * /opt/backup.sh</code> = «каждый день в 3:00 запусти бэкап».',
  why:'Многое на сервере должно происходить регулярно и без человека: бэкапы базы, чистка старых файлов, отчёты, продление сертификатов. Без планировщика кто-то должен был бы не забывать запускать это руками в 3 ночи.',
  where:'Расписание пользователя — <code>crontab -e</code>, системные — <code>/etc/cron.d/</code>, <code>/etc/crontab</code>. Задачи запускаются без терминала: их вывод никто не видит, если не перенаправить в лог.',
  when:'«Бэкапа нет уже неделю» — идёшь смотреть, есть ли задача в cron, запускалась ли и что писала в лог. Самая частая причина «молча не работает» — забыли <code>2>&1</code> или в cron другие переменные окружения, чем в твоём терминале.'},
 {k:'logrotate',n:'logrotate и ротация логов',re:/logrotate|ротац/i,m:'text',
  what:'Программа, которая по расписанию (обычно раз в сутки) «перекладывает» логи: текущий <code>access.log</code> становится <code>access.log.1</code>, вчерашний сжимается в <code>.2.gz</code>, самые старые удаляются.',
  why:'Логи пишутся непрерывно. Без ротации <code>access.log</code> нагруженного сайта за пару месяцев вырастает до десятков гигабайт, забивает диск — и сервер падает целиком (базы и приложения не могут писать). Ротация держит логи в рамках: например, последние 14 дней, старые сжаты.',
  where:'Правила — <code>/etc/logrotate.conf</code> и <code>/etc/logrotate.d/</code> (у nginx свой файл). Запускается по таймеру systemd или через cron.',
  when:'Ищешь, что было вчера, а в текущем логе пусто — данные в <code>access.log.1</code> или в <code>.gz</code>. Или диск забит логами — значит ротация не настроена или сломалась. Или <code>tail -f</code> «замолчал» после полуночи.'},
 {k:'systemd',n:'systemd / systemctl',re:/systemd|systemctl|unit-файл/i,m:'systemd',
  what:'Главный «надсмотрщик» Linux: первый процесс, который при загрузке запускает все сервисы (nginx, docker, ssh, твоё приложение) и следит за ними дальше.',
  why:'Сервис должен стартовать сам после перезагрузки, подниматься заново, если упал, запускаться в правильном порядке (сначала сеть, потом приложение) и от правильного пользователя. Раньше это делали самописными скриптами, которые часто ломались. systemd делает это по короткому описанию — unit-файлу.',
  where:'Команда <code>systemctl status|start|stop|restart|enable имя</code>. Описания сервисов — <code>/etc/systemd/system/*.service</code>. Логи — журнал, читается через <code>journalctl</code>.',
  when:'«Сервис не работает» → первое: <code>systemctl status имя</code> (запущен ли, когда упал, последние строки лога). Деплой своего приложения без Docker — это почти всегда unit-файл systemd.'},
 {k:'journalctl',n:'journalctl',re:/journalctl/i,m:'systemd',
  what:'Программа для чтения журнала systemd — единого хранилища логов всех сервисов и ядра.',
  why:'Раньше каждый сервис писал лог куда хотел, и искать приходилось по десятку файлов. Журнал собирает всё в одном месте с точным временем и позволяет фильтровать: по сервису, по времени, по важности.',
  where:'<code>journalctl -u nginx</code> — логи одного сервиса, <code>-f</code> — следить, <code>--since "1 hour ago"</code> — за последний час, <code>-p err</code> — только ошибки.',
  when:'Сервис не запускается — <code>systemctl status</code> показал «failed», а подробности смотришь в <code>journalctl -u сервис -n 100</code>.'},
 {k:'cicd',n:'CI/CD и пайплайн',re:/\bCI\b|CI\/CD|пайплайн|pipeline/i,m:'gitlabci',
  what:'Автоматическая «конвейерная лента»: после каждого push специальный сервер сам собирает код, запускает тесты (CI — непрерывная интеграция) и выкатывает на серверы (CD — непрерывная доставка).',
  why:'Руками деплоить долго и опасно: забыл шаг, собрал не ту версию, выкатил непротестированное в пятницу вечером. Конвейер делает одно и то же каждый раз, не пропускает сломанное дальше (тесты упали — деплоя нет) и показывает историю: кто, что и когда выкатил. Настройка и поддержка этих конвейеров — одна из главных задач DevOps.',
  where:'Описание шагов лежит в репозитории: <code>.gitlab-ci.yml</code>, <code>.github/workflows/*.yml</code>. Выполняют их «раннеры» — программы на отдельных машинах. Шаг (job) считается упавшим, если команда вернула ненулевой код.',
  when:'«Пайплайн красный» — открываешь лог упавшего job и ищешь, какая команда вернула ошибку. «Пайплайн зелёный, а на проде сломано» — значит, ошибка где-то проглатывается (пример — пайп без pipefail).'},
 {k:'git',n:'Git',re:/\bgit\b/i,m:'git',
  what:'Система контроля версий: хранит всю историю изменений кода и конфигов — кто, что и когда поменял.',
  why:'Без неё — «final_v2_исправленный.zip» и невозможность понять, какая правка сломала прод. Git даёт историю, откат к любой версии, работу нескольких людей над одним кодом и запуск CI на каждый push. Для DevOps в git лежит ещё и инфраструктура: конфиги, Dockerfile, Terraform.',
  where:'Папка <code>.git</code> в проекте; удалённый репозиторий — GitHub/GitLab. <code>git pull</code> — забрать изменения, <code>git push</code> — отправить.',
  when:'Каждый день. «Что поменялось перед тем, как всё сломалось?» — <code>git log</code>, <code>git diff</code>. Откат неудачного релиза — часто через git.'},
 {k:'ssh',n:'SSH',re:/\bssh\b/i,m:'ssh',
  what:'Защищённый способ получить терминал на удалённом сервере: <code>ssh user@host</code> — и ты печатаешь команды так, будто сидишь за ним.',
  why:'Серверы стоят в дата-центрах, без монитора и клавиатуры. Нужно управлять ими по сети так, чтобы никто не подслушал пароли и команды и не подменил сервер. SSH всё шифрует и проверяет обе стороны: ты — что это тот самый сервер, сервер — что это ты (по ключу).',
  where:'Клиент — команда <code>ssh</code>, сервер — сервис sshd (конфиг <code>/etc/ssh/sshd_config</code>). Твои ключи — <code>~/.ssh/</code>, разрешённые ключи на сервере — <code>~/.ssh/authorized_keys</code>.',
  when:'Каждое подключение к серверу, копирование файлов (<code>scp</code>), деплой из CI. Частые проблемы: ключ не принимается из-за прав на файлы, «host key changed» после переустановки сервера.'},
 {k:'curl',n:'curl',re:/curl/i,m:'net1',
  what:'Консольный HTTP-клиент: «браузер без окна». Отправляет запрос и печатает ответ.',
  why:'На сервере нет браузера, а проверить «отвечает ли сервис» нужно постоянно — и руками, и в скриптах. curl делает любой запрос (GET, POST, с заголовками и телом) и возвращает код возврата, по которому скрипт понимает, жив ли сервис.',
  where:'<code>curl http://localhost:3000</code> — тело ответа, <code>curl -I</code> — только заголовки, <code>curl -v</code> — весь разговор подробно.',
  when:'Сайт не открывается: с сервера делаешь <code>curl localhost:3000</code> — если приложение отвечает, проблема в nginx или сети; если нет — в самом приложении. Так за одну команду делишь проблему пополам.'},
 {k:'k8s',n:'Kubernetes',re:/kubernetes|k8s|kubectl/i,m:'k8sarch',
  what:'Оркестратор контейнеров: система, которая управляет сотнями контейнеров на десятках серверов как единым целым.',
  why:'Когда контейнеров много, руками не уследить: какой упал, на каком сервере свободно, как обновить 50 копий без простоя. Ты описываешь желаемое состояние («хочу 5 копий приложения версии 2.1»), а Kubernetes сам поддерживает его: перезапускает упавшие, переносит с умершего сервера, обновляет по очереди.',
  where:'Кластер: управляющие узлы (control plane) + рабочие узлы, где крутятся контейнеры. Управление — <code>kubectl</code>, описание — YAML-манифесты.',
  when:'В средних и крупных компаниях это основная платформа. Будешь деплоить, смотреть, почему под не стартует, и разбираться с ресурсами.'},
 {k:'postgres',n:'PostgreSQL',re:/postgres/i,m:'sql',
  what:'База данных: хранит данные приложения (пользователи, заказы) в таблицах и отвечает на SQL-запросы.',
  why:'Приложение не может хранить данные просто в файлах: нужны одновременная запись от многих пользователей, отсутствие потерь при сбое, быстрый поиск. База решает это. Для DevOps база — самое ценное на сервере: её бэкапят, мониторят и берегут.',
  where:'Сервис от системного пользователя <code>postgres</code>, данные — <code>/var/lib/postgresql</code>, порт 5432.',
  when:'Приложение тормозит из-за медленных запросов, диск забит данными базы, нужно восстановить бэкап, нужно дать доступ новому сервису.'},
 {k:'wsl',n:'WSL',re:/\bWSL\b/,m:'linux',
  what:'Windows Subsystem for Linux — настоящая Ubuntu внутри Windows, запускается как обычное приложение.',
  why:'Чтобы учиться Linux, не нужен отдельный компьютер или сервер: WSL даёт полноценный терминал Linux за одну команду <code>wsl --install</code>.',
  where:'Терминал «Ubuntu» в меню Пуск. Файлы Windows видны внутри как <code>/mnt/c/</code>.',
  when:'Твой полигон для всех лаб курса.'},
 {k:'vps',n:'VPS / виртуальная машина',re:/\bVPS\b|VirtualBox|виртуальн/i,m:'ctr',
  what:'Виртуальная машина — «компьютер внутри компьютера» со своей ОС и своим ядром. VPS — такая машина в аренду в дата-центре, с белым IP.',
  why:'Один мощный физический сервер делят на много изолированных виртуальных: дешевле, гибче, можно создать за минуту и удалить. Почти все «серверы» в облаках — это виртуальные машины.',
  where:'В облаке (Yandex Cloud, Selectel, Hetzner, AWS) или локально в VirtualBox.',
  when:'Твой «сервер» на работе почти наверняка VM. Для практики — дешёвый VPS или VirtualBox с Ubuntu Server.'},
 {k:'apt',n:'apt / dnf / apk (менеджеры пакетов)',re:/\bapt\b|\bdnf\b|\bapk\b/,m:'pkgs',
  what:'«Магазин приложений» в консоли: <code>apt install nginx</code> скачивает программу из официального хранилища (репозитория) и ставит со всеми зависимостями.',
  why:'Ставить софт вручную — искать архивы, собирать, следить за зависимостями и обновлениями — долго и опасно. Менеджер пакетов ставит проверенные версии, обновляет их одной командой (включая патчи безопасности) и чисто удаляет.',
  where:'apt — Ubuntu/Debian, dnf — RHEL/Rocky, apk — Alpine. Список репозиториев — <code>/etc/apt/sources.list.d/</code> (в Ubuntu).',
  when:'Поставить утилиту на сервер, обновить систему из-за уязвимости, разобраться, почему «пакет не найден» (другой дистрибутив или не подключён репозиторий).'},
 {k:'sysctl',n:'sysctl',re:/sysctl/i,m:'res',
  what:'Команда для чтения и изменения настроек ядра на лету.',
  why:'Ядро по умолчанию настроено «для всех». Нагруженному серверу иногда нужно другое: больше сетевых соединений, другая политика использования swap. sysctl меняет это без перезагрузки.',
  where:'Текущие значения — <code>sysctl -a</code>, постоянные — файлы <code>/etc/sysctl.d/*.conf</code>.',
  when:'Тонкая настройка под нагрузку, требования Kubernetes или базы данных (например, <code>vm.max_map_count</code> для Elasticsearch).'},
 {k:'npm',n:'npm / make (сборка)',re:/\bnpm\b|\bmake\b/,m:'gitlabci',
  what:'Инструменты сборки проектов: <code>npm</code> — для JavaScript/Node.js (ставит зависимости, запускает тесты), <code>make</code> — запускает шаги сборки, описанные в Makefile.',
  why:'Сборка проекта — это десятки шагов. Их записывают один раз, а дальше любой (и CI) запускает одной командой: <code>npm test</code>, <code>make build</code>.',
  where:'<code>package.json</code> (npm), <code>Makefile</code> (make) в корне проекта.',
  when:'Это команды внутри шагов CI. В модулях они — пример «долгой команды, у которой есть вывод, ошибки и код возврата».'},
 {k:'pwsh',n:'PowerShell',re:/powershell|pwsh|\.ps1/i,m:'shell',
  what:'Оболочка и язык скриптов от Microsoft. Есть в каждой Windows, есть версия для Linux (<code>pwsh</code>).',
  why:'В Windows-инфраструктуре (Active Directory, Windows Server, Azure) автоматизация пишется на PowerShell. Его отличие от bash — по пайпу передаются объекты со свойствами, а не текст.',
  where:'Скрипты — файлы <code>.ps1</code>. Запуск может быть ограничен политикой ExecutionPolicy.',
  when:'Компании со смешанной инфраструктурой, раннеры CI на Windows, автоматизация Azure.'},
 {k:'regex',n:'Регулярные выражения',re:/регуляр|regex/i,m:'text',
  what:'Язык шаблонов для поиска текста: не «найди слово error», а «найди строку, которая начинается с даты, а в конце — число больше 500».',
  why:'Логи и конфиги огромные, а искать нужно не точное слово, а «похожее»: любой IP, любой код 5xx, строку без комментария. Регулярки работают в grep, sed, awk, nginx, мониторинге и почти любом языке.',
  where:'<code>^</code> начало строки, <code>$</code> конец, <code>.</code> любой символ, <code>*</code> повтор, <code>[0-9]</code> цифра, <code>|</code> «или» (в grep -E).',
  when:'Каждый раз, когда фильтруешь логи или массово правишь конфиги.'}];
/* Какие инструменты модуль упоминает раньше их собственного модуля (по плановому порядку LEVELS) */
const PLAN=()=>LEVELS.flatMap(l=>l.ids);
function earlyTerms(id){const m=MODS[id],plan=PLAN(),i=plan.indexOf(id);
  const txt=[m.intro,m.theory,m.memo,JSON.stringify(m.traps),JSON.stringify(m.ex),JSON.stringify(m.lab),JSON.stringify(m.qa)].join(' ').replace(/<[^>]+>/g,' ');
  return TERMS.filter(t=>t.m!==id&&t.re.test(txt)&&plan.indexOf(t.m)>i)}
const termHTML=(t,open)=>`<details class="term"${open?' open':''}><summary>${t.n}</summary><dl>
<dt>Что это</dt><dd>${t.what}</dd><dt>Зачем это вообще нужно</dt><dd>${t.why}</dd><dt>Где живёт</dt><dd>${t.where}</dd><dt>Когда ты с этим столкнёшься</dt><dd>${t.when}</dd></dl>
<p class="muted">${MODS[t.m]?`Подробно: <a href="#m-${t.m}">${MODS[t.m].title}</a>`:'Подробно — в своём модуле (ещё в работе)'}</p></details>`;
/* Сквозной проект «Магазин» — от голого сервера до Kubernetes + CI/CD + мониторинг + Terraform.
   Итог: Node.js CRUD API (товары) в Kubernetes через Helm, CI/CD в GitLab, Prometheus/Grafana, инфраструктура в Terraform. Публичный репо с README и схемой.
   Каждый тикет: id · t (название) · why (зачем — какая боль в проекте) · do (что сделать) · done (как проверить, что готово) · need (модули, которые к нему готовят) · hint (подсказка, раскрывается).
   Модули из need показывают у себя блок «В проекте»: какой тикет теперь можно делать.
   ПРИНЦИП: курс первичен. Модули НЕ подгоняются под проект — проект подстраивается под модули. Поменялся курс → правим тикеты здесь. */
const PROJECT={
 goal:'Простое Node.js CRUD API «Магазин» (товары), задеплоенное в Kubernetes через Helm, с CI/CD в GitLab CI, мониторингом Prometheus/Grafana и инфраструктурой в Terraform. Всё в публичном GitLab-репозитории с README и схемой архитектуры — это твоё портфолио на собес.',
 sprints:[
 {id:'s0',n:'Спринт 0 · Голый сервер',goal:'Поднять API на обычном Linux-сервере руками — без Docker. Так ты поймёшь, из чего состоит прод и какие боли потом решают контейнеры.',tickets:[
  {id:'0.1',t:'Поднять сервер',need:['linux','shell'],why:'Нужна машина, на которой будет жить магазин. На работе это VPS в облаке, для учёбы хватит VM или WSL.',do:'VM в VirtualBox с Ubuntu Server 24.04 LTS или дешёвый VPS (Hetzner, Selectel, Timeweb). Узнай дистрибутив, ядро, архитектуру.',done:'<code>cat /etc/os-release</code> показывает Ubuntu 24.04 LTS, <code>uname -m</code> — архитектуру.'},
  {id:'0.2',t:'Пользователь deploy и права',need:['perms'],why:'Работать под root опасно: одна опечатка — и сервер сломан. Сервисы и деплой живут под отдельным пользователем с минимумом прав.',do:'Создать пользователя <code>deploy</code> с sudo, папку <code>/opt/shop</code> с владельцем deploy.',done:'<code>id deploy</code> показывает группу sudo, <code>ls -ld /opt/shop</code> — владелец deploy.'},
  {id:'0.3',t:'SSH по ключу, пароль выключен',need:['ssh'],why:'Боты круглосуточно подбирают пароли ко всем серверам в интернете. Вход только по ключу закрывает эту дверь.',do:'Сгенерировать ed25519-ключ, положить публичный в <code>authorized_keys</code> deploy, в <code>sshd_config</code> выключить PasswordAuthentication и вход root.',done:'<code>ssh deploy@сервер</code> пускает без пароля; <code>ssh -o PubkeyAuthentication=no deploy@сервер</code> — отказ.',hint:'<p>Перед перезапуском sshd держи вторую открытую сессию — если ошибся в конфиге, она тебя спасёт. Проверка конфига: <code>sudo sshd -t</code>.</p>'},
  {id:'0.4',t:'Firewall',need:['fw'],why:'Наружу должны смотреть только нужные порты: 22 (SSH), 80/443 (сайт). База и приложение — только внутри.',do:'Включить ufw: разрешить 22, 80, 443, всё остальное входящее — запретить.',done:'<code>sudo ufw status</code> — три правила; с другой машины порт 5432 недоступен.'},
  {id:'0.5',t:'API «Магазин» на Node.js',need:['shell','files'],why:'Нужно само приложение, которое будем деплоить всю дальнейшую жизнь курса.',do:'Node.js API: <code>GET /health</code>, <code>GET /items</code>, <code>POST /items</code>. Пока данные в памяти. Код — в git-репозитории на GitLab.',done:'<code>curl localhost:3000/health</code> → <code>200 OK</code>; POST добавляет товар, GET его показывает.',hint:'<p>Express + 30 строк кода. Порт и прочие настройки — из переменных окружения (<code>process.env.PORT</code>), а не зашиты в код: это понадобится в Docker и Kubernetes.</p>'},
  {id:'0.6',t:'Postgres руками',need:['pkgs','systemd'],why:'Данные в памяти пропадают при перезапуске. Настоящему магазину нужна база.',do:'Поставить PostgreSQL через apt, создать базу и пользователя, приложение читает и пишет товары в базу. Пароль — в <code>/opt/shop/.env</code> с правами 600.',done:'Перезапустил приложение — товары на месте. <code>ls -l /opt/shop/.env</code> → <code>-rw-------</code>.'},
  {id:'0.7',t:'Приложение как systemd-сервис',need:['systemd','procs'],why:'Запущенное в терминале приложение умрёт, когда закроешь SSH, и не поднимется после перезагрузки.',do:'Unit-файл <code>shop.service</code>: запуск от deploy, автоперезапуск при падении, автостарт.',done:'<code>sudo reboot</code> → после загрузки <code>systemctl status shop</code> — active; <code>kill -9</code> процесса — через пару секунд он снова жив.'},
  {id:'0.8',t:'Nginx перед приложением',need:['nginx'],why:'Приложение не должно торчать в интернет само: nginx принимает запросы на 80/443, пишет логи и передаёт их на localhost:3000.',do:'Конфиг reverse proxy в <code>sites-available/shop</code>, ссылка в sites-enabled, <code>nginx -t</code>, reload.',done:'<code>curl http://сервер/items</code> снаружи работает, порт 3000 снаружи закрыт.'},
  {id:'0.9',t:'Разбор: логи и ресурсы',need:['text','res'],why:'Прод работает — значит, пора научиться видеть, что с ним происходит.',do:'Нагрузить API (цикл curl), найти в access.log топ адресов и коды ответа, посмотреть, сколько CPU и памяти ест node и postgres.',done:'Можешь одной строкой ответить: сколько запросов было за час, сколько 5xx, кто больше всех нагружает.'}]},
 {id:'s1',n:'Спринт 1 · Docker',goal:'Упаковать магазин в контейнеры. Вспомни Спринт 0: ставить Node и Postgres руками, следить за версиями, писать unit-файлы — теперь это одна команда.',tickets:[
  {id:'1.1',t:'Окружение Docker',need:['docker'],why:'Нужен сам инструмент.',do:'Docker Engine на сервере (или Docker Desktop локально), пользователь deploy в группе docker (и помни, что это равно root).',done:'<code>docker run hello-world</code> работает без sudo.'},
  {id:'1.2',t:'Dockerfile, multi-stage',need:['dfile','multi'],why:'Образ должен быть маленьким и одинаковым везде: у тебя, в CI, на проде.',do:'Dockerfile для API: multi-stage сборка, <code>.dockerignore</code>, запуск не от root, healthcheck.',done:'<code>docker build -t shop .</code> + <code>docker run -p 3000:3000 shop</code> отвечает; образ меньше 200 МБ (<code>docker images</code>).'},
  {id:'1.3',t:'docker-compose: API + Postgres + Redis',need:['compose','vol','dnet'],why:'Магазин — это несколько сервисов, которые должны найти друг друга и не терять данные.',do:'<code>docker-compose.yml</code>: api, postgres (с volume), redis. API ходит в базу по имени сервиса <code>db</code>.',done:'<code>docker compose up -d</code>; POST → <code>docker compose down</code> → <code>up</code> — данные на месте.'},
  {id:'1.4',t:'Переезд прода в контейнеры',need:['compose','nginx'],why:'Закрываем Спринт 0: systemd-сервис и postgres из apt больше не нужны.',do:'Остановить старые сервисы, nginx проксирует на контейнер, деплой = <code>git pull && docker compose up -d --build</code>.',done:'Сайт работает из контейнеров, <code>systemctl status shop</code> — disabled.'}]},
 {id:'s2',n:'Спринт 2 · Kubernetes',goal:'Перенести магазин в Kubernetes: самовосстановление, несколько копий, обновление без простоя.',tickets:[

  {id:'2.2',t:'Deployment + Service',need:['pod','deploy','svc'],why:'Описать магазин манифестами: сколько копий и как к ним достучаться.',do:'<code>deployment.yaml</code> (2 реплики) и <code>service.yaml</code>.',done:'Поды Running; удалил под — Kubernetes поднял новый.'},
  {id:'2.3',t:'ConfigMap и Secret',need:['cfg'],why:'Настройки и пароль от базы не должны быть зашиты в образ.',do:'Env — в ConfigMap, пароль БД — в Secret, приложение читает их как переменные окружения.',done:'Поменял значение в ConfigMap + rollout restart — приложение видит новое.'},

  {id:'2.5',t:'Probes и ресурсы',need:['probes','qos'],why:'Kubernetes должен знать, жив ли под и готов ли принимать трафик, и сколько ресурсов ему дать.',do:'liveness и readiness на <code>/health</code>, requests/limits.',done:'Сломал /health — под перезапускается; <code>kubectl describe pod</code> показывает пробы.'}]},

  {id:'3.2',t:'values.yaml',need:['helm'],why:'Тег образа, число реплик, env — должны меняться без правки шаблонов.',do:'Вынести переменные в values, сделать <code>values-prod.yaml</code>.',done:'<code>helm upgrade --set replicaCount=3</code> меняет реплики; <code>helm rollback</code> возвращает.'},
  {id:'3.3',t:'Postgres и Redis из чартов',need:['helm','storage'],why:'Не писать базу самому, а взять проверенный чарт.',do:'Bitnami-чарты postgresql и redis отдельными релизами.',done:'<code>helm list</code> — 3 релиза; данные переживают удаление пода базы (PVC).'}]},
 {id:'s4',n:'Спринт 4 · GitLab CI/CD',goal:'Push в git → образ собран, протестирован и выкачен сам.',tickets:[
  {id:'4.1',t:'Пайплайн lint → build → test',need:['gitlabci','runners'],why:'Сломанный код не должен доезжать до прода.',do:'<code>.gitlab-ci.yml</code> со стадиями lint, build, test.',done:'MR с ошибкой в тесте — пайплайн красный.'},
  {id:'4.2',t:'Образ в Container Registry',need:['gitlabci','registry'],why:'Кластер должен откуда-то брать образ нужной версии.',do:'Сборка и push в GitLab Registry с тегом <code>$CI_COMMIT_SHA</code>.',done:'Образ виден в Registry, тег совпадает с коммитом.'},
  {id:'4.3',t:'Автодеплой через helm upgrade',need:['gitlabci','helm'],why:'Деплой без рук и без «а кто последний выкатывал?».',do:'Job deploy: <code>helm upgrade --install</code> с новым тегом; main — деплой, MR — только тесты.',done:'Push в main → через пару минут в кластере новая версия.'},

 {id:'s5',n:'Спринт 5 · Наблюдаемость',goal:'Видеть, что происходит с магазином, раньше, чем напишут пользователи.',tickets:[

  {id:'5.2',t:'/metrics в приложении',need:['prom'],why:'Метрики самого магазина: сколько запросов, как быстро, сколько ошибок.',do:'<code>prom-client</code>, эндпоинт <code>/metrics</code>, ServiceMonitor.',done:'В Prometheus есть метрики shop.'},
  {id:'5.3',t:'Дашборд RPS / latency / errors',need:['grafana'],why:'Три графика, по которым видно здоровье любого сервиса.',do:'Панели: RPS, p95 latency, error rate (5xx).',done:'Можешь объяснить каждую панель вслух.'},
  {id:'5.4',t:'Алерт',need:['grafana'],why:'Узнавать о падении от алерта, а не от менеджера.',do:'Alertmanager: «сервис недоступен больше 1 минуты» → Telegram.',done:'Выключил деплоймент — через минуту пришло сообщение.'}]},
 {id:'s6',n:'Спринт 6 · Terraform',goal:'Вся инфраструктура описана кодом и поднимается с нуля одной командой.',tickets:[

 {id:'s7',n:'Спринт 7 · Полировка и собес',goal:'Превратить проект в историю, которую ты уверенно рассказываешь.',tickets:[
  {id:'7.1',t:'README и схема',need:['incident'],why:'Репозиторий смотрят до собеса.',do:'README: что это, схема архитектуры, как запустить, что где лежит.',done:'Человек без контекста понимает проект за 2 минуты.'},
  {id:'7.2',t:'Учебный инцидент',need:['incident'],why:'На собесе спросят «расскажи, как чинил прод».',do:'Сломать намеренно (неверный selector, нет пароля в Secret, лимит памяти) и найти через describe, logs, Grafana.',done:'Записан разбор: симптом → диагностика → причина → исправление.'},
  {id:'7.3',t:'Рассказ на 2–3 минуты',need:['incident'],why:'Умение рассказать важно не меньше умения сделать.',do:'Что построил, с чем столкнулся, как решил. Проговорить вслух 5 раз.',done:'Укладываешься в 3 минуты без бумажки.'},
  {id:'7.4',t:'Резюме',need:['incident'],why:'Проект должен работать на тебя.',do:'Ссылка на репозиторий, стек (Linux, Docker, K8s, Helm, GitLab CI, Prometheus, Terraform).',done:'Резюме отправлено.'}]}]};
const TICKETS=PROJECT.sprints.flatMap(s=>s.tickets.map(t=>Object.assign({sp:s},t)));
/* Тикеты, для которых этот модуль — последний из нужных по плану (т. е. после него тикет можно делать) */
const ticketsAfter=id=>{const plan=LEVELS.flatMap(l=>l.ids);return TICKETS.filter(t=>t.need.length&&t.need.reduce((a,b)=>plan.indexOf(a)>plan.indexOf(b)?a:b)===id)};
/* Задания. Общие поля: t (тип), q (вопрос, html), e (почему — обязательно), g (группа), ref (id прошлой темы для ↺), code+lang (блок кода).
   t:'c'  выбор       {o:[варианты], a:индекс верного}        — варианты перемешиваются
   t:'r'  чтение      то же, что 'c', но с логом/конфигом в code
   t:'i'  впиши       {a:['ответ','допустимый вариант'], ph:'подсказка в поле', fix:true — «исправь ошибку»}
   t:'s'  собери      {p:['шаг 1','шаг 2',…]} — в верном порядке, на экране перемешиваются
   Группы g: base Базовые · prac Практика · job Как на работе · mix Смешанные (ставится сам, если есть ref) */
const TYPES={c:['Выбор','t-c'],r:['Чтение','t-r'],i:['Впиши','t-i'],s:['Собери','t-s']};
const GROUPS={base:'Базовые',prac:'Практика',job:'Как на работе',mix:'Смешанные ↺',rev:'Обзор'};
const norm=s=>String(s).trim().replace(/[“”«»]/g,'"').replace(/’/g,"'").replace(/\s+/g,' ').replace(/\s*;$/,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function exHTML(x,i,state){
  const [tn,tc]=TYPES[x.t];const mix=x.ref?` <a class="ref" href="#m-${x.ref}">↺ ${MODS[x.ref]?MODS[x.ref].title:x.ref}</a>`:'';
  let body='';
  if(x.t==='c'||x.t==='r'){const ord=shuffle(x.o.map((_,k)=>k));body=`<div class="opts">${ord.map(k=>`<button class="opt" data-k="${k}">${x.o[k]}</button>`).join('')}</div>`}
  if(x.t==='i')body=`<div class="inrow"><span class="k-pr">${x.fix?'✎':'$'}</span><input class="inp" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="${esc(x.ph||'')}"><button class="go">Проверить</button></div>`;
  if(x.t==='s')body=`<div class="sline"></div><div class="spool">${shuffle(x.p.map((_,k)=>k)).map(k=>`<button class="chip" data-k="${k}">${x.p[k]}</button>`).join('')}</div><button class="go">Проверить</button>`;
  return `<div class="ex ${tc}${x.ref?' mixd':''}${state===1?' ok':state===0?' no':''}" data-i="${i}"><div class="exh"><span class="tag">${tn}${x.fix?' · исправь':''}</span><span class="num">${i+1}</span>${mix}</div><div class="q">${x.q}</div>${x.code?C(x.code,x.lang||'sh'):''}${body}<div class="fb"></div></div>`}
function exCheck(x,el){
  if(x.t==='c'||x.t==='r'){const b=el.querySelector('.opt.sel');return b&&+b.dataset.k===x.a}
  if(x.t==='i'){const v=norm(el.querySelector('.inp').value);return x.a.some(a=>norm(a)===v)}
  if(x.t==='s'){const ks=[...el.querySelectorAll('.sline .chip')].map(b=>x.p[+b.dataset.k]);return ks.length===x.p.length&&ks.every((s,k)=>s===x.p[k])}}
function exRight(x){
  if(x.t==='c'||x.t==='r')return x.o[x.a];
  if(x.t==='i')return `<code>${hlSh(x.a[0])}</code>`;
  return `<ol>${x.p.map(s=>`<li>${s}</li>`).join('')}</ol>`}
/* Приложение: прогресс (localStorage), маршруты, экраны.
   #home главная · #m-<id>-<вкладка> модуль (theory|ex|lab|qa) · #cheat · #qa · #todo «Надо разобрать» */
const KEY='devops-v1';
const P=Object.assign({done:{},open:{},todo:[],lab:{},proj:{}},(()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}})());
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const $=s=>document.querySelector(s);
const score=id=>{const m=MODS[id],d=P.done[id]||{};const n=m.ex.length;const ok=Object.values(d).filter(v=>v===1).length;return {n,ok,pct:n?ok/n:0}};
const unlocked=id=>{const i=ORDER.indexOf(id);if(i<=0||P.open[id])return true;const prev=ORDER[i-1];return score(prev).pct>=PASS&&unlocked(prev)};
const groupOf=x=>x.ref?'mix':x.g||'base';
const plain=s=>String(s).replace(/<[^>]+>/g,'');

function side(cur){
  $('#side').innerHTML=`<a class="sl${!cur?' cur':''}" href="#home">⌂ Главная</a><a class="sl" href="#project">🛠 Проект «Магазин»</a><a class="sl" href="#qa">🎴 Собес каждый день</a><a class="sl" href="#cheat">📋 Шпаргалка</a><a class="sl" href="#terms">📖 Словарь инструментов</a><a class="sl" href="#todo">🗒 Надо разобрать <span class="cnt">${P.todo.length||''}</span></a>`+
  LEVELS.filter(l=>l.ids.some(id=>MODS[id])).map(l=>`<details open><summary>${l.id} · ${l.name}</summary>${l.ids.filter(id=>MODS[id]).map(id=>{const m=MODS[id],s=score(id),u=unlocked(id);
    return `<a class="sl${m.review?' rev':''}${cur===id?' cur':''}" href="#m-${id}">${u?'':'🔒 '}${ORDER.indexOf(id)+1}. ${m.title}<span class="pg" style="--p:${s.pct*100|0}%"></span></a>`}).join('')}</details>`).join('')}

function home(){
  const total=ORDER.reduce((a,id)=>a+MODS[id].ex.length,0),ok=ORDER.reduce((a,id)=>a+score(id).ok,0);
  return `<h1>DevOps по-тихому</h1><p class="sub">Linux → Docker → Kubernetes → CI/CD → Terraform → Собес. Цель — понимать, что происходит в системе и почему.</p>
  ${BOX('Как работать с тетрадью',`<ol><li><b>Теория</b> — сначала «что это и зачем», потом суть. Команды не зубри: пойми, что они делают.</li><li><b>Практика</b> — задания. Следующий модуль откроется при ${PASS*100}% верных.</li><li><b>Лаба</b> — главное. Делай руками в терминале <b>без ИИ</b>. Застрял — <code>man</code>, <code>--help</code>, потом подсказка, и только потом решение.</li><li><b>Собес</b> — проговори ответ вслух, потом открой. Раздел «Собес каждый день» собирает вопросы всех открытых тем.</li><li>Не понял — жми «В разобрать», тема уйдёт в список.</li></ol>`)}
  <div class="stats"><div><b>${ORDER.length}</b>модулей готово</div><div><b>${ok}/${total}</b>заданий решено</div><div><b>${P.todo.length}</b>надо разобрать</div></div>
  <p class="muted">Прогресс хранится в этом браузере. На другом устройстве открывай модули кнопкой «Открыть без прохождения».</p>`}

function modView(id,tab){
  const m=MODS[id];if(!m)return '<p>Нет такого модуля.</p>';
  const u=unlocked(id),s=score(id),i=ORDER.indexOf(id),next=ORDER[i+1];
  const tabs=[['theory','Теория'],['ex',`Практика ${s.ok}/${s.n}`],['lab',`Лаба ${m.lab.length}`],['qa',`Собес ${m.qa.length}`]]
    .filter(([k])=>(k!=='lab'||m.lab.length)&&(k!=='qa'||m.qa.length)&&(k!=='theory'||m.theory));
  if(!tabs.some(t=>t[0]===tab))tab=tabs[0][0];
  let h=`<div class="mh"><span class="lv">${m.review?'Обзор':m.lvl} · модуль ${i+1}</span><h1>${m.title}</h1><p class="sub">${m.sub||''}</p></div><nav class="tabs">${tabs.map(([k,n])=>`<a class="${k===tab?'on':''}" href="#m-${id}-${k}">${n}</a>`).join('')}</nav>`;
  const early=earlyTerms(id);const caseBox=m.case?`<section class="case"><h2>Ситуация</h2>${m.case}</section>`:'';const earlyBox=early.length?`<details class="early"><summary>В этом модуле встретятся инструменты, которых ещё не было (${early.length}). Что это и зачем они нужны — раскрой</summary>${early.map(t=>termHTML(t)).join('')}</details>`:'';
  const tk=ticketsAfter(id);const projBox=tk.length?`<section class="projbox"><h2>🛠 В проекте «Магазин»</h2><p>После этого модуля можно делать:</p>${tk.map(t=>`<p>→ <a href="#project">Тикет ${t.id} · ${t.t}</a> — ${t.why}</p>`).join('')}</section>`:'';
  if(tab==='theory')h+=caseBox;
  if(tab==='theory'||tab==='ex'||tab==='lab')h+=earlyBox;
  if(tab==='theory')h+=(m.intro?`<section class="intro"><h2>Что это и зачем</h2>${m.intro}</section>`:'')+`<section>${m.theory}</section>`+(m.memo?`<section><h2>Как тренировать</h2>${m.memo}</section>`:'')+(m.traps.length?`<section><h2>Ловушки</h2>${TR(m.traps)}</section>`:'')+projBox;
  if(tab==='ex'){
    if(!u)return h+`<div class="lock">🔒 Практика откроется, когда в предыдущем модуле будет ${PASS*100}% верных. Теорию можно читать уже сейчас.<br><button class="force" data-id="${id}">Открыть без прохождения</button></div>`;
    const d=P.done[id]||{};let last='';
    h+=`<div class="bar"><span>Верно: ${s.ok} из ${s.n} (${s.pct*100|0}%)</span><button class="reset" data-id="${id}">Сбросить</button></div>`;
    m.ex.forEach((x,k)=>{const g=m.review?'rev':groupOf(x);if(g!==last){h+=`<h3 class="grp">${GROUPS[g]}</h3>`;last=g}h+=exHTML(x,k,d[k])});
    if(next)h+=`<p class="nextp">${s.pct>=PASS?`<a class="btn" href="#m-${next}">Дальше: ${MODS[next].title} →</a>`:`Для перехода дальше нужно ${PASS*100}%.`}</p>`}
  if(tab==='lab')h+=BOX('Правила лабы','<p>Терминал, без ИИ и без копипасты из решения. Порядок: подумай → <code>man</code> / <code>--help</code> → подсказка → решение. Делай на своей машине (WSL, VirtualBox с Ubuntu, VPS) — не на рабочем сервере.</p>','warn')+
    m.lab.map((l,k)=>{const dn=(P.lab[id]||{})[k];return `<div class="lab${dn?' ok':''}"><div class="exh"><span class="tag">Лаба ${k+1}</span><label><input type="checkbox" class="labdone" data-id="${id}" data-k="${k}"${dn?' checked':''}> сделал сам</label></div><div class="q">${l.t}</div>${l.h?`<details><summary>Подсказка</summary>${l.h}</details>`:''}${l.chk?`<details><summary>Как проверить себя</summary>${l.chk}</details>`:''}${l.sol?`<details class="sol"><summary>Решение (только после попытки)</summary>${l.sol}</details>`:''}</div>`}).join('');
  if(tab==='lab')h+=projBox;
  if(tab==='qa')h+=`<p class="muted">Сначала ответь вслух сам, потом раскрой.</p>`+m.qa.map(([q,a])=>`<details class="qa"><summary>${q}</summary><div>${a}</div></details>`).join('');
  return h}

function cheat(){return `<h1>Шпаргалка</h1><input id="cs" class="inp wide" placeholder="Поиск: tail, права, порт…">`+ORDER.filter(id=>MODS[id].cheat.length).map(id=>`<section class="cs"><h3><a href="#m-${id}">${MODS[id].title}</a></h3>${CMDS(MODS[id].cheat)}</section>`).join('')}
function qaDaily(){const all=ORDER.filter(unlocked).flatMap(id=>MODS[id].qa.map(([q,a])=>[q,a,id]));
  return `<h1>Собес каждый день</h1><p class="sub">Пробегись глазами. Не знаешь — «В разобрать». Вопросы только из открытых модулей, порядок случайный.</p>`+
    shuffle(all).map(([q,a,id])=>`<details class="qa"><summary>${q}</summary><div>${a}<p class="muted">→ <a href="#m-${id}">${MODS[id].title}</a> · <button class="totodo" data-t="${esc(plain(q))}">В разобрать</button></p></div></details>`).join('')}
const modLink=id=>MODS[id]?`<a href="#m-${id}">${MODS[id].title}</a>${score(id).pct>=PASS?' ✓':''}`:`<span class="muted">${id} (модуль в работе)</span>`;
const ready=t=>t.need.every(id=>MODS[id]&&score(id).pct>=PASS);
function ticketHTML(t){const dn=P.proj[t.id],r=ready(t);return `<div class="ticket${dn?' ok':''}"><div class="exh"><span class="tag">Тикет ${t.id}</span><span class="${r?'rdy':'nrdy'}">${dn?'сделано':r?'можно делать':'сначала пройди модули'}</span><label><input type="checkbox" class="projdone" data-id="${t.id}"${dn?' checked':''}> сделал</label></div><h3>${t.t}</h3><p><b>Зачем:</b> ${t.why}</p><p><b>Что сделать:</b> ${t.do}</p><p><b>Готово, когда:</b> ${t.done}</p>${t.hint?`<details><summary>Подсказка</summary>${t.hint}</details>`:''}<p class="muted">Готовят модули: ${t.need.map(modLink).join(' · ')}</p></div>`}
function project(){const n=TICKETS.length,d=TICKETS.filter(t=>P.proj[t.id]).length;
  return `<h1>Проект «Магазин»</h1><p class="sub">${PROJECT.goal}</p>`+BOX('Как работать с проектом','<p>Это не задания с ответами, а настоящая работа: делаешь руками на своём сервере, без ИИ, и коммитишь в свой GitLab. Тикет становится «можно делать», когда пройдены модули, которые к нему готовят. Модули объясняют, <b>как</b>; проект показывает, <b>зачем</b> всё это вместе.</p>')+`<div class="stats"><div><b>${d}/${n}</b>тикетов сделано</div></div>`+PROJECT.sprints.map(s=>`<section><h2>${s.n}</h2><p class="sub">${s.goal}</p>${s.tickets.map(ticketHTML).join('')}</section>`).join('')}
function terms(){return `<h1>Словарь инструментов</h1><p class="sub">Каждый инструмент: что это, зачем он вообще нужен, где живёт на сервере и в какой ситуации ты с ним столкнёшься.</p>`+TERMS.map(t=>termHTML(t)).join('')}
function todo(){return `<h1>Надо разобрать</h1><p class="sub">Сюда — всё, что не понял. Разобрал — отмечай ✓.</p><div class="inrow"><input id="tdi" class="inp" placeholder="Тема или команда"><button id="tda" class="go">Добавить</button></div><ul class="todo">${P.todo.map((t,k)=>`<li><span>${esc(t)}</span><button class="tdx" data-k="${k}">✓</button></li>`).join('')}</ul>`}

function route(){
  let [a,id,tab]=location.hash.slice(1).split('-');a=a||'home';
  $('#main').innerHTML=a==='m'?modView(id,tab):a==='cheat'?cheat():a==='qa'?qaDaily():a==='todo'?todo():a==='terms'?terms():a==='project'?project():home();
  side(a==='m'?id:null);document.body.classList.remove('menu');scrollTo(0,0)}
addEventListener('hashchange',route);

document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,input[type=checkbox]');if(!t)return;
  const cl=n=>t.classList.contains(n);
  if(t.id==='burger')return document.body.classList.toggle('menu');
  if(cl('force')){P.open[t.dataset.id]=true;save();return route()}
  if(cl('reset')){if(t.dataset.sure){delete P.done[t.dataset.id];save();route()}else{t.dataset.sure=1;t.textContent='Точно сбросить? Нажми ещё раз'}return}
  if(cl('projdone')){P.proj[t.dataset.id]=t.checked;save();return route()}
  if(cl('labdone')){(P.lab[t.dataset.id]=P.lab[t.dataset.id]||{})[t.dataset.k]=t.checked;save();t.closest('.lab').classList.toggle('ok',t.checked);return}
  if(cl('totodo')){if(!P.todo.includes(t.dataset.t))P.todo.push(t.dataset.t);save();t.textContent='Добавлено ✓';return}
  if(t.id==='tda'){const v=$('#tdi').value.trim();if(v){P.todo.push(v);save();route()}return}
  if(cl('tdx')){P.todo.splice(+t.dataset.k,1);save();return route()}
  const el=t.closest('.ex');if(!el)return;
  const id=location.hash.slice(1).split('-')[1],k=+el.dataset.i,x=MODS[id].ex[k];
  if(cl('chip')){(t.parentNode.classList.contains('spool')?el.querySelector('.sline'):el.querySelector('.spool')).appendChild(t);return}
  if(cl('opt')){el.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));t.classList.add('sel')}
  if(cl('opt')||cl('go')){
    const ok=!!exCheck(x,el);(P.done[id]=P.done[id]||{})[k]=ok?1:0;save();
    el.classList.toggle('ok',ok);el.classList.toggle('no',!ok);
    el.querySelector('.fb').innerHTML=`<div class="res">${ok?'✓ Верно':'✗ Неверно'}</div>${ok?'':`<div class="right">Правильно: ${exRight(x)}</div>`}<div class="why">${x.e}</div><button class="totodo" data-t="${esc((MODS[id].title+': '+plain(x.q)).slice(0,140))}">В разобрать</button>`;
    const s=score(id),b=$('.bar span');if(b)b.textContent=`Верно: ${s.ok} из ${s.n} (${s.pct*100|0}%)`;side(id)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.classList.contains('inp')){const g=ev.target.parentNode.querySelector('.go');g&&g.click()}});
document.addEventListener('input',ev=>{if(ev.target.id==='cs'){const v=ev.target.value.toLowerCase();document.querySelectorAll('.cs tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(v)?'':'none')}});
route();</script>
